DATA.push(...[{"id":"review_unit2","title":"2 免許","group":"第1章 宅建業法・復習問題","reviewUnit":2,"items":[["2-1","宅地建物取引業者A社の使用人であって、A社の宅地建物取引業を行う支店の代表者であるものが、道路交通法の規定に違反したことにより拘禁刑に処せられても、A社の免許は取り消されることはない。",{"qnum":2,"label":"1","title":"免許の基準（欠格事由）①","stem":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"× 誤り","explanation":"[[政令で定める使用人]]が[[拘禁刑]]に処せられた場合、その原因となる犯罪を問わず、欠格事由に該当します。よってA社の免許は取り消されます。","method":false}],["2-2","宅地建物取引業者B社の取締役が、所得税法の規定に違反したことにより罰金の刑に処せられても、B社の免許は取り消されることはない。",{"qnum":2,"label":"2","title":"免許の基準（欠格事由）①","stem":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"○ 正しい","explanation":"所得税法の規定に違反したことによる罰金刑は、[[欠格事由に該当しません]]のでB社の免許は取り消されません。","method":false}],["3-2","B社は不正の手段により免許を取得したとして甲県知事から免許を取り消されたが、B社の取締役Cは、当該取消に係る聴聞の期日及び場所の公示の日の30日前にB社の取締役を退任した。B社の免許取消の日から5年を経過していない場合、Cは免許を受けることができない。",{"qnum":3,"label":"2","title":"免許の基準（欠格事由）②","stem":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"○ 正しい","explanation":"免許を取り消された場合、その聴聞の公示日前[[60日以内]]に役員であった者も欠格者となります。B社の取締役Cは30日前まで役員だったので欠格者となり、Cは免許を受けることができません（26ページの表❸）。","method":false}],["3-4","E社は乙県知事から業務停止処分についての聴聞の期日及び場所を公示されたが、その公示後聴聞が行われる前に、相当の理由なく宅地建物取引業を廃止した旨の届出をした。その届出の日から5年を経過していない場合、E社は免許を受けることができない。",{"qnum":3,"label":"4","title":"免許の基準（欠格事由）②","stem":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"× 誤り","explanation":"[[免許取消処分]]であれば欠格者となりますが（26ページの表❷）、E社が受けているのは[[業務停止処分]]です。業務停止処分の場合は欠格者となりません。","method":false}],["4-1","A社は、不正の手段により免許を取得したことによる免許の取消処分に係る聴聞の期日及び場所が公示された日から当該処分がなされるまでの間に、合併により消滅したが、合併に相当の理由がなかった。この場合において、当該公示の日の50日前にA社の取締役を退任したBは、当該消滅の日から5年を経過しなければ、免許を受けることができない。",{"qnum":4,"label":"1","title":"免許の基準（欠格事由）③","stem":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","answer":"○ 正しい","explanation":"A社のように、正当な事由なく合併により[[消滅]]した場合、聴聞の期日及び場所の公示日前[[60日]]以内に[[役員]]であった者は、合併消滅の日から[[5年]]を経過しなければ免許を受けることができません（26ページの表❷❸）。","method":false}],["4-3","営業に関し成年者と同一の行為能力を有しない未成年者であるFの法定代理人であるGが、刑法第247条（背任）の罪により罰金の刑に処せられていた場合、その刑の執行が終わった日から5年を経過していなければ、Fは免許を受けることができない。",{"qnum":4,"label":"3","title":"免許の基準（欠格事由）③","stem":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","answer":"○ 正しい","explanation":"[[営業に関し成年者と同一の行為能力を有しない未成年者]]である場合、[[本人]]FとFの[[法定代理人]]であるGの[[両方]]について、欠格事由に該当するかが考慮されます。Gは背任罪で罰金刑に処せられているので、その刑の執行が終わった日から5年を経過していなければ、Fは免許を受けられません（27ページの表⑪）。","method":false}],["4-4","H社の取締役Iが、暴力団員による不当な行為の防止等に関する法律に規定する暴力団員に該当することが判明し、宅地建物取引業法第66条第1項第3号の規定に該当することにより、H社の免許は取り消された。その後、Iは退任したが、当該取消しの日から5年を経過しなければ、H社は免許を受けることができない。",{"qnum":4,"label":"4","title":"免許の基準（欠格事由）③","stem":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","answer":"× 誤り","explanation":"H社の役員であるIが[[暴力団員]]であることは、欠格事由に該当します。しかし、H社の免許が取り消された後、Iが[[退任]]すればH社は免許を受けることができます（26、27ページの表❹⑩）。","method":false}],["6-2","国土交通大臣の免許を受けている宅地建物取引業者B社と乙県知事の免許を受けている宅地建物取引業者C社が合併し、C社が消滅した場合、C社を代表する役員であった者は、その旨を国土交通大臣に届け出なければならない。",{"qnum":6,"label":"2","title":"廃業等の届出","stem":"宅地建物取引業法に関する次の記述のうち、正しいものはどれか。","answer":"× 誤り","explanation":"C社の代表役員による乙県知事（C社の[[免許権者]]）への届出が必要です。","method":false}],["6-4","丙県知事の免許を受けている宅地建物取引業者Eが破産した場合、Eの免許は、当該破産手続開始の決定のときから、その効力を失う。",{"qnum":6,"label":"4","title":"廃業等の届出","stem":"宅地建物取引業法に関する次の記述のうち、正しいものはどれか。","answer":"× 誤り","explanation":"破産の場合は、[[破産管財人]]が免許権者に[[届出をした時点]]で失効となります。","method":false}]]},{"id":"review_unit3","title":"3 宅地建物取引士","group":"第1章 宅建業法・復習問題","reviewUnit":3,"items":[["6-1","国土交通大臣の免許を受けている宅地建物取引業者A社が新たに政令で定める使用人を設置した場合、A社は、その日から30日以内に、その旨を国土交通大臣に届け出なければならない。",{"qnum":6,"label":"1","title":"死亡等の届出","stem":"宅地建物取引業法上の届出に関する次の記述のうち、誤っているものはどれか。","answer":"○ 正しい","explanation":"[[政令で定める使用人]]の氏名は、宅建業者名簿の登載事項なので[[30日]]以内に[[国土交通大臣]]に届け出なければなりません。","method":false}],["6-2","甲県知事の免許を受けている宅地建物取引業者B社が建設業の許可を取得して建設業を営むこととなった場合、B社は、その日から30日以内にその旨を甲県知事に届け出なければならない。",{"qnum":6,"label":"2","title":"死亡等の届出","stem":"宅地建物取引業法上の届出に関する次の記述のうち、誤っているものはどれか。","answer":"× 誤り","explanation":"宅建業[[以外]]の事業の種類については、業者名簿に記載します。ですが、[[変更の届出]]の対象項目ではありません。","method":false}]]},{"id":"review_unit4","title":"4 営業保証金","group":"第1章 宅建業法・復習問題","reviewUnit":4,"items":[["2-2","宅地建物取引業者は、既に供託した額面金額1,000万円の国債証券と変換するため1,000万円の金銭を新たに供託した場合、遅滞なく、その旨を免許を受けた国土交通大臣又は都道府県知事に届け出なければならない。",{"qnum":2,"label":"2","title":"供託の方法と事務所新設の手続き","stem":"宅地建物取引業法に規定する営業保証金に関する次の記述のうち、正しいものはどれか。","answer":"○ 正しい","explanation":"国債証券から金銭へ営業保証金の供託方法を変えることを、[[営業保証金の変換]]といいます。新たに供託した場合、遅滞なく[[免許権者]]に届出をしなければなりません。","method":false}]]},{"id":"review_unit5","title":"5 弁済業務保証金","group":"第1章 宅建業法・復習問題","reviewUnit":5,"items":[["1-2","宅地建物取引業者で保証協会に加入しようとする者は、その加入の日から2週間以内に、弁済業務保証金分担金を保証協会に納付しなければならない。",{"qnum":1,"label":"2","title":"弁済業務保証金制度","stem":"宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"× 誤り","explanation":"加入の日から2週間以内ではなく、保証協会に[[加入しようとする日]]までに、弁済業務保証金分担金を納付しなければなりません（71ページ）。","method":false}],["4-3","保証協会は、弁済業務保証金の還付があったときは、当該還付に係る社員又は社員であった者に対して、当該還付額に相当する額の還付充当金を保証協会に納付すべきことを通知しなければならない。",{"qnum":4,"label":"3","title":"弁済業務保証金の還付","stem":"宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、正しいものはどれか。","answer":"○ 正しい","explanation":"[[保証協会]]が宅建業者に[[通知]]します。また、通知を受けた[[社員]]（宅建業者）は、通知を受けた日から[[2週間]]以内に、通知された額の還付充当金を[[保証協会]]に対して[[納付]]しなければなりません。","method":false}],["6-2","保証協会は、宅地建物取引業の業務に従事し、又は、従事しようとする者に対する研修を行わなければならないが、宅地建物取引士については、法第22条の2の規定に基づき都道府県知事が指定する講習をもって代えることができる。",{"qnum":6,"label":"2","title":"保証協会の業務・弁済業務保証金準備金","stem":"宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"× 誤り","explanation":"保証協会は、宅地建物取引業に関する[[研修]]を行わなければなりませんが、都道府県知事が指定する[[法定講習]]をもって代えることはできません。","method":false}]]},{"id":"review_unit6","title":"6 35条書面","group":"第1章 宅建業法・復習問題","reviewUnit":6,"items":[["1-3","宅地建物取引業者が代理人として売買契約を締結し、建物の購入を行う場合は、代理を依頼した者に対して重要事項の説明をする必要はない。",{"qnum":1,"label":"3","title":"35条書面の交付と重要事項説明","stem":"宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明及び書面の交付に関する次の記述のうち、正しいものはどれか。なお、書面の交付には、宅地建物取引業者の相手方等の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"× 誤り","explanation":"重要事項説明は、買主に対して宅建士がするものなので、[[代理]]を依頼した者（建物の買主）に対しても、重要事項説明をしなければなりません。","method":false}],["4-1","中古マンションの売買の媒介において、当該マンションに係る維持修繕積立金については説明したが、管理組合が保管している維持修繕の実施状況についての記録の内容については説明しなかった。",{"qnum":4,"label":"1","title":"35条書面〈売買・交換の場合の記載事項〉①","stem":"宅地建物取引業法第35条に規定する重要事項の説明を宅地建物取引士が行う場合における次の記述のうち、同条の規定に違反しないものはどれか。","answer":"× 誤り","explanation":"[[維持修繕の実施状況]]についての[[記録内容]]についても説明が必要です。","method":false}],["4-4","建物の売買の媒介において、登記された権利の種類及び内容については説明したが、移転登記申請の時期については説明しなかった。",{"qnum":4,"label":"4","title":"35条書面〈売買・交換の場合の記載事項〉①","stem":"宅地建物取引業法第35条に規定する重要事項の説明を宅地建物取引士が行う場合における次の記述のうち、同条の規定に違反しないものはどれか。","answer":"○ 正しい","explanation":"[[移転登記の申請時期]]は説明不要です。","method":false}],["5-1","建物の賃借の媒介を行う場合における、「都市計画法第29条第1項の規定に基づく制限」",{"qnum":5,"label":"1","title":"35条書面〈貸借の場合の記載事項〉①","stem":"宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、同法の規定に少なくとも説明しなければならない事項として掲げられていないのはどれか。","answer":"× 説明事項に掲げられていない","explanation":"建物の賃借の場合、法令上の制限に関する内容は、\n①新住宅市街地開発法32条\n②新都市基盤整備法51条\n③流通業務市街地の整備に関する法律38条\nの3つのみ説明すればOKです。よって、都市計画法第29条第1項の規定に基づく制限は説明不要です。","method":false}],["6-2","建物の売買の媒介において、売主が当該建物の種類又は品質に関して契約の内容に適合しない場合におけるその不適合を担保すべき責任を負わない旨の定めをする場合は、その内容について買主に説明しなければならない。",{"qnum":6,"label":"2","title":"35条書面〈貸借の場合の記載事項〉②","stem":"宅地建物取引業者が、宅地建物取引業法第35条に規定する重要事項について説明をする場合に関する次の記述のうち、正しいものはどれか。","answer":"× 誤り","explanation":"35条書面では、売主が[[契約不適合]]を担保すべき責任を負わない旨の定めをする場合の内容は、説明事項ではありません。ここはひっかけ問題で出やすいところです。この内容は、[[37条書面]]の記載事項となります。仮に、これが、「契約不適合担保責任の履行に関する[[措置の有無と概要]]」であれば、[[35条書面]]の記載事項であり、説明の必要があります。","method":false}],["6-3","建物の貸借の媒介において、借賃以外の金銭の授受に関する定めがあるときは、その額及びその目的のほか、当該金銭の授受の時期についても借主に説明しなければならない。",{"qnum":6,"label":"3","title":"35条書面〈貸借の場合の記載事項〉②","stem":"宅地建物取引業者が、宅地建物取引業法第35条に規定する重要事項について説明をする場合に関する次の記述のうち、正しいものはどれか。","answer":"× 誤り","explanation":"借賃以外の金銭の授受に関する定めがあるときは、その額及びその目的を説明しなくてはなりません。ですが、[[授受の時期]]に関しては、説明不要です。35条書面の内容で、[[「時期」]]について説明しなければいけないものはありません。ただし、[[37条書面]]では金額、授受の目的と授受の時期も記載する必要があります。","method":false}],["6-4","建物の売買の媒介において、買主が天災その他不可抗力による損害を負担する旨の定めをする場合は、その内容について買主に説明しなければならない。",{"qnum":6,"label":"4","title":"35条書面〈貸借の場合の記載事項〉②","stem":"宅地建物取引業者が、宅地建物取引業法第35条に規定する重要事項について説明をする場合に関する次の記述のうち、正しいものはどれか。","answer":"× 誤り","explanation":"[[天災その他不可抗力による損害を負担する]]旨の定めも、[[37条書面]]の記載事項であり、35条書面の記載事項ではありません。","method":false}],["7-1","当該マンションの管理が委託されているときは、その委託を受けている者の氏名（法人にあっては、その商号又は名称）、住所（法人にあっては、その主たる事務所の所在地）及び委託された業務の内容を説明しなければならない。",{"qnum":7,"label":"1","title":"35条書面〈区分所有建物の場合の記載事項〉","stem":"宅地建物取引業者がマンションの一室の貸借の媒介を行う場合、宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。","answer":"× 誤り","explanation":"委託を受けている者の[[氏名及び住所]]は説明する必要がありますが、委託された[[業務の内容]]は説明事項ではありません。","method":false}],["7-2","建築基準法に規定する容積率及び建蔽率に関する制限があるときは、その制限内容を説明しなければならない。",{"qnum":7,"label":"2","title":"35条書面〈区分所有建物の場合の記載事項〉","stem":"宅地建物取引業者がマンションの一室の貸借の媒介を行う場合、宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。","answer":"× 誤り","explanation":"容積率及び建蔽率に関する制限は[[建物の貸借]]では説明事項ではありません。説明する必要があるのは、[[売買・交換]]と[[宅地の貸借]]の場合です。","method":false}],["7-4","敷金の授受の定めがあるときは、その敷金の額、契約終了時の敷金の精算に関する事項及び金銭の保管方法を説明しなければならない。",{"qnum":7,"label":"4","title":"35条書面〈区分所有建物の場合の記載事項〉","stem":"宅地建物取引業者がマンションの一室の貸借の媒介を行う場合、宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。","answer":"× 誤り","explanation":"[[敷金]]の授受の定めがあるときは、その[[敷金の額]]、契約終了時の[[敷金の精算]]に関する事項は重要事項として説明が必要ですが、[[金銭の保管方法]]は説明事項ではありません。","method":false}],["8-1","建物の売買の媒介を行う場合、当該建物が既存の住宅であるときは当該建物の検査済証（宅地建物取引業法施行規則第16条の2の3第2号に定めるもの）の保存の状況について説明しなければならず、当該検査済証が存在しない場合はその旨を説明しなければならない。",{"qnum":8,"label":"1","title":"35条書面〈売買・交換の場合の記載事項〉②","stem":"宅地建物取引業者が行う宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはどれか。なお、説明の相手方は宅地建物取引業者ではないものとする。","answer":"○ 正しい","explanation":"[[既存]]の建物の取引であるときは、建物の建築及び維持保全の状況に関する書類の[[保存状況]]を重要事項説明しなければなりません。[[検査済証]]はこれに当たります。ない場合は「なし」と35条書面に[[記載]]をし、そのことを[[説明]]しなければなりません。","method":false}]]},{"id":"review_unit8","title":"8 自ら売主の8種制限","group":"第1章 宅建業法・復習問題","reviewUnit":8,"items":[["1-4","宅地建物取引業者でない買主Eから売買契約の解除があった場合で、この契約の解除が法的要件を満たし、かつ、Aが手付金を受領しているとき、Aは契約に要した費用を手付金から控除して返還することができる。",{"qnum":1,"label":"4","title":"クーリング・オフ①","stem":"宅地建物取引業者Aが自ら売主として締結した建物の売買契約について、買主が宅地建物取引業法第37条の2の規定に基づき売買契約の解除をする場合に関する次の記述のうち、正しいものはどれか。","answer":"× 誤り","explanation":"クーリング・オフは無条件解除ですので、契約に要した[[費用]]などを買主から受け取ることはできません。手付金を受領している場合は、そのまま[[すみやかに]]返還しなければならず、[[損害賠償請求]]や[[違約金請求]]もできません（123ページ）。","method":false}],["6-3","AがBから受領した手付が代金の額の1/10を超え、かつ、1,000万円を超える場合、Aは、いかなる場合も手付金等の保全措置を行わなければならない。",{"qnum":6,"label":"3","title":"手付金の額・性質の制限②","stem":"宅地建物取引業者Aが、自ら売主となって宅地建物取引業者でない買主Bと建物（完成物件）を売買する場合に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"× 誤り","explanation":"[[手付金等の保全措置]]（130ページ）の問題です。宅建業者が自ら売主で、買主が宅建業者以外の者である場合、手付金等の額が、完成物件においては売買代金の[[10%]]（1/10）を超える、もしくは[[1,000万円]]を超える場合には手付金等の保全措置を講じなければなりません。ただし、買主が[[所有権移転の登記]]をした場合などは、手付金等の保全措置を講じる必要はありません。「いかなる場合も」ではありません。","method":false}],["7-2","Aは、宅地建物取引業者でないBとの間で建築工事が完了した建物を5,000万円で販売する契約を締結し、法第41条の2に規定する手付金等の保全措置を講じずに、当該建物の引渡し前に700万円を手付金として受領した。",{"qnum":7,"label":"2","title":"手付金等の保全措置①","stem":"宅地建物取引業者Aが自ら売主として、買主Bとの間で締結した売買契約に関して行う次に記述する行為のうち、宅地建物取引業法（以下この問において「法」という。）の規定に違反するものはどれか。","answer":"○ 違反する","explanation":"[[完成]]物件の場合、[[手付金が10%以下]]かつ[[1,000万円以下]]であれば保全措置を講じる必要はありません。本肢の場合は代金5,000万円×10%＝500万円ですから、500万円以下かつ1,000万円以下であれば保全措置を講じる必要はありません。しかし、保全措置を講じずに700万円の手付金を受領しているので、宅建業法の規定に違反しています。","method":false}],["7-4","Aは、宅地建物取引業者であるBとの間で建築工事が完了した建物を1億円で販売する契約を締結し、法第41条の2に規定する手付金等の保全措置を講じずに、当該建物の引渡し前に2,500万円を手付金として受領した。",{"qnum":7,"label":"4","title":"手付金等の保全措置①","stem":"宅地建物取引業者Aが自ら売主として、買主Bとの間で締結した売買契約に関して行う次に記述する行為のうち、宅地建物取引業法（以下この問において「法」という。）の規定に違反するものはどれか。","answer":"× 違反しない","explanation":"買主が[[宅建業者]]なので、そもそも宅建業法のルールは適用されません。手付金等の額がいくらであっても、保全措置は不要です。","method":false}],["8-1","Aは、宅地建物取引業者でない買主Bとの間で建築工事完了前の建物を4,000万円で売却する契約を締結し300万円の手付金を受領する場合、銀行等による連帯保証、保険事業者による保証保険又は指定保管機関による保管により保全措置を講じなければならない。",{"qnum":8,"label":"1","title":"手付金等の保全措置②","stem":"宅地建物取引業者Aが、自ら売主として買主との間で締結する売買契約に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。なお、この問において「保全措置」とは、法第41条に規定する手付金等の保全措置をいうものとする。","answer":"× 誤り","explanation":"[[未完成]]物件の場合、指定保管機関との手付金等寄託契約はできません。","method":false}]]},{"id":"review_unit9","title":"9 広告・報酬","group":"第1章 宅建業法・復習問題","reviewUnit":9,"items":[["1-ア","建物の所有者と賃貸借契約を締結し、当該建物を転貸するための広告をする際は、当該広告に自らが契約の当事者となって貸借を成立させる旨を明示しなければ、法第34条に規定する取引態様の明示義務に違反する。",{"qnum":1,"label":"ア","title":"広告等に関する規制①","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはいくつあるか。","answer":"× 誤り","explanation":"[[自ら貸借]]は取引に該当しないので、そもそも宅建業法の適用がありません。","method":false}],["3-2","販売する宅地又は建物の広告に著しく事実に相違する表示をした場合の監督処分の対象となるほか、6月以下の拘禁及び100万円以下の罰金を併科されることがある。",{"qnum":3,"label":"2","title":"広告等に関する規制③","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"○ 正しい","explanation":"誇大広告は[[監督処分]]の対象となるほか、[[罰金]]を併科されることがあります。","method":false}],["5-イ","Aは売主から代理の依頼を受け、Bは買主から媒介の依頼を受けて、代金4,000万円の宅地の売買契約を成立させた場合、Aは売主から277万2,000円、Bは買主から138万6,000円の報酬をそれぞれ受けることができる。",{"qnum":5,"label":"イ","title":"報酬②","stem":"宅地建物取引業者A及び宅地建物取引業者B（共に消費税課税事業者）が受け取る報酬に関する次の記述のうち、正しいものはいくつあるか。","answer":"× 誤り","explanation":"A（[[代理]]）の報酬限度額は「（4,000万円×3%＋6万）×[[2]]×1.1＝277万2,000円」、B（媒介）の報酬限度額は「（4,000万円×3%＋6万）×1.1＝138万6,000円」。1つの取引に[[複数]]の業者が関与した場合の報酬限度額は、媒介報酬限度額の[[2倍]]を超えてはいけません。よって、AとB[[合わせて]]277万2,000円までしか受領できません。","method":false}],["5-ウ","Aは貸主から、Bは借主から、それぞれ媒介の依頼を受けて、共同して居住用建物の賃貸借契約を成立させた場合、貸主及び借主の承諾を得ていれば、Aは貸主から、Bは借主からそれぞれ借賃の1.1か月分の報酬を受けることができる。ただし、居住用建物は長期の空家ではないものとする。",{"qnum":5,"label":"ウ","title":"報酬②","stem":"宅地建物取引業者A及び宅地建物取引業者B（共に消費税課税事業者）が受け取る報酬に関する次の記述のうち、正しいものはいくつあるか。","answer":"× 誤り","explanation":"居住用建物の貸借の媒介に関して、依頼者の双方から受け取れる報酬限度額は、合計で[[借賃1か月分＋消費税]]です。たとえ、承諾を得ていても、借賃の1.1か月分の報酬を[[それぞれが受け取る]]ことはできません。","method":false}],["6-1","建物が店舗用である場合、Aは、B及びCの承諾を得たときは、B及びCの双方からそれぞれ11万円の報酬を受けることができる。",{"qnum":6,"label":"1","title":"報酬③","stem":"宅地建物取引業者A（消費税課税事業者）は、Bが所有する建物について、B及びCから媒介の依頼を受け、Bを貸主、Cを借主とし、1か月分の借賃を10万円（消費税等相当額を含まない。）、CからBに支払われる権利金（権利設定の対価として支払われる金銭であって返還されないものであり、消費税等相当額を含まない。）を150万円とする定期建物賃貸借契約を成立させた。この場合における次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。ただし、建物は長期の空家ではない。","answer":"× 誤り","explanation":"[[居住用ではない]]建物の貸借の場合、報酬限度額は、「①[[借賃の1か月]]」「②[[権利金]]を[[売買代金]]とみなして計算した額」の[[いずれか高いほう]]の金額となります。本問の場合は、①は[[双方合わせて]]11万円が限度です。②は「150万円×5%×1.1＝8万2,500円」となり、[[双方からそれぞれ]]8万2,500円を受け取ることができます。よって、双方からそれぞれ11万円を受け取ることはできません。","method":false}],["6-2","建物が居住用である場合、Aが受け取ることができる報酬の額は、CからBに支払われる権利金の額を売買に係る代金の額とみなして算出される16万5,000円が上限となる。",{"qnum":6,"label":"2","title":"報酬③","stem":"宅地建物取引業者A（消費税課税事業者）は、Bが所有する建物について、B及びCから媒介の依頼を受け、Bを貸主、Cを借主とし、1か月分の借賃を10万円（消費税等相当額を含まない。）、CからBに支払われる権利金（権利設定の対価として支払われる金銭であって返還されないものであり、消費税等相当額を含まない。）を150万円とする定期建物賃貸借契約を成立させた。この場合における次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。ただし、建物は長期の空家ではない。","answer":"× 誤り","explanation":"[[居住用建物]]の貸借の場合、[[権利金]]を売買代金とみなして計算することができません。よって、Aは11万円を上限として、報酬を受け取ることができます。","method":false}],["7-2","事務所（1か月の借賃110万円。消費税等相当額を含む。長期の空家ではない。）の貸借の媒介について、Aは依頼者の双方から合計で110万円を上限として報酬を受領することができる。",{"qnum":7,"label":"2","title":"報酬④","stem":"宅地建物取引業者A（消費税課税事業者）が受け取ることのできる報酬に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","answer":"○ 正しい","explanation":"[[賃貸]]の媒介の報酬は、[[1か月分の賃料＋消費税]]が上限です。[[事務所]]は[[非居住用]]建物ですので、Aは、依頼者の[[双方]]から合計で110万円を上限として報酬を受領することができます。","method":false}],["7-4","宅地（代金200万円。消費税等相当額を含まない。）の売買の媒介報酬額について、売主Dに説明はしたが、合意をしていない場合でも、AはDから330,000円を報酬として受領することができる。",{"qnum":7,"label":"4","title":"報酬④","stem":"宅地建物取引業者A（消費税課税事業者）が受け取ることのできる報酬に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","answer":"× 誤り","explanation":"[[あらかじめ]]報酬額について依頼者に対し[[説明し]]、[[合意]]をしていなければ33万円の報酬を受領することはできません。","method":false}]]},{"id":"review_unit10","title":"10 業務上の規制・監督処分・罰則・住宅瑕疵担保履行法","group":"第1章 宅建業法・復習問題","reviewUnit":10,"items":[["2-3","宅地建物取引業者は、契約の締結の勧誘をするに際し、理由の如何を問わず、相手方に対して当該契約を締結するかどうかを判断するために必要な時間を与えることを拒んではならない。",{"qnum":2,"label":"3","title":"業務上の規制②","stem":"宅地建物取引業法（以下この問において「法」という。）に規定する業務に関する禁止事項についての次の記述のうち、正しいものはどれか。","answer":"× 誤り","explanation":"[[正当な理由]]なく、契約を締結するかどうかの判断を急がせてはいけませんが、「理由の如何を問わず」ではなく[[正当な理由がある]]場合は認められます。","method":false}],["3-解法","この問題は、宅建業者の業務上の規制について問うものです。宅建業法のルールは膨大ですが、すべてを覚えようとしなくても大丈夫です。出題頻度が高いものを重点的に覚えていくのが効率的です。\n\n●宅建業者の業務上の規定\n・宅建業者は[[取引の関係者]]に対し、[[信義]]を旨とし、[[誠実]]にその業務を行わなければなりません。加えて、その[[従業者]]に対し、その業務を[[適正]]に実施させるため、必要な[[教育]]を行うよう努めなければなりません。\n・宅建士も、宅建士の[[信用]]または[[品位]]を害するような行為をしてはいけません。また、宅地または建物の取引に係る[[事務]]に必要な[[知識]]、および[[能力]]の[[維持向上]]に努めなければなりません。\n・宅建業者は、その業務に関して行うべき[[登記]]・物件の引渡し・取引に係る[[対価の支払]]を、不当に[[遅延]]してはなりません。\n\nほかにもルールがありますが、問題文をよく読めば常識的な範囲で解ける問題が多いので、すべてを完璧に覚える必要はありません",{"qnum":3,"label":"解法","title":"10-3 解法暗記","stem":"","answer":"× 誤り","explanation":"","method":true}],["4-1","甲県知事は、宅地建物取引士に対して必要な報告を求めることができるが、その対象は、甲県知事登録の宅地建物取引士であって、適正な事務の遂行を確保するために必要な場合に限られる。",{"qnum":4,"label":"1","title":"監督処分①","stem":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"× 誤り","explanation":"都道府県知事は、[[その登録を受けている]]宅建士と[[都道府県の区域内で事務を行う]]宅建士に必要な[[報告]]を求められます。甲県知事登録の宅建士に限りません。","method":false}],["4-3","宅地建物取引士が不正の手段により宅地建物取引士証の交付を受けた場合においては、その登録をしている都道府県知事は、情状が特に重いときは、当該宅地建物取引士の登録を消除することができる。",{"qnum":4,"label":"3","title":"監督処分①","stem":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"× 誤り","explanation":"[[不正の手段]]により宅建士証の交付を受けていた場合は、その登録をしている都道府県知事が登録を[[消除しなければなりません]]（「消除できる」ではない）。","method":false}],["4-2","宅地建物取引業者A（甲県知事免許）で専任の宅地建物取引士として従事しているB（甲県知事登録）が、勤務実態のない宅地建物取引業者C（乙県知事免許）において、自らが専任の宅地建物取引士である旨の表示がされていることを許した場合には、乙県知事は、Bに対し、必要な指示をすることができる。",{"qnum":4,"label":"2","title":"監督処分①","stem":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"○ 正しい","explanation":"この状態は[[名義貸し]]に該当し、[[指示処分]]の対象です。指示処分は[[登録をしている都道府県知事]]（甲県知事）も[[行為地管轄の知事]]（乙県知事）もできます（164ページ）。","method":false}],["5-1","宅地建物取引士が都道府県知事から指示処分を受けた場合において、宅地建物取引業者（国土交通大臣免許）の責めに帰すべき理由があるときは、国土交通大臣は、当該宅地建物取引業者に対して指示処分をすることができる。",{"qnum":5,"label":"1","title":"監督処分②","stem":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"○ 正しい","explanation":"宅建士が都道府県知事から[[指示処分]]を受けた場合において、[[宅建業者]]の責めに帰すべき理由があるときは、[[免許権者]]は宅建業者に対して指示処分ができます。","method":false}],["5-2","宅地建物取引士が不正の手段により宅地建物取引士の登録を受けた場合、その登録をした都道府県知事は、宅地建物取引士資格試験の合格の決定を取り消さなければならない。",{"qnum":5,"label":"2","title":"監督処分②","stem":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"× 誤り","explanation":"[[不正の手段]]により宅建士の登録を受けた場合、[[登録消除処分]]の対象となりますが、合格は取り消されません。[[合格を取り消される]]のは[[不正な手段]]で[[受験]]した場合です。","method":false}],["6-4","国土交通大臣は、宅地建物取引業者C社（国土交通大臣免許）が宅地建物取引業法第37条に規定する書面の交付をしていなかったことを理由に、C社に対して業務停止処分をしようとするときは、あらかじめ、内閣総理大臣に協議しなければならない。",{"qnum":6,"label":"4","title":"監督処分③","stem":"宅地建物取引業法の規定に基づく監督処分に関する次の記述のうち、正しいものはどれか。","answer":"○ 正しい","explanation":"国土交通大臣は、宅建業者の処分をする際には、あらかじめ[[内閣総理大臣]]に[[協議]]しなければなりません。","method":false}],["6-2","甲県知事は、宅地建物取引業者A社（国土交通大臣免許）の甲県の区域内における業務に関し、A社に対して指示処分をした場合、遅滞なく、その旨を国土交通大臣に通知するとともに、甲県の公報により公告しなければならない。",{"qnum":6,"label":"2","title":"監督処分③","stem":"宅地建物取引業法の規定に基づく監督処分に関する次の記述のうち、正しいものはどれか。","answer":"× 誤り","explanation":"[[指示処分]]の場合、公告は必要ありません。宅建業者に対して、[[業務停止]]処分と[[免許取消]]処分をした際には、公告が必要となります。なお、国土交通大臣に「報告」であり、「通知」ではありません。","method":false}],["7-3","宅地建物取引業者は、各事務所の業務に関する帳簿を主たる事務所に備え、取引のあった都度、その年月日、その取引に係る宅地又は建物の所在及び面積等の事項を記載しなければならない。",{"qnum":7,"label":"3","title":"罰則","stem":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、この問において、「事務所」とは、同法第31条の3に規定する事務所等をいう。","answer":"× 誤り","explanation":"事務所の業務に関する[[帳簿]]は、[[事務所ごと]]に備える必要があります。","method":false}]]}]);

const chapter2ReviewSectionsData=[{"id":"chapter2_review_1","title":"1 意思表示・制限行為能力者","group":"第2章 権利関係｜復習問題","reviewChapter":2,"reviewUnit":1,"items":[["q2_2","AがBとの売買契約をBの詐欺を理由に取り消す前に、Bの詐欺について悪意のCが、Bから甲土地を買い受けて所有権移転登記を備えていた場合、AはCに対して、甲土地の返還を請求することができる。",{"qnum":2,"label":"2","title":"意思表示②","stem":"AがBに甲土地を売却し、Bが所有権移転登記を備えた場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"AB間の契約を取り消す前に、第三者Cが登場した場合、Cは悪意の第三者ですので、登記を備えていてもAはCに対抗できます。よって、AはCに返還を請求することができます。ただし、Cが善意無過失の場合は対抗できませんので、注意しましょう。","pending":false}],["q3_2","善意のCが、Bとの間で、Bが甲土地上に建てた乙建物の賃貸借契約（貸主B、借主C）を締結した場合、AはAB間の売買契約の無効をCに主張することができない。",{"qnum":2,"label":"2","title":"意思表示③","stem":"Aは、その所有する甲土地を譲渡する意思がないのに、Bと通謀して、Aを売主、Bを買主とする甲土地の仮装の売買契約を締結した。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、この問において「善意」又は「悪意」とは、虚偽表示の事実についての善意又は悪意とする。","answer":"❌誤り","explanation":"第三者CはAB間の仮装売買契約において、法律上利害関係を有する第三者に該当しません。Cはその土地の本当の持ち主が誰かについて法律上の権利を持っているわけではありません。","pending":false}],["q4_3","Aが、Cの詐欺によってBとの間で売買契約を締結した場合、Cの詐欺をBが知っているか否かにかかわらず、Aは売買契約を取り消すことはできない。",{"qnum":3,"label":"3","title":"意思表示④","stem":"A所有の土地につき、AとBとの間で売買契約を締結し、Bが当該土地につき第三者との間で売買契約を締結していない場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"第三者Cによる詐欺によって意思表示した場合、相手方Bが善意無過失であるときを除いて、取り消しができます。つまり、Bが悪意または善意有過失であれば、Aは売買契約を取り消すことが可能です。","pending":false}],["q7_1","成年被後見人が行った法律行為は、事理を弁識する能力がある状態で行われたものであっても、取り消すことができる。ただし、日用品の購入その他日常生活に関する行為については、この限りではない。",{"qnum":1,"label":"1","title":"制限行為能力者③","stem":"行為能力に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"成年被後見人が行った法律行為は、事理を弁識する能力がある状態で行われたものであっても、取り消すことができます。ただし、日用品の購入その他日常生活に関する行為については、この限りではありません。","pending":false}],["q7_2","未成年者がその法定代理人の同意を得ずに行った法律行為は、無効となる。ただし、単に権利を得、又は義務を免れる法律行為については、この限りではない。",{"qnum":2,"label":"2","title":"制限行為能力者③","stem":"行為能力に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"未成年者がその法定代理人の同意を得ずに行った法律行為は、原則、取り消すことができます。無効となるわけではありません。そして、単に権利を得、または義務を免れる法律行為については取り消すことができません。","pending":false}],["q8_2","被保佐人が、不動産を売却する場合には保佐人の同意が必要であるが、贈与の申出を拒絶する場合には、保佐人の同意は不要である。",{"qnum":2,"label":"2","title":"制限行為能力者④","stem":"制限行為能力者に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"被保佐人が、不動産を売却する場合も贈与の申出を拒絶する場合も、保佐人の同意が必要です。","pending":false}]]},{"id":"chapter2_review_2","title":"2 代理","group":"第2章 権利関係｜復習問題","reviewChapter":2,"reviewUnit":2,"items":[["q1_2","Bが自らを「売主Aの代理人B」と表示して買主Dとの間で締結した売買契約について、Bが未成年であったとしても、AはBが未成年であることを理由に取り消すことはできない。",{"qnum":2,"label":"2","title":"代理制度","stem":"AがA所有の土地の売却に関する代理権をBに与えた場合における次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"制限行為能力者でも代理人になることができます。よって、制限行為能力者であることを理由に取り消すことはできません。","pending":false}],["q1_3","Bは、自らが選任及び監督するのであれば、Aの意向にかかわらず、いつでもEを復代理人として選任して売買契約を締結させることができる。",{"qnum":3,"label":"3","title":"代理制度","stem":"AがA所有の土地の売却に関する代理権をBに与えた場合における次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"本人の許諾を得なければ、任意代理人は復代理人を選任できません。","pending":false}],["q2_2","委任による代理人は、本人の許諾を得たときのほか、やむを得ない事由があるときに限り、復代理人を選任することができる。",{"qnum":2,"label":"2","title":"復代理","stem":"代理に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"委任による代理人の場合、本人の許諾を得たときのほか、やむを得ない事由があるときに限り、復代理人を選任することができます。","pending":false}],["q2_3","復代理人が委任事務を処理するに当たり金銭を受領し、これを代理人に引き渡したときは、特段の事情がない限り、代理人に対する受領物引渡義務は消滅するが、本人に対する受領物引渡義務は消滅しない。",{"qnum":3,"label":"3","title":"復代理","stem":"代理に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"復代理人の引渡し義務は、代理人と本人に対してあります。しかし、復代理人が、代理人に金銭を引き渡したときは、本人に対する引渡し義務は消滅します。よって、本人に対する受領物引渡義務は消滅します。","pending":false}],["q3_1","Aが死亡した後であっても、BがAの死亡の事実を知らず、かつ、知らないことにつき過失がない場合には、BはAの代理人として有効に甲土地を売却することができる。",{"qnum":1,"label":"1","title":"代理権の消滅","stem":"AがA所有の甲土地の売却に関する代理権をBに与えた場合における次の記述のうち、民法の規定によれば、正しいものはどれか。なお、表見代理は成立しないものとする。","answer":"❌誤り","explanation":"本人の死亡によって、代理権は消滅します。Aの死亡について善意無過失であっても、本人がいないわけですから、代理権は消滅しています。","pending":false}],["q3_2","Bが死亡しても、Bの相続人はAの代理人として有効に甲土地を売却することができる。",{"qnum":2,"label":"2","title":"代理権の消滅","stem":"AがA所有の甲土地の売却に関する代理権をBに与えた場合における次の記述のうち、民法の規定によれば、正しいものはどれか。なお、表見代理は成立しないものとする。","answer":"❌誤り","explanation":"代理人の死亡によって代理権は消滅します。代理権の相続は生じません。","pending":false}],["q4_3","代理人は、行為能力者であることを要しないが、代理人が後見開始の審判を受けたときは、代理権が消滅する。",{"qnum":3,"label":"ウ","title":"代理行為の瑕疵","stem":"代理に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはいくつあるか。","answer":"⭕正しい","explanation":"代理人は、行為能力者であることを要しませんが、代理人が後見開始の審判を受けたときは、代理権が消滅します。","pending":false}],["q4_4","代理人の意思表示の瑕疵が意思の不存在、詐欺、強迫又はある事情を知っていたこと若しくは知らなかったことにつき過失があったことによって影響を受けるべき場合には、その事実の有無は、本人又は代理人のいずれかについて決する。",{"qnum":4,"label":"エ","title":"代理行為の瑕疵","stem":"代理に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはいくつあるか。","answer":"❌誤り","explanation":"意思表示の瑕疵や過失の有無は、代理人を基準に決まります。本人の選択ではありません。","pending":false}]]},{"id":"chapter2_review_3","title":"3 時効・債務不履行・解除","group":"第2章 権利関係｜復習問題","reviewChapter":2,"reviewUnit":3,"items":[["q5_1","債務の履行について不確定期限があるときは、債務者は、その期限が到来したことを知らなくても、期限到来後に履行の請求を受けた時から遅滞の責任を負う。",{"qnum":1,"label":"1","title":"債務不履行・解除①","stem":"債務不履行に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、債務は令和8年4月1日以降に生じたものとする。","answer":"⭕正しい","explanation":"債務の履行について不確定期限があるときは、期限が到来したことを知らなくても、期限到来後に請求を受けたときから履行遅滞の責任を負います。","pending":false}],["q5_2","債務の目的が特定物の引渡しである場合、債権者が目的物の引渡しを受けることを理由なく拒否したため、その後の履行の費用が増加したときは、その増加額について、債権者と債務者はそれぞれ半額ずつ負担しなければならない。",{"qnum":2,"label":"2","title":"債務不履行・解除①","stem":"債務不履行に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、債務は令和8年4月1日以降に生じたものとする。","answer":"❌誤り","explanation":"債権者が引渡しを理由なく拒否したため費用が増加したときは、債権者と債務者はそれぞれ半額ずつ負担するのではなく、債権者が全額負担します。","pending":false}],["q5_4","契約に基づく債務の履行が契約の成立時に不能であったとしても、その不能が債務者の責めに帰することができない事由によるものでない限り、債権者は、履行不能によって生じた損害について、債務不履行による損害の賠償を請求することができる。",{"qnum":4,"label":"4","title":"債務不履行・解除①","stem":"債務不履行に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、債務は令和8年4月1日以降に生じたものとする。","answer":"⭕正しい","explanation":"債務の履行が契約の成立時に不能である、原始的不能の契約であっても、損害賠償請求できます。","pending":false}],["q6_2","マンションの売買契約がマンション引渡し後に債務不履行を理由に解除された場合、契約は遡及的に消滅するため、売主の代金返還債務と、買主の目的物返還債務は、同時履行の関係に立たない。",{"qnum":2,"label":"イ","title":"債務不履行・解除②","stem":"同時履行の抗弁権に関する次の記述のうち、民法の規定及び判例によれば、正しいものはいくつあるか。","answer":"❌誤り","explanation":"契約の解除に基づく原状回復義務は、同時履行の関係にあるので、代金返還債務と目的物返還債務は同時履行の関係に立ちます。","pending":false}],["q7_2","Aは、Bが履行に着手する前であれば、中間金を支払っていても、手付を放棄して契約を解除し、中間金の返還を求めることができる。",{"qnum":2,"label":"2","title":"債務不履行・解除③","stem":"Aは、Bから土地建物を購入する契約（代金5,000万円、手付300万円、違約金1,000万円）をBと締結し、手付を支払ったが、その後資金計画に支障を来し、残代金を支払うことができなくなった。この場合、民法の規定及び判例によれば、次の記述のうち誤っているものはどれか。","answer":"⭕正しい","explanation":"売買契約において手付が交付された場合、買主Aは自らが契約の履行に着手していても、売主Bが履行に着手する前であれば、手付を放棄して契約を解除できます。","pending":false}],["q7_3","Aの債務不履行を理由に契約が解除された場合、Aは、Bに対し違約金を支払わなければならないが、手付の返還を求めることはできる。",{"qnum":3,"label":"3","title":"債務不履行・解除③","stem":"Aは、Bから土地建物を購入する契約（代金5,000万円、手付300万円、違約金1,000万円）をBと締結し、手付を支払ったが、その後資金計画に支障を来し、残代金を支払うことができなくなった。この場合、民法の規定及び判例によれば、次の記述のうち誤っているものはどれか。","answer":"⭕正しい","explanation":"Aの債務不履行を理由に契約が解除された場合、Aは、Bに対して違約金を支払わなければなりませんが、手付の返還を求めることはできます。","pending":false}],["q7_4","Aの債務不履行を理由に契約が解除された場合、Aは、実際の損害額が違約金よりも少なければ、これを立証して、違約金の減額を求めることができる。",{"qnum":4,"label":"4","title":"債務不履行・解除③","stem":"Aは、Bから土地建物を購入する契約（代金5,000万円、手付300万円、違約金1,000万円）をBと締結し、手付を支払ったが、その後資金計画に支障を来し、残代金を支払うことができなくなった。この場合、民法の規定及び判例によれば、次の記述のうち誤っているものはどれか。","answer":"❌誤り","explanation":"違約金は損害賠償額の予定と推定されます。損害賠償額の予定であれば、実際の損害額を立証しても、違約金の減額を求めることはできません。","pending":false}],["q9_3","Bは、自らの債務不履行で解除されたので、Bの原状回復義務を先に履行しなければならず、Aの受領済み代金返還義務との同時履行の抗弁権を主張することはできない。",{"qnum":3,"label":"3","title":"債務不履行・解除⑤","stem":"売主Aは、買主Bとの間で甲土地の売買契約を締結し、代金の3分の2の支払と引換えに所有権移転登記手続と引渡しを行った。その後、Bが残代金を支払わないので、Aは適法に甲土地の売買契約を解除した。この場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"契約が解除された場合、当事者が負う原状回復義務は、同時履行の関係に立ちます。したがって、Bは、Aの受領済み代金返還義務との同時履行の抗弁権を主張することができます。","pending":false}],["q9_1","Aの解除前に、BがCに甲土地を売却し、BからCに対する所有権移転登記がなされているときは、BのAに対する代金債務につき不履行があることをCが知っていた場合においても、Aは解除に基づく甲土地の所有権をCに対して主張できない。",{"qnum":1,"label":"1","title":"債務不履行・解除⑤","stem":"売主Aは、買主Bとの間で甲土地の売買契約を締結し、代金の3分の2の支払と引換えに所有権移転登記手続と引渡しを行った。その後、Bが残代金を支払わないので、Aは適法に甲土地の売買契約を解除した。この場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"Bの債務不履行を理由にAがAB間の売買契約を解除した場合、解除前のCは、登記を備えていれば悪意であっても、保護されます。したがって、Aは甲土地の所有権をCに対抗できません。","pending":false}]]},{"id":"chapter2_review_4","title":"4 契約不適合責任・危険負担・共有","group":"第2章 権利関係｜復習問題","reviewChapter":2,"reviewUnit":4,"items":[["q1_4","甲自動車について、第三者CがA所有ではなくC所有の自動車であると主張しており、Bが所有権を取得できないおそれがある場合、Aが相当の担保を供したときを除き、BはAに対して、売買代金の支払を拒絶することができる。",{"qnum":4,"label":"4","title":"契約不適合責任①","stem":"Aを売主、Bを買主として、A所有の甲自動車を50万円で売却する契約（以下この問において「本件契約」という。）が令和8年7月1日に締結された場合に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"売買の目的について権利を主張する者がいるため、買主がその買い受けた権利の全部または一部を取得することができず、または失うおそれがあるときは、買主は、その危険の程度に応じて、代金の全部または一部の支払いを拒むことができます。ただし、売主が相当の担保を供したときは、この限りではありません。","pending":false}],["q4_2","各共有者は、他の共有者の同意を得なければ、共有物にその形状又は効用の著しい変更を加えることができない。",{"qnum":2,"label":"2","title":"共有①","stem":"不動産の共有に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"各共有者は、他の共有者の同意を得なければ、共有物にその形状または効用の著しい変更（＝軽微でない変更）を加えることができません。","pending":false}],["q4_4","共有者の一人が死亡して相続人がないときは、その持分は国庫に帰属する。",{"qnum":4,"label":"4","title":"共有①","stem":"不動産の共有に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"共有者の1人が死亡して相続人がいないときは、その持分は、他の共有者に帰属します。持分は国庫に帰属しません。","pending":false}],["q5_2","Bが、その持分に基づいて単独でこの建物全部を使用している場合は、A・Cは、Bに対して、理由を明らかにすることなく当然に、その明渡しを求めることができる。",{"qnum":2,"label":"2","title":"共有②","stem":"A・B・Cが、持分を6・2・2の割合とする建物の共有をしている場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"Bが、持分に基づいて建物全部を使用している場合、A・Cは、Bに対して、理由を明らかにすることなく当然に、その明渡しを求めることはできません。","pending":false}]]}];

const chapter2ReviewSectionsStage2Data=[{"id":"chapter2_review_5","title":"5 相続","group":"第2章 権利関係｜復習問題","reviewChapter":2,"reviewUnit":5,"items":[["q2_1","Bが甲建物を不法占拠するDに対し明渡しを求めたとしても、Bは単純承認をしたものとはみなされない。",{"qnum":2,"label":"1","title":"相続の承認と放棄","stem":"甲建物を所有するAが死亡し、相続人がそれぞれAの子であるB及びCの2名である場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"不法占拠者への明渡請求は相続財産の保存行為で、単純承認に該当しません。","pending":false}],["q2_4","Bが自己のために相続の開始があったことを知らない場合であっても、相続の開始から3か月が経過したときは、Bは単純承認をしたものとみなされる。",{"qnum":2,"label":"4","title":"相続の承認と放棄","stem":"甲建物を所有するAが死亡し、相続人がそれぞれAの子であるB及びCの2名である場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"相続の開始があったことを相続人が知った日から3か月以内に限定承認や放棄を行わなかった場合、単純承認したとみなします。相続の開始があったことをBが知らない場合は、3か月が経過しても単純承認にはなりません。","pending":false}],["q4_1","自筆証書遺言は、その内容をパソコン等で作成して印字していても、日付と氏名を自書し、押印すれば、有効な遺言となる。",{"qnum":4,"label":"1","title":"遺言","stem":"遺言に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"自筆証書遺言によって遺言するには、遺言者がその全文、日付、および氏名を自書し、押印しなければなりません。パソコンなどで作成して印字した場合は無効です。ただし、財産目録に限り、パソコンなどで作成できます。","pending":false}],["q5_1","被相続人の生前においては、相続人は、家庭裁判所の許可を受けることにより、遺留分を放棄することができる。",{"qnum":5,"label":"1","title":"遺留分","stem":"相続に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"被相続人の生前においては、相続人は、家庭裁判所の許可を受けることにより、遺留分を放棄することができます。","pending":false}],["q5_2","家庭裁判所への相続放棄の申述は、被相続人の生前には行うことができない。",{"qnum":5,"label":"2","title":"遺留分","stem":"相続に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"相続の放棄は、被相続人の生前に行うことはできません。","pending":false}],["q5_4","相続人が被相続人の兄弟姉妹である場合、当該相続人には遺留分がない。",{"qnum":5,"label":"4","title":"遺留分","stem":"相続に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"遺留分は配偶者、子、直系尊属に限られ、兄弟姉妹にはありません。例題1で学習した法定相続分と混同しないようにしましょう。","pending":false}],["q6_3","遺産に属する預貯金債権は、相続開始と同時に当然に相続分に応じて分割され、共同相続人は、その持分に応じて、単独で預貯金債権に関する権利を行使することができる。",{"qnum":6,"label":"3","title":"遺産分割","stem":"遺産分割に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"預貯金債権は、遺産分割の対象とされるので、相続開始と同時に当然に相続分に応じて分割されるわけではありません。","pending":false}],["q7_1","遺産分割協議において、Bの配偶者居住権の存続期間が定められなかった場合、配偶者居住権の存続期間は20年となる。",{"qnum":7,"label":"1","title":"配偶者居住権","stem":"甲建物を所有するAが死亡し、Aの配偶者Bが甲建物の配偶者居住権を、Aの子Cが甲建物の所有権をそれぞれ取得する旨の遺産分割協議が成立した場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"遺産分割協議においてBの配偶者居住権の存続期間を定めていないので、原則通り終身となります。","pending":false}]]},{"id":"chapter2_review_6","title":"6 抵当権","group":"第2章 権利関係｜復習問題","reviewChapter":2,"reviewUnit":6,"items":[["q2_1","債権者が抵当権の実行として担保不動産の競売手続をする場合には、被担保債権の弁済期が到来している必要があるが、対象不動産に関して発生した賃料債権に対して物上代位をしようとする場合には、被担保債権の弁済期が到来している必要はない。",{"qnum":2,"label":"1","title":"物上代位・妨害排除請求","stem":"抵当権に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"抵当権の効力は抵当不動産の果実（賃料）に及びますが、物上代位をするには、被担保債権の弁済期が到来している必要があります。","pending":false}],["q2_2","抵当権の対象不動産が借地上の建物であった場合、特段の事情がない限り、抵当権の効力は当該建物のみならず借地権についても及ぶ。",{"qnum":2,"label":"2","title":"物上代位・妨害排除請求","stem":"抵当権に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"抵当権の効力が及ぶ目的物の範囲として、従物・従たる権利があります。土地を借りてその土地の上に建物を建てていた場合、建物に抵当権が設定されれば、設定当時からあった借地権などの土地利用権に対しても効力が及びます。","pending":false}],["q3_1","Aが乙建物の登記をA名義に移転する前に甲土地に抵当権を設定登記していた場合、甲土地の抵当権が実行されたとしても、乙建物のために法定地上権は成立しない。",{"qnum":3,"label":"1","title":"法定地上権","stem":"Aが所有する甲土地上にBが乙建物を建築して所有権を登記していたところ、AがBから乙建物を買い取り、その後、Aが甲土地にCのために抵当権を設定し登記した。この場合の法定地上権に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"AがBから乙建物を買い取っているので、所有権はAにあります。登記は関係ありませんので、建物の登記名義がBであっても、法定地上権は成立します。","pending":false}],["q4_1","本件抵当権設定登記後にA・C間の賃貸借契約が締結され、AのBに対する借入金の返済が債務不履行となった場合、Bは抵当権に基づき、AがCに対して有している賃料債権を差し押さえることができる。",{"qnum":4,"label":"1","title":"抵当権と賃借権の対抗問題","stem":"Aは、Bからの借入金の担保として、A所有の甲建物に第一順位の抵当権（以下この問において「本件抵当権」という。）を設定し、その登記を行った。A・C間にCを賃借人とする甲建物の一時使用目的ではない賃貸借契約がある場合に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"例題2で学習した通り、抵当権は、その担保する債権について不履行があったときは、その後に生じた抵当不動産の果実に及びます。よって、Bは抵当権に基づき、AがCに対して有している賃料債権について物上代位（差し押さえること）ができます。","pending":false}],["q5_2","Cに対抗することができない賃貸借により甲土地を競売手続の開始前から使用するEは、甲土地の競売における買受人Fの買受けの時から6か月を経過するまでは、甲土地をFに引き渡すことを要しない。",{"qnum":5,"label":"2","title":"第三取得者の保護・一括競売","stem":"A所有の甲土地にBのCに対する債務を担保するためにCの抵当権（以下この問において「本件抵当権」という。）が設定され、その旨の登記がなされた場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"例題4で学習したとおり、賃借権の対抗要件を備えていない建物の賃借人については、買受けのときから6か月間引渡しが猶予されます。しかし、土地の場合にはこのような制度はありません。よって、甲土地を引き渡さなければなりません。","pending":false}]]},{"id":"chapter2_review_7","title":"7 連帯債務・連帯保証・保証","group":"第2章 権利関係｜復習問題","reviewChapter":2,"reviewUnit":7,"items":[["q2_2","BがDに対して300万円の債権を有している場合、Bが相続を放棄しない間に300万円の支払の請求を受けたCは、BのDに対する債権で相殺する旨の意思表示をすることができる。",{"qnum":2,"label":"2","title":"連帯債務②","stem":"債務者A、B、Cの3名が、令和8年7月1日に、内部的な負担部分の割合は等しいものとして合意した上で、債権者Dに対して300万円の連帯債務を負った場合に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"Bが相殺を援用しない間に300万円の支払の請求を受けたCは、Bの負担部分100万円（300万円÷3人）については、履行を拒絶できます。残りの200万円について支払えばよいということです。「BのDに対する債権（300万円）で相殺する旨の意思表示をすることができる」というのが誤りです。","pending":false}],["q3_3","Cの保証債務がBとの連帯保証債務である場合、Cに対する履行の請求による時効の更新は、Bに対してはその効力を生じない。",{"qnum":3,"label":"3","title":"連帯保証と保証①","stem":"Aは、Aの所有する土地をBに売却し、Bの売買代金の支払債務についてCがAとの間で保証契約を締結した。この場合、民法の規定によれば、次の記述のうち誤っているものはどれか。","answer":"⭕正しい","explanation":"履行の請求による時効の更新は相対効ですので、主たる債務者Bに対しては、その効力を生じません。","pending":false}],["q3_4","Cの保証債務がBと連帯して債務を負担する特約がない場合、Bに対する履行の請求その他時効の完成猶予及び更新は、Cに対してもその効力を生ずる。",{"qnum":3,"label":"4","title":"連帯保証と保証①","stem":"Aは、Aの所有する土地をBに売却し、Bの売買代金の支払債務についてCがAとの間で保証契約を締結した。この場合、民法の規定によれば、次の記述のうち誤っているものはどれか。","answer":"⭕正しい","explanation":"主たる債務者Bに対して、履行の請求その他時効の完成猶予及び更新があった場合は、その効力は保証人Cに対してもその効力を生じます。","pending":false}],["q4_1","保証人となるべき者が、主たる債務者と連絡を取らず、同人からの委託を受けないまま債権者に対して保証したとしても、その保証契約は有効に成立する。",{"qnum":4,"label":"1","title":"連帯保証と保証②","stem":"保証に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"保証人が主たる債務者からの委託を受けないまま債権者に対して保証したとしても、保証契約は有効に成立します。","pending":false}],["q4_2","保証人となるべき者が、口頭で明確に特定の債務につき保証する旨の意思表示を債権者に対してすれば、その保証契約は有効に成立する。",{"qnum":4,"label":"2","title":"連帯保証と保証②","stem":"保証に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"保証契約は、書面か、その内容を記録した電磁的記録で締結しなければその効力を生じません。口頭で意思表示しただけでは、保証契約は有効に成立しません。","pending":false}],["q5_1","Aが、Bに対して債務を免除した場合にはCが、Cに対して債務を免除した場合にはBが、それぞれ500万円分の債務を免れる。Dが、Eに対して債務を免除した場合にはFが、Fに対して債務を免除した場合にはEが、それぞれ全額の債務を免れる。",{"qnum":5,"label":"1","title":"連帯債務・連帯保証と保証","stem":"AからBとCとが負担部分2分の1として連帯して1,000万円を借り入れる場合と、DからEが1,000万円を借り入れ、Fがその借入金返済債務についてEと連帯して保証する場合とに関する次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"【連帯債務】連帯債務者の1人が債務を免除された場合でも、他の連帯債務者の債務には影響がありません。よって、ほかの連帯債務者が負担する債務は1,000万円から変わりません。【連帯保証】主たる債務者Eが債務の免除を受ければ、連帯保証人Fも債務を免れます。一方、連帯保証人Fが債務の免除を受けた場合については、主たる債務者Eは債務を免れません。","pending":false}],["q5_2","Aが、Bに対して履行を請求した効果はCに及ばず、Cに対して履行を請求した効果はBに及ばない。Dが、Eに対して履行を請求した効果はFに及び、Fに対して履行を請求した効果はEに及ばない。",{"qnum":5,"label":"2","title":"連帯債務・連帯保証と保証","stem":"AからBとCとが負担部分2分の1として連帯して1,000万円を借り入れる場合と、DからEが1,000万円を借り入れ、Fがその借入金返済債務についてEと連帯して保証する場合とに関する次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"【連帯債務】連帯債務者の1人に対する履行の請求は、他の連帯債務者に対しては、その効力が及びません。【連帯保証】主たる債務者Eに履行を請求すれば、連帯保証人Fにも履行を請求したことになります。一方、連帯保証人Fに対する履行の請求の効力は、主たる債務者Eに及びません。","pending":false}],["q6_1","Bが、本件代金債務につき受領権限のないCに対して弁済した場合、Cに受領権限がないことを知らないことにつきBに過失があれば、Cが受領した代金をAに引き渡したとしても、Bの弁済は有効にならない。",{"qnum":6,"label":"1","title":"弁済","stem":"Aを売主、Bを買主として甲建物の売買契約が締結された場合におけるBのAに対する代金債務（以下「本件代金債務」という。）に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"Cは受領権限がなく、さらに、Bは受領権限がないことについて過失があるので、原則としてBの弁済は無効です。ただし、本肢では「Cが受領した代金をAに引き渡した」とあります。代金が債権者Aに渡っている以上、Bの弁済を無効にし、改めてAに弁済しなければいけないというのは酷です。民法では、受領権者以外の者に対する弁済についても、債権者がこれによって利益を受けた限度において効力を認めていますので、Bの弁済は、Aが利益を受けた限度において有効となります。","pending":false}],["q6_2","Bが、Aの代理人と称するDに対して本件代金債務を弁済した場合、Dに受領権限がないことにつきBが善意かつ無過失であれば、Bの弁済は有効となる。",{"qnum":6,"label":"2","title":"弁済","stem":"Aを売主、Bを買主として甲建物の売買契約が締結された場合におけるBのAに対する代金債務（以下「本件代金債務」という。）に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"Dは代理人と称しているので、受領権者としての外観を有する者に該当します。Bは善意無過失ですので、Bの弁済は有効となります。","pending":false}],["q6_3","Bが、Aの相続人と称するEに対して本件代金債務を弁済した場合、Eに受領権限がないことにつきBが善意かつ無過失であれば、Bの弁済は有効となる。",{"qnum":6,"label":"3","title":"弁済","stem":"Aを売主、Bを買主として甲建物の売買契約が締結された場合におけるBのAに対する代金債務（以下「本件代金債務」という。）に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"選択肢2と同様、EはAの相続人と称しているので、受領権者としての外観を有する者に該当します。Bは善意無過失ですので、Bの弁済は有効となります。","pending":false}],["q7_2","同年11月1日にAの売買代金債権がAの債権者Cにより差し押さえられても、Bは、同年11月2日から12月1日までの間にAに対する別の債権を取得した場合には、同年12月1日に売買代金債権と当該債権を対当額で相殺することができる。",{"qnum":7,"label":"2","title":"相殺","stem":"Aは、令和8年10月1日、A所有の甲土地につき、Bとの間で、代金1,000万円、支払期日を同年12月1日とする売買契約を締結した。この場合の相殺に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"Bが取得した債権は、11月1日の差押後に取得されたものです。そのため、BはAの売買代金債権と相殺することができません。","pending":false}],["q7_3","同年10月10日、BがAの自動車事故によって被害を受け、Aに対して不法行為に基づく損害賠償債権を取得した場合には、Bは売買代金債権と当該損害賠償債権を対当額で相殺することができる。",{"qnum":7,"label":"3","title":"相殺","stem":"Aは、令和8年10月1日、A所有の甲土地につき、Bとの間で、代金1,000万円、支払期日を同年12月1日とする売買契約を締結した。この場合の相殺に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"BからAに対して相殺をもちかけることは可能です（自働債権）。ただし、Aからは相殺することはできません。","pending":false}]]},{"id":"chapter2_review_8","title":"8 物権変動・不動産登記法","group":"第2章 権利関係｜復習問題","reviewChapter":2,"reviewUnit":8,"items":[["q1_3","Cが時効により甲土地の所有権を取得した旨主張している場合、取得時効の進行中にBA間で売買契約及び所有権移転登記がなされ、その後に時効が完成しているときには、Cは登記がなくてもAに対して所有権を主張することができる。",{"qnum":1,"label":"3","title":"物権変動①","stem":"AがBから甲土地を購入したところ、甲土地の所有者を名乗るCがAに対して連絡してきた。この場合における次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"Cは登記がなくても権利を主張できます。時効取得者は時効完成前に移転登記を備えた第三者に対して、登記がなくても所有権を主張できるためです。","pending":false}],["q1_4","Cは債権者の追及を逃れるために売買契約の実態はないのに登記だけBに移し、Bがそれに乗じてAとの間で売買契約を締結した場合には、CB間の売買契約が存在しない以上、Aは所有権を主張することができない。",{"qnum":1,"label":"4","title":"物権変動①","stem":"AがBから甲土地を購入したところ、甲土地の所有者を名乗るCがAに対して連絡してきた。この場合における次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"本肢は、意思表示で学んだ通謀虚偽表示の問題です。第三者であるAが悪意であればCは無効を主張できますが、Aが善意であれば、Cは無効を主張できません。つまり、Aが善意の場合は、Aは甲土地の所有権を主張できます。","pending":false}],["q2_1","CはBとの間で売買契約を締結して所有権移転登記をしたが、甲土地の真の所有者はAであって、Bが各種の書類を偽造して自らに登記を移していた場合、Aは所有者であることをCに対して主張できる。",{"qnum":2,"label":"1","title":"物権変動②","stem":"所有権がAからBに移転している旨が登記されている甲土地の売買契約に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"Cは無権利者ですので、第三者に該当しません。よって、所有者であることをAはCに主張できます。","pending":false}],["q3_3","甲不動産につき兄と弟が各自2分の1の共有持分で共同相続した後に、兄が弟に断ることなく単独で所有権を相続取得した旨の登記をした場合、弟は、その共同相続の登記をしなければ、共同相続後に甲不動産を兄から取得して所有権移転登記を経た第三者に自己の持分権を対抗できない。",{"qnum":3,"label":"3","title":"物権変動③","stem":"不動産の物権変動の対抗要件に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。なお、この問において、第三者とはいわゆる背信的悪意者を含まないものとする。","answer":"❌誤り","explanation":"不動産を兄と弟で各自持分2分の1の割合とする共有相続をしているのにもかかわらず、兄が登記を偽装して、兄の単独所有としています。第三者がこの登記を信じて甲不動産を買ったとしても、兄は弟の相続分については無権利者であるので、第三者も無権利者となります。よって、弟は登記がなくても、自己の持分を第三者に対抗できます。","pending":false}],["q4_1","新築した建物又は区分建物以外の表題登記がない建物の所有権を取得した者は、その所有権の取得の日から1月以内に、所有権の保存の登記を申請しなければならない。",{"qnum":4,"label":"1","title":"不動産登記法①","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"新築した建物や表題登記がない建物の所有権を取得した者は、取得の日から1か月以内に、表題登記を申請しなければなりませんが、所有権保存登記の申請義務はありません。","pending":false}],["q4_3","建物が滅失したときは、表題部所有者又は所有権の登記名義人は、その滅失の日から1月以内に、当該建物の滅失の登記を申請しなければならない。",{"qnum":4,"label":"3","title":"不動産登記法①","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"建物が滅失した場合、表題部所有者又は所有権の登記名義人は、その滅失の日から1か月以内に、当該建物の滅失の登記を申請しなければなりません。","pending":false}],["q5_2","不動産の収用による所有権の移転の登記は、起業者が単独で申請することができる。",{"qnum":5,"label":"2","title":"不動産登記法②","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"起業者が行う不動産の収用による所有権の移転登記は、単独で申請することができます。","pending":false}],["q5_3","相続人ではない者に対する遺贈による所有権の移転の登記は、登記権利者が単独で申請することができる。",{"qnum":5,"label":"3","title":"不動産登記法②","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"相続人ではない者に対する遺贈による所有権の移転の登記は、原則通り相続人と受遺者の共同申請となります。相続人に対する遺贈であれば、単独で申請することができます。","pending":false}],["q6_3","仮登記の抹消の申請は、その仮登記の登記識別情報を提供して、登記上の利害関係人が単独ですることができる。",{"qnum":6,"label":"3","title":"不動産登記法③","stem":"不動産の仮登記に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"仮登記の抹消申請は、申請情報と合わせて登記識別情報を提供して、仮登記名義人が単独で行うことができます。登記上の利害関係人が単独でできるわけではありません。","pending":false}],["q6_4","仮登記の抹消の申請は、仮登記名義人の承諾があれば、登記上の利害関係人が単独ですることができる。",{"qnum":6,"label":"4","title":"不動産登記法③","stem":"不動産の仮登記に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"仮登記の抹消申請は、仮登記名義人の承諾があるときは、登記上の利害関係人が単独でできます。","pending":false}],["q7_1","登記事項証明書の交付を請求する場合は、書面をもって作成された登記事項証明書の交付のほか、電磁的記録をもって作成された登記事項証明書の交付を請求することもできる。",{"qnum":7,"label":"1","title":"不動産登記法④","stem":"登記事項証明書の交付の請求に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"登記事項証明書の交付請求は書面でのみでき、電磁的記録での交付請求はできません。","pending":false}],["q8_1","登記の申請に係る不動産の所在地が当該申請を受けた登記所の管轄に属しないときは、登記官は、理由を付した決定で、当該申請を却下しなければならない。",{"qnum":8,"label":"1","title":"不動産登記法⑤","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"登記官は、申請に係る不動産の所在地が当該申請を受けた登記所の管轄に属していないときは、理由を付した決定で、登記の申請を却下しなければなりません。","pending":false}],["q8_2","所有権の登記名義人が相互に異なる土地の合筆の登記は、することができない。",{"qnum":8,"label":"2","title":"不動産登記法⑤","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"所有権の登記名義人が相互に異なる土地の合筆の登記はできません。","pending":false}],["q8_3","登記官は、一筆の土地の一部が別の地目となったときであっても、職権で当該土地の分筆の登記をすることはできない。",{"qnum":8,"label":"3","title":"不動産登記法⑤","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"一筆の土地の一部が別の地目になったときは、分筆登記をしなければなりません。土地の所有者から登記申請がなかった場合、登記官は職権で分筆登記をすることができます。","pending":false}],["q8_4","登記の申請をする者の委任による代理人の権限は、本人の死亡によっては、消滅しない。",{"qnum":8,"label":"4","title":"不動産登記法⑤","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"登記申請をする者の委任による代理権は、本人の死亡によって消滅しません。","pending":false}]]}];

const chapter2ReviewSectionsStage3Data=[{"id":"chapter2_review_10","title":"10 借地借家法（借地）","group":"第2章 権利関係｜復習問題","reviewChapter":2,"reviewUnit":10,"items":[["q1_1","賃貸借契約が建物を所有する目的ではなく、資材置場とする目的である場合、ケース①は期間の定めのない契約になり、ケース②では期間は15年となる。",{"qnum":1,"label":"1","title":"普通借地権と定期借地権①","stem":"甲土地につき、期間を50年と定めて賃貸借契約を締結しようとする場合（以下「ケース①」という。）と、期間を15年と定めて賃貸借契約を締結しようとする場合（以下「ケース②」という。）に関する次の記述のうち、民法及び借地借家法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"資材置場を目的とするということは、建物の所有を目的にしていないため、借地借家法は適用されません。この場合、民法の規定が適用され、期間は50年が上限となります。よってケース①は50年、ケース②は15年となります。","pending":false}],["q1_3","賃貸借契約が居住の用に供する建物の所有を目的とする場合、ケース①では契約の更新がないことを書面で定めればその特約は有効であるが、ケース②では契約の更新がないことを書面で定めても無効であり、期間は30年となる。",{"qnum":1,"label":"3","title":"普通借地権と定期借地権①","stem":"甲土地につき、期間を50年と定めて賃貸借契約を締結しようとする場合（以下「ケース①」という。）と、期間を15年と定めて賃貸借契約を締結しようとする場合（以下「ケース②」という。）に関する次の記述のうち、民法及び借地借家法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"居住用建物の所有を目的とする場合、更新がない契約は一般定期借地権となります。一般定期借地権の存続期間が50年以上なので、ケース①は50年となり、契約の更新がないことなどを公正証書等の書面で定めればその特約は有効です。ケース②は50年未満ですので、更新のない定めは無効となり、普通借地権の期間である30年となります。","pending":false}],["q1_4","賃貸借契約が専ら工場の用に供する建物の所有を目的とする場合、ケース①では契約の更新がないことを公正証書で定めた場合に限りその特約は有効であるが、ケース②では契約の更新がないことを公正証書で定めても無効である。",{"qnum":1,"label":"4","title":"普通借地権と定期借地権①","stem":"甲土地につき、期間を50年と定めて賃貸借契約を締結しようとする場合（以下「ケース①」という。）と、期間を15年と定めて賃貸借契約を締結しようとする場合（以下「ケース②」という。）に関する次の記述のうち、民法及び借地借家法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"専ら工場の用に供する建物の所有を目的とする場合、事業用定期借地権を定めることができますが、その期間は10年以上50年未満となります。ケース①は一般定期借地権とした場合、契約書面でよく、公正証書である必要はありません。ケース②は契約の更新がないことを公正証書で定めれば、事業用定期借地権として有効となります。","pending":false}],["q2_3","本件契約において借地権の存続期間を60年と定めても、公正証書によらなければ、その期間は30年となる。",{"qnum":2,"label":"3","title":"更新","stem":"AとBとの間で、A所有の甲土地につき建物所有目的で賃貸借契約（以下この問において「本件契約」という。）を締結する場合に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"借地権の最短存続期間は30年です。30年より短い期間を定めれば30年になりますが、60年と定めた場合は60年になります。また、普通借地権の場合、公正証書でなくても有効です。","pending":false}],["q2_4","Bは、甲土地につき借地権登記を備えなくても、Bと同姓でかつ同居している未成年の長男名義で保存登記をした建物を甲土地上に所有していれば、甲土地の所有者が替わっても、甲土地の新所有者に対し借地権を対抗することができる。",{"qnum":2,"label":"4","title":"更新","stem":"AとBとの間で、A所有の甲土地につき建物所有目的で賃貸借契約（以下この問において「本件契約」という。）を締結する場合に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"借地上に借地権者本人名義の登記された建物があれば、甲土地の新所有者に対し借地権を対抗することができますが、本肢では建物の名義人はBではなく、Bと同姓でかつ同居している未成年の長男名義となっています。よってBは新所有者に対し借地権を対抗することはできません。","pending":false}],["q3_3","A B間の賃貸借契約を公正証書で行えば、当該契約の更新がなく期間満了により終了し、終了時にはAが甲建物を収去すべき旨を有効に規定することができる。",{"qnum":3,"label":"3","title":"普通借地権と定期借地権②","stem":"Aが居住用の甲建物を所有する目的で、期間30年としてBから乙土地を賃借した場合に関する次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。なお、Aは借地権登記を備えていないものとする。","answer":"❌誤り","explanation":"更新がない契約は定期借地権を利用します。定期借地権の設定条件として、「居住用建物・期間30年・更地で返還」が該当するものはありません。よって、本問の条件にあう契約をすることはできません。","pending":false}],["q4_1","借地権の存続期間が満了する前に建物の滅失があった場合において、借地権者が借地権の残存期間を超えて存続すべき建物を築造したときは、その建物を築造することにつき借地権設定者の承諾がない場合でも、借地権の期間の延長の効果が生ずる。",{"qnum":4,"label":"1","title":"建物の再築","stem":"建物の所有を目的とする土地の賃貸借契約（定期借地権及び一時使用目的の借地権となる契約を除く。）に関する次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"借地権の期間延長の効果は、借地権設定者の承諾がない場合は生じません。契約期間満了で借地契約は終了します。","pending":false}],["q4_2","転借地権が設定されている場合において、転借地上の建物が滅失したときは、転借地権は消滅し、転借地権者（転借人）は建物を再築することができない。",{"qnum":4,"label":"2","title":"建物の再築","stem":"建物の所有を目的とする土地の賃貸借契約（定期借地権及び一時使用目的の借地権となる契約を除く。）に関する次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"建物再築のルールは転借人にも適用されますので、転貸借の存続期間中に建物が滅失した場合は、建物を再築することができます。","pending":false}],["q4_3","借地上の建物が滅失し、借地権設定者の承諾を得て借地権者が新たに建物を築造するに当たり、借地権設定者が存続期間満了の際における借地の返還確保の目的で、残存期間を超えて存続する建物を築造しない旨の特約を借地権者と結んだとしても、この特約は無効である。",{"qnum":4,"label":"3","title":"建物の再築","stem":"建物の所有を目的とする土地の賃貸借契約（定期借地権及び一時使用目的の借地権となる契約を除く。）に関する次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"借地上の建物が滅失した場合、残存期間を超えて存続する建物を築造しない旨の特約は、借地借家法の規定よりも借地人に不利になりますので、無効となります。","pending":false}],["q5_3","Aが借地上の建物をDに賃貸している場合には、AはあらかじめDの同意を得ておかなければ、借地権を譲渡することはできない。",{"qnum":5,"label":"3","title":"借地権の譲渡と転貸","stem":"借地人Aが、令和8年9月1日に甲地所有者Bと締結した建物所有を目的とする甲地賃貸借契約に基づいてAが甲地上に所有している建物と甲地の借地権を第三者Cに譲渡した場合に関する次の記述のうち、民法及び借地借家法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"建物の譲渡をする場合、建物の賃借人Dの同意は不要です。","pending":false}],["q6_3","建物の所有を目的とする土地の賃貸借契約において、建物が全焼した場合でも、借地権者は、その土地上に滅失建物を特定するために必要な事項等を掲示すれば、借地権を第三者に対抗することができる場合がある。",{"qnum":6,"label":"3","title":"借地権の対抗要件","stem":"賃貸借契約に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"建物が滅失した場合でも、滅失日から2年を経過するまでは、一定の内容をその土地の見やすい場所に掲示すれば、借地権を第三者に対抗できます。","pending":false}],["q6_4","仮設建物を建築するために土地を一時使用として1年間賃借し、借地権の存続期間が満了した場合には、借地権者は、借地権設定者に対し、建物を時価で買い取るように請求することができる。",{"qnum":6,"label":"4","title":"借地権の対抗要件","stem":"賃貸借契約に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"一時使用目的の場合、存続期間が満了しても、建物を買い取るように請求することはできません。","pending":false}]]},{"id":"chapter2_review_11","title":"11 借地借家法（借家）","group":"第2章 権利関係｜復習問題","reviewChapter":2,"reviewUnit":11,"items":[["q1_2","本件契約において期間の定めがない場合、借地借家法第28条に定める正当事由を備えてAが解約の申入れをしたときには、解約の申入れをした日から6月を経過した日に、本件契約は終了する。",{"qnum":1,"label":"2","title":"更新・解約","stem":"賃貸人Aと賃借人Bとの間で令和8年7月1日に締結した一時使用目的ではない建物賃貸借契約（以下この問において「本件契約」という。）の終了に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"期間の定めがない契約の場合、いつでも双方が解約を申し入れることができます。賃貸人Aが解約の申入れをするときには、正当事由が必要ですが、申入れをしてから6か月を経過した日に契約は終了します。","pending":false}],["q1_3","建物の転貸借がされている場合において、本件契約がB（転貸人）の債務不履行によって解除されて終了するときは、Aが転借人に本件契約の終了を通知した日から6月を経過することによって、転貸借契約は終了する。",{"qnum":1,"label":"3","title":"更新・解約","stem":"賃貸人Aと賃借人Bとの間で令和8年7月1日に締結した一時使用目的ではない建物賃貸借契約（以下この問において「本件契約」という。）の終了に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"転貸人の債務不履行によって解除され、終了する場合は、転借人に対抗できます。よって6か月の経過を待つことなく転貸借契約は終了します（340ページ）。","pending":false}],["q2_2","Aが甲建物の賃貸借契約の解約の申入れをした場合には申入れ日から3月で賃貸借契約が終了する旨を定めた特約は、Bがあらかじめ同意していれば、有効となる。",{"qnum":2,"label":"2","title":"譲渡・転貸借","stem":"Aが所有する甲建物をBに対して3年間賃貸する旨の契約をした場合における次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"申入れ日から3か月で賃貸借契約が終了する旨を定めた特約は、賃貸人があらかじめ同意していても、賃借人に不利な特約として無効となります。賃貸人からの解約申入れから契約終了までの期間は、6か月を下回ることはできません。","pending":false}],["q3_1","定期建物賃貸借契約を締結するには、公正証書による等書面または電磁的記録によらなければならない。",{"qnum":3,"label":"1","title":"定期建物賃貸借①","stem":"借地借家法第38条の定期建物賃貸借（以下この問において「定期建物賃貸借」という。）に関する次の記述のうち、借地借家法の規定及び判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"公正証書による等書面または電磁的記録によって契約しなければなりません。ですが、公正証書である必要はなく、書面で契約すれば大丈夫です。","pending":false}],["q3_3","定期建物賃貸借契約を締結するには、当該契約に係る賃貸借は契約の更新がなく、期間の満了によって終了することを、当該契約書と同じ書面内に記載して説明すれば足りる。",{"qnum":3,"label":"3","title":"定期建物賃貸借①","stem":"借地借家法第38条の定期建物賃貸借（以下この問において「定期建物賃貸借」という。）に関する次の記述のうち、借地借家法の規定及び判例によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"賃貸人は契約締結前に、契約書面等とは別に、賃借人に対して「契約の更新がなく期間満了で終了する」旨を記載した書面等を交付または電磁的方法により提供して説明しなければなりません。","pending":false}],["q4_1","A B間の賃貸借契約が借地借家法第38条の定期建物賃貸借で、契約の更新がない旨を定めた場合には、5年経過をもって当然に、AはBに対し、期間満了による終了を対抗することができる。",{"qnum":4,"label":"1","title":"定期建物賃貸借②・造作買取請求権","stem":"AとBとの間で、Aが所有する甲建物をBが5年間賃貸する旨の契約を締結した場合における次の記述のうち、民法及び借地借家法の規定によれば、正しいものはどれか（借地借家法第39条に定める取壊し予定の建物の賃貸借及び同法第40条に定める一時使用目的の建物の賃貸借は考慮しないものとする。）。","answer":"❌誤り","explanation":"期間が1年以上の定期建物賃貸借の場合、期間満了の1年前から6か月前までの間に、賃貸人から契約終了の通知をしなければ、賃借人に終了を対抗できません。","pending":false}],["q4_3","A B間の賃貸借契約が借地借家法第38条の定期建物賃貸借でない場合、A及びBのいずれからも期間内に更新しない旨の通知又は条件変更しなければ更新しない旨の通知がなかったときは、当該賃貸借契約が更新され、その契約は期間の定めがないものとなる。",{"qnum":4,"label":"3","title":"定期建物賃貸借②・造作買取請求権","stem":"AとBとの間で、Aが所有する甲建物をBが5年間賃貸する旨の契約を締結した場合における次の記述のうち、民法及び借地借家法の規定によれば、正しいものはどれか（借地借家法第39条に定める取壊し予定の建物の賃貸借及び同法第40条に定める一時使用目的の建物の賃貸借は考慮しないものとする。）。","answer":"⭕正しい","explanation":"本肢は普通建物賃貸借について問われています。A、Bいずれかからも更新しない旨の通知がなかったときは従前の契約と同一の条件で更新されますが、契約期間については期間の定めのない契約となります。","pending":false}],["q4_4","CがBから甲建物を適法に賃貸された転借人で、期間満了によってA B間及びB C間の賃貸借契約が終了する場合、Aの同意を得て甲建物に付加した造作について、BはAに対する買取請求権を有するが、CはAに対する買取請求権を有しない。",{"qnum":4,"label":"4","title":"定期建物賃貸借②・造作買取請求権","stem":"AとBとの間で、Aが所有する甲建物をBが5年間賃貸する旨の契約を締結した場合における次の記述のうち、民法及び借地借家法の規定によれば、正しいものはどれか（借地借家法第39条に定める取壊し予定の建物の賃貸借及び同法第40条に定める一時使用目的の建物の賃貸借は考慮しないものとする。）。","answer":"❌誤り","explanation":"BおよびCがAの同意を得て甲建物に付加した造作については、BもCも同様にAに対する買取請求権を有します。","pending":false}],["q6_3","賃貸借契約に期間を定め、賃貸借契約を書面によって行った場合には、AがBに対しあらかじめ契約の更新がない旨を説明していれば、賃貸借契約は期間満了により終了する。",{"qnum":6,"label":"3","title":"居住用建物の賃貸借の承継","stem":"賃貸人Aと賃借人Bとの間で令和8年7月1日に締結した居住用建物の賃貸借契約に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"更新のない定期建物賃貸借契約は、賃貸借契約を書面によって行うだけでは足りず、契約書面等とは別に、賃借人に対して「契約の更新がなく期間満了で終了する」旨を記載した書面等を交付または電磁的方法により提供して説明しなければなりません。","pending":false}],["q6_4","Bが相続人なしに死亡した場合、Bと婚姻の届出をしていないが事実上夫婦と同様の関係にあった同居者Dは、Bが相続人なしに死亡したことを知った後1月以内にAに反対の意思表示をしない限り、賃貸人としてのBの権利義務を承継する。",{"qnum":6,"label":"4","title":"居住用建物の賃貸借の承継","stem":"賃貸人Aと賃借人Bとの間で令和8年7月1日に締結した居住用建物の賃貸借契約に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"賃借人Bと事実上夫婦と同様の関係にあった同居者Dは、Bが相続人なしに死亡した場合、賃借権を承継します。ですが、DはBが相続人なく死亡したことを知ったときから1か月以内に、賃貸人Aに反対の意思表示をすれば承継は生じません。","pending":false}]]},{"id":"chapter2_review_12","title":"12 区分所有法","group":"第2章 権利関係｜復習問題","reviewChapter":2,"reviewUnit":12,"items":[["q1_2","形状又は効用の著しい変更を伴う共用部分の変更については、区分所有者及び議決権の各過半数を有する者が出席し、出席した区分所有者及び議決権の各4分の3以上の多数による集会の決議で決するものであるが、規約でこの4分の3という賛成割合を2分の1を超える割合まで減ずることができる。",{"qnum":1,"label":"2","title":"区分所有法の基礎","stem":"建物の区分所有等に関する法律（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。ただし、議決権を有する所有者は全員出席とし、共用部分の変更については3分の2以上を要する変更決議を除く。","answer":"⭕正しい","explanation":"形状又は効用の著しい変更を伴う共用部分の変更は、区分所有者及び議決権の各過半数を有する者が出席し、出席した区分所有者及び議決権の各4分の3以上の集会決議で決まりますが、規約でこの4分の3という賛成割合を、2分の1を超える割合まで減らすことができます（354ページ）。","pending":false}],["q1_4","各共有者の共用部分の持分は、規約に別段の定めがある場合を除いて、その有する専有部分の床面積の割合によるが、この床面積は壁その他の区画の中心線で囲まれた部分の水平投影面積である。",{"qnum":1,"label":"4","title":"区分所有法の基礎","stem":"建物の区分所有等に関する法律（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。ただし、議決権を有する所有者は全員出席とし、共用部分の変更については3分の2以上を要する変更決議を除く。","answer":"❌誤り","explanation":"原則として、共用部分の持分は専有部分の床面積の割合となります。専有部分の床面積は、壁、その他の区画の内側線で囲まれた部分の水平投影面積です。中心線ではありません。","pending":false}],["q2_1","共用部分の保存行為は、規約に別段の定めがない限り、集会の決議を経ずに各区分所有者が単独ですることができる。",{"qnum":2,"label":"1","title":"共用部分の管理・管理者等","stem":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"共用部分の保存行為は、規約に別段の定めがない限り、各区分所有者が単独でできます。","pending":false}],["q2_2","共用部分の変更（その形状又は効用の著しい変更を伴わないものを除く。）は、集会における出席した区分所有者及びその議決権のそれぞれ4分の3以上の多数による決議で決するが、規約でこの出席した区分所有者の賛成割合を2分の1まで減ずることができる。ただし、共用部分の瑕疵（欠陥）の除去に必要な変更や、高齢者、障害者等の移動または施設の利用に係る身体の負担を軽減するために必要となる変更を除く。",{"qnum":2,"label":"2","title":"共用部分の管理・管理者等","stem":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"「規約でこの出席した区分所有者の賛成割合を2分の1まで減ずることができる」という点が誤りです。規約によって賛成割合を減らすことができる下限は「2分の1を超える割合」であり、ちょうど「2分の1まで」ではありません。","pending":false}],["q3_1","専有部分が数人の共有に属するときは、共有者は、集会においてそれぞれ議決権を行使することができる。",{"qnum":3,"label":"1","title":"集会","stem":"建物の区分所有等に関する法律（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"専有部分を数人で共有している場合、共有者は各共有者の持分の価格に従い、その過半数をもって、議決権を行使すべき者一人を定める必要があります。","pending":false}],["q3_2","区分所有者の承諾を得て専有部分を占有する者は、会議の目的たる事項につき利害関係を有する場合には、集会に出席して議決権を行使することができる。",{"qnum":3,"label":"2","title":"集会","stem":"建物の区分所有等に関する法律（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"区分所有者の承諾を得て専有部分を占有する者（例：賃借人）は、集会に出席して意見を述べることはできますが、議決権の行使はできません。","pending":false}],["q3_3","集会においては、規約に別段の定めがある場合及び別段の決議をした場合を除いて、管理者又は集会を招集した区分所有者の1人が議長となる。",{"qnum":3,"label":"3","title":"集会","stem":"建物の区分所有等に関する法律（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"規約に別段の定めがある場合及び別段の決議をした場合を除いて、管理者又は集会を招集した区分所有者の1人が議長を務めます。","pending":false}],["q3_4","共用部分の変更（重大な変更）をする場合、集会での決議は区分所有者及び議決権の各4分の3以上の多数で決する。",{"qnum":3,"label":"4","title":"集会","stem":"建物の区分所有等に関する法律（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"区分所有者（議決権を有しないものを除く）及び議決権の各過半数（規約でこれより高い割合にすることも可能）を有する者が出席した上で、出席した区分所有者及びその議決権の各4分の3以上の多数による集会の決議で決定します。また、特定の共用部分の変更の場合は、出席した区分所有者及びその議決権の各4分の3から、各3分の2以上に緩和されます。","pending":false}],["q4_2","規約を保管する者は、利害関係人の請求があったときは、正当な理由がある場合を除いて、規約の閲覧を拒んではならず、閲覧を拒絶した場合は20万円以下の過料に処される。",{"qnum":4,"label":"2","title":"規約","stem":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"規約を保管する者は、利害関係人の請求があったときは、正当な理由がある場合を除いて、規約の閲覧を拒んではなりません。閲覧を拒絶した場合は20万円以下の過料に処されます。","pending":false}],["q4_4","占有者は、建物又はその敷地若しくは附属施設の使用方法につき、区分所有者が規約又は集会の決議に基づいて負う義務と同一の義務を負う。",{"qnum":4,"label":"4","title":"規約","stem":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"賃借人などの占有者は、区分所有者が規約または集会の決議に基づいて負う義務と同一の義務を負います。","pending":false}],["q5_1","区分所有者の団体は、区分所有建物が存在すれば、区分所有者を構成員として当然に成立する団体であるが、管理組合法人になることができるものは、区分所有者の数が30人以上のものに限られる。",{"qnum":5,"label":"1","title":"建物の復旧・建替え","stem":"建物の区分所有等に関する法律（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"管理組合の法人化には、集会の決議が必要です。「区分所有者の数が30人以上のものに限られる」という定めはありません。","pending":false}]]}];

["shared_trick_08","共有物の壊れた屋根を雨漏り防止のために修繕する保存行為は、共有者の1人が単独で行うことができる。",{"qnum":8,"label":"判定","title":"共有のひっかけ○×","stem":"各記述が正しいか、誤っているかを答えてください。","answer":"⭕正しい","explanation":"原状維持のための保存行為であれば単独でできる。工事の実質が重大な変更なら別。","pending":false}],

["shared_trick_10","共有物の管理に関する決定は、共有者全員が同意しなければならない。",{"qnum":10,"label":"判定","title":"共有のひっかけ○×","stem":"各記述が正しいか、誤っているかを答えてください。","answer":"❌誤り","explanation":"通常の管理は持分価格の過半数。全員一致と混同しない。","pending":false}]
]},

const chapter3ReviewSectionsStage1=[{"id":"chapter3_review_1","title":"1 都市計画区域・用途地域・地区計画","group":"第3章 法令上の制限等｜復習問題","reviewChapter":3,"reviewUnit":1,"items":[["q2_4","特定用途制限地域は、用途地域内の一定の区域における当該区域の特性にふさわしい土地利用の増進、環境の保護等の特別の目的の実現を図るため当該用途地域の指定を補完して定めるものとされている。",{"qnum":2,"label":"4","title":"区域区分","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"これは特別用途地区のことです。特定用途制限地域と特別用途地区は、まぎらわしいのでひっかけ問題として出題されることがよくあります。整理して覚えましょう（399ページ）。","pending":false}],["q3_1","市街化区域については、都市計画に、少なくとも用途地域を定めるものとされている。",{"qnum":3,"label":"1","title":"用途地域①","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"市街化区域には、少なくとも用途地域を定めなければなりません。","pending":false}],["q3_2","準都市計画区域については、都市計画に、特別用途地区を定めることができる。",{"qnum":3,"label":"2","title":"用途地域①","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"特別用途地区は補助的地域地区で、用途地域を補完する役割があります。用途地域内に定めることができますので、準都市計画区域内にも定めることができます（399ページ）。","pending":false}],["q3_3","高度地区については、都市計画に、建築物の容積率の最高限度又は最低限度を定めるものとされている。",{"qnum":3,"label":"3","title":"用途地域①","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"高度地区は建築物の高さの最高限度または最低限度を定める地区ですので、容積率を定めることはできません（400ページ）。","pending":false}],["q3_4","工業地域は、主として工業の利便を増進するため定める地域とされている。",{"qnum":3,"label":"4","title":"用途地域①","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"工業地域は主として工業の利便を増進するために定める地域です。","pending":false}],["q4_1","近隣商業地域は、主として商業その他の業務の利便の増進を図りつつ、これと調和した住居の環境を保護するため定める地域とする。",{"qnum":4,"label":"1","title":"用途地域②","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"近隣商業地域は、近隣の住宅地の住民に対する日用品の供給を行うことを主たる内容とする商業その他の業務の利便を増進するため定める地域です。本肢は商業地域と準住居地域の内容を混ぜたものとなっています。このように、ほかの地域の内容と混ぜて出題されることが多いので、比較して覚えておきましょう。","pending":false}],["q4_2","準工業地域は、主として環境の悪化をもたらすおそれのない工業の利便の増進を図りつつ、これと調和した住居の環境を保護するため定める地域とする。",{"qnum":4,"label":"2","title":"用途地域②","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"準工業地域は、主として環境の悪化をもたらすおそれのない工業の利便を増進するため定める地域です。本肢の後半は準住居地域の内容です。","pending":false}],["q4_3","第一種低層住居専用地域については、都市計画に特定用途制限地域を定めることができる場合がある。",{"qnum":4,"label":"3","title":"用途地域②","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"特定用途制限地域は、用途地域が定められていない土地の区域で定められます。用途地域である第一種低層住居専用地域には、定めることはできません（399ページ）。","pending":false}],["q4_4","第一種住居地域については、都市計画に高層住居誘導地区を定めることができる場合がある。",{"qnum":4,"label":"4","title":"用途地域②","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"高層住居誘導地区は、住居と住居以外の用途とを適正に配分し、利便性の高い高層住宅の建設を誘導するため、第一種住居地域、第二種住居地域、準住居地域、近隣商業地域、準工業地域内に定めることができます（400ページ）。","pending":false}],["q5_1","用途地域に関する都市計画には、建築物の延べ面積の敷地面積に対する割合を定めることとされている。",{"qnum":5,"label":"1","title":"用途地域③","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"用途地域に関する都市計画には、建築物の延べ面積の敷地面積に対する割合＝容積率を定めることとされています。","pending":false}],["q5_2","第一種低層住居専用地域に関する都市計画には、建築物の高さの限度を定めることとされている。",{"qnum":5,"label":"2","title":"用途地域③","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"第一種低層住居専用地域に関する都市計画には、建築物の高さの限度を10mまたは12mのいずれかで定めることとされています。","pending":false}],["q5_3","第二種中高層住居専用地域に関する都市計画には、建築物の高さの最高限度及び最低限度を定めることとされている。",{"qnum":5,"label":"3","title":"用途地域③","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"第二種中高層住居専用地域に関する都市計画には、建築物の高さの最高限度及び最低限度を定める規定はありません。建築物の高さの最高限度及び最低限度を定める規定があるのは、高度地区です。","pending":false}],["q5_4","特定街区に関する都市計画には、建築物の容積率並びに建築物の高さの最高限度及び壁面の位置の制限を定めることとされている。",{"qnum":5,"label":"4","title":"用途地域③","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"特定街区に関する都市計画には、建築物の容積率並びに建築物の高さの最高限度及び壁面の位置の制限を定めることとされています。","pending":false}],["q6_1","高度地区は、用途地域内において市街地の環境を維持し、又は土地利用の増進を図るため、建築物の高さの最高限度又は最低限度を定める地区とされている。",{"qnum":6,"label":"1","title":"補助的地域地区","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"高度地区は、用途地域内において、建築物の高さの限度を定める地区です。","pending":false}],["q6_2","特定街区については、都市計画に、建築物の容積率並びに建築物の高さの最高限度及び壁面の位置の制限を定めるものとされている。",{"qnum":6,"label":"2","title":"補助的地域地区","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"特定街区は、都市計画に、建築物の容積率並びに建築物の高さの最高限度及び壁面の位置の制限を定めます。","pending":false}],["q6_3","準住居地域は、道路の沿道としての地域の特性にふさわしい業務の利便の増進を図りつつ、これと調和した住居の環境を保護するため定める地域とされている。",{"qnum":6,"label":"3","title":"補助的地域地区","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"準住居地域は、道路の沿道としての地域の特性にふさわしい業務の利便を増進しつつ、これと調和した住居の環境を保護するため定める地域です。","pending":false}],["q6_4","特別用途地区は、用途地域が定められていない土地の区域（市街化調整区域を除く。）内において、その良好な環境の形成又は保持のため当該区域の特性に応じて合理的な土地利用が行われるよう、制限すべき特定の建築物等の用途の概要を定める地区とされている。",{"qnum":6,"label":"4","title":"補助的地域地区","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"これは特定用途制限地域の説明です。特別用途地区は、用途地域内の一定の地区における当該地区の特性にふさわしい土地利用の増進、環境の保護等の特別の目的の実現を図るため当該用途地域の指定を補完して定める地区です。","pending":false}],["q7_1","地区計画については、都市計画に、当該地区計画の目標を定めるよう努めるものとされている。",{"qnum":7,"label":"1","title":"地区計画①","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"都市計画に、当該地区計画の目標を定めるよう努めるものとされています。","pending":false}],["q7_2","地区計画については、都市計画に、区域の面積を定めるよう努めるものとされている。",{"qnum":7,"label":"2","title":"地区計画①","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"都市計画に、区域の面積を定めるよう努めるものとされています。","pending":false}],["q7_3","地区整備計画においては、市街化区域と市街化調整区域との区分の決定の有無を定めることができる。",{"qnum":7,"label":"3","title":"地区計画①","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"市街化区域と市街化調整区域との区域区分は、都市計画区域について定めるものです。地区レベルの地区整備計画において定めるものではありません。","pending":false}],["q7_4","地区整備計画においては、建築物の建蔽率の最高限度を定めることができる。",{"qnum":7,"label":"4","title":"地区計画①","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"地区整備計画においては、建築物の建蔽率の最高限度を定めることができます。","pending":false}],["q8_1","市街地開発事業等予定区域に関する都市計画において定められた区域内において、非常災害のため必要な応急措置として行う建築物の建築であれば、都道府県知事（市の区域内にあっては、当該市の長）の許可を受ける必要はない。",{"qnum":8,"label":"1","title":"地区計画②","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"非常災害のため必要な応急措置として行う建築物の建築であれば、都道府県知事等の許可を受ける必要はありません（412ページ）。","pending":false}],["q8_2","都市計画の決定又は変更の提案は、当該提案に係る都市計画の素案の対象となる土地について所有権又は借地権を有している者以外は行うことができない。",{"qnum":8,"label":"2","title":"地区計画②","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"都市計画の決定または変更の提案は、所有権または借地権を有している者以外に、特定非営利活動法人なども行えます（410ページ）。","pending":false}],["q8_3","市町村は、都市計画を決定しようとするときは、あらかじめ、都道府県知事に協議し、その同意を得なければならない。",{"qnum":8,"label":"3","title":"地区計画②","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"市町村は、都市計画を決定しようとするときは、あらかじめ、都道府県知事との協議は必要ですが、同意までは必要ありません（410ページ）。","pending":false}],["q8_4","地区計画の区域のうち地区整備計画が定められている区域内において、建築物の建築等の行為を行った者は、一定の行為を除き、当該行為の完了した日から30日以内に、行為の種類、場所等を市町村長に届け出なければならない。",{"qnum":8,"label":"4","title":"地区計画②","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"行為を行おうとする者は、当該行為に着手する日の30日前までに届け出なければなりません。行為の完了した日からではありません。","pending":false}]]},{"id":"chapter3_review_2","title":"2 都市計画・開発許可","group":"第3章 法令上の制限等｜復習問題","reviewChapter":3,"reviewUnit":2,"items":[["q1_1","市街化区域及び区域区分が定められていない都市計画区域については、少なくとも道路、病院及び下水道を定めるものとされている。",{"qnum":1,"label":"1","title":"都市施設・市街地開発事業","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"少なくとも道路、公園および下水道を定めるものとされていますが、病院は定める必要はありません。","pending":false}],["q1_2","市街化調整区域内においては、都市計画に、市街地開発事業を定めることができないこととされている。",{"qnum":1,"label":"2","title":"都市施設・市街地開発事業","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"市街地開発事業は、市街化区域または非線引き区域内で開発または整備する必要がある土地の区域について定めます。市街化調整区域内では定めることができません。","pending":false}],["q1_3","都市計画区域は、市町村が、市町村都市計画審議会の意見を聴くとともに、都道府県知事に協議し、その同意を得て指定する。",{"qnum":1,"label":"3","title":"都市施設・市街地開発事業","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"都市計画区域を定めるのは都道府県です。都道府県が都市計画区域を指定しようとするときは、あらかじめ関係市町村および都道府県都市計画審議会の意見を聴くとともに国土交通大臣にも協議し、その同意を得なければなりません（410ページ）。","pending":false}],["q3_イ","地区整備計画が定められている地区計画の区域内において、建築物の建築を行おうとする者は、都道府県知事（市の区域内にあっては、当該市の長）の許可を受けなければならない。",{"qnum":3,"label":"イ","title":"都市計画事業","stem":"都市計画法に関する次の記述のうち、正しいものの組合せはどれか。","answer":"❌誤り","explanation":"当該行為に着手する日の30日前までに、市町村長に届出です。都道府県知事の許可ではありません。","pending":false}],["q3_ウ","都市計画事業の認可の告示があった後、当該認可に係る事業地内において、当該都市計画事業の施行の障害となるおそれがある土地の形質の変更を行おうとする者は、都道府県知事（市の区域内にあっては、当該市の長）の許可を受けなければならない。",{"qnum":3,"label":"ウ","title":"都市計画事業","stem":"都市計画法に関する次の記述のうち、正しいものの組合せはどれか。","answer":"⭕正しい","explanation":"都市計画事業の認可の告示後、当該都市計画事業の施行の障害となるおそれがある土地の形質の変更を行おうとする者は、都道府県知事等の許可を受けなければなりません。","pending":false}],["q3_エ","都市計画事業の認可の告示があった後、当該認可に係る事業地内の土地建物等を有償で譲り渡そうとする者は、当該事業の施行者の許可を受けなければならない。",{"qnum":3,"label":"エ","title":"都市計画事業","stem":"都市計画法に関する次の記述のうち、正しいものの組合せはどれか。","answer":"❌誤り","explanation":"都市計画事業の認可等の告示の日の翌日から起算して10日を経過したあとに、事業地内の土地建物等を有償で譲り渡そうとする者は、施行者に届出が必要です。許可ではありません。","pending":false}],["q4_1","市街化調整区域における農産物の加工に必要な建築物の建築を目的とした500m²の土地の区画形質の変更には、常に開発許可が不要である。",{"qnum":4,"label":"1","title":"開発許可①","stem":"開発許可に関する次の記述のうち、都市計画法の規定によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"農産物の生産または集荷の建物は、許可不要ですが、農産物の処理、貯蔵、加工の建物は許可が必要です。","pending":false}],["q4_2","市街化区域における市街地再開発事業の施行として行う3,000m²の土地の区画形質の変更には、常に開発許可が不要である。",{"qnum":4,"label":"2","title":"開発許可①","stem":"開発許可に関する次の記述のうち、都市計画法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"市街地再開発事業の施行として行う開発行為は、常に開発許可が不要です。","pending":false}],["q4_3","都市計画区域でも準都市計画区域でもない区域内における住宅団地の建設を目的とした6,000m²の土地の区画形質の変更には、常に開発許可が不要である。",{"qnum":4,"label":"3","title":"開発許可①","stem":"開発許可に関する次の記述のうち、都市計画法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"都市計画区域でも準都市計画区域でもない区域内では、10,000m²未満であれば開発許可は不要です。","pending":false}],["q4_4","準都市計画区域における医療施設の建築を目的とした2,000m²の土地の区画形質の変更には、常に開発許可が不要である。",{"qnum":4,"label":"4","title":"開発許可①","stem":"開発許可に関する次の記述のうち、都市計画法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"準都市計画区域内であれば3,000㎡未満は開発許可が不要です。また、注意するポイントとして、医療施設は公益上必要な建築物ではないことを覚えておきましょう。ほかにも老人ホーム、小学校、中学校なども公益上必要な建築物ではありません。","pending":false}],["q5_ア","市街化調整区域において、国が設置する医療法に規定する病院の用に供する施設である建築物の建築の用に供する目的で行われる1,500m²の開発行為",{"qnum":5,"label":"ア","title":"開発許可②","stem":"次のアからウまでの記述のうち、都市計画法による開発許可を受ける必要のある、又は同法第34条の2の規定に基づき協議する必要のある開発行為の組合せとして、正しいものはどれか。ただし、開発許可を受ける必要のある、又は協議する必要のある開発行為の面積については、条例による定めはないものとする。","answer":"⭕正しい","explanation":"市街化調整区域は面積によらず開発許可が必要であり、病院は公益上必要な建築物ではありません。また、本肢は国が設置する医療法に規定する病院ですが、知事との協議成立をもって開発許可があったものとみなすのであって、許可不要というわけではありません。よって、開発許可は必要です。","pending":false}],["q5_イ","市街化区域において、農林漁業を営む者の居住の用に供する建築物の建築の用に供する目的で行われる1,200m²の開発行為",{"qnum":5,"label":"イ","title":"開発許可②","stem":"次のアからウまでの記述のうち、都市計画法による開発許可を受ける必要のある、又は同法第34条の2の規定に基づき協議する必要のある開発行為の組合せとして、正しいものはどれか。ただし、開発許可を受ける必要のある、又は協議する必要のある開発行為の面積については、条例による定めはないものとする。","answer":"⭕正しい","explanation":"市街化区域での農林漁業を営む者の居住用建築物は、許可不要の例外に当たりません。許可が必要です。市街化区域外であれば、許可不要です。","pending":false}],["q6_2","市街化調整区域内において生産される農産物の貯蔵に必要な建築物の建築を目的とする当該市街化調整区域内における土地の区画形質の変更は、都道府県知事の許可を受けなくてよい。",{"qnum":6,"label":"2","title":"開発許可の手続き①","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市及び特例市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"農産物の貯蔵に必要な建築物は、許可不要の例外に該当しません。ほかにも、農産物の加工に必要な建築物も、開発許可が必要です。","pending":false}],["q6_3","都市計画法第33条に関する開発許可の基準のうち、排水施設の構造及び能力についての基準は、主として自己の居住の用に供する住宅の建築の用に供する目的で行う開発行為に対しては適用されない。",{"qnum":6,"label":"3","title":"開発許可の手続き①","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市及び特例市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"自己の居住用の場合も、排水施設の基準については適用されます。ただし、給水施設については適用されないので注意しましょう。","pending":false}],["q6_4","非常災害のため必要な応急措置として行う開発行為は、当該開発行為が市街化調整区域内において行われるものであっても都道府県知事の許可を受けなくてよい。",{"qnum":6,"label":"4","title":"開発許可の手続き①","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市及び特例市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"非常災害のため必要な応急措置については、常に許可不要です。","pending":false}],["q7_1","都道府県知事は、開発許可の申請があったときは、申請があった日から21日以内に許可又は不許可の処分をしなければならない。",{"qnum":7,"label":"1","title":"開発許可の手続き②","stem":"都市計画法の開発許可に関する次の記述のうち、正しいものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市、特例市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"申請があったら遅滞なく処分をしなければいけません。21日以内という規定はありません。","pending":false}],["q7_3","開発許可を受けた者は、開発行為に関する工事を廃止したときは、遅滞なく、その旨を都道府県知事に届け出なければならない。",{"qnum":7,"label":"3","title":"開発許可の手続き②","stem":"都市計画法の開発許可に関する次の記述のうち、正しいものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市、特例市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"工事を廃止したときは、遅滞なく、都道府県知事に届け出なければなりません。","pending":false}],["q7_4","開発行為を行おうとする者は、開発許可を受けてから開発行為に着手するまでの間に、開発行為に関係がある公共施設の管理者と協議し、その同意を得なければならない。",{"qnum":7,"label":"4","title":"開発許可の手続き②","stem":"都市計画法の開発許可に関する次の記述のうち、正しいものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市、特例市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"開発行為に関係がある公共施設の管理者（現在の管理者）との協議や同意は、開発許可申請前に行います。","pending":false}],["q8_1","区域区分が定められていない都市計画区域内において、20戸の分譲住宅の新築を目的として5,000m²の土地の区画形質の変更を行おうとする場合は、都道府県知事の許可を受けなければならない。",{"qnum":8,"label":"1","title":"開発行為に関連した建築規制","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市及び特例市にあってはその長をいうものとする。また、各選択肢に掲げる行為は、都市計画事業、土地区画整理事業、市街地再開発事業、住宅街区整備事業及び防災街区整備事業の施行として行うもの、公有水面埋立法第2条第1項の免許を受けた埋立地で行うもの並びに非常災害のため必要な応急措置として行うものを含まない。","answer":"⭕正しい","explanation":"区域区分が定められていない都市計画区域内（非線引き区域）では、3,000m²未満の開発行為は許可不要ですが、本肢は5,000m²ですので都道府県知事の許可が必要です。","pending":false}],["q8_2","市街化調整区域のうち開発許可を受けた開発区域以外の区域内において、土地の区画形質の変更を伴わずに、床面積が150m²の住宅の全部を改築し、飲食店としようとする場合には、都道府県知事の許可を受けなければならない。",{"qnum":8,"label":"2","title":"開発行為に関連した建築規制","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市及び特例市にあってはその長をいうものとする。また、各選択肢に掲げる行為は、都市計画事業、土地区画整理事業、市街地再開発事業、住宅街区整備事業及び防災街区整備事業の施行として行うもの、公有水面埋立法第2条第1項の免許を受けた埋立地で行うもの並びに非常災害のため必要な応急措置として行うものを含まない。","answer":"⭕正しい","explanation":"市街化調整区域のうち開発許可を受けた開発区域以外の区域内では、原則として建築物の建築・用途変更等の行為を行うには、都道府県知事の許可が必要です。","pending":false}],["q8_4","開発許可申請者以外の者は、開発許可を受けた開発区域内のうち、用途地域等の定められていない土地の区域においては、開発行為に関する工事が完了した旨の公告があった後は、都道府県知事の許可を受けなくとも、当該開発許可に係る予定建築物以外の建築物を新築することができる。",{"qnum":8,"label":"4","title":"開発行為に関連した建築規制","stem":"都市計画法に関する次の記述のうち、誤っているものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市及び特例市にあってはその長をいうものとする。また、各選択肢に掲げる行為は、都市計画事業、土地区画整理事業、市街地再開発事業、住宅街区整備事業及び防災街区整備事業の施行として行うもの、公有水面埋立法第2条第1項の免許を受けた埋立地で行うもの並びに非常災害のため必要な応急措置として行うものを含まない。","answer":"❌誤り","explanation":"開発行為は特定の建築物を建築する目的で行われます。ですので、工事完了後は、予定建築物以外の建築物を建築することはできません。ただし、例外があり、用途地域にあった建物を建築する場合や、都道府県知事が許可した場合は、予定建築物以外の建築物も建築できます。しかし、本肢は「用途地域が定められていない土地の区域」「都道府県知事の許可を受けなくても」となっており、例外に該当しません。よって、誤りとなります。","pending":false}]]}];
