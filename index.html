<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宅建暗記クイズ v9｜法令・税・免除科目</title><style>
:root{--red:#8f211d;--bg:#fff8f6;--line:#ebd1cd;--ink:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;box-shadow:0 2px 8px #0002}
.topbar{height:48px;display:flex;align-items:center;gap:8px;padding:0 10px}
.current{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.mini-score{font-size:12px;font-weight:800;opacity:.95;white-space:nowrap}
.menu-btn{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:9px;padding:6px 9px;font-size:13px;font-weight:800}
.panel{display:none;padding:8px 10px 10px;border-top:1px solid #ffffff22}
.panel.open{display:block}
.tabs,.levels,.filters,.tools,.actions{display:flex;gap:7px;align-items:center}
.tabs,.levels,.filters{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar,.levels::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.tab,.level,.filter{flex:0 0 auto;border:1px solid #fff7;background:#fff;color:#7f201d;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}
.tab.active,.level.active,.filter.active{background:#50110f;color:#fff;border-color:#50110f}
.group-label{font-size:11px;opacity:.8;margin:7px 0 4px}
.tools{flex-wrap:wrap;margin-top:8px}
.tools button{border:1px solid #fff6;background:#fff;color:#7f201d;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:700}
main{padding:10px;max-width:900px;margin:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 9px;overflow:hidden}
.card.ok{border:2px solid #69a975;background:#f4fbf5}
.card.ng{border:2px solid #cf6159;background:#fff6f5}
.card.ok .num{background:#4f925d}
.card.ng .num{background:#bd4d46}
.card.ok::after,.card.ng::after{display:block;font-size:12px;font-weight:800;padding:0 10px 9px 55px}
.card.ok::after{content:'○ できた';color:#397247}
.card.ng::after{content:'× 要復習';color:#a43f39}
.row{display:grid;grid-template-columns:46px 1fr}
.num{background:#9f302b;color:#fff;font-weight:800;display:flex;align-items:flex-start;justify-content:center;padding:11px 5px;font-size:14px}
.text{padding:11px 12px;font-size:14px;line-height:1.7;white-space:pre-line}
.cloze{display:inline-block;min-width:5em;color:transparent;background:#f1dcda;border-bottom:2px solid #a64c46;border-radius:3px}
.cloze.show{color:#c3342f;background:#fff1ef;font-weight:700}
.extra.hide{display:inline-block;color:transparent;background:#eee1df;border-bottom:2px solid #9b7975;border-radius:3px;min-width:6em}
.adv{display:inline-block;width:94%;min-height:3em;background:#eee1df;color:transparent;border-radius:6px}
.actions{padding:0 9px 10px 55px;flex-wrap:wrap}
.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px}
.answer{background:#fff0ee!important;color:#8b2824;font-weight:800}
.mark{width:42px;height:36px;padding:0!important;font-size:19px!important;font-weight:800}
.mark.sel.ok{background:#4f925d!important;color:#fff;border-color:#4f925d!important;box-shadow:0 0 0 2px #d8efdd}
.mark.sel.ng{background:#bd4d46!important;color:#fff;border-color:#bd4d46!important;box-shadow:0 0 0 2px #f2d9d6}
.empty{padding:30px 12px;text-align:center;color:#777}
footer{padding:26px 12px 44px;text-align:center;color:#888;font-size:11px}
@media(min-width:700px){
  .topbar{height:54px}.current{font-size:17px}.panel{display:block!important}
  .menu-btn{display:none}.text{font-size:16px}
}

.section-picker{display:block;width:100%;max-width:100%;margin:0 0 8px;padding:8px;border:1px solid #ffffff70;border-radius:8px;background:#fff;color:#7f201d;font:inherit;font-size:13px}
.card-cue{padding:10px 12px 0 55px;font-size:13px;font-weight:800;color:#6e211e;line-height:1.5}
.source-line{padding:0 12px 9px 55px;color:#786460;font-size:11px;line-height:1.5}
.supplement{margin:0 12px 10px 55px;border:1px solid #ecdcd8;border-radius:8px;background:#fffaf2;overflow:hidden}
.supplement summary{padding:8px 10px;color:#76411e;cursor:pointer;font-size:12px;font-weight:700;min-height:36px}
.supplement p{margin:0;padding:0 10px 10px;font-size:13px;line-height:1.7;white-space:pre-line;color:#49392d}
.study-hint{padding:8px 12px;margin:0 0 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:12px;line-height:1.6;color:#745450}
@media(max-width:699px){.card-cue,.source-line{padding-left:55px}.supplement{margin-left:55px}.section-picker{font-size:16px}}

</style></head>
<body>
<header>
  <div class="topbar">
    <div id="current" class="current"></div>
    <div id="score" class="mini-score">○0 ×0 未0</div>
    <button id="menuBtn" class="menu-btn">設定</button>
  </div>
  <div id="panel" class="panel">
    <div class="group-label">分野</div><select id="sectionPicker" class="section-picker" aria-label="分野を一覧から選ぶ"></select><div id="tabs" class="tabs"></div>
    <div class="group-label">難易度</div>
    <div class="levels">
      <button class="level active" data-level="1">初級</button>
      <button class="level" data-level="2">中級</button>
      <button class="level" data-level="3">上級</button>
    </div>
    <div class="group-label">表示</div>
    <div class="filters">
      <button class="filter active" data-filter="all">全部</button>
      <button class="filter" data-filter="ng">×だけ</button>
      <button class="filter" data-filter="un">未回答</button>
    </div>
    <div class="tools">
      <button id="reset">この分野をリセット</button>
      <button id="backup">バックアップ</button>
      <button id="restoreBtn">復元</button>
      <input id="restore" type="file" accept="application/json" hidden>
    </div>
  </div>
</header>
<main><div class="study-hint">赤文字の空欄を思い出してから「答えを表示」。○×は答えの表示と別に記録されます。補足解説は必要なときに開けます。</div><div id="cards"></div></main>
<footer>設定は右上から。○×記録はブラウザ内に保存されます。</footer>
<script>
const DATA=[{"id":"35_sale","title":"35条書面｜売買・交換","items":[["1","登記された権利の種類および内容\n・抵当権など登記されている権利関係を説明。説明時の登記内容を記載するので、物件を[[引渡すまでに抵当権が抹消される予定であっても]]その旨を記載する"],["2","[[法令に基づく制限]]\n・都市計画法、建築基準法等における造成や建築等の制限など、((具体的な制限の内容))"],["3","[[私道]]に関する負担に関する事項\n・[[将来の負担も含む]]私道負担の有無、私道面積、通行使用料等の負担額"],["4","[[飲用水、電気、ガス]]等の供給施設、[[排水施設]]の整備状況\n・未整備であればその[[整備の見通し]]や、その整備に当たって[[負担金が課されるか]]などの負担に関する事項"],["5","[[未完成物件]]の場合　工事完了時の形状、構造\n・[[宅地：造成工事完了時]]\n・完了時の形状、構造、宅地に接している道路の構造と幅員等\n・[[建物：建築工事完了時]]\n・完了時の形状、構造、主要構造部、内装および外装の構造や仕上げ等"],["6","[[土砂災害警戒区域内、造成宅地防災区域内、津波災害警戒区域内]]にある時はその旨"],["7","水防法の規定により市町村の長が提供する図面（[[水害ハザードマップ]]）に表示されているときは水害ハザードマップにおけるその宅地建物の[[所在地]]"],["8","[[住宅性能評価を受けた新築住宅]]の場合はその旨"],["9","[[石綿]]（アスベスト）の使用の有無の調査結果が記録されているときはその内容（[[実施は義務ではない]]）"],["10","昭和56年6月1日以降に新築工事に着手したものを除く建物が、指定確認検査機関等による一定の[[耐震診断]]を受けたものであるときはその内容（[[実施は義務ではない]]）"],["11","既存の建物であるときは、[[建物状況調査]]（インスペクション）等に関する事項\n・既存の建物であるときは、実施後1年を経過していない[[建物状況調査の実施の有無]]や、[[実施している場合はその結果の概要]]（[[実施は義務ではない]]）\n・[[鉄筋コンクリート造]]または[[鉄骨鉄筋コンクリート造]]の[[共同住宅等]]に係る重要事項説明の対象となる建物状況調査の結果については、調査の実施から[[2年]]を経過していないもの"],["12","既存の建物であるときは、[[建物の建築及び維持保全の状況に関する書類の保存状況]]\n・確認の申請書、確認済証、検査済証、建物状況調査の結果についての報告書、既存住宅にかかる建設住宅性能評価書等の保存の状況"],["13","代金、交換差金[[以外]]に授受される金銭の額、および目的\n・手付金等の[[額と目的]]\n※[[代金や交換差金は重要事項説明の対象外]]"],["14","契約の[[解除]]に関する事項\n・契約の解除が可能な場合、手続きや解除の効果について"],["15","[[損害賠償額の予定または違約金]]に関する事項\n・損害賠償額の予定、違約金としての違約金を定めるか否か"],["16","[[手付金等の保全措置]]の概要\n・[[宅建業者が自ら売主]]の場合、お客さんから受け取ったお金を返せるようにするための保全措置義務の概要"],["17","[[支払金、預り金]]を受領する場合の保全措置の有無、概要\n・宅建業者が取引の相手方などから、支払金、預り金を受領する場合、保全措置を講ずるか否か。保全措置を講ずる場合はその概要\n・[[50万円未満のもの]]、売主や交換の当事者である宅建業者が[[登記以後]]に受領するものについては、[[説明義務なし]]"],["18","ローンの[[あっせんの内容]]、およびローン[[不成立の場合の措置]]\n・住宅ローン等をあっせんする場合、融資額、金利、返済方法などのあっせんの内容や融資条件。ローンが受けられなかった場合の措置"],["19","[[契約不適合を担保すべき責任]]の履行に関し保証保険契約の締結、その他の措置の有無・概要\n・宅地建物が種類、品質に関して契約の内容に適合しない場合におけるその不適合を担保すべき責任の履行に関して、保証保険契約等を[[講ずるか否か・講ずる場合におけるその措置の概要]]"],["20","[[割賦販売]]の場合：現金販売価格、割賦販売価格、頭金・賦払いの額、支払時期・方法\n・分割払いを条件として販売する"]]},{"id":"35_lease","title":"35条書面｜貸借","items":[["1","[ のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"build_height_fire","title":"建築基準法｜高さ・防火制限","group":"法令上の制限","items":[["1","道路斜線\n[[すべて]]の用途地域",{"prompt":"高さ制限：道路斜線","pages":[440],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","第一種低層住居専用地域・第二種低層住居専用地域・田園住居地域\n隣地斜線　[[×]]",{"prompt":"高さ制限：低層住居専用・田園住居の隣地斜線","pages":[440],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","第一種低層住居専用地域・第二種低層住居専用地域・田園住居地域・第一種中高層住居専用地域・第二種中高層住居専用地域\n北側斜線　[[○]]\n※日影規制の適用区域内の第一種・第二種中高層住居専用地域では、北側斜線制限は[[適用されない]]",{"prompt":"北側斜線：対象の用途地域","pages":[440],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","商業地域・工業地域・工業専用地域\n日影規制　[[×]]",{"prompt":"日影規制：適用しない用途地域","pages":[440],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","階数[[3以上]]（[[地階を含む]]）の建築物\n[[または]]\n延べ面積[[100㎡超]]の建築物",{"prompt":"防火地域：耐火建築物等の基準","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","階数[[2以下]]、[[かつ]]延べ面積[[100㎡以下]]の建築物\n[[耐火建築物等または準耐火建築物等]]",{"prompt":"防火地域：小規模な建築物","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","地上階数[[4以上]]（[[地階を除く]]）の建築物\n[[または]]\n延べ面積[[1,500㎡超]]の建築物",{"prompt":"準防火地域：耐火建築物等の基準","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","地上階数3、かつ延べ面積[[1,500㎡以下]]の建築物\nまたは\n地上階数2以下、かつ延べ面積[[500㎡を超え1,500㎡以下]]の建築物\n[[耐火建築物等または準耐火建築物等]]",{"prompt":"準防火地域：地上3階・中規模の建築物","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","地上階数[[2以下]]、かつ延べ面積[[500㎡以下]]の建築物\n[[技術的基準適合建築物]]",{"prompt":"準防火地域：地上2階以下・小規模","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","看板・広告塔等で1・2のどちらかに該当する建築物は、その主要な部分を[[不燃材料]]で造り、または覆わなければならない\n1 建築物の[[屋上]]に設けるもの\n2 高さ[[3mを超える]]もの",{"prompt":"防火地域：看板・広告塔等","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","地階を[[除く]]階数が[[4以上]]、高さ[[16m超]]、延べ面積[[3,000㎡超]]の建築物（大規模な木造建築物等）は、原則、主要構造部を[[耐火構造または準耐火構造]]としなければならない",{"prompt":"防火地域等以外：大規模木造建築物","pages":[442],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","防火壁でその建築物が有効に区分されているときを[[除いて]]、[[最も厳しい]]地域の規制が適用されます。",{"prompt":"防火・準防火地域にまたがる建築物","pages":[442],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"build_confirm","title":"建築基準法｜建築確認・建築協定","group":"法令上の制限","items":[["1","用途に供する床面積の合計が[[200㎡超]]",{"prompt":"建築確認：特殊建築物の対象規模","pages":[442],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","1・2のいずれかに該当\n1 階数[[2以上]]（[[地下含む]]）\n2 延べ面積[[200㎡超]]",{"prompt":"建築確認：全国で対象となる大規模建築物","pages":[442],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","建築物が防火地域または準防火地域にある場合の増築・改築・移転は、[[10㎡以内]]であっても建築確認が[[必要]]です。",{"prompt":"建築確認：防火・準防火地域の小規模増築等","pages":[442],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","国土交通大臣または都道府県知事等が指定した[[指定確認検査機関]]でもできる",{"prompt":"確認・検査を行える機関","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","建築主事等は、確認の申請書を受理した日から、特殊建築物、大規模建築物→[[35日以内]]\n一般の建築物→[[7日以内]]に審査、確認し、[[確認済証]]を交付しなければならない",{"prompt":"建築確認：審査の日数","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","建築主は工事が完了した日から[[4日以内]]に建築主事等に到達するように[[工事完了検査の申請]]をしなければならない",{"prompt":"工事完了：建築主の検査申請期限","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","建築主事等は、完了検査の申請を受理した日から[[7日以内]]に完了検査をし、規定に適合するときは[[検査済証]]を交付しなければならない",{"prompt":"工事完了検査：建築主事等の期限","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","[[確認済証の交付]]を受けてから工事を開始します。",{"prompt":"確認済証と工事着手","pages":[453],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","消防長または消防署長の[[同意]]を得なければならない。\nただし、防火地域や準防火地域[[以外]]の区域で行う[[住宅建築]]の場合は[[不要]]",{"prompt":"建築確認：消防同意の例外","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","1 文化財保護法の規定によって[[重要文化財等]]に指定された建築物\n2 [[既存不適格建築物]]\n※ただし建替えや増改築等の際には規定に[[従わなければならない]]",{"prompt":"建築基準法：適用されない建築物","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の「既存不適格」の再質問への補足。建築時には適法でも、法改正等で現行基準に合わなくなったもの。最初から基準に違反していた建物とは区別します。"}],["11","建築協定の締結手続き\n土地の所有者等の[[全員の合意]]によって、建築協定書を作成し、これを[[特定行政庁]]に申請して、その[[認可]]を受ける\n建築協定の変更\n土地の所有者等の[[全員の合意]]が必要",{"prompt":"建築協定：締結と変更の同意","pages":[455],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","土地の所有者等の[[過半数の合意]]が必要",{"prompt":"建築協定：廃止に必要な同意","pages":[455],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","特定行政庁による認可の公告があった日以後に、建築協定区域内の土地の所有者や借地権者になった者に対しても、原則として、この建築協定の[[効力が及ぶ]]",{"prompt":"建築協定：後から取得した人への効力","pages":[455],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","建築協定は、[[1人]]でも定めることができる。効力の発生は認可の日から[[3年以内]]に、その土地の区域に[[2人以上]]の土地所有者等が存在することとなったとき",{"prompt":"一人協定：効力が生じる条件","pages":[443,455],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"land_readjust","title":"土地区画整理法｜施行・換地・仮換地","group":"法令上の制限","items":[["1","土地区画整理事業　[[都市計画区域内]]の土地について、公共施設（道路、公園等）の整備改善および、宅地の利用増進を図るために行われる土地の[[区画形質の変更]]および公共施設の新設または変更に関する事業。[[減歩や換地処分]]という方法で行われる",{"prompt":"土地区画整理事業：対象区域","pages":[456],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","宅地の所有者、借地権者が[[7人以上]]で共同して定款や事業計画を定めた上で、[[都道府県知事等の認可]]を受けて設立する組合",{"prompt":"土地区画整理組合：人数と認可","pages":[456],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","事業計画の認可・決定等の[[公告があった日]]後、[[換地処分の公告がある日]]までの間に、施行地区内において下記の1〜3の行為を行おうとする者は、国土交通大臣（国土交通大臣が施行する場合）または[[都道府県知事等の許可]]が必要です。\n1 土地の形質の変更　2 建築物の建築（新築・増改築等）、工作物の建設　3 移動の容易でない[[5t超]]物件の設置・堆積",{"prompt":"土地区画整理事業の施行地区：建築行為等の制限","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","施行者が個人施行者、土地区画整理組合、区画整理会社、市町村または機構等である場合は、換地計画について[[都道府県知事等の認可]]を受けなければなりません。",{"prompt":"換地計画：認可を受ける者","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","換地は従前の宅地と条件（位置、地積、土質、水利、利用状況、環境等）が[[同じようなもの]]でなければならない＝[[換地照応の原則]]",{"prompt":"換地：照応の原則","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","換地に関して不均衡が生ずる場合には[[金銭]]により清算\n損→清算金を[[交付]]　得→清算金を[[徴収]]",{"prompt":"清算金：換地の不均衡の調整","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","民間施行の場合\n1 土地区画整理事業の[[施行費用]]に充てるため\n2 [[規準、規約、定款]]で定める目的のため",{"prompt":"保留地：民間施行の場合","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","公的施行の場合\n土地区画整理事業の[[施行費用]]に充てるためのみ\n[[土地区画整理審議会の同意]]が必要",{"prompt":"保留地：公的施行の場合","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","換地処分を行うまで、[[必要がある]]場合に指定できる",{"prompt":"仮換地：指定できる時期","pages":[458],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","従前の宅地について、使用収益することが[[できない]]\n[[所有権がある]]ので、従前の宅地の処分（売却や抵当権の設定）が[[できる]]",{"prompt":"仮換地指定後：従前の宅地の権利","pages":[458],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","仮換地について[[使用収益することができる]]",{"prompt":"仮換地指定後：仮換地の権利","pages":[458],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"教材の権利関係を整理した補足。仮換地で使用・収益できることと、仮換地の所有権を取得することは別です。所有権の切替えは換地処分の公告に伴う効果で確認します。"}],["12","換地処分は換地計画に係る区域の[[全部]]について、工事が[[完了した後]]に遅滞なく行う",{"prompt":"換地処分：原則の時期","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","換地処分の公告があった日が[[終了したとき]]に消滅する",{"prompt":"換地を定めなかった従前の宅地：権利消滅の時点","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","換地計画について換地処分の公告があった日の[[翌日]]から従前の宅地とみなされる換地\n換地計画で所有者と定められたものが[[取得]]する",{"prompt":"換地：所有権取得の時点","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["15","換地処分の公告があった日の[[翌日]]に施行者が取得する",{"prompt":"保留地：施行者が取得する時点","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","換地処分の公告があった日の[[翌日]]に確定する\n金額の確定後、施行者が[[徴収・交付]]する",{"prompt":"清算金：確定の時点","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["17","土地区画整理の登記は、[[施行者]]によって[[一括]]して申請され、その変動に係る登記をした後でないと、原則として[[施行者以外の者]]は登記できません。",{"prompt":"土地区画整理の登記：申請者","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"national_land","title":"国土利用計画法｜届出・許可","group":"法令上の制限","items":[["1","権利取得者は、契約締結日から[[2週間以内]]に、[[都道府県知事等]]に届出をしなければならない",{"prompt":"事後届出：誰がいつ届け出るか","pages":[472,473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","売買の場合⇒[[買主]]\n交換の場合⇒[[両当事者]]",{"prompt":"事後届出：売買・交換の権利取得者","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","土地の利用目的、対価の額などを、[[市町村長を経由]]して[[都道府県知事等]]に届け出なければなりません。",{"prompt":"事後届出：提出の経由先","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","[[権利性・対価性・契約性]]を満たす取引",{"prompt":"土地取引：対象となる3要件","pages":[472],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","市街化区域　[[2,000㎡以上]]",{"prompt":"事後届出：市街化区域の面積基準","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","市街化調整区域・非線引き区域　[[5,000㎡以上]]",{"prompt":"事後届出：その他の都市計画区域の面積基準","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","都市計画区域外　[[10,000㎡以上]]",{"prompt":"事後届出：都市計画区域外の面積基準","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"開発許可の面積と混同しないための教材整理。準都市計画区域は都市計画区域外としてこの面積基準で判定します。"}],["8","ひとまとまりの土地を、回数を分けて購入しても、全体として[[一団の土地]]の処分と認められれば、[[全体の面積]]を基準とします。",{"prompt":"事後届出：一団の土地","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","[[売買契約、売買予約、交換契約]]（金銭授受がなくても該当）、[[停止条件付売買契約]]",{"prompt":"届出の対象となる売買契約","pages":[472],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","[[贈与、相続、時効]]",{"prompt":"届出の対象とならない取得","pages":[472],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","都道府県知事が[[利用目的]]について審査する（[[対価の額は審査の対象外]]）",{"prompt":"事後届出：審査対象","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","審査に問題があれば、都道府県知事は届出があった日から[[3週間以内]]に勧告する\n都道府県知事は届出をしたものに対して、[[利用目的]]を変更すべきことを勧告できる",{"prompt":"事後届出：勧告の期限・内容","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","都道府県知事等は、その旨および勧告内容を[[公表できる]]（[[義務ではない]]）",{"prompt":"勧告に従わない場合","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","監視区域⇒都道府県知事等が、[[都道府県の規則]]により定める\n注視区域⇒[[事後届出制と同じ]]",{"prompt":"事前届出：注視区域・監視区域の面積","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["15","契約の当事者は、契約締結[[前]]に[[都道府県知事等の許可]]を受けなければならない",{"prompt":"規制区域：必要な手続と時期","pages":[472],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","取引の当事者の一方、または双方が[[国・地方公共団体等]]である場合",{"prompt":"届出不要の例外：国等が当事者","pages":[474],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["17","[[農地法3条1項]]の許可を受ける必要がある場合\n農地法[[5条1項]]の許可を受ける場合は[[届出が必要]]",{"prompt":"届出不要の例外：農地法の許可","pages":[474],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"farmland","title":"農地法｜3条・4条・5条","group":"法令上の制限","items":[["1","農地に該当するかどうかは、各農地の土地の[[現況]]によっ まとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","対象不動産が土地のみの場合は、[[造成地、埋立地]]などのときには適用できる\n[[既成市街地]]の土地は再調達原価を算定するのが難しいため、原価法は[[適用しない]]",{"prompt":"原価法：土地だけの不動産","pages":[532],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","環境の変化が価格水準に影響を与えていると認められる場合は、地域要因の変化の程度に応じた増加額を[[熟成度]]として[[加算]]できる",{"prompt":"原価法：熟成度の調整","pages":[532],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","[[事情補正]]および[[時点修正]]を行い、かつ、地域要因の比較および個別的要因の比較を行って求められた価格を比較考量して、対象不動産の試算価格を求める手法です。",{"prompt":"取引事例比較法：事例に行う修正","pages":[533],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","取引事例は正常なもの、または正常なものに補正できるものを収集・選択する。[[投機的取引事例は含まない]]",{"prompt":"取引事例比較法：投機的取引事例","pages":[533],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","対象不動産が将来生み出すであろうと期待される[[純収益の現在価値の総和]]を求めることにより、対象不動産の試算価格を求める手法です。",{"prompt":"収益還元法：求めるもの","pages":[533],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","市場性を有しない不動産（文化財の指定を受けた建造物など）[[以外]]のものには、基本的に[[すべて適用すべき]]とされる",{"prompt":"収益還元法：適用の原則","pages":[533],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","自用の不動産の価格を求める場合にも、[[賃貸を想定]]することによって[[適用することができる]]",{"prompt":"収益還元法：自用の不動産","pages":[533],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","その不動産の効用が[[最高度]]に発揮される可能性に最も富む使用を前提として把握される価格を標準として形成され、これを[[最有効使用の原則]]という",{"prompt":"最有効使用の原則","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","市場性を[[有する]]不動産について、現実の社会経済情勢の下で[[合理的]]と考えられる条件を満たす市場で形成されるであろう市場価値を表示する適正な価格",{"prompt":"正常価格：市場性と合理的条件","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","不動産と取得するほかの不動産との[[併合または分割等]]に基づき、正常価格と同一の市場概念の下において、形成されるであろう市場価値と[[乖離]]することにより、市場が相対的に[[限定]]される場合における取得部分の当該市場限定に基づく市場価格",{"prompt":"限定価格：市場が限定される原因","pages":[537],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["15","市場性を[[有する]]不動産について、法令等による[[社会的要請]]を背景とする鑑定評価[[目的]]のもとで、正常価格の前提となる諸条件を[[満たさない]]ことにより、正常価格と同一の市場概念のもとに、形成されるであろう市場価値と[[乖離]]することとなる価格",{"prompt":"特定価格：条件と鑑定評価目的","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","文化財等の一般的に市場性を[[有しない]]不動産について、その利用現況等を前提とした不動産の経済価値を適正に表示する価格",{"prompt":"特殊価格：市場性","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"land_price","title":"その他｜地価公示法","group":"税・その他","items":[["1","標準地を選定し、その[[正常価格]]を公示すること",{"prompt":"地価公示：公示する価格","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","標準地の[[1㎡当たり]]の土地の価格が示される",{"prompt":"公示価格：表示の単位","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","建物等の定着物や地上権等の使用収益を制限する権利が存する場合には、これらの定着物または権利が[[存しないもの]]として通常成立すると認められる価格をいう",{"prompt":"標準地の正常価格：建物・権利の取扱い","pages":[534,542],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","公示価格を[[指標]]として取引するよう[[努めなければならない]]",{"prompt":"一般の土地取引：公示価格の効力","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","不動産鑑定士が公示区域内の土地について鑑定評価を行う場合⇒当該土地の正常な価格を求めるとき\n公共事業の用に供する土地の取得価格の算定や、収用する土地に対する補償金額を算定するとき\n公示価格を[[規準としなければならない]]",{"prompt":"鑑定・公共事業等：公示価格の効力","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","[[土地鑑定委員会]]が選定する",{"prompt":"標準地の選定者","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","土地鑑定委員会は[[毎年1回]]、[[2人以上]]の不動産鑑定士に鑑定評価を求める",{"prompt":"標準地の鑑定評価：回数・鑑定士の人数","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","[[土地鑑定委員会]]は、提出を受けた鑑定評価の結果を審査し、必要な調整を行って[[正常な価格]]を判定する",{"prompt":"正常価格の判定者","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","毎年1回、土地鑑定委員会は[[官報]]で地価公示を行う",{"prompt":"地価公示：公示する媒体","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","関係市町村長は図書を市町村の事務所において、一般の閲覧に[[3年間]]公開する",{"prompt":"地価公示の図書：閲覧期間","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"housing_finance","title":"免除科目｜住宅金融支援機構","group":"5問免除科目","items":[["1","原則として、[[直接的には個人向け融資を行わず]]、[[間接的]]に一般の金融機関による個人への融資の支援を行います",{"prompt":"住宅金融支援機構：直接・間接の原則","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","民間の金融機関による融資が[[困難]]な分野に限り、一般の金融機関による融資の[[補完]]のための[[直接融資業務]]を行います。",{"prompt":"直接融資：例外となる分野","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","民間金融機関から個人の[[住宅ローン債権]]を[[買い取り]]、信託した上で証券化し、その担保とした証券（[[MBS]]：資産担保証券）を売却し、債券市場（[[投資家]]）から資金を調達しています。",{"prompt":"証券化支援業務：買い取るもの","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","住宅の建設・購入に[[付随して]]取得する[[土地や借地権]]の取得資金についても可能。ただし、土地の購入資金[[のみ]]の融資は[[できない]]。",{"prompt":"フラット35：土地・借地権取得費","pages":[548,556],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去に質問・誤答が確認できた論点。住宅と一緒に取得する土地は対象に含まれます。「土地が入るから不可」と「土地だけの購入」を分けて判断します。"}],["5","[[中古住宅]]の購入資金としても使えるが、住宅の[[改良（リフォーム）]]の資金としては[[使えない]]。ただし、住宅の購入と[[あわせて行う]]リフォームや、[[高齢者]]が住みやすくなるリフォームは対象となる。",{"prompt":"フラット35：中古住宅・リフォーム","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","賃貸住宅を建設・購入するための資金としては[[使えない]]",{"prompt":"フラット35：賃貸住宅","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","ローンの[[借換えにも使える]]",{"prompt":"フラット35：ローンの借換え","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","一戸建て等→[[70㎡以上]]\nマンションなど共同住宅→[[30㎡以上]]",{"prompt":"フラット35：対象住宅の床面積","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","一部分を店舗や事務所と併用する場合は、住宅部分の床面積が全体の[[2分の1以上]]であること",{"prompt":"フラット35：店舗・事務所との併用","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","全国一律[[100万円以上8,000万円以下]]で、建設費や購入価額の[[100％]]までOK",{"prompt":"フラット35：融資額の範囲","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","原則：「[[15年以上35年以内]]」もしくは「完済時の年齢が[[80歳]]となるまでの年数」のどちらか[[短いほう]]",{"prompt":"フラット35：借入期間","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","[[全期間固定金利]]。金利は金融機関によって[[異なり]]、申込みの[[受付時ではなく]]、資金[[受取り時]]点の金利が適用される",{"prompt":"フラット35：金利と適用時点","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","元利均等返済と[[元金均等返済]]の[[2つ]]があります。",{"prompt":"住宅ローン債権の償還方法","pages":[554,556],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の「元利金」の質問への補足。元金は借りたお金、利息は借りるために払うお金、元利金はその合計。元利均等と元金均等の名前を分けて覚えます。"}],["14","[[災害復興建築物]]の建設・購入、[[被災建築物]]の補修に必要な資金の貸付け",{"prompt":"直接融資：災害復興・被災建築物","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["15","合理的土地利用建築物の建設、または[[マンションの共用部分の改良]]に必要な資金の貸付け",{"prompt":"直接融資：マンション共用部分","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","高齢者の家庭に適した良好な居住性能、および居住環境を有する住宅とすることを主たる目的とする住宅の[[改良]]（[[高齢者自ら居住する住宅]]について行うものに限る）に必要な資金の貸付け",{"prompt":"直接融資：高齢者の居住住宅の改良","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["17","住宅の[[エネルギー消費性能の向上]]を主たる目的とする住宅の改良に必要な資金の貸付け",{"prompt":"直接融資：省エネルギー住宅の改良","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["18","証券化支援業務（買取型）と直接融資業務の共通点として、高齢者が亡くなったときに借入金を[[一括して返済]]する制度があります",{"prompt":"高齢者：死亡時の一括返済制度","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の「何がメリット？」「家族への影響は？」への補足。生存中の毎月の返済負担を抑え、死亡時に元金をまとめて返す仕組みとして説明しました。借金が自動で免除される意味ではありません。家族への具体的な責任は、個々の契約条件によるためここでは断定しません。"}],["19","融資を受けた者と[[あらかじめ契約]]を締結して、その者が[[死亡]]した場合（[[重度障害も含む]]）に支払われる生命保険の保険金を、貸付債務の[[弁済]]に充てるものです。",{"prompt":"団体信用生命保険：死亡以外の給付事由","pages":[556],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["20","空家等及び空家等の跡地の活用推進に必要な[[資金の融通]]に関する[[情報の提供]]その他の援助を行っています。",{"prompt":"空家等：機構の支援業務","pages":[556],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"ads_display","title":"免除科目｜広告表示・景品表示法","group":"5問免除科目","items":[["1","豪華すぎる[[景品]]の提供や[[誇大広告]]を禁止する法律",{"prompt":"景品表示法：禁止される行為","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","[[内閣総理大臣]]は事業者に対して指示命令を出すことができます。指示命令は違反行為が[[すでになくなっている]]場合も出せます。",{"prompt":"景品表示法：指示命令の権限","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","物件が公園、庭園、旧跡その他の施設または海（海岸）、湖沼もしくは河川の岸・堤防から[[直線距離で300m以内]]に所在している場合は、これらの名称を用いることができる",{"prompt":"公園・庭園・海等の名称：表示できる距離","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","物件から[[直線距離で50m以内]]に所在する街道その他の道路の名称（坂を含む。）を用いることができる",{"prompt":"街道等の名称：表示できる距離","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","デパート、スーパーマーケット、商店街の商業施設は、[[現に利用できる]]ものを、物件からの[[道路距離または徒歩所要時間]]を明示して表示しなければならない",{"prompt":"スーパー等：表示できる施設","pages":[550],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","将来確実に利用できると認められる場合は、その[[整備予定時期]]を明示すれば表示することができる",{"prompt":"工事中の商業施設：表示の条件","pages":[550],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","徒歩による所要時間は[[道路距離80mにつき1分間]]を要するものとして算出した数値を表示する。1分未満の端数が生じたときは[[1分]]として算出する",{"prompt":"徒歩所要時間：距離・端数","pages":[550],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","建築工事完了後[[1年未満]]であって、[[居住の用に供されたことがない]]もの",{"prompt":"広告：新築の定義","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","地目は[[登記簿]]に記載されているものを表示する（[[現況]]の地目と異なる場合は、現況の地目も併記する）",{"prompt":"広告：地目の表示","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","建物の面積（マンションは専有面積）は[[延べ面積]]を表示し、これに[[車庫、地下室等]]（地下居室を除く）の面積を含むときは、その旨およびその面積を表示しなければならない。",{"prompt":"広告：建物面積の表示","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","[[1戸当たり]]の価格を表示し、取引する[[すべての住戸]]の価格を表示しなければならない。",{"prompt":"広告：通常の住宅価格表示","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","取引するすべての住戸の[[1か月当たり]]の賃料を表示する。",{"prompt":"広告：賃貸住宅の賃料表示","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","その本広告に先立ち、その[[取引開始時期をあらかじめ告知]]する広告表示のこと",{"prompt":"広告：予告広告の取引開始前","pages":[550],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","一定期間内に指定の建築業者との間で[[建築請負契約]]が成立することを[[条件]]として売買される土地のこと",{"prompt":"建築条件付土地：成立する契約","pages":[550],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["15","物件が[[存在しない]]ため、実際には取引することができない物件",{"prompt":"おとり広告：存在しない物件","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","物件は存在するが、実際には取引の[[対象となりえない]]物件",{"prompt":"おとり広告：取引対象とならない物件","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["17","物件は存在するが、実際には取引する[[意思がない]]物件",{"prompt":"おとり広告：取引の意思がない物件","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"ads_prices","title":"免除科目｜二重価格・景品限度額","group":"5問免除科目","items":[["1","過去の販売価格の[[公表日]]および[[値下げした日]]を明示すること",{"prompt":"過去の販売価格との比較：表示する日付","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","値下げの[[直前]]の価格であって、かつ値下げ前[[2か月以上]]にわたり実際に販売のために公表していた価格であること",{"prompt":"過去の販売価格：販売していた期間","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","値下げの日から[[6か月以内]]に表示するものであること",{"prompt":"二重価格：値下げ日からの表示期間","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","取引価額の[[20倍]]、または[[10万円]]のいずれか[[低い額]]",{"prompt":"懸賞によって提供する景品：個別の限度額","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","提供できる景品類の総額は、懸賞に係る取引予定総額の[[100分の2以内]]とする",{"prompt":"懸賞によって提供する景品：総額の限度","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","取引価額の[[10分の1]]、または[[100万円]]のいずれか[[低い額]]",{"prompt":"懸賞によらない景品：限度額","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"land_features","title":"免除科目｜土地・地形・災害","group":"5問免除科目","items":[["1","一般に水はけがよく、地耐力もあり、洪水や地震に対する安全度も比較的高いので、一般的には宅地として[[適している]]",{"prompt":"宅地適性：丘陵地・台地・段丘","pages":[568],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","[[縁辺部]]（台地等の端で崖崩れの危険がある場所）や[[谷地]]（浅い谷で地盤が軟弱な場所）は、宅地には[[適さない]]",{"prompt":"台地等：縁辺部・谷地の例外","pages":[568],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","扇状地の中の[[微高地、自然堤防]]、廃川敷となった旧天井川、砂丘、砂州などは、比較的[[宅地に適している]]",{"prompt":"扇状地・自然堤防：宅地適性","pages":[568],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","埋立地は干拓地と異なり、立地が海面より高いことが多いので、[[干拓地よりは安全]]",{"prompt":"埋立地と干拓地：安全性の比較","pages":[568],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","標高の低い[[デルタ地域、旧河道]]、沼沢地、自然堤防に囲まれた[[後背湿地]]などは、とりわけ宅地に適さない",{"prompt":"低地：宅地に不適な地形","pages":[568],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","粒径のそろった[[砂地盤]]で、[[地下水位の高い、地表から浅い地域]]で発生しやすく、これにより建物の[[傾斜や沈下]]などが起こります。",{"prompt":"液状化：起こりやすい地盤","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の土地分野の説明と対応する補足。「水分が多い、緩い砂地盤、地震の揺れ」の組合せで理解すると、地形名だけの丸暗記を減らせます。"}],["7","斜面崩壊によってできた地形。再度、崩壊のおそれがあるので、宅地には[[適していない]]",{"prompt":"崩壊跡地：宅地適性","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","地盤の強度が安定していないため、断層に沿った崩壊や[[地すべり]]が発生する可能性が[[高い]]",{"prompt":"断層周辺：災害の可能性","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","集中豪雨のときは[[土石流]]が発生する危険性が高く、一般に宅地には[[適していない]]",{"prompt":"崖錐：集中豪雨時の災害","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","急傾斜については等高線の間隔が[[密]]となっているのに対し、傾斜が緩やかな土地については等高線は[[疎]]となっている",{"prompt":"等高線：急斜面と緩斜面","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","等高線が山頂に向かって高いほうに弧を描いている部分は[[谷]]で、山頂から見て等高線が張り出している部分は[[尾根]]となる",{"prompt":"等高線：谷と尾根","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"building_structures","title":"免除科目｜建物の構造・材料","group":"5問免除科目","items":[["1","[[耐火性、耐久性]]があり、[[耐震性、耐風性]]にも優れた構造です。",{"prompt":"鉄筋コンクリート造：主な性能","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","錆を防いでいるコンクリートの[[アルカリ性]]が、空気中の[[炭酸ガス]]によって失われて[[中性化]]することを防ぐ必要がある",{"prompt":"鉄筋コンクリート：中性化","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","[[酸、塩分、有機物、泥土]]を含んではならない",{"prompt":"鉄筋コンクリート：混ぜてはいけないもの","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","鉄筋の末端は、原則として[[かぎ状]]に折り曲げて、コンクリートから抜け出さないように定着させなければならない",{"prompt":"鉄筋：末端の定着","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","原則として主筋は[[4本以上]]でなければならない",{"prompt":"鉄筋コンクリート柱：主筋の本数","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","耐力壁・柱・はりにあっては[[3センチ以上]]としなければならない",{"prompt":"鉄筋コンクリート：かぶり厚さ","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","鉄筋コンクリート造と比較して、工期が[[短く]]建設コストが[[安い]]ですが、耐震性や耐火性に[[やや劣ります]]。",{"prompt":"補強コンクリートブロック造：特徴","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","自重が[[小さく]]、靭性が[[大きい]]ことから、大空間の建築、高層建築に使用されます。",{"prompt":"鉄骨造：重さと靭性","pages":[570,580],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","耐火性が[[低い]]ため、[[耐火被覆]]が必要という短所があります",{"prompt":"鉄骨造：耐火性の弱点","pages":[580],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","柱とはりを組み合わせた[[直方体]]で構成する骨組み",{"prompt":"ラーメン構造：骨組み","pages":[570,580],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","細長い部材を[[三角形]]に組み合わせた構成の構造",{"prompt":"トラス構造：骨組み","pages":[570,580],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","[[アーチ形]]の骨組みで、スポーツ施設のような[[大空間]]を構成するのに適した構造",{"prompt":"アーチ構造：適する建物","pages":[570,580],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","木造軸組工法、[[枠組壁工法]]（[[ツーバイフォー工法]]）、集成木材工法",{"prompt":"木造：主な工法","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","圧縮に対する強度は繊維に対して直角方向に比べ、[[繊維方向の方が強い]]",{"prompt":"木材：繊維と圧縮の強さ","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の「木の繊維方向」の質問に対応。繊維がどちらに走っていて、どちらから力を掛けるかを分けて考えます。"}],["15","乾燥状態に比べて湿潤状態のほうが強度が[[小さく]]、湿潤状態ではシロアリなどの虫害や腐朽菌の害を受けやすくなる",{"prompt":"木材：乾燥状態と湿潤状態","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","辺材は樹液を多く含み虫害にも弱いため、[[心材よりも腐朽しやすい]]",{"prompt":"木材：辺材と心材","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["17","鉄筋と普通のコンクリートを比較すると、常温常圧において、温度上昇に伴う体積の膨張の程度は[[ほぼ等しい]]",{"prompt":"鉄とコンクリート：熱膨張","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["18","圧縮強度は[[強い]]が、引張強度は[[弱い]]",{"prompt":"コンクリート：圧縮と引張り","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["19","炭素含有量が多いほど、引張強度、硬度が[[増大]]する傾向にある",{"prompt":"鋼材：炭素量と性能","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"building_wood_quake","title":"免除科目｜木造・耐震・基礎","group":"5問免除科目","items":[["1","[[柱]]（縦の構造材）に[[はり]]（横の構造材）を組み合わせて建てる工法です。",{"prompt":"木造軸組工法：組み合わせる構造材","pages":[581],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","原則、2階建ての木造建築物の土台は、基礎に[[緊結]]しなければなりませんが、例外的に[[物置や納屋（10㎡以内）]]などの建物の場合は行う必要はありません。",{"prompt":"木造2階建て：土台と基礎","pages":[581],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","はり、けたなどの横架材には、中央部付近の下側に耐力上支障のある[[欠込み]]をしては[[なりません]]。",{"prompt":"横架材：中央付近の下側の欠込み","pages":[581],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の「横架材の欠込み」の再質問に対応。はり・けたは横向きの構造材。問題は「補強すればよい」ではなく、中央部付近の下側に耐力上支障のある欠込みをしないという規定です。"}],["4","壁で支える仕組みのため、耐震性が[[高く]]、[[通し柱の必要もない]]とされています。",{"prompt":"枠組壁工法：壁と通し柱","pages":[581],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","建物の柱、はり、耐震壁などで[[剛性を const EXTRAS={"city_2::区域区分":{"pages":[388,394],"note":"過去に区域の関係が分かりにくいと質問した箇所。都市計画区域の中を市街化区域と市街化調整区域に分けるのが区域区分。準都市計画区域は都市計画区域の外です。「任意」と一定区域での義務を分けて覚えます。"},"city_3::準住居地域":{"pages":[389,396],"note":"過去の「準住居地域も用途地域？」への補足。準住居地域は13種類の用途地域の一つです。準都市計画区域という区域の名称とは区別します。"},"city_3::都市計画に必ず定める事項":{"pages":[389,398,440],"note":"建築基準法の絶対高さ制限（10mまたは12m）も、この既存項目で復習できます。同じ知識を新しい分野に重複登録していません。"},"city_3::必要に応じて定める事項":{"pages":[389,398,440],"note":"外壁後退距離（1mまたは1.5m）は、この既存項目で復習できます。同じ知識を新しい分野に重複登録していません。"},"city_4::特別用途地区":{"pages":[390,399],"note":"用途地域を補充するのが特別用途地区。用途地域の外に定める特定用途制限地域とは名前と条件を組み合わせて区別します。"},"city_5::地区計画の区域内の制限（届出が必要）":{"pages":[391],"note":"過去に「30日はどこから？」「都市計画事業の話？」と繰り返し確認した箇所。地区計画は行為に着手する30日前までに市町村長へ届出。都市計画事業の許可や、認可告示後の有償譲渡の届出とは別です。"},"city_p2_3::都市計画制限":{"pages":[404,405,411],"note":"過去の認可告示・事業地の質問に対応。計画決定と事業の認可告示は段階が違います。建築等の許可と、土地建物の有償譲渡の届出を混同しないようにします。"},"city_p2_4::判定の順序":{"pages":[406],"note":"過去に開発許可が分かりにくいと質問した箇所。「開発行為か」を先に判定し、その後に区域・面積・例外を確認します。"},"city_p2_6::工事完了の公告後・例外②":{"pages":[408,420],"note":"過去の「用途地域に合っていても再申請？」への補足。ここは予定建築物と異なる建築の制限の話です。建物の用途を変えるだけなのか、新たに区画形質を変更して開発行為をするのかを分けて判断します。"}};
const KEY='takken_v4_progress';
let sec=0,level=1,filter='all';
let progress={};
try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const key=(sid,n)=>sid+'::'+n;
const get=(sid,n)=>progress[key(sid,n)]||'';
const save=()=>{localStorage.setItem(KEY,JSON.stringify(progress));updateScore()};

function shortTitle(t){
  return t.replace('35条書面｜','35条 ').replace('指定流通機構（REINS）｜','REINS ').replace('媒介契約｜','媒介 ');
}
function sectionGroup(s){
  if(s.group)return s.group;
  return s.id.startsWith('city')?'法令上の制限':'既存の宅建業法';
}
function renderPicker(){
  const picker=document.getElementById('sectionPicker');
  picker.textContent='';
  const groups={};
  DATA.forEach((s,i)=>{
    const g=sectionGroup(s);
    if(!groups[g]){groups[g]=document.createElement('optgroup');groups[g].label=g;picker.appendChild(groups[g]);}
    const option=document.createElement('option');option.value=String(i);option.textContent=s.title;
    groups[g].appendChild(option);
  });
  picker.value=String(sec);
}
function renderTabs(){
  renderPicker();
  const t=document.getElementById('tabs');t.innerHTML='';
  DATA.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===sec?' active':'');
    b.textContent=shortTitle(s.title);
    b.onclick=()=>{
      sec=i;renderTabs();render();
      if(window.innerWidth<700) document.getElementById('panel').classList.remove('open');
    };
    t.appendChild(b);
  });
}

document.getElementById('sectionPicker').onchange=e=>{
  sec=Number(e.target.value);renderTabs();render();
  if(window.innerWidth<700)document.getElementById('panel').classList.remove('open');
};
document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{
  level=+b.dataset.level;
  document.querySelectorAll('.level').forEach(x=>x.classList.toggle('active',x===b));
  render();
  if(window.innerWidth<700) document.getElementById('panel').classList.remove('open');
});
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{
  filter=b.dataset.filter;
  document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));
  render();
});

function parsed(raw){
  return esc(raw).replace(/\[\[(.*?)\]\]/gs,'<span class="cloze">$1</span>')
                 .replace(/\(\((.*?)\)\)/gs,'<span class="extra">$1</span>');
}
function updateScore(){
  const s=DATA[sec];let ok=0,ng=0,un=0;
  s.items.forEach(([n])=>{const v=get(s.id,n);if(v==='ok')ok++;else if(v==='ng')ng++;else un++});
  document.getElementById('score').textContent=`○${ok} ×${ng} 未${un}`;
}
function applyCardMark(card,sid,n){
  const v=get(sid,n);
  card.classList.remove('ok','ng');
  if(v) card.classList.add(v);
  const ok=card.querySelector('.mark.ok');
  const ng=card.querySelector('.mark.ng');
  if(ok) ok.classList.toggle('sel',v==='ok');
  if(ng) ng.classList.toggle('sel',v==='ng');
  if(filter==='ng') card.style.display=(v==='ng')?'':'none';
  else if(filter==='un') card.style.display=v?'none':'';
  else card.style.display='';
}
function setMark(card,sid,n,val){
  const k=key(sid,n);
  if(progress[k]===val) delete progress[k]; else progress[k]=val;
  save();
  applyCardMark(card,sid,n);
}
function render(){
  const s=DATA[sec];
  document.getElementById('current').textContent=shortTitle(s.title);
  const root=document.getElementById('cards');root.innerHTML='';
  let shown=0;
  s.items.forEach(([n,raw,itemMeta])=>{
    const meta=itemMeta||EXTRAS[key(s.id,n)]||{};
    const v=get(s.id,n);
    if(filter==='ng'&&v!=='ng')return;
    if(filter==='un'&&v)return;
    shown++;
    const c=document.createElement('div');c.className='card '+(v||'');
    c.dataset.recordKey=key(s.id,n);
    if(meta.prompt){
      const cue=document.createElement('div');cue.className='card-cue';cue.textContent=meta.prompt;c.appendChild(cue);
    }
    const row=document.createElement('div');row.className='row';
    const num=document.createElement('div');num.className='num';num.textContent=n;
    const txt=document.createElement('div');txt.className='text';
    if(level===3) txt.innerHTML='<span class="adv">この項目の内容を頭の中で再現</span>';
    else{
      txt.innerHTML=parsed(raw);
      if(level===2) txt.querySelectorAll('.extra').forEach(x=>x.classList.add('hide'));
    }
    row.append(num,txt);

    const ac=document.createElement('div');ac.className='actions';
    const ans=document.createElement('button');ans.className='answer';ans.textContent='答えを表示';
    let answerShown=false;
    function hideAnswer(){
      if(level===3){
        txt.innerHTML='<span class="adv">この項目の内容を頭の中で再現</span>';
      }else{
        txt.innerHTML=parsed(raw);
        if(level===2) txt.querySelectorAll('.extra').forEach(x=>x.classList.add('hide'));
      }
      answerShown=false;
      ans.textContent='答えを表示';
    }
    function showAnswer(){
      if(level===3){
        txt.innerHTML=parsed(raw);
        txt.querySelectorAll('.cloze').forEach(x=>x.classList.add('show'));
      }else{
        txt.querySelectorAll('.cloze').forEach(x=>x.classList.add('show'));
        txt.querySelectorAll('.extra').forEach(x=>x.classList.remove('hide'));
      }
      answerShown=true;
      ans.textContent='答えを隠す';
    }
    ans.setAttribute('aria-pressed','false');
    ans.onclick=()=>{answerShown ? hideAnswer() : showAnswer();ans.setAttribute('aria-pressed',String(answerShown))};
    const ok=document.createElement('button');ok.className='mark ok'+(v==='ok'?' sel':'');ok.textContent='○';ok.onclick=()=>setMark(c,s.id,n,'ok');
    const ng=document.createElement('button');ng.className='mark ng'+(v==='ng'?' sel':'');ng.textContent='×';ng.onclick=()=>setMark(c,s.id,n,'ng');
    ac.append(ans,ok,ng);
    c.append(row);
    if(meta.note){
      const detail=document.createElement('details');detail.className='supplement';
      const summary=document.createElement('summary');summary.textContent='補足解説・ひっかけポイント（学習メモ）';
      const note=document.createElement('p');note.textContent=meta.note;
      detail.append(summary,note);c.appendChild(detail);
    }
    c.appendChild(ac);
    if(meta.pages&&meta.pages.length){
      const source=document.createElement('div');source.className='source-line';
      source.textContent=(meta.source?'出典：':'関連：')+'教材 P'+meta.pages.join('・P');
      c.appendChild(source);
    }
    root.appendChild(c);
    applyCardMark(c,s.id,n);
  });
  if(!shown){root.innerHTML='<div class="empty">該当する項目はありません。</div>'}
  updateScore();
}

document.getElementById('menuBtn').onclick=()=>document.getElementById('panel').classList.toggle('open');

document.getElementById('reset').onclick=()=>{
  const s=DATA[sec];
  if(!confirm('この分野の○×記録を消しますか？'))return;
  s.items.forEach(([n])=>delete progress[key(s.id,n)]);
  save();render();
};
document.getElementById('backup').onclick=()=>{
  const blob=new Blob([JSON.stringify(progress)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='takken_progress.json';a.click();
};
