const chapter3ReviewSectionsStage2=[{"id":"chapter3_review_3","title":"3 単体規定・道路規制・用途規制・建蔽率・容積率","group":"第3章 法令上の制限等｜復習問題","reviewChapter":3,"reviewUnit":3,"items":[["c3u3_1_1","住宅は、敷地の周囲の状況によってやむを得ない場合を除き、その１以上の居室の開口部が日照を受けることができるものでなければならない。",{"qnum":1,"label":"1","title":"単体規定①","stem":"次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"法改正により、住宅の日照に関する規定は削除されています。そのため、現在の建築基準法では、居室には採光のための窓その他の開口部を設け、その採光に有効な部分の面積は、その居室の床面積に対して原則、住宅にあっては7分の1以上としなければなりません（一定の場合10分の1以上）。","pending":false}],["c3u3_1_2","高さ25ｍの建築物には、周囲の状況によって安全上支障がない場合を除き、有効に避雷設備を設けなければならない。",{"qnum":1,"label":"2","title":"単体規定①","stem":"次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"高さ20ｍを超える建築物には、有効に避雷設備を設ける必要があります。","pending":false}],["c3u3_1_3","高さ25ｍの建築物には、安全上支障がない場合を除き、非常用の昇降機を設けなければならない。",{"qnum":1,"label":"3","title":"単体規定①","stem":"次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"高さ31ｍを超える建築物には、非常用の昇降機を設ける必要がありますが、本肢は高さ25ｍですので設置は不要です。","pending":false}],["c3u3_1_4","延べ面積が2,000㎡の準耐火建築物は、防火上有効な構造の防火壁又は防火床によって有効に区画し、かつ、各区画の床面積の合計をそれぞれ500㎡以内としなければならない。",{"qnum":1,"label":"4","title":"単体規定①","stem":"次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"耐火建築物または準耐火建築物の場合は、防火壁で区画する必要はありません。選択肢で「延べ面積が2,000㎡の準耐火建築物」と出てきたときに、「2,000㎡」だけに目がいってしまうと、「準耐火建築物」を見落としてしまうので、注意しましょう。もしも、この建物が耐火建築物または準耐火建築物等以外である場合には、延べ面積が1,000㎡を超える建築物は、防火上有効な構造の防火壁または防火床によって有効に区画し、かつ、各区画の床面積の合計を、それぞれ1,000㎡以内としなければなりません。","pending":false}],["c3u3_2_1","一つ",{"qnum":2,"label":"1","title":"単体規定②","stem":"建築基準法に関する次の記述のうち、誤っているものはいくつあるか。\nア　一室の居室で天井の高さが異なる部分がある場合、室の床面から天井の一番低い部分までの高さが2.1ｍ以上でなければならない。\nイ　３階建ての共同住宅の各階のバルコニーには、安全上必要な高さが1.1ｍ以上の手すり壁、さく又は金網を設けなければならない。\nウ　石綿以外の物質で居室内において衛生上の支障を生ずるおそれがあるものとして政令で定める物質は、ホルムアルデヒドのみである。\nエ　高さが20ｍを超える建築物には原則として非常用の昇降機を設けなければならない。","answer":"❌誤り","explanation":"ア　居室の天井の高さは、2.1ｍ以上でなければなりません。一室で天井の高さが異なる部分がある場合は、その平均の高さが2.1ｍ以上である必要があります。\nイ　２階以上の階にあるバルコニーには、安全上必要な高さが1.1ｍ以上の手すり壁、さくまたは金網を設けなければなりません。ただし「各階のバルコニー」では１階にも設置することになりますが、１階には不要ですので誤りとなります。\nウ　ホルムアルデヒドのみではありません。クロルピリホスも指定されています。\nエ　高さ20ｍを超える建築物には不要です。31ｍ超の建築物から、非常用の昇降機を設けなければなりません。\n正解：四つ","pending":false}],["c3u3_2_2","二つ",{"qnum":2,"label":"2","title":"単体規定②","stem":"建築基準法に関する次の記述のうち、誤っているものはいくつあるか。\nア　一室の居室で天井の高さが異なる部分がある場合、室の床面から天井の一番低い部分までの高さが2.1ｍ以上でなければならない。\nイ　３階建ての共同住宅の各階のバルコニーには、安全上必要な高さが1.1ｍ以上の手すり壁、さく又は金網を設けなければならない。\nウ　石綿以外の物質で居室内において衛生上の支障を生ずるおそれがあるものとして政令で定める物質は、ホルムアルデヒドのみである。\nエ　高さが20ｍを超える建築物には原則として非常用の昇降機を設けなければならない。","answer":"❌誤り","explanation":"ア　居室の天井の高さは、2.1ｍ以上でなければなりません。一室で天井の高さが異なる部分がある場合は、その平均の高さが2.1ｍ以上である必要があります。\nイ　２階以上の階にあるバルコニーには、安全上必要な高さが1.1ｍ以上の手すり壁、さくまたは金網を設けなければなりません。ただし「各階のバルコニー」では１階にも設置することになりますが、１階には不要ですので誤りとなります。\nウ　ホルムアルデヒドのみではありません。クロルピリホスも指定されています。\nエ　高さ20ｍを超える建築物には不要です。31ｍ超の建築物から、非常用の昇降機を設けなければなりません。\n正解：四つ","pending":false}],["c3u3_3_1","道路法による道路は、すべて建築基準法上の道路に該当する。",{"qnum":3,"label":"1","title":"道路規制","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"建築基準法上の道路とは、幅員４ｍ（もしくは６ｍ）以上のもので、道路法による道路は幅員に関係なく一般交通の用に供する道、すべてを道路とみなします。よって、道路法による道路＝建築基準法上の道路ではありません。","pending":false}],["c3u3_3_2","建築物の敷地は、必ず幅員４ｍ以上の道路に２ｍ以上接しなければならない。",{"qnum":3,"label":"2","title":"道路規制","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"原則として、幅員４ｍ（もしくは６ｍ）以上の道路に２ｍ以上接しなければ、その敷地に建物を建てることができないというルール（接道義務）があります。ただし、このルールは都市計画区域および準都市計画区域内に限り適用され、それ以外の区域には適用されません。また、特定行政庁の認可・許可により接道義務の適用除外となる場合もあります。よって、必ずしも幅員４ｍ以上の道路に２ｍ以上接しなければならないのではありません。","pending":false}],["c3u3_3_3","地方公共団体は、土地の状況等により必要な場合は、建築物の敷地と道路との関係について建築基準法に規定された制限を、条例で緩和することができる。",{"qnum":3,"label":"3","title":"道路規制","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"条例で必要な制限を付加できますが、緩和はできません。つまり、厳しくはできても、制限をゆるくはできないということです。言葉の意味も一緒に覚えておきましょう。","pending":false}],["c3u3_3_4","地盤面下に設ける建築物については、道路内に建築することができる。",{"qnum":3,"label":"4","title":"道路規制","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"地盤面下に設ける建築物＝地下街（地下商店街）をイメージしましょう。ほかにも、地下駐車場なども地盤面下に設けることができます。","pending":false}],["c3u3_4_1","店舗の用途に供する建築物で当該用途に供する部分の床面積の合計が20,000㎡であるものは、準工業地域においては建築することができるが、工業地域においては建築することができない。",{"qnum":4,"label":"1","title":"用途規制①","stem":"建築基準法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、用途地域以外の地域地区等の指定及び特定行政庁の許可は考慮しないものとする。","answer":"⭕正しい","explanation":"床面積の合計が10,000㎡を超える店舗は、準工業地域では建築できますが、工業地域では建築できません。","pending":false}],["c3u3_4_2","第一種住居地域において、カラオケボックスで当該用途に供する部分の床面積の合計が500㎡であるものは建築することができる。",{"qnum":4,"label":"2","title":"用途規制①","stem":"建築基準法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、用途地域以外の地域地区等の指定及び特定行政庁の許可は考慮しないものとする。","answer":"❌誤り","explanation":"第一種住居地域では、床面積に関係なく、カラオケボックスは建築できません。","pending":false}],["c3u3_4_3","建築物が第一種中高層住居専用地域と第二種住居地域にわたる場合で、当該建築物の敷地の過半が第二種住居地域内に存するときは、当該建築物に対して法第56条第１項第３号の規定による北側斜線制限は適用されない。",{"qnum":4,"label":"3","title":"用途規制①","stem":"建築基準法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、用途地域以外の地域地区等の指定及び特定行政庁の許可は考慮しないものとする。","answer":"❌誤り","explanation":"斜線制限では２以上の地域にまたがる場合、建物のどの部分が、どの用途地域にあるかで判断します。その過半で判断するのではないので、本肢の場合、第一種中高層住居専用地域の部分で北側高さ制限（北側斜線制限）が適用されます（444ページ）。","pending":false}],["c3u3_4_4","第一種中高層住居専用地域において、火葬場を新築しようとする場合には、都市計画により敷地の位置が決定されていれば新築することができる。",{"qnum":4,"label":"4","title":"用途規制①","stem":"建築基準法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、用途地域以外の地域地区等の指定及び特定行政庁の許可は考慮しないものとする。","answer":"❌誤り","explanation":"火葬場は原則、第一種中高層住居専用地域では建築できません。特定行政庁の許可があれば建築できますが、本肢にはそのような記述はないので、建築することはできず、誤りです。","pending":false}],["c3u3_5_1","第一種低層住居専用地域内においては、延べ面積の合計が60㎡であって、居住の用に供する部分が40㎡かつ、クリーニング取次店の用に供する延べ面積が20㎡である兼用住宅は、建築してはならない。",{"qnum":5,"label":"1","title":"用途規制②","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"第一種低層住居専用地域においては、一定の兼用住宅を建てることができます。本肢は延べ面積の1/2以上が居住用、かつ、クリーニング取次店の面積が20㎡ですので、兼用住宅の建築は認められます。","pending":false}],["c3u3_5_2","工業地域内においては、幼保連携型認定こども園を建築することができる。",{"qnum":5,"label":"2","title":"用途規制②","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"幼保連携型認定こども園は、保育所と同じ扱いとなるので、工業地域でも建築することができます。「幼稚園」と同じ扱いだと誤認すると、建築できないという解答になってしまうので、気をつけましょう。","pending":false}],["c3u3_5_3","都市計画において定められた建蔽率の限度が10分の８とされている地域外で、かつ、防火地域内にある準耐火建築物の建蔽率については、都市計画において定められた建蔽率の数値に10分の１を加えた数値が限度となる。",{"qnum":5,"label":"3","title":"用途規制②","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"防火地域内の準耐火建築物は10分の1を加えることができません。都市計画において定められた建蔽率の限度が8/10とされている地域外で、かつ、防火地域内にある耐火建築物の建蔽率については、都市計画において定められた建蔽率の数値に1/10を加えた数値が限度となります（437ページ）。","pending":false}],["c3u3_5_4","地方公共団体は、その敷地が袋路状道路にのみ接する一戸建ての住宅について、条例で、その敷地が接しなければならない道路の幅員に関し必要な制限を付加することができる。",{"qnum":5,"label":"4","title":"用途規制②","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"地方公共団体は、その敷地が袋路状道路にのみ接するもので、延べ面積が150㎡を超えるものについては、条例で、その敷地が接しなければならない道路の幅員に関し必要な制限を付加することができます。ただし、一戸建ての住宅については、除かれています。","pending":false}],["c3u3_6_1","建蔽率の限度が80％とされている防火地域内にある耐火建築物については、建蔽率による制限は適用されない。",{"qnum":6,"label":"1","title":"建蔽率と容積率①","stem":"建築物の建築面積の敷地面積に対する割合（以下この問において「建蔽率」という。）及び建築物の延べ面積の敷地面積に対する割合（以下この問において「容積率」という。）に関する次の記述のうち、建築基準法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"建蔽率の限度80％、防火地域内、耐火建築物、この条件を満たすものは、建蔽率の制限が適用されません。","pending":false}],["c3u3_6_2","建築物の敷地が、幅員15ｍ以上の道路（以下「特定道路」という。）に接続する幅員６ｍ以上12ｍ未満の前面道路のうち、当該特定道路からの延長が70ｍ以内の部分において接する場合における当該敷地の容積率の限度の算定に当たっては、当該敷地の前面道路の幅員は、当該延長及び前面道路の幅員を基に一定の計算により算定した数値だけ広いものとみなす。",{"qnum":6,"label":"2","title":"建蔽率と容積率①","stem":"建築物の建築面積の敷地面積に対する割合（以下この問において「建蔽率」という。）及び建築物の延べ面積の敷地面積に対する割合（以下この問において「容積率」という。）に関する次の記述のうち、建築基準法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"建築物の敷地が、幅員15ｍ以上の道路（特定道路）に接続する幅員６ｍ以上12ｍ未満の前面道路のうち、当該特定道路からの延長が70ｍ以内の部分において接する場合には、前面道路の幅員は、当該延長および前面道路の幅員を基に一定の計算により算定した数値だけ広いものとみなします（439ページ）。","pending":false}],["c3u3_6_3","容積率を算定する上では、共同住宅の共用の廊下及び階段部分は、当該共同住宅の延べ面積の３分の１を限度として、当該共同住宅の延べ面積に算入しない。",{"qnum":6,"label":"3","title":"建蔽率と容積率①","stem":"建築物の建築面積の敷地面積に対する割合（以下この問において「建蔽率」という。）及び建築物の延べ面積の敷地面積に対する割合（以下この問において「容積率」という。）に関する次の記述のうち、建築基準法の規定によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"共同住宅の共用の廊下又は、階段の用に供する部分の床面積は、延べ面積にすべて算入されません（439ページ）。","pending":false}],["c3u3_6_4","隣地境界線から後退して壁面線の指定がある場合において、当該壁面線を越えない建築物で、特定行政庁が安全上、防火上及び衛生上支障がないと認めて許可したものの建蔽率は、当該許可の範囲内において建蔽率による制限が緩和される。",{"qnum":6,"label":"4","title":"建蔽率と容積率①","stem":"建築物の建築面積の敷地面積に対する割合（以下この問において「建蔽率」という。）及び建築物の延べ面積の敷地面積に対する割合（以下この問において「容積率」という。）に関する次の記述のうち、建築基準法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"隣地境界線から後退して壁面線の指定がある場合、当該壁面線を越えない建築物で、特定行政庁が安全上、防火上及び衛生上支障がないと認めて許可したものは、建蔽率による制限が緩和されます。","pending":false}],["c3u3_7_1","第二種住居地域内において、工場に併設した倉庫であれば倉庫業を営む倉庫の用途に供してもよい。",{"qnum":7,"label":"1","title":"建蔽率と容積率②","stem":"建築基準法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、他の地域地区等の指定及び特定行政庁の許可については考慮しないものとする。","answer":"❌誤り","explanation":"第二種住居地域では、倉庫業を営む倉庫は建築できません。","pending":false}],["c3u3_7_2","法が施行された時点で現に建築物が並んでいる幅員４ｍ未満の道路は、特定行政庁の指定がなくとも法上の道路となる。",{"qnum":7,"label":"2","title":"建蔽率と容積率②","stem":"建築基準法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、他の地域地区等の指定及び特定行政庁の許可については考慮しないものとする。","answer":"❌誤り","explanation":"特定行政庁の指定がなければ、幅員４ｍ未満の道路は、法上の道路とはなりません。","pending":false}],["c3u3_7_3","容積率の制限は、都市計画において定められた数値によるが、建築物の前面道路（前面道路が２以上あるときは、その幅員の最大のもの。）の幅員が12ｍ未満である場合には、当該前面道路の幅員のメートルの数値に法第52条第２項各号に定められた数値を乗じたもの以下でなければならない。",{"qnum":7,"label":"3","title":"建蔽率と容積率②","stem":"建築基準法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、他の地域地区等の指定及び特定行政庁の許可については考慮しないものとする。","answer":"⭕正しい","explanation":"前面道路（前面道路が２つ以上あるときは、道路幅員が最大のもの）の幅員が12ｍ未満の場合、その前面道路の幅員（ｍ）に指定の数値（住居系4/10、住居系以外6/10）をかけたもの以下でなければなりません。そして、指定容積率と比べ、どちらか小さいほうの値がその土地の容積率となります。","pending":false}],["c3u3_7_4","建蔽率の限度が10分の８とされている地域内で、かつ、防火地域内にある耐火建築物については、建蔽率の限度が10分の９に緩和される。",{"qnum":7,"label":"4","title":"建蔽率と容積率②","stem":"建築基準法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、他の地域地区等の指定及び特定行政庁の許可については考慮しないものとする。","answer":"❌誤り","explanation":"建蔽率が10分の8とされている地域の防火地域内にある耐火建築物は、建蔽率の制限がなくなります。つまり、10分の10となり、敷地面積の100％まで建築可能になります。","pending":false}]]},{"id":"chapter3_review_4","title":"4 高さ制限・防火／準防火地域・建築確認・建築協定","group":"第3章 法令上の制限等｜復習問題","reviewChapter":3,"reviewUnit":4,"items":[["c3u4_1_1","道路斜線制限（建築基準法第56条第１項第１号の制限をいう。）は、用途地域の指定のない区域内については、適用されない。",{"qnum":1,"label":"1","title":"高さ制限①","stem":"建築物の高さの制限に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"道路斜線制限は、都市計画区域および準都市計画区域内のすべての区域に適用されます。よって、用途地域が定められていない区域でも適用されます。","pending":false}],["c3u4_1_2","隣地斜線制限（法第56条第１項第２号の制限をいう。）は、第一種低層住居専用地域、第二種低層住居専用地域、田園住居地域、第一種中高層住居専用地域及び第二種中高層住居専用地域内については、適用されない。",{"qnum":1,"label":"2","title":"高さ制限①","stem":"建築物の高さの制限に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"隣地斜線制限は、第一種・第二種中高層住居専用地域には適用されます。","pending":false}],["c3u4_1_3","北側斜線制限（法第56条第１項第３号の制限をいう。）は、第一種低層住居専用地域、第二種低層住居専用地域、田園住居地域、第一種中高層住居専用地域及び第二種中高層住居専用地域に限り、適用される。",{"qnum":1,"label":"3","title":"高さ制限①","stem":"建築物の高さの制限に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"北側斜線制限は、第一種低層住居専用地域、第二種低層住居専用地域、田園住居地域、第一種中高層住居専用地域及び第二種中高層住居専用地域に適用されます。","pending":false}],["c3u4_1_4","日影規制（法第56条の２の制限をいう。）は、商業地域内においても、適用される。",{"qnum":1,"label":"4","title":"高さ制限①","stem":"建築物の高さの制限に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"日影規制は、商業地域、工業地域、工業専用地域には適用されません。","pending":false}],["c3u4_2_1","区域内の土地においては、美容院の用途に供する部分の床面積の合計が100㎡である２階建ての美容院を建築することができない。",{"qnum":2,"label":"1","title":"高さ制限②","stem":"第二種低層住居専用地域に指定されている区域内の土地（以下この問において「区域内の土地」という。）に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。ただし、特定行政庁の許可については考慮しないものとする。","answer":"❌誤り","explanation":"第二種低層住居専用地域では、店舗の床面積の合計が150㎡以下かつ２階以下であれば建築できます。","pending":false}],["c3u4_2_2","区域内の土地においては、都市計画において建築物の外壁又はこれに代わる柱の面から敷地境界線までの距離の限度を２ｍ又は1.5ｍとして定めることができる。",{"qnum":2,"label":"2","title":"高さ制限②","stem":"第二種低層住居専用地域に指定されている区域内の土地（以下この問において「区域内の土地」という。）に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。ただし、特定行政庁の許可については考慮しないものとする。","answer":"❌誤り","explanation":"第一種・第二種低層住居専用地域と田園住居地域では、建築物の外壁またはこれに代わる柱の面から、敷地境界線までの距離の限度を1ｍまたは1.5ｍとして定めることができます。２ｍは定めることができません。","pending":false}],["c3u4_2_3","区域内の土地においては、高さが９ｍを超える建築物を建築することはできない。",{"qnum":2,"label":"3","title":"高さ制限②","stem":"第二種低層住居専用地域に指定されている区域内の土地（以下この問において「区域内の土地」という。）に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。ただし、特定行政庁の許可については考慮しないものとする。","answer":"❌誤り","explanation":"第一種・第二種低層住居専用地域と田園住居地域では、原則、建築物の高さが10ｍまたは12ｍまでに制限されます。よって、いずれを指定されても、９ｍ超だからといって建築できないわけではありません。","pending":false}],["c3u4_2_4","区域内の土地においては、建築物を建築しようとする際、当該建築物に対する建築基準法第56条第１項第２号のいわゆる隣地斜線制限の適用はない。",{"qnum":2,"label":"4","title":"高さ制限②","stem":"第二種低層住居専用地域に指定されている区域内の土地（以下この問において「区域内の土地」という。）に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。ただし、特定行政庁の許可については考慮しないものとする。","answer":"⭕正しい","explanation":"隣地斜線制限は、第一種・第二種低層住居専用地域と田園住居地域を除く地域で適用されますので、第二種低層住居専用地域は隣地斜線制限の適用はありません。","pending":false}],["c3u4_3_1","建築物が防火地域及び準防火地域にわたる場合、原則として、当該建築物の全部について防火地域内の建築物に関する規定が適用される。",{"qnum":3,"label":"1","title":"防火地域・準防火地域①","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"建築物が防火地域及び準防火地域にわたる場合、原則、その全部について防火地域の建築物に関する規定が適用されます。注意する点として、建築物が防火地域外において防火壁で区画されている場合は、その防火壁外の部分については、準防火地域の建築物に関する規定を適用します。","pending":false}],["c3u4_3_3","防火地域内において建築物の屋上に看板を設ける場合には、その主要な部分を難燃材料で造り、又は覆わなければならない。",{"qnum":3,"label":"3","title":"防火地域・準防火地域①","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"難燃材料ではなく、不燃材料で造り、または覆わなければなりません。","pending":false}],["c3u4_3_4","防火地域にある建築物は、外壁が耐火構造であっても、その外壁を隣地境界線に接して設けることはできない。",{"qnum":3,"label":"4","title":"防火地域・準防火地域①","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"防火地域にある建築物で、外壁が耐火構造であれば、その外壁を隣地境界線に接して設けることができます。準防火地域にある建築物も同様です。","pending":false}],["c3u4_4_1","防火地域内にある建築物に付属する高さ1.5ｍの門は、必ず延焼防止上支障のない構造としなければならない。",{"qnum":4,"label":"1","title":"防火地域・準防火地域②","stem":"防火地域又は準防火地域に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"防火地域内にある建築物でも、高さ２ｍ以下の門と塀は、延焼防止上支障のない構造にする必要はありません。","pending":false}],["c3u4_4_2","準防火地域内にある木造建築物の外壁及びその軒裏で延焼のおそれのある部分は、防火性能に関する技術的基準に適合しなければならない。",{"qnum":4,"label":"2","title":"防火地域・準防火地域②","stem":"防火地域又は準防火地域に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"準防火地域内にある木造建築物の外壁及びその軒裏で延焼のおそれのある部分は、防火性能に関する技術的基準に適合するものでなければなりません。","pending":false}],["c3u4_4_3","建築物が防火地域及び準防火地域にわたる場合においては、その全部について準防火地域内の建築物に関する規定が適用される。",{"qnum":4,"label":"3","title":"防火地域・準防火地域②","stem":"防火地域又は準防火地域に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"建築物が防火地域及び準防火地域にわたる場合は、厳しいほうの規定が適用されるので、防火地域の規定となります。","pending":false}],["c3u4_4_4","防火地域又は準防火地域以外においても、建築物の高さが15ｍを超える建築物は、必ず耐火建築物等又は準耐火建築物等としなければならない。",{"qnum":4,"label":"4","title":"防火地域・準防火地域②","stem":"防火地域又は準防火地域に関する次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"防火地域または準防火地域以外において、地階を除く階数が４以上、高さ16ｍ超、延べ面積3,000㎡超の建築物は、原則、主要構造部を耐火構造または準耐火構造としなければなりませんが、高さ15ｍ超は規制の対象になりません。","pending":false}],["c3u4_5_1","階数２の木造建築物を改築する場合、改築に係る部分の床面積が200㎡のときでも、建築確認を受けなければならない。",{"qnum":5,"label":"1","title":"建築確認①","stem":"建築基準法の確認に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"床面積が200㎡を超えていない場合でも、階数２以上であれば、建築確認を受けなければなりません。","pending":false}],["c3u4_5_2","延べ面積が250㎡の下宿の用途に供する建築物を寄宿舎に用途変更する場合、建築確認を受ける必要はない。",{"qnum":5,"label":"2","title":"建築確認①","stem":"建築基準法の確認に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"下宿から寄宿舎への用途変更は、類似の用途変更に該当するため、建築確認は不要です。","pending":false}],["c3u4_5_3","都市計画区域内（都道府県知事が都道府県都市計画審議会の意見を聴いて指定する区域を除く。）において、延べ面積が10㎡の倉庫を新築する場合、建築確認を受けなければならない。",{"qnum":5,"label":"3","title":"建築確認①","stem":"建築基準法の確認に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"都市計画区域内で、建築物を新築する場合は、その用途、規模を問わず、建築確認が必要です。","pending":false}],["c3u4_6_1","建築確認を申請しようとする建築主は、あらかじめ、当該確認に係る建築物の所在地を管轄する消防長又は消防署長の同意を得ておかなければならない。",{"qnum":6,"label":"1","title":"建築確認②","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"消防長または消防署長の同意を得るのは、建築主事等です。","pending":false}],["c3u4_6_2","建築主は、工事を完了した場合においては、工事が完了した日から３日以内に到達するように、建築主事等に文書をもって届け出なければならない。",{"qnum":6,"label":"2","title":"建築確認②","stem":"建築基準法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"工事が完了した日から４日以内に到達するように、建築主事等に文書をもって工事完了検査の申請をしなければなりません。","pending":false}],["c3u4_7_3","建築協定は、建築物の敷地、位置及び構造に関して定めることができるが、用途に関しては定めることができない。",{"qnum":7,"label":"3","title":"建築協定","stem":"建築基準法の建築協定に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"用途についても建築協定で定めることができます。ほかにも、形態、意匠、建築設備に関する基準についても定めることができます。","pending":false}]]}];

const chapter3ReviewSectionsStage3 = [{"id":"chapter3_review_5","title":"5 土地区画整理法","group":"第3章 法令上の制限等｜復習問題","reviewChapter":3,"reviewUnit":5,"items":[["c3u5_1_1","組合は、事業の完成により解散しようとする場合においては、都道府県知事の認可を受けなければならない。",{"qnum":1,"label":"1","title":"土地区画整理事業の施行者①","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。なお、この問において「組合」とは、土地区画整理組合をいう。","answer":"⭕正しい","explanation":"組合は、事業の完成により解散しようとする場合、都道府県知事の認可を受けなければなりません。","pending":false}],["c3u5_1_2","施行地区内の宅地について組合員の有する所有権の全部又は一部を承継した者がある場合においては、その組合員がその所有権の全部又は一部について組合に対して有する権利義務は、その承継した者に移転する。",{"qnum":1,"label":"2","title":"土地区画整理事業の施行者①","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。なお、この問において「組合」とは、土地区画整理組合をいう。","answer":"⭕正しい","explanation":"施行地区内の宅地の所有権を組合員から承継した場合は、その組合員が有していた権利義務は承継した者に移転します。","pending":false}],["c3u5_1_3","組合を設立しようとする者は、事業計画の決定に先立って組合を設立する必要があると認める場合においては、7人以上共同して、定款及び事業基本方針を定め、その組合の設立について都道府県知事の認可を受けることができる。",{"qnum":1,"label":"3","title":"土地区画整理事業の施行者①","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。なお、この問において「組合」とは、土地区画整理組合をいう。","answer":"⭕正しい","explanation":"組合は原則7人以上が共同して定款および事業計画を定めた上で都道府県知事の認可を受けることにより設立します。ですが、事業計画の決定に先立って組合を設立する必要があると認める場合には、事業計画ではなく事業基本方針を定めることで都道府県知事の認可を受けることができます。","pending":false}],["c3u5_1_4","組合が施行する土地区画整理事業に係る施行地区内の宅地について借地権のみを有する者は、その組合の組合員とはならない。",{"qnum":1,"label":"4","title":"土地区画整理事業の施行者①","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。なお、この問において「組合」とは、土地区画整理組合をいう。","answer":"❌誤り","explanation":"施行地区内の宅地の所有者、借地権者は全員、組合員となります。","pending":false}],["c3u5_2_3","施行者は、換地処分の公告があった場合においては、直ちに、その旨を換地計画に係る区域を管轄する登記所に通知しなければならない。",{"qnum":2,"label":"3","title":"土地区画整理事業の施行者②","stem":"土地区画整理法（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"換地処分の公告があった場合、施行者は直ちに、その旨を換地計画に係る区域を管轄する登記所に通知しなければなりません。","pending":false}],["c3u5_2_4","市町村が施行する土地区画整理事業では、事業ごとに、市町村に土地区画整理審議会が設置され、換地計画、仮換地の指定及び減価補償金の交付に関する事項について法に定める権限を行使する。",{"qnum":2,"label":"4","title":"土地区画整理事業の施行者②","stem":"土地区画整理法（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"公的施行である、市町村が施行する土地区画整理事業では、事業ごとに土地区画整理審議会が設置されます。そこでは、換地計画、仮換地の指定および減価補償金の交付に関する事項について法に定める権限を行使します。","pending":false}],["c3u5_3_3","土地区画整理組合の設立の認可の公告があった日後、換地処分の公告がある日までは、施行地区内において、土地区画整理事業の施行の障害となるおそれがある土地の形質の変更を行おうとする者は、当該土地区画整理組合の許可を受けなければならない。",{"qnum":3,"label":"3","title":"建築行為の制限等","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"土地区画整理組合の許可ではなく、国土交通大臣もしくは都道府県知事等の許可を受けなければなりません。例題3で学習した施行地区内の建築制限の問題は、誰の許可を受けるかがよく出題されますので、覚えておきましょう。","pending":false}],["c3u5_3_4","土地区画整理組合の組合員は、組合員の3分の1以上の連署をもって、その代表者から理由を記載した書面を土地区画整理組合に提出して、理事又は監事の解任を請求することができる。",{"qnum":3,"label":"4","title":"建築行為の制限等","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"土地区画整理組合の組合員は、組合員の3分の1以上の連署をもって、その代表者から理由を記載した書面を土地区画整理組合に提出することにより、理事または監事の解任の請求ができます。","pending":false}],["c3u5_4_1","土地区画整理組合の設立の認可の公告があった日後、換地処分の公告がある日までは、施行地区内において、土地区画整理事業の施行の障害となるおそれがある土地の形質の変更を行おうとする者は、当該土地区画整理組合の許可を受けなければならない。",{"qnum":4,"label":"1","title":"換地計画","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"土地区画整理組合の許可ではなく、国土交通大臣または都道府県知事等の許可です。例題3で学習した施行地区内の建築制限の問題は、誰の許可を受けるかがよく出題されますので、覚えておきましょう。","pending":false}],["c3u5_4_2","公共施設の用に供している宅地に対しては、換地計画において、その位置、地積等に特別の考慮を払い、換地を定めることができる。",{"qnum":4,"label":"2","title":"換地計画","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"公共施設の用に供している宅地に対しては、換地計画において、その位置、地積等に特別の考慮を払い、換地を定めることができます。ほかにも、鉄道、学校、病院、養護老人ホームなども同じく、特別の考慮を払い、換地を定めることができます。","pending":false}],["c3u5_4_3","区画整理会社が施行する土地区画整理事業の換地計画においては、土地区画整理事業の施行の費用に充てるため、一定の土地を換地として定めないで、その土地を保留地として定めることができる。",{"qnum":4,"label":"3","title":"換地計画","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"区画整理会社が施行する土地区画整理事業の換地計画においては、土地区画整理事業の施行の費用に充てるため、一定の土地を換地として定めないで、その土地を保留地として定めることができます。個人施行者、土地区画整理組合も同様です。","pending":false}],["c3u5_4_4","個人施行者は、換地処分を行う前において、換地計画に基づき換地処分を行うため必要がある場合においては、施行地区内の宅地について仮換地を指定することができる。",{"qnum":4,"label":"4","title":"換地計画","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"土地区画整理事業の施行者（個人施行者を含む）は、換地処分を行う前において、換地計画に基づいて換地処分を行うために必要がある場合においては、施行地区内の宅地について仮換地を指定することができます。","pending":false}],["c3u5_5_1","施行者は、換地処分を行う前において、換地計画に基づき換地処分を行うため必要がある場合においては、施行地区内の宅地について仮換地を指定することができる。",{"qnum":5,"label":"1","title":"仮換地の指定とその効果","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"施行者は、換地処分を行う前において、換地計画に基づき換地処分を行うために必要がある場合においては、施行地区内の宅地について仮換地を指定することができます。","pending":false}],["c3u5_5_2","仮換地が指定された場合において、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地の指定の効力発生の日から換地処分の公告がある日まで、仮換地について、従前の宅地について有する権利の内容である使用又は収益と同じ使用又は収益をすることができる。",{"qnum":5,"label":"2","title":"仮換地の指定とその効果","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"仮換地が指定されて指定の効力が発生した後からは、使用・収益が従前の宅地と同様に可能です。","pending":false}],["c3u5_5_3","施行者は、仮換地を指定した場合において、特別の事情があるときは、その仮換地について使用又は収益を開始することができる日を仮換地の指定の効力発生日と別に定めることができる。",{"qnum":5,"label":"3","title":"仮換地の指定とその効果","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"施行者は、仮換地を指定した場合、特別の事情があるときは、その仮換地について使用または収益を開始することができる日を、仮換地の指定の効力発生日とは別に定めることができます。","pending":false}],["c3u5_6_1","換地処分は、施行者が換地計画において定められた関係事項を公告してするものとされている。",{"qnum":6,"label":"1","title":"換地処分とその効果①","stem":"土地区画整理事業の換地処分に関する次の記述のうち、土地区画整理法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"施行者は換地計画において定められた関係事項を、関係権利者に通知します。公告ではありません。公告は都道府県知事等が行います。","pending":false}],["c3u5_6_2","施行地区内の宅地について存する地役権は、行使する利益がなくなった場合を除き、換地処分に係る公告があった日の翌日以後においても、なお従前の宅地の上に存する。",{"qnum":6,"label":"2","title":"換地処分とその効果①","stem":"土地区画整理事業の換地処分に関する次の記述のうち、土地区画整理法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"施行地区内の宅地に存する地役権は、換地処分の公告があった日の翌日以後においても、なお従前の宅地の上に残ります。ただし、行使する利益がなくなった地役権は、換地処分の公告があった日が終了した時において消滅します。","pending":false}],["c3u5_6_4","土地区画整理事業の施行により生じた公共施設の用に供する土地は、換地処分に係る公告があった日の翌日において、すべて市町村の管理に属する。",{"qnum":6,"label":"4","title":"換地処分とその効果①","stem":"土地区画整理事業の換地処分に関する次の記述のうち、土地区画整理法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"土地区画整理事業の施行により生じた公共施設の土地は、原則、市町村の管理となりますが、すべてではありません。ほかの法令等に別段の定めがある場合は、その公共施設を管理すべき者に帰属します。","pending":false}],["c3u5_7_2","現に施行されている土地区画整理事業の施行地区となっている区域については、その施行者の同意を得なければ、その施行者以外の者は、土地区画整理事業を施行することができない。",{"qnum":7,"label":"2","title":"換地処分とその効果②","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"同じ区域内での複数の土地区画整理事業の実施を防ぐため、現に施行されている土地区画整理事業の施行者の同意を得なければ、その事業は施行できません。","pending":false}],["c3u5_7_3","施行者は、換地処分の公告があった場合において、施行地区内の土地及び建物について土地区画整理事業の施行により変動があったときは、遅滞なく、その変動に係る登記を申請し、又は嘱託しなければならない。",{"qnum":7,"label":"3","title":"換地処分とその効果②","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"換地処分の公告後は遅滞なく、その変動に係る登記を申請しなければなりません。土地区画整理の登記は施行者によって一括して申請され、この変動に係る登記をしたあとでないと、原則として施行者以外の者は登記を行うことはできません。","pending":false}],["c3u5_7_4","土地区画整理組合は、仮換地を指定しようとする場合においては、あらかじめ、その指定について、土地区画整理審議会の同意を得なければならない。",{"qnum":7,"label":"4","title":"換地処分とその効果②","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"土地区画整理審議会は公的施行の場合のみに置かれます。","pending":false}]]}];

const chapter3ReviewSectionsStage4 = [{"id":"chapter3_review_6","title":"6 国土利用計画法・農地法・盛土規制法","group":"第3章 法令上の制限等｜復習問題","reviewChapter":3,"reviewUnit":6,"items":[["c3u6_1_1","宅地建物取引業者Aが所有する市街化区域内の1,500㎡の土地について、宅地建物取引業者Bが購入する契約を締結した場合、Bは、その契約を締結した日から起算して2週間以内に事後届出を行わなければならない。",{"qnum":1,"label":"1","title":"国土利用計画法①","stem":"国土利用計画法第23条に基づく都道府県知事への届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"市街化区域の事後届出が必要な面積要件は、2,000㎡以上ですので、Bは事後届出は不要です。","pending":false}],["c3u6_1_2","甲市が所有する市街化調整区域内の12,000㎡の土地について、宅地建物取引業者Cが購入する契約を締結した場合、Cは、その契約を締結した日から起算して2週間以内に事後届出を行わなければならない。",{"qnum":1,"label":"2","title":"国土利用計画法①","stem":"国土利用計画法第23条に基づく都道府県知事への届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"取引の当事者の一方、または双方が国や地方公共団体等の場合は、届出不要です。","pending":false}],["c3u6_1_3","個人Dが所有する市街化調整区域内の6,000㎡の土地について、宅地建物取引業者Eが購入する契約を締結した場合、Eは、その契約を締結した日から起算して2週間以内に事後届出を行わなければならない。",{"qnum":1,"label":"3","title":"国土利用計画法①","stem":"国土利用計画法第23条に基づく都道府県知事への届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"市街化調整区域の事後届出が必要な面積要件は、5,000㎡以上ですので、Eは事後届出を行わなければなりません。","pending":false}],["c3u6_1_4","個人Fが所有する都市計画区域外の30,000㎡の土地について、その子Gが相続した場合、Gは、相続した日から起算して2週間以内に事後届出を行わなければならない。",{"qnum":1,"label":"4","title":"国土利用計画法①","stem":"国土利用計画法第23条に基づく都道府県知事への届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"相続によって土地を取得した場合は、事後届出は不要です。契約性、権利性、対価性を満たす土地取引が事後届出の対象です。該当しないものは、面積要件が該当していても、事後届出は不要になります。","pending":false}],["c3u6_2_1","土地売買等の契約を締結した場合には、当事者のうち当該契約による権利取得者は、その契約を締結した日の翌日から起算して3週間以内に、事後届出を行わなければならない。",{"qnum":2,"label":"1","title":"国土利用計画法②","stem":"国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"事後届出は契約締結日から起算して2週間以内に行います。翌日から起算するのではありませんし、3週間以内でもありません。","pending":false}],["c3u6_2_2","都道府県知事は、事後届出をした者に対し、その届出に係る土地に関する権利の移転若しくは設定後における土地の利用目的又は土地に関する権利の移転若しくは設定の対価の額について、当該土地を含む周辺の地域の適正かつ合理的な土地利用を図るために必要な助言をすることができる。",{"qnum":2,"label":"2","title":"国土利用計画法②","stem":"国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"都道府県知事は、土地の利用目的について助言・勧告ができますが、対価の額についてはできません。","pending":false}],["c3u6_2_4","宅地建物取引業者Aが所有する準都市計画区域内の20,000㎡の土地について、10,000㎡をB市に、10,000㎡を宅地建物取引業者Cに売却する契約を締結した場合、B市は事後届出を行う必要はないが、Cは一定の場合を除き事後届出を行う必要がある。",{"qnum":2,"label":"4","title":"国土利用計画法②","stem":"国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"準都市計画区域内においては、10,000㎡以上の土地取引をした場合、その買主は事後届出が必要となります。ですが、当事者の一方または双方が国・地方公共団体等である場合は、事後届出は不要となります。よって、B市は事後届出不要ですが、Cは一定の場合を除き事後届出が必要です。","pending":false}],["c3u6_3_1","都市計画区域外において、A市が所有する面積15,000㎡の土地を宅地建物取引業者Bが購入した場合、Bは事後届出を行わなければならない。",{"qnum":3,"label":"1","title":"国土利用計画法③","stem":"国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"当事者の一方、または双方が国・地方公共団体等の場合、届出不要です。「都市計画区域外の10,000㎡以上」だけで判断しないようにしましょう。","pending":false}],["c3u6_3_2","事後届出において、土地売買等の契約に係る土地の土地に関する権利の移転又は設定の対価の額については届出事項ではない。",{"qnum":3,"label":"2","title":"国土利用計画法③","stem":"国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"対価の額も届出事項です。①当事者の氏名、②契約を締結した年月日、③土地の所在及び面積、④権利の種別及び内容、⑤土地の利用目的等も届出が必要です。","pending":false}],["c3u6_3_3","市街化区域を除く都市計画区域内において、一団の土地である甲土地（C所有、面積3,500㎡）と乙土地（D所有、面積2,500㎡）を宅地建物取引業者Eが購入した場合、Eは事後届出を行わなければならない。",{"qnum":3,"label":"3","title":"国土利用計画法③","stem":"国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"市街化区域を除く都市計画区域（市街化調整区域・非線引き区域）の事後届出の面積要件は、5,000㎡以上です。「甲土地（3,500㎡）＋乙土地（2,500㎡）＝6,000㎡」で、権利取得者（買主：E）は面積要件に該当します。よって事後届出が必要です。","pending":false}],["c3u6_3_4","都道府県知事は、土地利用審査会の意見を聴いて、事後届出をした者に対し、当該事後届出に係る土地の利用目的について必要な変更をすべきことを勧告することができ、勧告を受けた者がその勧告に従わない場合、その勧告に反する土地売買等の契約を取り消すことができる。",{"qnum":3,"label":"4","title":"国土利用計画法③","stem":"国土利用計画法第23条の届出（以下この問において「事後届出」という。）に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"勧告に従わない場合、都道府県知事は、その旨および勧告内容を公表できますが、罰則はなく、契約も有効です。","pending":false}],["c3u6_4_1","監視区域内において一定規模以上の面積の土地売買等の契約を締結した場合には、契約締結後2週間以内に届出をしなければならない。",{"qnum":4,"label":"1","title":"国土利用計画法④","stem":"国土利用計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"売買契約を行う前に、都道府県知事へ届出をしなければなりません。","pending":false}],["c3u6_4_2","市町村長は、当該市町村の区域のうち、国土交通大臣が定める基準に該当し、地価の上昇によって適正かつ合理的な土地利用の確保に支障を生ずるおそれがあると認められる区域を、期間を定めて、注視区域として指定することができる。",{"qnum":4,"label":"2","title":"国土利用計画法④","stem":"国土利用計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"注視区域を指定できるのは都道府県知事です。監視区域も同様です。","pending":false}],["c3u6_4_3","監視区域内において国土利用計画法の規定に違反して必要な届出をせず、土地売買等の契約を締結した場合には、6月以下の拘禁刑又は100万円以下の罰金に処せられる。",{"qnum":4,"label":"3","title":"国土利用計画法④","stem":"国土利用計画法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"監視区域内で必要な事前届出をせず、土地売買等の契約を締結した場合は、罰則があります。6か月以下の拘禁刑または100万円以下の罰金に処せられます。","pending":false}],["c3u6_4_4","注視区域内においては、都道府県の規則で定める面積以上の土地売買等の契約を締結する場合に届出が必要である。",{"qnum":4,"label":"4","title":"国土利用計画法④","stem":"国土利用計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"注視区域で事前届出が必要となる面積は、事後届出の面積要件と同じです。これは監視区域の説明で、監視区域では都道府県の規則で定める面積以上の土地売買等の契約を締結する場合に事前届出が必要です。","pending":false}],["c3u6_5_2","法第3条第1項又は第5条第1項の許可が必要な農地の売買について、これらの許可を受けずに売買契約を締結しても、その所有権は移転しない。",{"qnum":5,"label":"2","title":"農地法①","stem":"農地法（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"3条許可や5条許可を受けずに売買契約をしても、所有権は移転しません。","pending":false}],["c3u6_5_3","市街化区域内の農地について、あらかじめ農業委員会に届け出てその所有者が自ら駐車場に転用する場合には、法第4条第1項の許可を受ける必要はない。",{"qnum":5,"label":"3","title":"農地法①","stem":"農地法（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"市街化区域は市街化を促進したい区域ですので、農地以外のものにする場合は、許可ではなく、農業委員会への届出だけでOKです。","pending":false}],["c3u6_5_4","砂利採取法による認可を受けた砂利採取計画に従って砂利を採取するために農地を一時的に貸し付ける場合には、法第5条第1項の許可を受ける必要はない。",{"qnum":5,"label":"4","title":"農地法①","stem":"農地法（以下この問において「法」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"農地を農地以外のものにするために貸し付ける場合は、一時的に貸し付ける場合も含めて転用目的の権利移動になります。よって5条許可が必要です。","pending":false}],["c3u6_6_1","市街化区域内において4ヘクタールを超える農地を住宅建設のために取得する場合には、農林水産大臣へ農地法第5条の届出をする必要がある。",{"qnum":6,"label":"1","title":"農地法②","stem":"農地法に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"市街化区域内で農地を転用目的で取得する場合は農業委員会へ5条届出が必要です。","pending":false}],["c3u6_6_3","都道府県が農林水産省令で定める農業振興上の必要性が高いと認められる施設の用に供するために、農地を取得する場合には、農地法の許可を受ける必要はない。",{"qnum":6,"label":"3","title":"農地法②","stem":"農地法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"都道府県が農業振興上の必要性が高いと認められる施設のために農地を取得する場合は、農地法の許可は不要です。","pending":false}],["c3u6_6_4","農家が農業用施設に転用する目的で1アールの農地を取得する場合には、農地法第5条の許可を受ける必要がある。",{"qnum":6,"label":"4","title":"農地法②","stem":"農地法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"選択肢の通り、権利移動＋転用ですので、5条許可が必要です。","pending":false}],["c3u6_7_2","採草放牧地の所有者がその土地に500㎡の農業用施設を建設する場合、農地法第4条の許可を受けなければならない。",{"qnum":7,"label":"2","title":"農地法③","stem":"農地法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"農地法第4条では、採草放牧地を採草放牧地以外の土地に転用する場合は、許可不要です。","pending":false}],["c3u6_7_3","建設業者が、工事終了後農地に復元して返還する条件で、市街化調整区域内の農地を6か月間資材置場として借り受けた場合、農地法第5条の許可を受ける必要はない。",{"qnum":7,"label":"3","title":"農地法③","stem":"農地法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"農地以外に転用する場合は、一時的な使用目的でも許可が必要です。また、賃借権などの使用収益権の設定は、権利移動に該当します。よって、転用＋権利移動となり、5条許可が必要です。","pending":false}],["c3u6_8_1","農地の賃貸借及び使用貸借は、その登記がなくても農地の引渡しがあったときは、これをもってその後にその農地について所有権を取得した第三者に対抗することができる。",{"qnum":8,"label":"1","title":"農地法④","stem":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"農地の賃貸借であれば、引渡しがあれば登記がなくても第三者に対抗することができます。しかし、使用貸借では第三者に対抗できません。","pending":false}],["c3u6_8_3","法第4条第1項、第5条第1項の違反について原状回復等の措置に係る命令の対象となる者（違反転用者等）には、当該規定に違反した者又はその一般承継人は含まれるが、当該違反に係る土地について工事を請け負った者は含まれない。",{"qnum":8,"label":"3","title":"農地法④","stem":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"違反に係る土地について工事を請け負った者に対しても、原状回復措置を命じることができます。一般承継人も解法のポイントにある解説の通りです。","pending":false}],["c3u6_8_4","法の適用については、土地の面積は、登記簿の地積によることとしているが、登記簿の地積が著しく事実と相違する場合及び登記簿の地積がない場合には、実測に基づき農業委員会が認定したところによる。",{"qnum":8,"label":"4","title":"農地法④","stem":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"登記簿の地積が著しく事実と相違する場合や、登記簿の地積がない場合には、実測に基づき、農業委員会が認定した面積となります。","pending":false}],["c3u6_9_1","宅地造成とは、宅地以外の土地を宅地にするために行う盛土その他の土地の形質の変更で政令で定めるものをいう。",{"qnum":9,"label":"1","title":"盛土規制法①","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市、特例市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"宅地造成とは、宅地以外の土地を宅地にするために行う、盛土その他の土地の形質変更で政令で定めるものをいいます。","pending":false}],["c3u6_9_2","都道府県知事は、宅地造成等工事規制区域内において行われる宅地造成等に関する工事についての許可に、当該工事の施行に伴う災害の防止その他良好な都市環境の形成のために必要と認める場合にあっては、条件を付することができる。",{"qnum":9,"label":"2","title":"盛土規制法①","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市、特例市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"盛土規制法は、宅地造成に伴う災害を防止するための法律です。よって、「良好な都市環境の形成のために」という目的で条件を付することはできません。災害を防止するために必要と認める場合に条件を付することができます。","pending":false}],["c3u6_9_3","宅地以外の土地を宅地にするための切土であって、当該切土を行う土地の面積が400㎡であり、かつ、高さが1ｍのがけを生ずることとなる土地の形質の変更は、宅地造成に該当しない。",{"qnum":9,"label":"3","title":"盛土規制法①","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市、特例市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"本肢の土地の形質の変更は宅地造成に該当しません。切土で２ｍ超のがけ、面積が500㎡超であれば、宅地造成に該当します。","pending":false}],["c3u6_9_4","宅地以外の土地を宅地にするための盛土であって、当該盛土を行う土地の面積が800㎡であり、かつ、高さが90cmのがけを生ずることとなる土地の形質の変更は、宅地造成に該当する。",{"qnum":9,"label":"4","title":"盛土規制法①","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問における都道府県知事とは、地方自治法に基づく指定都市、中核市、特例市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"面積が500㎡を超える土地の形質の変更になるので、宅地造成に該当します。","pending":false}],["c3u6_10_3","宅地造成等工事規制区域内において、公共施設用地を宅地又は農地等に転用する者は、宅地造成に関する工事を行わない場合でも、都道府県知事の許可を受けなければならない。",{"qnum":10,"label":"3","title":"盛土規制法②","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"宅地造成等工事規制区域内において、公共施設用地を宅地または農地等に転用する者は、宅地造成等に関する工事を行わない場合、許可を受ける必要はありません。転用した日から14日以内に、その旨を都道府県知事に届出をすればよいとなっています。","pending":false}],["c3u6_10_4","宅地造成等に関する工事の許可を受けた者が、工事施行者を変更する場合には、遅滞なくその旨を都道府県知事に届け出ればよく、改めて許可を受ける必要はない。",{"qnum":10,"label":"4","title":"盛土規制法②","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"工事の計画や内容等が変わるようであれば、再度、都道府県知事の許可を受ける必要がありますが、工事施行者を変更するだけであれば、工事の計画や内容等が変わるわけではありませんので、遅滞なく都道府県知事に届出すればよいとなっています。","pending":false}],["c3u6_11_3","工事主は、宅地造成等工事規制区域内において行われる宅地造成等に関する工事について、工事着手後2週間以内に、宅地造成等に関する工事の施行に係る土地の周辺地域の住民に対し、説明会の開催その他の当該宅地造成等に関する工事の内容を周知させるため必要な措置を講じなければならない。",{"qnum":11,"label":"3","title":"盛土規制法③","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市及び中核市にあってはその長をいうものとし、地方自治法に基づく施行時特例市に係る経過措置については考慮しないものとする。","answer":"❌誤り","explanation":"工事着手後２週間以内ではありません。あらかじめ、土地の周辺地域の住民に対し、説明会の開催その他の当該宅地造成等に関する工事の内容を周知させるための必要な措置を講じなければなりません（498ページ）。","pending":false}],["c3u6_11_4","特定盛土等規制区域内において行われる特定盛土等又は土石の堆積に関する工事については、工事主は、当該工事に着手する日の30日前までに、主務省令で定めるところにより、当該工事の計画を都道府県知事に届け出なければならない。ただし、特定盛土等又は土石の堆積に伴う災害の発生のおそれがないと認められるものとして政令で定める工事については、この限りでない。",{"qnum":11,"label":"4","title":"盛土規制法③","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、正しいものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市及び中核市にあってはその長をいうものとし、地方自治法に基づく施行時特例市に係る経過措置については考慮しないものとする。","answer":"⭕正しい","explanation":"特定盛土等規制区域内で特定盛土等または土石の堆積に関する工事をする場合、政令で定める一定の場合を除き、工事主は、工事着手の30日前までに、都道府県知事に届け出なければなりません。","pending":false}],["c3u6_12_4","都道府県知事は、関係市町村長の意見を聴いて、宅地造成等工事規制区域内で、宅地造成又は宅地において行う特定盛土等に伴う災害で相当数の居住者等に危害を生ずるものの発生のおそれが大きい一団の造成宅地の区域であって一定の基準に該当するものを、造成宅地防災区域として指定することができる。",{"qnum":12,"label":"4","title":"盛土規制法④","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び特例市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"造成宅地防災区域は、宅地造成等工事規制区域に指定されていない区域で指定することができます。","pending":false}],["c3u6_13_1","土砂災害警戒区域等における土砂災害防止対策の推進に関する法律によれば、土砂災害特別警戒区域内において都市計画法上の一定の開発行為をしようとする者は、原則として市町村長の許可を受けなければならない。",{"qnum":13,"label":"1","title":"その他の法令上の制限","stem":"次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"土砂災害警戒区域等における土砂災害防止対策の推進に関する法律の場合、市町村長の許可ではなく、都道府県知事の許可です。","pending":false}],["c3u6_13_2","海岸法によれば、海岸保全区域内において土石の採取等の行為をしようとする者は、原則として海岸管理者の許可を受けなければならない。",{"qnum":13,"label":"2","title":"その他の法令上の制限","stem":"次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"海岸法の場合、海岸管理者の許可が必要です。","pending":false}],["c3u6_13_3","都市緑地法によれば、特別緑地保全地区内で建築物の新築、改築等の行為をしようとする者は、原則として都道府県知事の許可を受けなければならない。",{"qnum":13,"label":"3","title":"その他の法令上の制限","stem":"次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"都市緑地法の場合、都道府県知事の許可が必要です。","pending":false}],["c3u6_13_4","急傾斜地の崩壊による災害の防止に関する法律によれば、急傾斜地崩壊危険区域内において水を放流し、又は停滞させる等の行為をしようとする者は、原則として都道府県知事の許可を受けなければならない。",{"qnum":13,"label":"4","title":"その他の法令上の制限","stem":"次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"急傾斜地の崩壊による災害の防止に関する法律の場合、都道府県知事の許可が必要です。","pending":false}]]}];

const chapter3ReviewSectionsStage5=[{"id":"chapter3_review_7","title":"7 不動産取得税・固定資産税","group":"第3章 法令上の制限等｜復習問題","reviewChapter":3,"reviewUnit":7,"items":[["c3u7_1_1","不動産取得税の徴収については、特別徴収の方法によることができる。",{"qnum":1,"label":"1","title":"不動産取得税①","stem":"不動産取得税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"不動産取得税の徴収方法は普通徴収です。","pending":false}],["c3u7_1_2","不動産取得税は、目的税である。",{"qnum":1,"label":"2","title":"不動産取得税①","stem":"不動産取得税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"不動産取得税は普通税です。","pending":false}],["c3u7_1_3","不動産取得税は、不動産の取得に対し、当該不動産所在の市町村及び特別区において、当該不動産の取得者に課する。",{"qnum":1,"label":"3","title":"不動産取得税①","stem":"不動産取得税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"不動産取得税は不動産の所在する都道府県において、当該不動産の取得者に課される税金です。","pending":false}],["c3u7_1_4","不動産取得税は、市町村及び特別区に対して、課することができない。",{"qnum":1,"label":"4","title":"不動産取得税①","stem":"不動産取得税に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"不動産取得税は、国や都道府県、市町村、特別区に対して、課することができません。","pending":false}],["c3u7_2_1","令和8年に新築された既存住宅（床面積210㎡）を個人が自己の居住のために取得した場合、当該取得に係る不動産取得税の課税標準の算定については、当該住宅の固定資産課税台帳に登録されている価格から1,200万円が控除される。",{"qnum":2,"label":"1","title":"不動産取得税②","stem":"不動産取得税に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"新築された既存住宅（床面積が50㎡以上240㎡以下）を、個人が自己の居住のために取得した場合、1,200万円が控除されます。","pending":false}],["c3u7_2_2","家屋が新築された日から3年を経過して、なお、当該家屋について最初の使用又は譲渡が行われない場合においては、当該家屋が新築された日から3年を経過した日において家屋の取得がなされたものとみなし、当該家屋の所有者を取得者とみなして、これに対して不動産取得税を課する。",{"qnum":2,"label":"2","title":"不動産取得税②","stem":"不動産取得税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"新築された日から６か月を経過した日において家屋の取得がなされたものとみなします。３年ではありません（506ページ）。","pending":false}],["c3u7_2_3","不動産取得税は、不動産の取得があった日の翌日から起算して2か月以内に当該不動産の所在する都道府県に申告納付しなければならない。",{"qnum":2,"label":"3","title":"不動産取得税②","stem":"不動産取得税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"不動産取得税は、送付される納付書で納税する普通徴収です。","pending":false}],["c3u7_2_4","不動産取得税は、不動産を取得するときに比較的担税力のある機会に相当の税負担を求める観点から創設されたものであるが、不動産取得税の税率は4％を超えることができない。",{"qnum":2,"label":"4","title":"不動産取得税②","stem":"不動産取得税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"不動産取得税の標準税率は、４％ですが、超えてはいけないというルールではありません。必要があれば４％を超える税率を定められます。","pending":false}],["c3u7_3_1","不動産取得税の課税標準となるべき額が、土地の取得にあっては10万円、家屋の取得のうち建築によるものにあっては1戸につき23万円、その他のものにあっては1戸につき12万円に満たない場合においては、不動産取得税が課されない。",{"qnum":3,"label":"1","title":"不動産取得税③","stem":"不動産取得税に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"不動産取得税の免税点未満のため、不動産取得税は課されません。","pending":false}],["c3u7_3_3","宅地の取得に係る不動産取得税の課税標準は、当該取得が令和9年3月31日までに行われた場合、当該宅地の価格の4分の1の額とされる。",{"qnum":3,"label":"3","title":"不動産取得税③","stem":"不動産取得税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"当該宅地の価格（固定資産課税台帳に登録されている価格）の２分の１の額になります。","pending":false}],["c3u7_3_4","家屋が新築された日から2年を経過して、なお、当該家屋について最初の使用又は譲渡が行われない場合においては、当該家屋が新築された日から2年を経過した日において家屋の取得がなされたものとみなし、当該家屋の所有者を取得者とみなして、これに対して不動産取得税を課する。",{"qnum":3,"label":"4","title":"不動産取得税③","stem":"不動産取得税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"２年ではなく６か月（宅建業者による建売住宅は１年）です。","pending":false}],["c3u7_4_1","令和8年1月15日に新築された家屋に対する令和8年度分の固定資産税は、新築住宅に係る特例措置により税額の2分の1が減額される。",{"qnum":4,"label":"1","title":"固定資産税①","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"固定資産税は１月１日の所有者が１年分負担します。１月15日に新築ということは翌年から課税となり、令和８年度分の税金は払いません。ですので、減額も当然ありません。","pending":false}],["c3u7_4_3","区分所有家屋の土地に対して課される固定資産税は、各区分所有者が連帯して納税義務を負う。",{"qnum":4,"label":"3","title":"固定資産税①","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"各区分所有者は連帯して納税義務を負うのではなく、原則として、所有する専有部分の床面積の割合で按分した額についてのみ納税義務を負います。","pending":false}],["c3u7_4_4","市町村は、財政上その他特別の必要がある場合を除き、当該市町村の区域内において同一の者が所有する土地に係る固定資産税の課税標準額が30万円未満の場合には課税できない。",{"qnum":4,"label":"4","title":"固定資産税①","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"土地の免税点は30万円未満です。同一市町村内において、同一の者が所有する土地の課税標準額の合計が30万円未満であれば課税されません。","pending":false}],["c3u7_5_1","市町村長は、固定資産課税台帳に登録された価格等に重大な錯誤があることを発見した場合においては、直ちに決定された価格等を修正して、これを固定資産課税台帳に登録しなければならない。",{"qnum":5,"label":"1","title":"固定資産税②","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"市町村長は、固定資産課税台帳に登録された価格等に重大な錯誤があることを発見した場合においては、直ちに決定された価格等を修正して、これを固定資産課税台帳に登録しなければなりません。","pending":false}],["c3u7_5_2","固定資産税の納税義務者は、その納付すべき当該年度の固定資産税に係る固定資産について、固定資産課税台帳に登録された価格について不服があるときは、公示の日から納税通知書の交付を受けた日後1月を経過するまでの間において、文書をもって、固定資産評価審査委員会に審査の申出をすることができる。",{"qnum":5,"label":"2","title":"固定資産税②","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"固定資産課税台帳に登録されている価格について、不服がある場合は、公示の日から納税通知書の交付を受けた日後３か月を経過するまでの間に、固定資産評価審査委員会に対し審査を申し出ることができます。","pending":false}],["c3u7_5_3","年度の途中において家屋の売買が行われた場合、売主と買主は、当該年度の固定資産税を、固定資産課税台帳に所有者として登録されている日数で按分して納付しなければならない。",{"qnum":5,"label":"3","title":"固定資産税②","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"固定資産税は、原則、１月１日現在の所有者に納付義務があります。年度の途中において売買があった場合でも、按分して納付するのではなく、１月１日現在の所有者が納付します。","pending":false}],["c3u7_6_1","質権者は、その土地についての使用収益の実質を有していることから、登記簿にその質権が登記されている場合には、固定資産税が課される。",{"qnum":6,"label":"1","title":"固定資産税③","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"原則は所有者が納税しますが、質権が登記されている場合は、質権者が納税することになります。","pending":false}],["c3u7_6_2","納税義務者又はその同意を受けた者以外の者は、固定資産課税台帳の記載事項の証明書の交付を受けることはできない。",{"qnum":6,"label":"2","title":"固定資産税③","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"固定資産課税台帳の記載事項の証明書の交付は、誰でも請求できるわけではありませんが、借地人や借家人は交付を受けることができます。","pending":false}],["c3u7_6_4","新築された住宅に対して課される固定資産税については、新たに課されることとなった年度から４年度分に限り、1/2相当額を固定資産税額から減額される。",{"qnum":6,"label":"4","title":"固定資産税③","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"マンションなどの中高層（３階以上）の耐火建築物は５年度分、その他の住宅は３年度分適用されます。よって、４年度分ではありません。","pending":false}]]}];

const chapter3ReviewSectionsStage6 = [{"id":"chapter3_review_8","title":"8 所得税・印紙税・登録免許税・贈与税","group":"第3章 法令上の制限等｜復習問題","reviewChapter":3,"reviewUnit":8,"items":[["c3u8_1_1","令和８年１月１日において所有期間が10年以下の居住用財産については、居住用財産の譲渡所得の3,000万円特別控除（租税特別措置法第35条第１項）を適用することができない。",{"qnum":1,"label":"1","title":"所得税①","stem":"令和８年中に、個人が居住用財産を譲渡した場合における譲渡所得の課税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"所有期間10年以下でも適用されます。3,000万円特別控除は、所有期間を問わず適用できますので覚えておきましょう。","pending":false}],["c3u8_1_2","令和８年１月１日において所有期間が10年を超える居住用財産について、収用交換等の場合の譲渡所得等の5,000万円特別控除（租税特別措置法第33条の４第１項）の適用を受ける場合であっても、特別控除後の譲渡益について、居住用財産を譲渡した場合の軽減税率の特例（同法第31条の３第１項）を適用することができる。",{"qnum":1,"label":"2","title":"所得税①","stem":"令和８年中に、個人が居住用財産を譲渡した場合における譲渡所得の課税に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"収用交換等の場合の譲渡所得等の5,000万円特別控除の特例は、居住用財産を譲渡した場合の軽減税率の特例と併用して適用を受けることができます。","pending":false}],["c3u8_1_3","令和８年１月１日において所有期間が10年を超える居住用財産について、その譲渡した時にその居住用財産を自己の居住の用に供していなければ、居住用財産を譲渡した場合の軽減税率の特例を適用することができない。",{"qnum":1,"label":"3","title":"所得税①","stem":"令和８年中に、個人が居住用財産を譲渡した場合における譲渡所得の課税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"譲渡したときに居住していなくても適用されます。自己の居住の用に供されなくなった日から３年を経過する日の属する年の12月31日までに譲渡すれば、適用されます。","pending":false}],["c3u8_1_4","令和８年１月１日において所有期間が10年を超える居住用財産について、その者と生計を一にしていない孫に譲渡した場合には、居住用財産の譲渡所得の3,000万円特別控除を適用することができる。",{"qnum":1,"label":"4","title":"所得税①","stem":"令和８年中に、個人が居住用財産を譲渡した場合における譲渡所得の課税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"孫は、直系血族に当たるため、譲渡しても居住用財産の3,000万円特別控除は適用されません。","pending":false}],["c3u8_2_2","居住用財産を譲渡した場合の軽減税率の特例は、その個人が前々年において既にその特例の適用を受けている場合であっても、令和８年中の譲渡による譲渡益について適用を受けることができる。",{"qnum":2,"label":"2","title":"所得税②","stem":"個人が令和８年中に令和８年１月１日において所有期間が10年を超える居住用財産を譲渡した場合のその譲渡に係る譲渡所得の課税に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"軽減税率の特例は前々年に既にその特例の適用を受けている場合、譲渡による譲渡益について適用を受けることができません。","pending":false}],["c3u8_2_3","居住用財産の譲渡所得の3,000万円特別控除は、その個人がその個人と生計を一にしていない孫に譲渡した場合には、適用を受けることができない。",{"qnum":2,"label":"3","title":"所得税②","stem":"個人が令和８年中に令和８年１月１日において所有期間が10年を超える居住用財産を譲渡した場合のその譲渡に係る譲渡所得の課税に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"3,000万円特別控除は、配偶者、直系血族、生計を一にする親族等への譲渡の場合、適用を受けることができません。","pending":false}],["c3u8_2_4","その譲渡について収用等に伴い代替資産を取得した場合の課税の特例の適用を受ける場合には、その譲渡があったものとされる部分の譲渡益について、居住用財産を譲渡した場合の軽減税率の特例の適用を受けることができない。",{"qnum":2,"label":"4","title":"所得税②","stem":"個人が令和８年中に令和８年１月１日において所有期間が10年を超える居住用財産を譲渡した場合のその譲渡に係る譲渡所得の課税に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"収用等に伴い代替資産を取得した場合の課税の特例の適用を受ける場合には、その譲渡があったものとされる部分の譲渡益について、居住用財産を譲渡した場合の軽減税率の特例の適用を受けることができません。","pending":false}],["c3u8_3_1","譲渡資産とされる家屋については、その譲渡に係る対価の額が5,000万円以下であることが、適用要件とされている。",{"qnum":3,"label":"1","title":"所得税③","stem":"租税特別措置法第36条の２の特定の居住用財産の買換えの場合の長期譲渡所得の課税の特例に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"譲渡に係る対価の額は5,000万円以下ではなく、1億円以下です。","pending":false}],["c3u8_3_2","買換資産とされる家屋については、譲渡資産の譲渡をした日からその譲渡をした日の属する年の12月31日までに取得をしたものであることが、適用要件とされている。",{"qnum":3,"label":"2","title":"所得税③","stem":"租税特別措置法第36条の２の特定の居住用財産の買換えの場合の長期譲渡所得の課税の特例に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"譲渡した年の前年の1月1日から、翌年の12月31日までに買い換えることが適用要件です。","pending":false}],["c3u8_3_3","譲渡資産とされる家屋については、その譲渡をした日の属する年の１月１日における所有期間が５年を超えるものであることが、適用要件とされている。",{"qnum":3,"label":"3","title":"所得税③","stem":"租税特別措置法第36条の２の特定の居住用財産の買換えの場合の長期譲渡所得の課税の特例に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"所有期間は５年超ではなく、10年超でなければなりません。","pending":false}],["c3u8_3_4","買換資産とされる家屋については、その床面積のうち自己の居住の用に供する部分の床面積が50㎡以上のものであることが、適用要件とされている。",{"qnum":3,"label":"4","title":"所得税③","stem":"租税特別措置法第36条の２の特定の居住用財産の買換えの場合の長期譲渡所得の課税の特例に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"買換資産とされる家屋の場合は、床面積が50㎡以上であることが適用要件です。","pending":false}],["c3u8_4_1","「建物の電気工事に係る請負代金は1,100万円（うち消費税額及び地方消費税額100万円）とする」旨を記載した工事請負契約書について、印紙税の課税標準となる当該契約書の記載金額は1,100万円である。",{"qnum":4,"label":"1","title":"印紙税①","stem":"印紙税に関する次の記述のうち、正しいものはどれか。なお、以下の契約書はいずれも書面により作成されたものとする。","answer":"❌誤り","explanation":"請負契約書において、消費税額及び地方消費税額は記載金額に含めません。よって、1,000万円が記載金額となります。","pending":false}],["c3u8_4_3","国を売主、株式会社Cを買主とする土地の売買契約において、共同で売買契約書を2通作成し、国とC社がそれぞれ1通ずつ保存することとした場合、C社が保存する契約書には印紙税は課されない。",{"qnum":4,"label":"3","title":"印紙税①","stem":"印紙税に関する次の記述のうち、正しいものはどれか。なお、以下の契約書はいずれも書面により作成されたものとする。","answer":"⭕正しい","explanation":"C社が保存する契約書は、国が作成した文書なので非課税となります。","pending":false}],["c3u8_4_4","「契約期間は10年間、賃料は月額10万円、権利金の額は100万円とする」旨が記載された土地の賃貸借契約書は、記載金額1,300万円の土地の賃貸借権の設定に関する契約書として印紙税が課される。",{"qnum":4,"label":"4","title":"印紙税①","stem":"印紙税に関する次の記述のうち、正しいものはどれか。なお、以下の契約書はいずれも書面により作成されたものとする。","answer":"❌誤り","explanation":"土地の賃貸借契約書は課税文書に該当し、権利金の額が記載金額になります。よって、100万円が記載金額となります。","pending":false}],["c3u8_5_3","「Dの所有する甲土地（時価2,000万円）をEに贈与する」旨を記載した贈与契約書を作成した場合、印紙税の課税標準となる当該契約書の記載金額は、2,000万円である。",{"qnum":5,"label":"3","title":"印紙税②","stem":"印紙税に関する次の記述のうち、正しいものはどれか。なお、以下の契約書はいずれも書面により作成されたものとする。","answer":"❌誤り","explanation":"贈与契約書は、記載金額のない契約書として200円の印紙税が課されます。","pending":false}],["c3u8_5_4","当初作成の「土地を1億円で譲渡する」旨を記載した土地譲渡契約書の契約金額を変更するために作成する契約書で、「当初の契約書の契約金額を1,000万円減額し、9,000万円とする」旨を記載した変更契約書について、印紙税の課税標準となる当該変更契約書の記載金額は、1,000万円である。",{"qnum":5,"label":"4","title":"印紙税②","stem":"印紙税に関する次の記述のうち、正しいものはどれか。なお、以下の契約書はいずれも書面により作成されたものとする。","answer":"❌誤り","explanation":"減額する契約書を作成した場合は、記載金額のない契約書となり、200円の印紙税を貼らなければなりません。","pending":false}],["c3u8_6_1","建物の賃貸借契約に際して敷金を受け取り、「敷金として20万円を領収し、当該敷金は賃借人が退去する際に全額返還する」旨を記載した敷金の領収証を作成した場合、印紙税は課税されない。",{"qnum":6,"label":"1","title":"印紙税③","stem":"印紙税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"敷金の領収書は課税文書ですから、印紙税が課されます。","pending":false}],["c3u8_6_2","土地譲渡契約書に課税される印紙税を納付するため当該契約書に印紙を貼り付けた場合には、課税文書と印紙の彩紋とにかけて明瞭に消印しなければならないが、契約当事者の代理人又は従業者の印章又は署名で消印しても、消印をしたことにはならない。",{"qnum":6,"label":"2","title":"印紙税③","stem":"印紙税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"消印は、本人またはその代理人（法人の代表者を含む）、使用人、その他の従業員の印章または署名でよいので、本肢の場合、消印したことになります。","pending":false}],["c3u8_6_4","国を売主、株式会社A社を買主とする土地の譲渡契約において、双方が署名押印して共同で土地譲渡契約書を2通作成し、国とA社がそれぞれ1通ずつ保存することとした場合、A社が保存する契約書には印紙税は課税されない。",{"qnum":6,"label":"4","title":"印紙税③","stem":"印紙税に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"国が作成する文書は非課税です。問題文をよく読み、どちらが作成するかを読み取りましょう。","pending":false}],["c3u8_7_1","登録免許税の課税標準の金額を計算する場合において、その金額が１千円に満たないときは、その課税標準は１千円とされる。",{"qnum":7,"label":"1","title":"登録免許税①","stem":"登録免許税に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"課税標準が1,000円未満の場合、課税標準は1,000円として計算されます。","pending":false}],["c3u8_7_3","建物の新築をした所有者が行う建物の表示の登記については、登録免許税は課税されない。",{"qnum":7,"label":"3","title":"登録免許税①","stem":"登録免許税に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"表題登記については、登録免許税は課されません。","pending":false}],["c3u8_7_4","登録免許税の納付は、納付すべき税額が３万円以下の場合においても、現金による納付が認められる。",{"qnum":7,"label":"4","title":"登録免許税①","stem":"登録免許税に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"登録免許税は現金納付が原則ですが、３万円以下の場合は、現金納付もできますし、印紙による納付も認められています。","pending":false}],["c3u8_8_1","直系尊属から住宅用の家屋の贈与を受けた場合でも、この特例の適用を受けることができる。",{"qnum":8,"label":"1","title":"贈与税","stem":"「直系尊属から住宅取得等資金の贈与を受けた場合の贈与税の非課税」に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"特例が適用されるのは、資金の贈与です。住宅用の家屋の贈与では適用されません。","pending":false}],["c3u8_8_4","受贈者について、住宅取得等資金の贈与を受けた年の所得税法に定める合計所得金額が2,000万円を超える場合でも、この特例の適用を受けることができる。",{"qnum":8,"label":"4","title":"贈与税","stem":"「直系尊属から住宅取得等資金の贈与を受けた場合の贈与税の非課税」に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"受贈者の合計所得金額は、2,000万円以下でなければ適用されません。","pending":false}]]}];

const chapter3ReviewSectionsStage7 = [{"id":"chapter3_review_9","title":"9 価格評定・地価公示法","group":"第3章 法令上の制限等｜復習問題","reviewChapter":3,"reviewUnit":9,"items":[["c3u9_1_3","特殊価格とは、市場性を有する不動産について、法令等による社会的要請を背景とする鑑定評価目的の下で、正常価格の前提となる諸条件を満たさない場合における不動産の鑑定評価額を適正に表示する価格をいう。",{"qnum":1,"label":"3","title":"不動産鑑定評価基準①","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、正しいものはどれか。","answer":"❌誤り","explanation":"特殊価格は、市場性を有しない不動産についての価格です。本肢は特定価格についての説明です。","pending":false}],["c3u9_1_4","収益還元法は、対象不動産が将来生み出すであろうと期待される純収益の現在価値の総和を求めることにより対象不動産の試算価格を求める手法であることから、賃貸用不動産の価格を求める場合に有効であり、自用の住宅地には適用すべきでない。",{"qnum":1,"label":"4","title":"不動産鑑定評価基準①","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、正しいものはどれか。","answer":"❌誤り","explanation":"収益還元法は、自用の不動産にも適用することができます（541ページ）。","pending":false}],["c3u9_2_1","原価法は、価格時点における対象不動産の収益価格を求め、この収益価格について減価修正を行って対象不動産の比準価格を求める手法である。",{"qnum":2,"label":"1","title":"不動産鑑定評価基準②","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、正しいものはどれか。","answer":"❌誤り","explanation":"原価法は、価格時点における対象不動産の再調達原価を求め、これについて減価修正を行い、対象不動産の試算価格を求める手法です。","pending":false}],["c3u9_2_2","原価法は、対象不動産が建物又は建物及びその敷地である場合には適用することができるが、対象不動産が土地のみである場合においては、いかなる場合も適用することができない。",{"qnum":2,"label":"2","title":"不動産鑑定評価基準②","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、正しいものはどれか。","answer":"❌誤り","explanation":"対象が土地のみでも、再調達原価を適切に求められるときは適用できます。","pending":false}],["c3u9_2_3","取引事例比較法における取引事例が、特殊事情のある事例である場合、その具体的な状況が判明し、事情補正できるものであっても採用することは許されない。",{"qnum":2,"label":"3","title":"不動産鑑定評価基準②","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、正しいものはどれか。","answer":"❌誤り","explanation":"特殊事情のある事例でも、事情補正できるなら採用できます（539ページ）。","pending":false}],["c3u9_2_4","取引事例比較法は、近隣地域若しくは同一需給圏内の類似地域等において対象不動産と類似の不動産の取引が行われている場合又は同一需給圏内の代替競争不動産の取引が行われている場合に有効である。",{"qnum":2,"label":"4","title":"不動産鑑定評価基準②","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"取引事例比較法は、近隣地域もしくは同一需給圏内の類似地域等において対象不動産と類似の不動産の取引が行われている場合、または同一需給圏内の代替競争不動産の取引が行われている場合に有効です（540ページ）。","pending":false}],["c3u9_3_1","不動産の価格を形成する要因とは、不動産の効用及び相対的希少性並びに不動産に対する有効需要の三者に影響を与える要因をいう。不動産の鑑定評価を行うに当たっては、不動産の価格を形成する要因を明確に把握し、かつ、その推移及び動向並びに諸要因間の相互関係を十分に分析すること等が必要である。",{"qnum":3,"label":"1","title":"不動産鑑定評価基準③","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"不動産の価格を形成する要因とは、不動産の効用及び相対的希少性並びに不動産に対する有効需要の三者に影響を与える要因をいいます。不動産の鑑定評価を行うに当たっては、不動産の価格を形成する要因を明確に把握し、かつ、その推移及び動向並びに諸要因間の相互関係を分析することなどが必要です。","pending":false}],["c3u9_3_2","不動産の鑑定評価における各手法の適用に当たって必要とされる事例は、鑑定評価の各手法に即応し、適切にして合理的な計画に基づき、豊富に秩序正しく収集、選択されるべきであり、たとえば、投機的取引と認められる事例は用いることができない。",{"qnum":3,"label":"2","title":"不動産鑑定評価基準③","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"不動産の鑑定評価において採用する事例は、鑑定評価の各手法に即応し、適切にして合理的な計画に基づき、豊富に秩序正しく収集、選択されるべきであり、たとえば、投機的取引と認められる事例は用いることができません。","pending":false}],["c3u9_3_3","取引事例比較法においては、時点修正が可能である等の要件をすべて満たした取引事例について、近隣地域又は同一需給圏内の類似地域に存する不動産に係るもののうちから選択するものとするが、必要やむを得ない場合においては、近隣地域の周辺の地域に存する不動産に係るもののうちから選択することができる。",{"qnum":3,"label":"3","title":"不動産鑑定評価基準③","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"取引事例比較法においては、時点修正が可能である等の要件をすべて満たした取引事例について、近隣地域または同一需給圏内の類似地域に存する不動産に係るものから選択するが、必要やむを得ない場合には、近隣地域の周辺地域に存する不動産に係るものから選択できます。","pending":false}],["c3u9_3_4","原価法における減価修正の方法としては、耐用年数に基づく方法と、観察減価法の二つの方法があるが、これらを併用することはできない。",{"qnum":3,"label":"4","title":"不動産鑑定評価基準③","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"原価法における減価修正の方法としては、耐用年数に基づく方法と観察減価法の２つの方法があり、併用するものとされています。","pending":false}],["c3u9_4_1","不動産の価格を求める鑑定評価の基本的な手法は、原価法、取引事例比較法及び収益還元法に大別され、原価法による試算価格を積算価格、取引事例比較法による試算価格を比準価格、収益還元法による試算価格を収益価格という。",{"qnum":4,"label":"1","title":"不動産鑑定評価基準④","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"不動産の鑑定評価の基本的な手法は、原価法、取引事例比較法、収益還元法に分けられます。原価法による試算価格を積算価格、取引事例比較法による試算価格を比準価格、収益還元法による試算価格を収益価格といいます。","pending":false}],["c3u9_4_4","収益還元法は、対象不動産が将来生み出すであろうと期待される純収益の現在価値の総和を求めることにより対象不動産の試算価格を求める手法であり、このうち、一定期間の純収益を還元利回りによって還元する方法をDCF（Discounted Cash Flow）法という。",{"qnum":4,"label":"4","title":"不動産鑑定評価基準④","stem":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"これは直接還元法の説明です。収益還元法の手法には、直接還元法とDCF法の２種類があり、DCF法は、連続する複数の期間に発生する純収益および復帰価格を、その発生時期に応じて現在価値に割り引き、それぞれを合計する方法です。","pending":false}],["c3u9_5_1","公示区域内の土地を対象とする鑑定評価については、公示価格を規準とする必要があり、その際には、当該対象土地に最も近接する標準地との間に均衡をもたせる必要がある。",{"qnum":5,"label":"1","title":"地価公示法①","stem":"地価公示法に係る次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"公示価格を規準とする際には、当該対象土地とこれに類似する利用価値を有する標準地と比較して、公示価格と対象地の価格の間に均衡をもたせる必要があります。最も近接する標準地ではありません（543ページ）。","pending":false}],["c3u9_5_2","標準地の鑑定評価は、近傍類地の取引価格から算定される推定の価格、近傍類地の地代等から算定される推定の価格及び同等の効用を有する土地の造成に要する推定の費用の額を勘案して行われる。",{"qnum":5,"label":"2","title":"地価公示法①","stem":"地価公示法に係る次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"不動産鑑定士が標準地の鑑定評価を行う際は、近傍類地の取引価格から算定される推定の価格、近傍類地の地代等から算定される推定の価格及び同等の効用を有する土地の造成に要する推定の費用の額を勘案して行われます（544ページ）。","pending":false}],["c3u9_5_3","地価公示において判定を行う標準地の正常な価格とは、土地について、自由な取引が行われるとした場合において通常成立すると認められる価格をいい、当該土地に、当該土地の使用収益を制限する権利が存する場合には、これらの権利が存するものとして通常成立すると認められる価格をいう。",{"qnum":5,"label":"3","title":"地価公示法①","stem":"地価公示法に係る次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"「権利が存するもの」としてではなく、「権利が存しないもの」として算定される価格です。","pending":false}],["c3u9_6_1","地価公示法の目的は、都市及びその周辺の地域等において、標準地を選定し、その正常な価格を公示することにより、一般の土地の取引価格に対して指標を与え、及び公共の利益となる事業の用に供する土地に対する適正な補償金の額の算定等に資し、もって適正な地価の形成に寄与することである。",{"qnum":6,"label":"1","title":"地価公示法②","stem":"地価公示法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"地価公示法の目的は、都市及びその周辺の地域等において、標準地を選定し、その正常な価格を公示することにより、一般の土地の取引価格に対して指標を与え、及び公共の利益となる事業の用に供する土地に対する適正な補償金の額の算定等に資し、もって適正な地価の形成に寄与することです。","pending":false}],["c3u9_6_3","不動産鑑定士は、土地鑑定委員会の求めに応じて標準地の鑑定評価を行うに当たっては、近傍類地の取引価格から算定される推定の価格、近傍類地の地代等から算定される推定の価格及び同等の効用を有する土地の造成に要する推定の費用の額を勘案しなければならない。",{"qnum":6,"label":"3","title":"地価公示法②","stem":"地価公示法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"不動産鑑定士が標準地の鑑定評価を行う場合には、取引事例比較法、収益還元法、原価法の３つの手法を用いて求めた価格を勘案しなければなりません。","pending":false}],["c3u9_6_4","関係市町村の長は、土地鑑定委員会が公示した事項のうち、当該市町村が属する都道府県に存する標準地に係る部分を記載した書面等を、当該市町村の事務所において一般の閲覧に供しなければならない。",{"qnum":6,"label":"4","title":"地価公示法②","stem":"地価公示法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"関係市町村の長は、土地鑑定委員会が公示した事項のうち、当該市町村が属する都道府県に存する標準地に係る部分を記載した書面などを、当該市町村の事務所において一般の閲覧に供しなければなりません。","pending":false}],["c3u9_7_1","都市計画区域外の区域を公示区域とすることはできない。",{"qnum":7,"label":"1","title":"地価公示法③","stem":"地価公示法に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"公示区域は、都市計画区域および土地取引が相当程度見込まれる区域で、国土交通大臣が定めます。都市計画区域外であっても、土地取引が相当程度見込まれる区域であれば、指定は可能です。","pending":false}],["c3u9_7_2","正常な価格は、土地について、自由な取引が行われるとした場合におけるその取引において通常成立すると認められる価格をいい、この「取引」には住宅地とするための森林の取引も含まれる。",{"qnum":7,"label":"2","title":"地価公示法③","stem":"地価公示法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"正常な価格とは、土地について、自由な取引が行われるとした場合におけるその取引において通常成立すると認められる価格です。森林の取引は除きますが、森林以外のものとするための取引は含めます。よって、住宅地とするための森林の取引は含まれます。","pending":false}],["c3u9_7_3","土地鑑定委員会が標準地の単位面積当たりの正常な価格を判定する際は、二人以上の不動産鑑定士の鑑定評価を求めなければならない。",{"qnum":7,"label":"3","title":"地価公示法③","stem":"地価公示法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"土地鑑定委員会は、毎年１回、２人以上の不動産鑑定士に標準地の鑑定評価を求めなければなりません。","pending":false}],["c3u9_7_4","土地鑑定委員会が標準地の単位面積当たりの正常な価格を判定したときは、標準地の形状についても公示しなければならない。",{"qnum":7,"label":"4","title":"地価公示法③","stem":"地価公示法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"標準地の形状についても公示しなければなりません。","pending":false}],["c3u9_8_1","土地鑑定委員会は、標準地の価格の総額を官報で公示する必要はない。",{"qnum":8,"label":"1","title":"地価公示法④","stem":"地価公示法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"標準地の価格の総額ではなく、単位面積当たりの価格を公示します。ほかの公示事項については、例題７の解法を確認しましょう。","pending":false}],["c3u9_8_2","土地の使用収益を制限する権利が存する土地を標準地として選定することはできない。",{"qnum":8,"label":"2","title":"地価公示法④","stem":"地価公示法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"土地の使用収益を制限する権利が存する土地を標準地として選定することはできます。この場合、権利がないものとして算定します。","pending":false}],["c3u9_8_3","不動産鑑定士が土地鑑定委員会の求めに応じて標準地の鑑定評価を行うに当たっては、標準地の鑑定評価額が前年の鑑定評価額と変わらない場合は、その旨を土地鑑定委員会に申告することにより、鑑定評価書の提出に代えることができる。",{"qnum":8,"label":"3","title":"地価公示法④","stem":"地価公示法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"このような規定はありません。鑑定評価を行った不動産鑑定士は、土地鑑定委員会に対し、鑑定評価額その他の国土交通省令で定める事項を記載した鑑定評価書を提出しなければなりません。","pending":false}],["c3u9_8_4","不動産鑑定士は、土地鑑定委員会の求めに応じて標準地の鑑定評価を行うに当たっては、近傍類地の取引価格から算定される推定の価格を基本とし、必要に応じて、近傍類地の地代等から算定される推定の価格及び同等の効用を有する土地の造成に要する推定の費用の額を勘案しなければならない。",{"qnum":8,"label":"4","title":"地価公示法④","stem":"地価公示法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"近傍類地の取引価格から算定される推定の価格を基本とするのではありません。近傍類地の地代等から算定される推定の価格及び同等の効用を有する土地の造成に要する推定の費用の額を、すべて勘案して行わなければなりません。","pending":false}]]}];

const chapter3ReviewSectionsStage8 = [{"id":"chapter3_review_10","title":"10 免除科目① 住宅金融支援機構法・景品表示法","group":"第3章 法令上の制限等｜復習問題","reviewChapter":3,"reviewUnit":10,"items":[["c3u10_1_1","機構は、子どもを育成する家庭又は高齢者の家庭（単身の世帯を含む。）に適した良好な居住性能及び居住環境を有する賃貸住宅の建設に必要な資金の貸付けを業務として行っている。",{"qnum":1,"label":"1","title":"住宅金融支援機構①","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"機構は、子どもを育成する家庭又は高齢者の家庭（単身の世帯を含む。）に適した良好な居住性能および居住環境を有する賃貸住宅の建設に必要な資金の貸付けを行っています。","pending":false}],["c3u10_1_2","機構は、証券化支援事業（買取型）において、新築住宅に対する貸付債権のみを買取りの対象としている。",{"qnum":1,"label":"2","title":"住宅金融支援機構①","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"貸付債権の買取りの対象は、住宅の建設だけでなく、購入に必要な資金も含まれ、この購入には新築住宅だけでなく、中古住宅の購入も含まれます。","pending":false}],["c3u10_1_3","機構は、証券化支援事業（買取型）において、ZEH（ネット・ゼロ・エネルギー・ハウス）及び省エネルギー性、耐震性、バリアフリー性、耐久性・可変性に優れた住宅を取得する場合に、貸付金の利率を一定期間引き下げる制度を実施している。",{"qnum":1,"label":"3","title":"住宅金融支援機構①","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"機構は、証券化支援事業（買取型）において、ZEH（ネット・ゼロ・エネルギー・ハウス）および省エネルギー性、耐震性、バリアフリー性、耐久性・可変性に優れた住宅を取得する場合に、貸付金の利率を一定期間引き下げる制度を実施しています。","pending":false}],["c3u10_1_4","機構は、マンション管理組合や区分所有者に対するマンション共用部分の改良に必要な資金の貸付けを業務として行っている。",{"qnum":1,"label":"4","title":"住宅金融支援機構①","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"機構は、マンション管理組合や区分所有者に対するマンション共用部分の改良に必要な資金の貸付けを行っています。","pending":false}],["c3u10_2_2","機構は、団体信用生命保険業務において、貸付けを受けた者が死亡した場合のみならず、重度障害となった場合においても、支払われる生命保険の保険金を当該貸付けに係る債務の弁済に充当することができる。",{"qnum":2,"label":"2","title":"住宅金融支援機構②","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"団体信用生命保険では、貸付けを受けた者が死亡した場合のみならず、重度障害となった場合にも保険金が支払われます。そして、支払われる生命保険の保険金を当該貸付けに係る債務の弁済に充当できます。","pending":false}],["c3u10_2_3","償還方法は、元利均等返済と元金均等返済の2つがあります。",{"qnum":2,"label":"3","title":"住宅金融支援機構②","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"償還方法は、元利均等返済と元金均等返済の2つがあります。","pending":false}],["c3u10_2_4","機構は、証券化支援事業（買取型）において、MBS（資産担保証券）を発行することにより、債券市場（投資家）から資金を調達している。",{"qnum":2,"label":"4","title":"住宅金融支援機構②","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"機構は、証券化支援事業（買取型）において、MBS（資産担保証券）を発行することにより債券市場（投資家）から資金を調達しています。","pending":false}],["c3u10_3_2","証券化支援事業（買取型）における民間金融機関の住宅ローン金利は、金融機関によって異なる場合がある。",{"qnum":3,"label":"2","title":"住宅金融支援機構③","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"証券化支援事業（買取型）における民間金融機関の住宅ローン金利は、金融機関によって異なります。","pending":false}],["c3u10_3_3","機構は、高齢者が自ら居住する住宅に対して行うバリアフリー工事に係る貸付けについて、貸付金の償還を高齢者の死亡時に一括して行うという制度を設けている。",{"qnum":3,"label":"3","title":"住宅金融支援機構③","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"機構は、高齢者が自ら居住する住宅に対して行うバリアフリー工事や耐震改修工事について、債務者本人の死亡時に一括して借入金を返済する制度を設けています。","pending":false}],["c3u10_3_4","証券化支援業務（買取型）において、機構による譲受けの対象となる住宅の購入に必要な資金の貸付けに係る金融機関の貸付債権には、当該住宅の購入に付随する改良に必要な資金は含まれない。",{"qnum":3,"label":"4","title":"住宅金融支援機構③","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"当該住宅の購入に付随する改良に必要な資金も含まれます。","pending":false}],["c3u10_4_2","直線距離で50m以内に街道が存在する場合、物件名に当該街道の名称を用いることができる。",{"qnum":4,"label":"2","title":"不当景品類及び不当表示防止法①","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"直線距離で50m以内に街道が存在する場合、物件名に当該街道の名称を用いることができます。","pending":false}],["c3u10_4_3","物件の近隣に所在するスーパーマーケットを表示する場合は、物件からの自転車による所要時間を明示しておくことで、徒歩による所要時間を明示する必要がなくなる。",{"qnum":4,"label":"3","title":"不当景品類及び不当表示防止法①","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"自転車による所要時間を明示しても、徒歩による所要時間を明示する必要があります。物件までの道路距離、または徒歩所要時間を明示しなければなりません。","pending":false}],["c3u10_4_4","一棟リノベーションマンションについては、一般消費者に対し、初めて購入の申込みの勧誘を行う場合であっても、「新発売」との表示を行うことはできない。",{"qnum":4,"label":"4","title":"不当景品類及び不当表示防止法①","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"一棟リノベーションマンションについて、一般消費者に対し初めて購入の申込みの勧誘を行う場合は、「新発売」の表示をすることができます。","pending":false}],["c3u10_5_1","物件からスーパーマーケット等の商業施設までの徒歩所要時間は、道路距離80mにつき1分間を要するものとして算出し、1分未満の端数が生じたときは、端数を切り捨てて表示しなければならない。",{"qnum":5,"label":"1","title":"不当景品類及び不当表示防止法②","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"1分未満の端数が生じたときは、1分として算出します。端数を切り捨てるのではなく、切り上げて1分とします。","pending":false}],["c3u10_5_3","マンションの管理費について、住戸により管理費の額が異なる場合において、その全ての住宅の管理費を示すことが困難であるときは、最高額のみを表示すればよい。",{"qnum":5,"label":"3","title":"不当景品類及び不当表示防止法②","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"管理費については原則、1戸当たりの月額を表示します。ただし、住戸により金額が異なる場合で、すべての住戸の管理費の表示が困難である場合は、最低額および最高額のみの表示にできます。最高額のみの表示ではいけません。","pending":false}],["c3u10_6_1","住宅の居室の広さを畳数で表示する場合には、畳1枚当たりの広さにかかわらず、実際に当該居室に敷かれている畳の数を表示しなければならない。",{"qnum":6,"label":"1","title":"不当景品類及び不当表示防止法③","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"住宅の居室等の広さを畳数で表示する場合には、畳1枚当たりの広さ＝1.62㎡以上の広さという意味で用いなければなりません。実際に居室に敷かれている畳の数ではありません。","pending":false}],["c3u10_6_2","団地（一団の宅地又は建物をいう。）と駅との間の距離は、駅から最も近い当該団地内の地点を起点として算出した数値とともに、駅から最も遠い当該団地内の地点を起点として算出した数値を表示しなければならず、当該団地を数区に区分して取引するときは各区分ごとに距離を算出して表示しなければならない。",{"qnum":6,"label":"2","title":"不当景品類及び不当表示防止法③","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"団地と駅との間の距離は、駅から最も近い当該団地内の地点を起点とした数値と、最も遠い地点を起点とした数値を併記しなければなりません。また、団地を数区に区分して取引するときは区分ごとに距離を表示しなければなりません。","pending":false}],["c3u10_6_4","新築分譲住宅の販売に当たって行う二重価格表示は、実際に過去において販売価格として公表していた価格を比較対照価格として用いて行うのであれば、値下げの時期から1年以内の期間は表示することができる。",{"qnum":6,"label":"4","title":"不当景品類及び不当表示防止法③","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の const KEY='takken_v4_progress';
let sec=0,level=1,filter='all';
let progress={};
try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const key=(sid,n)=>sid+'::'+n;

function shortTitle(t){
  return t.replace('35条書面｜','35条 ').replace('指定流通機構（REINS）｜','REINS ').replace('媒介契約｜','媒介 ');
}
function sectionGroup(s){
  if(s.group)return s.group;
  return s.id.startsWith('city')?'法令上の制限':'既存の宅建業法';
}
function renderPicker(){
  const picker=document.getElementById('sectionPicker');
  picker.textContent='';
  const groups={};
  DATA.forEach((s,i)=>{
    const g=sectionGroup(s);
    if(!groups[g]){groups[g]=document.createElement('optgroup');groups[g].label=g;picker.appendChild(groups[g]);}
    const option=document.createElement('option');option.value=String(i);option.textContent=s.title;
    groups[g].appendChild(option);
  });
  picker.value=String(sec);
}
function renderTabs(){
  renderPicker();
  const t=document.getElementById('tabs');t.innerHTML='';
  DATA.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===sec?' active':'');
    b.textContent=shortTitle(s.title);
    b.onclick=()=>{
      sec=i;renderTabs();render();
      if(window.innerWidth<700) document.getElementById('panel').classList.remove('open');
    };
    t.appendChild(b);
  });
}

document.getElementById('sectionPicker').onchange=e=>{
  sec=Number(e.target.value);renderTabs();render();
  if(window.innerWidth<700)document.getElementById('panel').classList.remove('open');
};
document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{

document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{

function parsed(raw){
  return esc(raw).replace(/\[\[(.*?)\]\]/gs,'<span class="cloze">$1</span>')
                 .replace(/\(\((.*?)\)\)/gs,'<span class="extra">$1</span>');
}
function renderMemoryContent(meta,raw){
  if(!meta.table)return parsed(raw);
  const t=meta.table;
  const head='<thead><tr>'+t.headers.map(x=>'<th>'+parsed(x)+'</th>').join('')+'</tr></thead>';
  const body='<tbody>'+t.rows.map(row=>'<tr>'+row.map(cell=>'<td>'+parsed(cell)+'</td>').join('')+'</tr>').join('')+'</tbody>';
  return '<div class="memory-table-scroll"><table class="memory-table">'+head+body+'</table></div>';
}
function bindClozeToggles(root){
  root.querySelectorAll('.cloze').forEach(x=>{
    x.setAttribute('role','button');x.tabIndex=0;x.setAttribute('aria-label','赤文字の表示を切り替える');x.setAttribute('aria-pressed','false');
    const toggle=()=>{x.classList.toggle('show');x.setAttribute('aria-pressed',String(x.classList.contains('show')));};
    x.onclick=toggle;x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}};
  });
}
function updateScore(){
  const s=DATA[sec];let ok=0,ng=0,un=0;
  s.items.forEach(([n,q,meta])=>{if(isChoiceQuiz(s)&&meta.pending)return;const v=get(s.id,n);if(v==='ok')ok++;else if(v==='ng')ng++;else un++});
  document.getElementById('score').textContent=`○${ok} ×${ng} 未${un}`;
}
function applyCardMark(card,sid,n){
  const v=get(sid,n);
  card.classList.remove('ok','ng');
  if(v) card.classList.add(v);
  const ok=card.querySelector('.mark.ok');
  const ng=card.querySelector('.mark.ng');
  if(ok) ok.classList.toggle('sel',v==='ok');
  if(ng) ng.classList.toggle('sel',v==='ng');
  if(filter==='ng') card.style.display=(v==='ng')?'':'none';
  else if(filter==='un') card.style.display=v?'none':'';
  else card.style.display='';
}
function setMark(card,sid,n,val){
  const k=key(sid,n);
  if(progress[k]===val) delete progress[k]; else progress[k]=val;
  save();
  applyCardMark(card,sid,n);
}

function isChoiceQuiz(s){return s.id==='prediction'||s.id==='chapter7_review'||Boolean(s.reviewUnit);}
function plainReviewExplanation(raw){return raw.replace(/\[\[([\s\S]*?)\]\]/g,'$1');}
function renderPrediction(s,root){
  const isChapter7=s.id==='chapter7_review',isReview=Boolean(s.reviewUnit);
  const prefix=s.reviewUnit+'-';
  const heading=n=>isReview?prefix+n:isChapter7?'7-'+n:'予想問題'+n;
  const anchor=n=>isReview?s.id+'-q'+n:isChapter7?'chapter7-q'+n:'pred-q'+n;
  const visible=s.items.filter(([n,q,meta])=>{
    if(meta.pending)return filter==='all';
    const v=get(s.id,n);
    if(filter==='ng')return v==='ng';
    if(filter==='un')return !v;
    return true;
  });
  const groups=new Map();
  visible.forEach(item=>{const meta=item[2];if(!groups.has(meta.qnum))groups.set(meta.qnum,[]);groups.get(meta.qnum).push(item);});
  if(!visible.length){root.innerHTML='<div class="empty">該当する項目はありません。</div>';updateScore();return;}
  const nav=document.createElement('nav');nav.className='prediction-nav'+(isReview?' review-nav':'');if(isReview)root.style.setProperty('--review-header-height',(window.innerWidth<700?48:document.querySelector('header').offsetHeight)+'px');nav.setAttribute('aria-label',s.title+'へ移動');
  [...groups.keys()].sort((a,b)=>a-b).forEach(n=>{const link=document.createElement('a');link.href='#'+anchor(n);link.textContent=isReview?prefix+n:isChapter7?'7-'+n:'問'+n;nav.appendChild(link);});
  root.appendChild(nav);
  [...groups.entries()].sort((a,b)=>a[0]-b[0]).forEach(([qnum,items])=>{
    const first=items[0][2],section=document.createElement('section');section.className='prediction-question'+(isReview?' review-question':'');section.id=anchor(qnum);
    const h=document.createElement('h2');h.textContent=heading(qnum)+(first.title?'｜'+first.title:'');section.appendChild(h);
    if(first.stem){const stem=document.createElement('div');stem.className='prediction-stem';stem.textContent=first.stem;section.appendChild(stem);}
    items.forEach(([n,statement,meta])=>{
      const saved=get(s.id,n),card=document.createElement('div');card.className='card prediction-option '+(saved||'');card.dataset.recordKey=key(s.id,n);
      const row=document.createElement('div');row.className='row';
      const num=document.createElement('div');num.className='num';num.textContent=meta.label;
      const text=document.createElement('div');text.className='text';
      const label=document.createElement('div');label.className='pred-label';label.textContent=isReview?prefix+qnum+' '+meta.label:isChapter7?'7-'+qnum+' '+meta.label:'選択肢 '+meta.label;
      const question=document.createElement('div');if(isReview){question.innerHTML=parsed(statement);}else{question.textContent=statement;}text.append(label,question);row.append(num,text);card.appendChild(row);
      if(meta.pending){const pending=document.createElement('div');pending.className='pred-pending';pending.textContent='正答と解説に食い違いがあるため確認対象です。確認が済むまで答え・解説・自己採点は表示しません。';card.appendChild(pending);}
      else{
        const ans=document.createElement('div');ans.className='pred-answer-panel';ans.hidden=true;ans.textContent='教材の正答：'+meta.answer;
        const exp=document.createElement('div');exp.className='pred-explanation';exp.hidden=true;exp.textContent=isReview&&!meta.method?plainReviewExplanation(meta.explanation):meta.explanation;
        const actions=document.createElement('div');actions.className='pred-actions';
        const answerBtn=document.createElement('button');answerBtn.textContent='答えを見る';answerBtn.setAttribute('aria-expanded','false');
        answerBtn.onclick=()=>{ans.hidden=!ans.hidden;if(isReview&&!meta.method)exp.hidden=ans.hidden;answerBtn.textContent=ans.hidden?'答えを見る':'答えを隠す';answerBtn.setAttribute('aria-expanded',String(!ans.hidden));};
        const explanationBtn=document.createElement('button');explanationBtn.textContent='解説を見る';explanationBtn.setAttribute('aria-expanded','false');
        explanationBtn.onclick=()=>{exp.hidden=!exp.hidden;explanationBtn.textContent=exp.hidden?'解説を見る':'解説を隠す';explanationBtn.setAttribute('aria-expanded',String(!exp.hidden));};
        const markOk=document.createElement('button');markOk.className='pred-self-ok'+(saved==='ok'?' sel':'');markOk.textContent='正解 ○';
        const markNg=document.createElement('button');markNg.className='pred-self-ng'+(saved==='ng'?' sel':'');markNg.textContent='間違い ×';
        markOk.onclick=()=>{setMark(card,s.id,n,'ok');markOk.classList.toggle('sel',get(s.id,n)==='ok');markNg.classList.toggle('sel',get(s.id,n)==='ng');};
        markNg.onclick=()=>{setMark(card,s.id,n,'ng');markOk.classList.toggle('sel',get(s.id,n)==='ok');markNg.classList.toggle('sel',get(s.id,n)==='ng');};
        if(isReview){
          if(!meta.method)actions.append(answerBtn);
          const redBtn=document.createElement('button');redBtn.textContent='赤文字を表示';redBtn.setAttribute('aria-pressed','false');
          let redShown=false;
          redBtn.onclick=()=>{redShown=!redShown;card.querySelectorAll('.cloze').forEach(x=>x.classList.toggle('show',redShown));redBtn.textContent=redShown?'赤文字を隠す':'赤文字を表示';redBtn.setAttribute('aria-pressed',String(redShown));};
          card.querySelectorAll('.cloze').forEach(x=>{x.setAttribute('role','button');x.tabIndex=0;x.setAttribute('aria-label','赤文字の表示を切り替える');x.setAttribute('aria-pressed','false');const toggle=()=>{x.classList.toggle('show');x.setAttribute('aria-pressed',String(x.classList.contains('show')));};x.onclick=toggle;x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}};});
          if(statement.includes('[['))actions.append(redBtn);
          actions.append(markOk,markNg);if(!meta.method)card.append(ans,exp);card.append(actions);
        }else{actions.append(answerBtn,explanationBtn,markOk,markNg);card.append(ans,exp,actions);}
      }
      section.appendChild(card);applyCardMark(card,s.id,n);
    });
    root.appendChild(section);
  });
  updateScore();
}

function render(){
  const s=DATA[sec];
  document.getElementById('current').textContent=shortTitle(s.title);
  const hint=document.getElementById('studyHint');if(hint)hint.textContent=s.reviewChapter===2?'「答えを見る」で教材の正誤と解説全文を表示します。自己採点は別に保存されます。':s.reviewUnit?'「答えを見る」で教材の正誤と解説全文を表示します。自己採点は別に保存されます。10-3 解法暗記は赤文字をタップして表示・非表示にできます。':isChoiceQuiz(s)?'共通問題文と選択肢を確認し、必要なときに正答と解説を表示できます。自己採点は正答表示と別に保存されます。':'赤文字の空欄を思い出してから「答えを表示」。○×は答えの表示と別に記録されます。補足解説は必要なときに開けます。';
  const root=document.getElementById('cards');root.innerHTML='';
  let shown=0;
  if(isChoiceQuiz(s)){renderPrediction(s,root);return;}
  s.items.forEach(([n,raw,itemMeta])=>{
    const meta=itemMeta||EXTRAS[key(s.id,n)]||{};
    const v=get(s.id,n);
    if(filter==='ng'&&v!=='ng')return;
    if(filter==='un'&&v)return;
    shown++;
    const c=document.createElement('div');c.className='card '+(v||'');
    c.dataset.recordKey=key(s.id,n);
    if(meta.prompt){
      const cue=document.createElement('div');cue.className='card-cue';cue.textContent=meta.prompt;c.appendChild(cue);
    }
    const row=document.createElement('div');row.className='row';
    const num=document.createElement('div');num.className='num';num.textContent=n;
    const txt=document.createElement('div');txt.className='text';
    if(level===3) txt.innerHTML='<span class="adv">この項目の内容を頭の中で再現</span>';
    else{
      txt.innerHTML=renderMemoryContent(meta,raw);
      if(level===2) txt.querySelectorAll('.extra').forEach(x=>x.classList.add('hide'));
    }
    bindClozeToggles(txt);
    row.append(num,txt);

    const ac=document.createElement('div');ac.className='actions';
    const ans=document.createElement('button');ans.className='answer';ans.textContent='答えを表示';
    let answerShown=false;
    function hideAnswer(){
      if(level===3){
        txt.innerHTML='<span class="adv">この項目の内容を頭の中で再現</span>';
      }else{
        txt.innerHTML=renderMemoryContent(meta,raw);
        if(level===2) txt.querySelectorAll('.extra').forEach(x=>x.classList.add('hide'));
      }
      bindClozeToggles(txt);
      answerShown=false;
      ans.textContent='答えを表示';
    }
    function showAnswer(){
      if(level===3){
        txt.innerHTML=renderMemoryContent(meta,raw);
        bindClozeToggles(txt);
        txt.querySelectorAll('.cloze').forEach(x=>x.classList.add('show'));
      }else{
        txt.querySelectorAll('.cloze').forEach(x=>x.classList.add('show'));
        txt.querySelectorAll('.extra').forEach(x=>x.classList.remove('hide'));
      }
      answerShown=true;
      ans.textContent='答えを隠す';
    }
    ans.setAttribute('aria-pressed','false');
    ans.onclick=()=>{answerShown ? hideAnswer() : showAnswer();ans.setAttribute('aria-pressed',String(answerShown))};
    const ok=document.createElement('button');ok.className='mark ok'+(v==='ok'?' sel':'');ok.textContent='○';ok.onclick=()=>setMark(c,s.id,n,'ok');
    const ng=document.createElement('button');ng.className='mark ng'+(v==='ng'?' sel':'');ng.textContent='×';ng.onclick=()=>setMark(c,s.id,n,'ng');
    ac.append(ans,ok,ng);
    c.append(row);
    if(meta.note){
      const detail=document.createElement('details');detail.className='supplement';
      const summary=document.createElement('summary');summary.textContent='補足解説・ひっかけポイント（学習メモ）';
      const note=document.createElement('p');note.textContent=meta.note;
      detail.append(summary,note);c.appendChild(detail);
    }
    c.appendChild(ac);
    if(meta.pages&&meta.pages.length){
      const source=document.createElement('div');source.className='source-line';
      source.textContent=(meta.source?'出典：':'関連：')+'教材 P'+meta.pages.join('・P');
      c.appendChild(source);
    }
    root.appendChild(c);
    applyCardMark(c,s.id,n);
  });
  if(!shown){root.innerHTML='<div class="empty">該当する項目はありません。</div>'}
  updateScore();
}

document.getElementById('menuBtn').onclick=()=>document.getElementById('panel').classList.toggle('open');

document.getElementById('reset').onclick=()=>{
  const s=DATA[sec];
  if(!confirm('この分野の○×記録を消しますか？'))return;
  s.items.forEach(([n])=>delete progress[key(s.id,n)]);
  save();render();
};
document.getElementById('backup').onclick=()=>{
  const blob=new Blob([JSON.stringify(progress)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='takken_progress.json';a.click();
};
document.getElementById('restoreBtn').onclick=()=>document.getElementById('restore').click();
document.getElementById('restore').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{progress=JSON.parse(await f.text());save();render();alert('復元しました')}catch(err){alert('読み込めませんでした')}
};
renderTabs();render();
</script></body></html>
