<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宅建暗記クイズ v8｜都市計画・開発許可追加</title><style>
:root{--red:#8f211d;--bg:#fff8f6;--line:#ebd1cd;--ink:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;box-shadow:0 2px 8px #0002}
.topbar{height:48px;display:flex;align-items:center;gap:8px;padding:0 10px}
.current{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.mini-score{font-size:12px;font-weight:800;opacity:.95;white-space:nowrap}
.menu-btn{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:9px;padding:6px 9px;font-size:13px;font-weight:800}
.panel{display:none;padding:8px 10px 10px;border-top:1px solid #ffffff22}
.panel.open{display:block}
.tabs,.levels,.filters,.tools,.actions{display:flex;gap:7px;align-items:center}
.tabs,.levels,.filters{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar,.levels::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.tab,.level,.filter{flex:0 0 auto;border:1px solid #fff7;background:#fff;color:#7f201d;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}
.tab.active,.level.active,.filter.active{background:#50110f;color:#fff;border-color:#50110f}
.group-label{font-size:11px;opacity:.8;margin:7px 0 4px}
.tools{flex-wrap:wrap;margin-top:8px}
.tools button{border:1px solid #fff6;background:#fff;color:#7f201d;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:700}
main{padding:10px;max-width:900px;margin:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 9px;overflow:hidden}
.card.ok{border:2px solid #69a975;background:#f4fbf5}
.card.ng{border:2px solid #cf6159;background:#fff6f5}
.card.ok .num{background:#4f925d}
.card.ng .num{background:#bd4d46}
.card.ok::after,.card.ng::after{display:block;font-size:12px;font-weight:800;padding:0 10px 9px 55px}
.card.ok::after{content:'○ できた';color:#397247}
.card.ng::after{content:'× 要復習';color:#a43f39}
.row{display:grid;grid-template-columns:46px 1fr}
.num{background:#9f302b;color:#fff;font-weight:800;display:flex;align-items:flex-start;justify-content:center;padding:11px 5px;font-size:14px}
.text{padding:11px 12px;font-size:14px;line-height:1.7;white-space:pre-line}
.cloze{display:inline-block;min-width:5em;color:transparent;background:#f1dcda;border-bottom:2px solid #a64c46;border-radius:3px}
.cloze.show{color:#c3342f;background:#fff1ef;font-weight:700}
.extra.hide{display:inline-block;color:transparent;background:#eee1df;border-bottom:2px solid #9b7975;border-radius:3px;min-width:6em}
.adv{display:inline-block;width:94%;min-height:3em;background:#eee1df;color:transparent;border-radius:6px}
.actions{padding:0 9px 10px 55px;flex-wrap:wrap}
.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px}
.answer{background:#fff0ee!important;color:#8b2824;font-weight:800}
.mark{width:42px;height:36px;padding:0!important;font-size:19px!important;font-weight:800}
.mark.sel.ok{background:#4f925d!important;color:#fff;border-color:#4f925d!important;box-shadow:0 0 0 2px #d8efdd}
.mark.sel.ng{background:#bd4d46!important;color:#fff;border-color:#bd4d46!important;box-shadow:0 0 0 2px #f2d9d6}
.empty{padding:30px 12px;text-align:center;color:#777}
footer{padding:26px 12px 44px;text-align:center;color:#888;font-size:11px}
@media(min-width:700px){
  .topbar{height:54px}.current{font-size:17px}.panel{display:block!important}
  .menu-btn{display:none}.text{font-size:16px}
}
</style></head>
<body>
<header>
  <div class="topbar">
    <div id="current" class="current"></div>
    <div id="score" class="mini-score">○0 ×0 未0</div>
    <button id="menuBtn" class="menu-btn">設定</button>
  </div>
  <div id="panel" class="panel">
    <div class="group-label">分野</div><div id="tabs" class="tabs"></div>
    <div class="group-label">難易度</div>
    <div class="levels">
      <button class="level active" data-level="1">初級</button>
      <button class="level" data-level="2">中級</button>
      <button class="level" data-level="3">上級</button>
    </div>
    <div class="group-label">表示</div>
    <div class="filters">
      <button class="filter active" data-filter="all">全部</button>
      <button class="filter" data-filter="ng">×だけ</button>
      <button class="filter" data-filter="un">未回答</button>
    </div>
    <div class="tools">
      <button id="reset">この分野をリセット</button>
      <button id="backup">バックアップ</button>
      <button id="restoreBtn">復元</button>
      <input id="restore" type="file" accept="application/json" hidden>
    </div>
  </div>
</header>
<main><div id="cards"></div></main>
<footer>設定は右上から。○×記録はブラウザ内に保存されます。</footer>
<script>
const DATA=[{"id":"35_sale","title":"35条書面｜売買・交換","items":[["1","登記された権利の種類および内容\n・抵当権など登記されている権利関係を説明。説明時の登記内容を記載するので、物件を[[引渡すまでに抵当権が抹消される予定であっても]]その旨を記載する"],["2","[[法令に基づく制限]]\n・都市計画法、建築基準法等における造成や建築等の制限など、((具体的な制限の内容))"],["3","[[私道]]に関する負担に関する事項\n・[[将来の負担も含む]]私道負担の有無、私道面積、通行使用料等の負担額"],["4","[[飲用水、電気、ガス]]等の供給施設、[[排水施設]]の整備状況\n・未整備であればその[[整備の見通し]]や、その整備に当たって[[負担金が課されるか]]などの負担に関する事項"],["5","[[未完成物件]]の場合　工事完了時の形状、構造\n・[[宅地：造成工事完了時]]\n・完了時の形状、構造、宅地に接している道路の構造と幅員等\n・[[建物：建築工事完了時]]\n・完了時の形状、構造、主要構造部、内装および外装の構造や仕上げ等"],["6","[[土砂災害警戒区域内、造成宅地防災区域内、津波災害警戒区域内]]にある時はその旨"],["7","水防法の規定により市町村の長が提供する図面（[[水害ハザードマップ]]）に表示されているときは水害ハザードマップにおけるその宅地建物の[[所在地]]"],["8","[[住宅性能評価を受けた新築住宅]]の場合はその旨"],["9","[[石綿]]（アスベスト）の使用の有無の調査結果が記録されているときはその内容（[[実施は義務ではない]]）"],["10","昭和56年6月1日以降に新築工事に着手したものを除く建物が、指定確認検査機関等による一定の[[耐震診断]]を受けたものであるときはその内容（[[実施は義務ではない]]）"],["11","既存の建物であるときは、[[建物状況調査]]（インスペクション）等に関する事項\n・既存の建物であるときは、実施後1年を経過していない[[建物状況調査の実施の有無]]や、[[実施している場合はその結果の概要]]（[[実施は義務ではない]]）\n・[[鉄筋コンクリート造]]または[[鉄骨鉄筋コンクリート造]]の[[共同住宅等]]に係る重要事項説明の対象となる建物状況調査の結果については、調査の実施から[[2年]]を経過していないもの"],["12","既存の建物であるときは、[[建物の建築及び維持保全の状況に関する書類の保存状況]]\n・確認の申請書、確認済証、検査済証、建物状況調査の結果についての報告書、既存住宅にかかる建設住宅性能評価書等の保存の状況"],["13","代金、交換差金[[以外]]に授受される金銭の額、および目的\n・手付金等の[[額と目的]]\n※[[代金や交換差金は重要事項説明の対象外]]"],["14","契約の[[解除]]に関する事項\n・契約の解除が可能な場合、手続きや解除の効果について"],["15","[[損害賠償額の予定または違約金]]に関する事項\n・損害賠償額の予定、違約金としての違約金を定めるか否か"],["16","[[手付金等の保全措置]]の概要\n・[[宅建業者が自ら売主]]の場合、お客さんから受け取ったお金を返せるようにするための保全措置義務の概要"],["17","[[支払金、預り金]]を受領する場合の保全措置の有無、概要\n・宅建業者が取引の相手方などから、支払金、預り金を受領する場合、保全措置を講ずるか否か。保全措置を講ずる場合はその概要\n・[[50万円未満のもの]]、売主や交換の当事者である宅建業者が[[登記以後]]に受領するものについては、[[説明義務なし]]"],["18","ローンの[[あっせんの内容]]、およびローン[[不成立の場合の措置]]\n・住宅ローン等をあっせんする場合、融資額、金利、返済方法などのあっせんの内容や融資条件。ローンが受けられなかった場合の措置"],["19","[[契約不適合を担保すべき責任]]の履行に関し保証保険契約の締結、その他の措置の有無・概要\n・宅地建物が種類、品質に関して契約の内容に適合しない場合におけるその不適合を担保すべき責任の履行に関して、保証保険契約等を[[講ずるか否か・講ずる場合におけるその措置の概要]]"],["20","[[割賦販売]]の場合：現金販売価格、割賦販売価格、頭金・賦払いの額、支払時期・方法\n・分割払いを条件として販売する"]]},{"id":"35_lease","title":"35条書面｜貸借","items":[["1","[[登記]]された権利の種類および内容"],["2","[[法令に基づく制限]]\n・[[建物の貸借]]の場合、一定の制限のみ説明\n・[[建蔽率、容積率等]]に関する制限は関係ないので説明不要（[[宅地の貸借では説明必要]]）"],["3","[[私道]]負担に関する事項\n・建物を借りる人にとっては、私道については関係ない"],["4","[[飲用水、電気、ガス]]等の供給施設、[[排水施設]]の整備状況"],["5","[[未完成物件]]の工事完了時の形状、構造"],["6","[[土砂災害警戒区域、津波災害警戒区域、造成宅地防災区域]]に関する事項"],["7","[[水害ハザードマップ]]における取引対象物件の所在地"],["8","建物の[[石綿]]の使用の有無の調査結果の記録に関する事項"],["9","建物の[[耐震診断]]に関する事項"],["10","既存の建物であるときは、[[建物状況調査]]（インスペクション）等に関する事項\n［[[住宅性能評価]]［建物の建築及び維持保全の状況に関する書類］は記載事項ではない］"],["11","借賃[[以外]]に授受される金銭の額、および目的\n・敷金など"],["12","契約の[[解除]]に関する事項"],["13","[[損害賠償額]]の予定または違約金に関する事項"],["14","支払金、預り金を受領する場合の[[保全措置]]の有無、概要"],["15","[[台所・浴室・便所]]等の整備状況\n※[[事業用建物]]の貸借でも説明必要"],["16","[[契約期間および契約更新]]に関する事項\n・更新の際の更新料改定に関することや、期限付き建物賃貸借の場合は契約の更新はないこと等を説明"],["17","[[定期借地権、定期借家権（定期建物賃貸借）]]などに関する事項\n・期間が満了すれば契約は終了－更新はないことを説明"],["18","宅地建物の[[用途や利用の制限]]"],["19","金銭の[[契約終了時の精算]]に関する事項\n・敷金の用途等を明確にする。金額が明確でない場合はその旨を説明"],["20","宅地建物の[[管理の委託]]を受けた者の氏名や住所等"],["21","契約終了時における宅地の[[建物の取壊し]]に関する事項の内容\n・借地上の建物の取壊しのことなので、建物を借りる場合は該当しない"],["22","高齢者の居住の安定確保に関する法律に規定する[[終身建物賃貸借]]をしようとするときはその旨"]]},{"id":"35_condo","title":"35条書面｜区分所有建物","items":[["賃貸1","[[専有部分の用途、その他の利用の制限]]に関する規約の定めがあるときはその内容\n・専有部分の使い方に関する制限\n・ペット飼育や店舗営業などについて規約の定めがあるなら説明をする\n※[[規約が案の段階でも、その案についても説明が必要]]"],["賃貸2","一棟の建物および敷地の[[管理が委託]]されているときは、その委託先の氏名や住所等\n・マンション管理の適正化の推進に関する法律第44条の登録を受けているときは登録番号も記載\n・法人の場合、商号または名称、主たる事務所の所在地。ただし管理業務内容は不要"],["売買1","[[敷地]]に関する権利の種類及び内容\n・敷地利用権であれば、所有権か借地権かなど"],["売買2","[[共用部分]]に関する規約の定めがあるときはその内容\n※[[規約が案の段階でも、その案についても説明が必要]]"],["売買3","[[専有部分の用途、その他の利用の制限]]に関する規約の定めがあるときはその内容\n・専有部分の使い方に関する制限\n・ペット飼育や店舗営業などについて規約の定めがあるなら説明をする\n※[[規約が案の段階でも、その案についても説明が必要]]"],["売買4","[[専用使用権]]に関する規約の定めがあるときはその内容\n・専用駐車場や専用庭など。ただし、[[使用者の氏名や住所は説明不要]]\n※[[規約が案の段階でも、その案についても説明が必要]]"],["売買5","一棟の建物の計画的な[[維持修繕のための費用]]、通常の管理費用、その他の当該建物の所有者が負担しなければならない費用を、特定の者にのみ減免する旨の規約の定めがあるときはその内容\n※[[規約が案の段階でも、その案についても説明が必要]]"],["売買6","[[計画修繕積立金]]の規約の定めがあるときは、その内容及びすでに積み立てられている額\n・滞納がある場合は金額を告げなければならない\n※[[規約が案の段階でも、その案についても説明が必要]]"],["売買7","区分所 ればならない"],["市街地開発事業","[[市街化区域]]または[[非線引き区域]]内において定められる\n[[市街化調整区域]]や[[準都市計画区域]]では定められない"]]},{"id":"city_p2_2","title":"都市計画・開発許可｜まとめ2 都市計画の決定手続き","items":[["都市計画の決定","都市計画は[[都道府県]]または[[市町村]]が決定します。"],["2以上の都府県","[[2以上]]の都府県にまたがる都市計画区域内の都市計画は、都道府県に代わって[[国土交通大臣]]及び[[市町村]]が決定します。"],["提案できる者","都市計画の決定や変更を[[提案]]ができる者は、土地の[[所有者]]・[[借地権者]]・[[NPO法人（特定非営利活動法人）]]などです。"]]},{"id":"city_p2_3","title":"都市計画・開発許可｜まとめ3 都市計画事業","items":[["都市計画施設","①[[都市計画施設]]（都市計画で定められた施設）\n例）公園、交通施設、水道・ガスの供給施設、学校、図書館　など"],["市街地開発事業","②[[市街地開発事業]]（積極的な街づくりの事業）\n[[市街化区域]]内または[[非線引き区域]]内においてのみ定められる\n例）新住宅市街地開発事業（ニュータウンづくり）、土地区画整理事業、市街地再開発事業　など"],["都市計画制限","[[都市計画事業]]が行われるときに加えられる制限を[[都市計画制限]]といいます。建築や造成などを行う場合に、あらかじめ、[[都道府県知事]]や、市の区域内においては[[市の長]]の[[許可]]を受ける必要があります。"]]},{"id":"city_p2_4","title":"都市計画・開発許可｜まとめ4 開発許可","items":[["開発許可","開発行為をする者が[[都道府県知事等]]の[[許可]]を受けること"],["開発行為","主として、[[建築物]]の建築、または、[[特定工作物]]の建設の用に供する目的で行う[[土地の区画形質の変更]]（区画の変更・形の変更・質の変更）"],["特定工作物","[[第一種特定工作物]]と[[第二種特定工作物]]"],["区画の変更","例）宅地を分割して道路を配置"],["形の変更","例）のり面を切土"],["質の変更","例）農地（畑）を宅地化"],["建築物の建築","一戸建て、ビル、マンションの新築、増改築、移転など"],["第一種特定工作物","コンクリートプラント、アスファルトプラントなど"],["第二種特定工作物","[[ゴルフコース（規模に関わらず）]]\n[[運動・レジャー施設]]（野球場、庭球場、遊園地など）、[[墓園（1ha以上）]]\n※1ha＝10,000㎡（例：100m×100mの土地）"],["小規模・市街化区域","[[1,000㎡未満]]\n・三大都市圏の一定区域は[[500㎡未満]]\n・都道府県は条例で300㎡以上1,000㎡未満の範囲で定めることができる"],["小規模・市街化調整区域","[[例外なし]]"],["小規模・非線引き区域","[[3,000㎡未満]]"],["小規模・準都市計画区域","[[3,000㎡未満]]"],["小規模・それ以外の区域","[[10,000㎡未満]]"],["農林漁業用の建築物・市街化区域","[[例外なし]]"],["農林漁業用の建築物・その他の区域","[[農林漁業用]]の建築物（畜舎、温室、サイロ、農機具収納施設など）を建築するために行う開発行為や、農林漁業を営む者の[[居住用建築物]]を建築するために行う開発行為は[[許可不要]]\n・処理、貯蔵、加工のための建築物は[[許可必要]]"],["その他の許可不要の例外①","[[公益上必要な建築物]]を建築するための開発行為（駅舎、図書館、公民館、変電所等）"],["その他の許可不要の例外②","[[都市計画事業]]や[[土地区画整理事業等]]の施行として行う開発行為"],["その他の許可不要の例外③","[[非常災害のため必要な応急措置]]として行う開発行為"],["その他の許可不要の例外④","通常の管理行為、軽易な行為等（仮設建築物や車庫等の建築）"],["判定の順序","[[開発行為に該当するか？]] → 該当する → [[許可不要の例外に該当するか？]] → 該当しない → [[開発許可必要]]"]]},{"id":"city_p2_5","title":"都市計画・開発許可｜まとめ5 開発許可の手続き","items":[["申請前①","開発行為に[[関係がある既存]]の公共施設の管理者⇒[[協議]]と[[同意]]が必要"],["申請前②","開発行為により[[将来設置される]]公共施設を管理することとなる者⇒[[協議]]が必要"],["申請書の内容①","予定建築物等の[[用途]]（[[構造、設備等は不要]]）"],["申請書の内容②","開発区域の[[位置、区域、規模]]"],["申請書の内容③","開発行為に関する[[設計]]\n※[[1ha以上]]の開発行為の場合は、一定の資格を有する者が作成した設計図書が必要となる"],["申請書の内容④","[[工事施行者]]"],["提出方法","[[協議書]]や[[同意書]]も添付して、[[書面]]で提出する"],["工事完了の届出","[[都道府県知事等]]に工事が完了した旨の[[届出]]が必要"],["完了検査","[[都道府県知事等]]は遅滞なく、[[検査]]しなければならない"],["検査済証","工事の内容が、開発許可の内容に適合していると認めたとき⇒[[検査済証]]を開発許可を受けた者に[[交付]]しなければならない"],["工事完了の公告","[[都道府県知事等]]は遅滞なく、工事が完了した旨の[[公告]]をしなければならない"],["管理・用地の帰属①","公共施設を作った場合、管理や用地の帰属は、工事完了の公告の日の[[翌日]]となる"],["管理・用地の帰属②","公共施設は、原則、その施設がある[[市町村]]が管理する"],["管理・用地の帰属③","公共施設の用地の所有権は、原則、公共施設の[[管理者]]に帰属する"]]},{"id":"city_p2_6","title":"都市計画・開発許可｜まとめ6 開発行為に関連した建築規制","items":[["建築規制を受ける場所①","[[開発許可を受けた開発区域内]]"],["工事完了の公告前・原則","開発許可を受けた開発区域内では、[[工事完了の公告]]があるまでは、建築物の建築・特定工作物の建設は[[できない]]"],["工事完了の公告前・例外①","工事用[[仮設建築物]]を建設するとき"],["工事完了の公告前・例外②","[[都道府県知事]]が支障がないと認めたとき"],["工事完了の公告前・例外③","開発行為に[[同意していない土地所有者等]]がその権利を行使して建築するとき"],["工事完了の公告後・原則","開発許可申請書に記載した[[予定建築物・特定工作物]]以外のものは新築・新設できない。また、[[改築・用途変更]]して、予定以外の建築物にすることも禁止"],["工事完了の公告後・例外①","[[都道府県知事]]が許可したとき"],["工事完了の公告後・例外②","[[用途地域等]]が定められているとき"],["建築規制を受ける場所②","[[市街化調整区域のうち開発許可を受けた開発区域以外]]"],["調整区域・原則","都道府県知事等の[[許可]]がなければ、建築物の[[新築、改築、用途変更]]、[[第一種特定工作物]]の新設はできない"],["調整区域・例外①","[[農林漁業用]]の建築物（畜舎、温室、サイロ、農機具収納施設など）"],["調整区域・例外②","農林漁業を営む者の[[居住用建築物]]"],["調整区域・例外③","[[公益上必要な建築物]]（駅舎、図書館、公民館、変電所等）"],["調整区域・例外④","[[都市計画事業]]の施行として行う建築物の新築"],["調整区域・例外⑤","[[非常災害]]のため必要な応急措置として行う建築物"],["調整区域・例外⑥","通常の[[管理行為、軽易な行為等]]（仮設建築物の建築、車庫の建設）\n※①〜⑥は[[開発許可不要]]"]]}];
const KEY='takken_v4_progress';
let sec=0,level=1,filter='all';
let progress={};
try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const key=(sid,n)=>sid+'::'+n;
const get=(sid,n)=>progress[key(sid,n)]||'';
const save=()=>{localStorage.setItem(KEY,JSON.stringify(progress));updateScore()};

function shortTitle(t){
  return t.replace('35条書面｜','35条 ').replace('指定流通機構（REINS）｜','REINS ').replace('媒介契約｜','媒介 ');
}
function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  DATA.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===sec?' active':'');
    b.textContent=shortTitle(s.title);
    b.onclick=()=>{
      sec=i;renderTabs();render();
      if(window.innerWidth<700) document.getElementById('panel').classList.remove('open');
    };
    t.appendChild(b);
  });
}

document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{
  level=+b.dataset.level;
  document.querySelectorAll('.level').forEach(x=>x.classList.toggle('active',x===b));
  render();
  if(window.innerWidth<700) document.getElementById('panel').classList.remove('open');
});
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{
  filter=b.dataset.filter;
  document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));
  render();
});

function parsed(raw){
  return esc(raw).replace(/\[\[(.*?)\]\]/gs,'<span class="cloze">$1</span>')
                 .replace(/\(\((.*?)\)\)/gs,'<span class="extra">$1</span>');
}
function updateScore(){
  const s=DATA[sec];let ok=0,ng=0,un=0;
  s.items.forEach(([n])=>{const v=get(s.id,n);if(v==='ok')ok++;else if(v==='ng')ng++;else un++});
  document.getElementById('score').textContent=`○${ok} ×${ng} 未${un}`;
}
function applyCardMark(card,sid,n){
  const v=get(sid,n);
  card.classList.remove('ok','ng');
  if(v) card.classList.add(v);
  const ok=card.querySelector('.mark.ok');
  const ng=card.querySelector('.mark.ng');
  if(ok) ok.classList.toggle('sel',v==='ok');
  if(ng) ng.classList.toggle('sel',v==='ng');
  if(filter==='ng') card.style.display=(v==='ng')?'':'none';
  else if(filter==='un') card.style.display=v?'none':'';
  else card.style.display='';
}
function setMark(card,sid,n,val){
  const k=key(sid,n);
  if(progress[k]===val) delete progress[k]; else progress[k]=val;
  save();
  applyCardMark(card,sid,n);
}
function render(){
  const s=DATA[sec];
  document.getElementById('current').textContent=shortTitle(s.title);
  const root=document.getElementById('cards');root.innerHTML='';
  let shown=0;
  s.items.forEach(([n,raw])=>{
    const v=get(s.id,n);
    if(filter==='ng'&&v!=='ng')return;
    if(filter==='un'&&v)return;
    shown++;
    const c=document.createElement('div');c.className='card '+(v||'');
    const row=document.createElement('div');row.className='row';
    const num=document.createElement('div');num.className='num';num.textContent=n;
    const txt=document.createElement('div');txt.className='text';
    if(level===3) txt.innerHTML='<span class="adv">この項目の内容を頭の中で再現</span>';
    else{
      txt.innerHTML=parsed(raw);
      if(level===2) txt.querySelectorAll('.extra').forEach(x=>x.classList.add('hide'));
    }
    row.append(num,txt);

    const ac=document.createElement('div');ac.className='actions';
    const ans=document.createElement('button');ans.className='answer';ans.textContent='答えを表示';
    let answerShown=false;
    function hideAnswer(){
      if(level===3){
        txt.innerHTML='<span class="adv">この項目の内容を頭の中で再現</span>';
      }else{
        txt.innerHTML=parsed(raw);
        if(level===2) txt.querySelectorAll('.extra').forEach(x=>x.classList.add('hide'));
      }
      answerShown=false;
      ans.textContent='答えを表示';
    }
    function showAnswer(){
      if(level===3){
        txt.innerHTML=parsed(raw);
        txt.querySelectorAll('.cloze').forEach(x=>x.classList.add('show'));
      }else{
        txt.querySelectorAll('.cloze').forEach(x=>x.classList.add('show'));
        txt.querySelectorAll('.extra').forEach(x=>x.classList.remove('hide'));
      }
      answerShown=true;
      ans.textContent='答えを隠す';
    }
    ans.onclick=()=>{answerShown ? hideAnswer() : showAnswer()};
    const ok=document.createElement('button');ok.className='mark ok'+(v==='ok'?' sel':'');ok.textContent='○';ok.onclick=()=>setMark(c,s.id,n,'ok');
    const ng=document.createElement('button');ng.className='mark ng'+(v==='ng'?' sel':'');ng.textContent='×';ng.onclick=()=>setMark(c,s.id,n,'ng');
    ac.append(ans,ok,ng);
    c.append(row,ac);root.appendChild(c);
    applyCardMark(c,s.id,n);
  });
  if(!shown){root.innerHTML='<div class="empty">該当する項目はありません。</div>'}
  updateScore();
}

document.getElementById('menuBtn').onclick=()=>document.getElementById('panel').classList.toggle('open');

document.getElementById('reset').onclick=()=>{
  const s=DATA[sec];
  if(!confirm('この分野の○×記録を消しますか？'))return;
  s.items.forEach(([n])=>delete progress[key(s.id,n)]);
  save();render();
};
document.getElementById('backup').onclick=()=>{
  const blob=new Blob([JSON.stringify(progress)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='takken_progress.json';a.click();
};
document.getElementById('restoreBtn').onclick=()=>document.getElementById('restore').click();
document.getElementById('restore').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{progress=JSON.parse(await f.text());save();render();alert('復元しました')}catch(err){alert('読み込めませんでした')}
};
renderTabs();render();
</script></body></html>
