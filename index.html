まとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","対象不動産が土地のみの場合は、[[造成地、埋立地]]などのときには適用できる\n[[既成市街地]]の土地は再調達原価を算定するのが難しいため、原価法は[[適用しない]]",{"prompt":"原価法：土地だけの不動産","pages":[532],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","環境の変化が価格水準に影響を与えていると認められる場合は、地域要因の変化の程度に応じた増加額を[[熟成度]]として[[加算]]できる",{"prompt":"原価法：熟成度の調整","pages":[532],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","[[事情補正]]および[[時点修正]]を行い、かつ、地域要因の比較および個別的要因の比較を行って求められた価格を比較考量して、対象不動産の試算価格を求める手法です。",{"prompt":"取引事例比較法：事例に行う修正","pages":[533],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","取引事例は正常なもの、または正常なものに補正できるものを収集・選択する。[[投機的取引事例は含まない]]",{"prompt":"取引事例比較法：投機的取引事例","pages":[533],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","対象不動産が将来生み出すであろうと期待される[[純収益の現在価値の総和]]を求めることにより、対象不動産の試算価格を求める手法です。",{"prompt":"収益還元法：求めるもの","pages":[533],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","市場性を有しない不動産（文化財の指定を受けた建造物など）[[以外]]のものには、基本的に[[すべて適用すべき]]とされる",{"prompt":"収益還元法：適用の原則","pages":[533],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","自用の不動産の価格を求める場合にも、[[賃貸を想定]]することによって[[適用することができる]]",{"prompt":"収益還元法：自用の不動産","pages":[533],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","その不動産の効用が[[最高度]]に発揮される可能性に最も富む使用を前提として把握される価格を標準として形成され、これを[[最有効使用の原則]]という",{"prompt":"最有効使用の原則","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","市場性を[[有する]]不動産について、現実の社会経済情勢の下で[[合理的]]と考えられる条件を満たす市場で形成されるであろう市場価値を表示する適正な価格",{"prompt":"正常価格：市場性と合理的条件","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","不動産と取得するほかの不動産との[[併合または分割等]]に基づき、正常価格と同一の市場概念の下において、形成されるであろう市場価値と[[乖離]]することにより、市場が相対的に[[限定]]される場合における取得部分の当該市場限定に基づく市場価格",{"prompt":"限定価格：市場が限定される原因","pages":[537],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["15","市場性を[[有する]]不動産について、法令等による[[社会的要請]]を背景とする鑑定評価[[目的]]のもとで、正常価格の前提となる諸条件を[[満たさない]]ことにより、正常価格と同一の市場概念のもとに、形成されるであろう市場価値と[[乖離]]することとなる価格",{"prompt":"特定価格：条件と鑑定評価目的","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","文化財等の一般的に市場性を[[有しない]]不動産について、その利用現況等を前提とした不動産の経済価値を適正に表示する価格",{"prompt":"特殊価格：市場性","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"land_price","title":"その他｜地価公示法","group":"税・その他","items":[["1","標準地を選定し、その[[正常価格]]を公示すること",{"prompt":"地価公示：公示する価格","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","標準地の[[1㎡当たり]]の土地の価格が示される",{"prompt":"公示価格：表示の単位","pages":[534],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","建物等の定着物や地上権等の使用収益を制限する権利が存する場合には、これらの定着物または権利が[[存しないもの]]として通常成立すると認められる価格をいう",{"prompt":"標準地の正常価格：建物・権利の取扱い","pages":[534,542],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","公示価格を[[指標]]として取引するよう[[努めなければならない]]",{"prompt":"一般の土地取引：公示価格の効力","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","不動産鑑定士が公示区域内の土地について鑑定評価を行う場合⇒当該土地の正常な価格を求めるとき\n公共事業の用に供する土地の取得価格の算定や、収用する土地に対する補償金額を算定するとき\n公示価格を[[規準としなければならない]]",{"prompt":"鑑定・公共事業等：公示価格の効力","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","[[土地鑑定委員会]]が選定する",{"prompt":"標準地の選定者","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","土地鑑定委員会は[[毎年1回]]、[[2人以上]]の不動産鑑定士に鑑定評価を求める",{"prompt":"標準地の鑑定評価：回数・鑑定士の人数","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","[[土地鑑定委員会]]は、提出を受けた鑑定評価の結果を審査し、必要な調整を行って[[正常な価格]]を判定する",{"prompt":"正常価格の判定者","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","毎年1回、土地鑑定委員会は[[官報]]で地価公示を行う",{"prompt":"地価公示：公示する媒体","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","関係市町村長は図書を市町村の事務所において、一般の閲覧に[[3年間]]公開する",{"prompt":"地価公示の図書：閲覧期間","pages":[535],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"housing_finance","title":"免除科目｜住宅金融支援機構","group":"5問免除科目","items":[["1","原則として、[[直接的には個人向け融資を行わず]]、[[間接的]]に一般の金融機関による個人への融資の支援を行います",{"prompt":"住宅金融支援機構：直接・間接の原則","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","民間の金融機関による融資が[[困難]]な分野に限り、一般の金融機関による融資の[[補完]]のための[[直接融資業務]]を行います。",{"prompt":"直接融資：例外となる分野","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","民間金融機関から個人の[[住宅ローン債権]]を[[買い取り]]、信託した上で証券化し、その担保とした証券（[[MBS]]：資産担保証券）を売却し、債券市場（[[投資家]]）から資金を調達しています。",{"prompt":"証券化支援業務：買い取るもの","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","住宅の建設・購入に[[付随して]]取得する[[土地や借地権]]の取得資金についても可能。ただし、土地の購入資金[[のみ]]の融資は[[できない]]。",{"prompt":"フラット35：土地・借地権取得費","pages":[548,556],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去に質問・誤答が確認できた論点。住宅と一緒に取得する土地は対象に含まれます。「土地が入るから不可」と「土地だけの購入」を分けて判断します。"}],["5","[[中古住宅]]の購入資金としても使えるが、住宅の[[改良（リフォーム）]]の資金としては[[使えない]]。ただし、住宅の購入と[[あわせて行う]]リフォームや、[[高齢者]]が住みやすくなるリフォームは対象となる。",{"prompt":"フラット35：中古住宅・リフォーム","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","賃貸住宅を建設・購入するための資金としては[[使えない]]",{"prompt":"フラット35：賃貸住宅","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","ローンの[[借換えにも使える]]",{"prompt":"フラット35：ローンの借換え","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","一戸建て等→[[70㎡以上]]\nマンションなど共同住宅→[[30㎡以上]]",{"prompt":"フラット35：対象住宅の床面積","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","一部分を店舗や事務所と併用する場合は、住宅部分の床面積が全体の[[2分の1以上]]であること",{"prompt":"フラット35：店舗・事務所との併用","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","全国一律[[100万円以上8,000万円以下]]で、建設費や購入価額の[[100％]]までOK",{"prompt":"フラット35：融資額の範囲","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","原則：「[[15年以上35年以内]]」もしくは「完済時の年齢が[[80歳]]となるまでの年数」のどちらか[[短いほう]]",{"prompt":"フラット35：借入期間","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","[[全期間固定金利]]。金利は金融機関によって[[異なり]]、申込みの[[受付時ではなく]]、資金[[受取り時]]点の金利が適用される",{"prompt":"フラット35：金利と適用時点","pages":[548],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","元利均等返済と[[元金均等返済]]の[[2つ]]があります。",{"prompt":"住宅ローン債権の償還方法","pages":[554,556],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の「元利金」の質問への補足。元金は借りたお金、利息は借りるために払うお金、元利金はその合計。元利均等と元金均等の名前を分けて覚えます。"}],["14","[[災害復興建築物]]の建設・購入、[[被災建築物]]の補修に必要な資金の貸付け",{"prompt":"直接融資：災害復興・被災建築物","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["15","合理的土地利用建築物の建設、または[[マンションの共用部分の改良]]に必要な資金の貸付け",{"prompt":"直接融資：マンション共用部分","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","高齢者の家庭に適した良好な居住性能、および居住環境を有する住宅とすることを主たる目的とする住宅の[[改良]]（[[高齢者自ら居住する住宅]]について行うものに限る）に必要な資金の貸付け",{"prompt":"直接融資：高齢者の居住住宅の改良","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["17","住宅の[[エネルギー消費性能の向上]]を主たる目的とする住宅の改良に必要な資金の貸付け",{"prompt":"直接融資：省エネルギー住宅の改良","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["18","証券化支援業務（買取型）と直接融資業務の共通点として、高齢者が亡くなったときに借入金を[[一括して返済]]する制度があります",{"prompt":"高齢者：死亡時の一括返済制度","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の「何がメリット？」「家族への影響は？」への補足。生存中の毎月の返済負担を抑え、死亡時に元金をまとめて返す仕組みとして説明しました。借金が自動で免除される意味ではありません。家族への具体的な責任は、個々の契約条件によるためここでは断定しません。"}],["19","融資を受けた者と[[あらかじめ契約]]を締結して、その者が[[死亡]]した場合（[[重度障害も含む]]）に支払われる生命保険の保険金を、貸付債務の[[弁済]]に充てるものです。",{"prompt":"団体信用生命保険：死亡以外の給付事由","pages":[556],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["20","空家等及び空家等の跡地の活用推進に必要な[[資金の融通]]に関する[[情報の提供]]その他の援助を行っています。",{"prompt":"空家等：機構の支援業務","pages":[556],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"ads_display","title":"免除科目｜広告表示・景品表示法","group":"5問免除科目","items":[["1","豪華すぎる[[景品]]の提供や[[誇大広告]]を禁止する法律",{"prompt":"景品表示法：禁止される行為","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","[[内閣総理大臣]]は事業者に対して指示命令を出すことができます。指示命令は違反行為が[[すでになくなっている]]場合も出せます。",{"prompt":"景品表示法：指示命令の権限","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","物件が公園、庭園、旧跡その他の施設または海（海岸）、湖沼もしくは河川の岸・堤防から[[直線距離で300m以内]]に所在している場合は、これらの名称を用いることができる",{"prompt":"公園・庭園・海等の名称：表示できる距離","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","物件から[[直線距離で50m以内]]に所在する街道その他の道路の名称（坂を含む。）を用いることができる",{"prompt":"街道等の名称：表示できる距離","pages":[549],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","デパート、スーパーマーケット、商店街の商業施設は、[[現に利用できる]]ものを、物件からの[[道路距離または徒歩所要時間]]を明示して表示しなければならない",{"prompt":"スーパー等：表示できる施設","pages":[550],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","将来確実に利用できると認められる場合は、その[[整備予定時期]]を明示すれば表示することができる",{"prompt":"工事中の商業施設：表示の条件","pages":[550],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","徒歩による所要時間は[[道路距離80mにつき1分間]]を要するものとして算出した数値を表示する。1分未満の端数が生じたときは[[1分]]として算出する",{"prompt":"徒歩所要時間：距離・端数","pages":[550],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","建築工事完了後[[1年未満]]であって、[[居住の用に供されたことがない]]もの",{"prompt":"広告：新築の定義","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","地目は[[登記簿]]に記載されているものを表示する（[[現況]]の地目と異なる場合は、現況の地目も併記する）",{"prompt":"広告：地目の表示","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","建物の面積（マンションは専有面積）は[[延べ面積]]を表示し、これに[[車庫、地下室等]]（地下居室を除く）の面積を含むときは、その旨およびその面積を表示しなければならない。",{"prompt":"広告：建物面積の表示","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","[[1戸当たり]]の価格を表示し、取引する[[すべての住戸]]の価格を表示しなければならない。",{"prompt":"広告：通常の住宅価格表示","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","取引するすべての住戸の[[1か月当たり]]の賃料を表示する。",{"prompt":"広告：賃貸住宅の賃料表示","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","その本広告に先立ち、その[[取引開始時期をあらかじめ告知]]する広告表示のこと",{"prompt":"広告：予告広告の取引開始前","pages":[550],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","一定期間内に指定の建築業者との間で[[建築請負契約]]が成立することを[[条件]]として売買される土地のこと",{"prompt":"建築条件付土地：成立する契約","pages":[550],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["15","物件が[[存在しない]]ため、実際には取引することができない物件",{"prompt":"おとり広告：存在しない物件","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","物件は存在するが、実際には取引の[[対象となりえない]]物件",{"prompt":"おとり広告：取引対象とならない物件","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["17","物件は存在するが、実際には取引する[[意思がない]]物件",{"prompt":"おとり広告：取引の意思がない物件","pages":[551],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"ads_prices","title":"免除科目｜二重価格・景品限度額","group":"5問免除科目","items":[["1","過去の販売価格の[[公表日]]および[[値下げした日]]を明示すること",{"prompt":"過去の販売価格との比較：表示する日付","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","値下げの[[直前]]の価格であって、かつ値下げ前[[2か月以上]]にわたり実際に販売のために公表していた価格であること",{"prompt":"過去の販売価格：販売していた期間","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","値下げの日から[[6か月以内]]に表示するものであること",{"prompt":"二重価格：値下げ日からの表示期間","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","取引価額の[[20倍]]、または[[10万円]]のいずれか[[低い額]]",{"prompt":"懸賞によって提供する景品：個別の限度額","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","提供できる景品類の総額は、懸賞に係る取引予定総額の[[100分の2以内]]とする",{"prompt":"懸賞によって提供する景品：総額の限度","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","取引価額の[[10分の1]]、または[[100万円]]のいずれか[[低い額]]",{"prompt":"懸賞によらない景品：限度額","pages":[552],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"land_features","title":"免除科目｜土地・地形・災害","group":"5問免除科目","items":[["1","一般に水はけがよく、地耐力もあり、洪水や地震に対する安全度も比較的高いので、一般的には宅地として[[適している]]",{"prompt":"宅地適性：丘陵地・台地・段丘","pages":[568],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","[[縁辺部]]（台地等の端で崖崩れの危険がある場所）や[[谷地]]（浅い谷で地盤が軟弱な場所）は、宅地には[[適さない]]",{"prompt":"台地等：縁辺部・谷地の例外","pages":[568],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","扇状地の中の[[微高地、自然堤防]]、廃川敷となった旧天井川、砂丘、砂州などは、比較的[[宅地に適している]]",{"prompt":"扇状地・自然堤防：宅地適性","pages":[568],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","埋立地は干拓地と異なり、立地が海面より高いことが多いので、[[干拓地よりは安全]]",{"prompt":"埋立地と干拓地：安全性の比較","pages":[568],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","標高の低い[[デルタ地域、旧河道]]、沼沢地、自然堤防に囲まれた[[後背湿地]]などは、とりわけ宅地に適さない",{"prompt":"低地：宅地に不適な地形","pages":[568],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","粒径のそろった[[砂地盤]]で、[[地下水位の高い、地表から浅い地域]]で発生しやすく、これにより建物の[[傾斜や沈下]]などが起こります。",{"prompt":"液状化：起こりやすい地盤","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の土地分野の説明と対応する補足。「水分が多い、緩い砂地盤、地震の揺れ」の組合せで理解すると、地形名だけの丸暗記を減らせます。"}],["7","斜面崩壊によってできた地形。再度、崩壊のおそれがあるので、宅地には[[適していない]]",{"prompt":"崩壊跡地：宅地適性","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","地盤の強度が安定していないため、断層に沿った崩壊や[[地すべり]]が発生する可能性が[[高い]]",{"prompt":"断層周辺：災害の可能性","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","集中豪雨のときは[[土石流]]が発生する危険性が高く、一般に宅地には[[適していない]]",{"prompt":"崖錐：集中豪雨時の災害","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","急傾斜については等高線の間隔が[[密]]となっているのに対し、傾斜が緩やかな土地については等高線は[[疎]]となっている",{"prompt":"等高線：急斜面と緩斜面","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","等高線が山頂に向かって高いほうに弧を描いている部分は[[谷]]で、山頂から見て等高線が張り出している部分は[[尾根]]となる",{"prompt":"等高線：谷と尾根","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"building_structures","title":"免除科目｜建物の構造・材料","group":"5問免除科目","items":[["1","[[耐火性、耐久性]]があり、[[耐震性、耐風性]]にも優れた構造です。",{"prompt":"鉄筋コンクリート造：主な性能","pages":[569],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","錆を防いでいるコンクリートの[[アルカリ性]]が、空気中の[[炭酸ガス]]によって失われて[[中性化]]することを防ぐ必要がある",{"prompt":"鉄筋コンクリート：中性化","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","[[酸、塩分、有機物、泥土]]を含んではならない",{"prompt":"鉄筋コンクリート：混ぜてはいけないもの","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","鉄筋の末端は、原則として[[かぎ状]]に折り曲げて、コンクリートから抜け出さないように定着させなければならない",{"prompt":"鉄筋：末端の定着","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","原則として主筋は[[4本以上]]でなければならない",{"prompt":"鉄筋コンクリート柱：主筋の本数","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","耐力壁・柱・はりにあっては[[3センチ以上]]としなければならない",{"prompt":"鉄筋コンクリート：かぶり厚さ","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","鉄筋コンクリート造と比較して、工期が[[短く]]建設コストが[[安い]]ですが、耐震性や耐火性に[[やや劣ります]]。",{"prompt":"補強コンクリートブロック造：特徴","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","自重が[[小さく]]、靭性が[[大きい]]ことから、大空間の建築、高層建築に使用されます。",{"prompt":"鉄骨造：重さと靭性","pages":[570,580],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","耐火性が[[低い]]ため、[[耐火被覆]]が必要という短所があります",{"prompt":"鉄骨造：耐火性の弱点","pages":[580],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","柱とはりを組み合わせた[[直方体]]で構成する骨組み",{"prompt":"ラーメン構造：骨組み","pages":[570,580],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","細長い部材を[[三角形]]に組み合わせた構成の構造",{"prompt":"トラス構造：骨組み","pages":[570,580],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","[[アーチ形]]の骨組みで、スポーツ施設のような[[大空間]]を構成するのに適した構造",{"prompt":"アーチ構造：適する建物","pages":[570,580],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","木造軸組工法、[[枠組壁工法]]（[[ツーバイフォー工法]]）、集成木材工法",{"prompt":"木造：主な工法","pages":[570],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","圧縮に対する強度は繊維に対して直角方向に比べ、[[繊維方向の方が強い]]",{"prompt":"木材：繊維と圧縮の強さ","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の「木の繊維方向」の質問に対応。繊維がどちらに走っていて、どちらから力を掛けるかを分けて考えます。"}],["15","乾燥状態に比べて湿潤状態のほうが強度が[[小さく]]、湿潤状態ではシロアリなどの虫害や腐朽菌の害を受けやすくなる",{"prompt":"木材：乾燥状態と湿潤状態","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","辺材は樹液を多く含み虫害にも弱いため、[[心材よりも腐朽しやすい]]",{"prompt":"木材：辺材と心材","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["17","鉄筋と普通のコンクリートを比較すると、常温常圧において、温度上昇に伴う体積の膨張の程度は[[ほぼ等しい]]",{"prompt":"鉄とコンクリート：熱膨張","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["18","圧縮強度は[[強い]]が、引張強度は[[弱い]]",{"prompt":"コンクリート：圧縮と引張り","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["19","炭素含有量が多いほど、引張強度、硬度が[[増大]]する傾向にある",{"prompt":"鋼材：炭素量と性能","pages":[571],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"building_wood_quake","title":"免除科目｜木造・耐震・基礎","group":"5問免除科目","items":[["1","[[柱]]（縦の構造材）に[[はり]]（横の構造材）を組み合わせて建てる工法です。",{"prompt":"木造軸組工法：組み合わせる構造材","pages":[581],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","原則、2階建ての木造建築物の土台は、基礎に[[緊結]]しなければなりませんが、例外的に[[物置や納屋（10㎡以内）]]などの建物の場合は行う必要はありません。",{"prompt":"木造2階建て：土台と基礎","pages":[581],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","はり、けたなどの横架材には、中央部付近の下側に耐力上支障のある[[欠込み]]をしては[[なりません]]。",{"prompt":"横架材：中央付近の下側の欠込み","pages":[581],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の「横架材の欠込み」の再質問に対応。はり・けたは横向きの構造材。問題は「補強すればよい」ではなく、中央部付近の下側に耐力上支障のある欠込みをしないという規定です。"}],["4","壁で支える仕組みのため、耐震性が[[高く]]、[[通し柱の必要もない]]とされています。",{"prompt":"枠組壁工法：壁と通し柱","pages":[581],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","建物の柱、はり、耐震壁などで[[剛性を高め]]、地震に対して十分耐えられるようにした構造",{"prompt":"耐震構造：方法","pages":[571,583],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の耐震・制震・免震の質問に対応。耐震は建物で耐える、制震は揺れを抑える、免震は揺れを伝えにくくする、と対応づけます。"}],["6","[[制震ダンパー]]などを設置し、揺れを[[制御]]する構造",{"prompt":"制震構造：使う装置","pages":[571,583],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","建物の下部構造と上部構造との間に[[積層ゴム]]などを設置し、揺れを[[減らす]]構造",{"prompt":"免震構造：装置の位置と働き","pages":[571,583],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","既存不適格建築物の耐震補強の方法としても、制震構造や免震構造は[[適している]]",{"prompt":"既存不適格建築物：制震・免震による補強","pages":[583,584],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の既存不適格と耐震補強の質問に対応。古い建物だから制震・免震が使えない、という判断はしません。既存不適格の意味は建築基準法の補足でも確認できます。"}],["9","[[筋かい]]を入れた壁を均等に配置する\n※真壁造りより[[大壁造り]]のほうが耐震的",{"prompt":"木造の耐震補強：壁","pages":[583],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","[[アンカーボルト]]で基礎に緊結する",{"prompt":"木造の耐震補強：土台","pages":[583],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","立ち上がっている部分と床一面を鉄筋を入れたコンクリートで一体化して、大きな[[面]]で家の重みを支える",{"prompt":"ベタ基礎：支え方","pages":[584],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の基礎の説明に対応。ベタ基礎は床下を面で支えるイメージ、布基礎は壁の下などに沿って支えるイメージで比較します。"}],["12","[[連続基礎]]ともいわれ、壁の下などに連続して設けられるが、住宅を支えるのは立ち上がっている部分のみ。鉄筋もここだけに入っていて、ベタ基礎が面で建物を支えるとしたら、布基礎は[[点]]で支える",{"prompt":"布基礎：別名と支え方","pages":[584],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]}];
DATA.push({id:'prediction',title:'予想問題',group:'予想問題',items:[["q2_option1","営業を許された未成年者が、その営業に関する意思表示をした時に意思能力を有しなかった場合は、その法律行為は無効である。",{"qnum":2,"label":"1","title":"意思表示","stem":"法律行為に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。意思表示をした時に意思能力を有しなかった場合、その法律行為は無効となります。","pending":false}],["q2_option3","詐欺による意思表示は取り消すことによってはじめから無効であったとみなされるのに対し、強迫による意思表示は取り消すまでもなく無効である。",{"qnum":2,"label":"3","title":"意思表示","stem":"法律行為に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。詐欺による意思表示も強迫による意思表示も取り消した場合、はじめから無効であったとみなされます。取り消すまでもなく無効とはなりません。","pending":false}],["q2_option4","他人が所有している土地を目的物にした売買契約は無効であるが、当該他人がその売買契約を追認した場合にはその売買契約は有効となる。",{"qnum":2,"label":"4","title":"意思表示","stem":"法律行為に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。民法では、他人が所有している土地を目的物にした売買契約は有効となります。これを他人物売買といい、追認なしで有効となります。","pending":false}],["q3_option1","Aは、Bに対し、乙建物の築造行為は、甲土地に対するAの抵当権を侵害する行為であるとして、乙建物の収去を求めることができる。",{"qnum":3,"label":"1","title":"抵当権","stem":"Aは、Bに対する貸付金債権の担保のために、当該貸付金債権額にほぼ見合う評価額を有するB所有の更地である甲土地に抵当権を設定し、その旨の登記をした。その後、Bはこの土地上に乙建物を築造し、自己所有とした。この場合、民法の規定及び判例によれば、次の記述のうち正しいものはどれか。","answer":"❌誤り","explanation":"誤り。抵当権設定者が抵当権の設定されている土地に建物を築造する行為は、通常に使用収益する行為です。この場合、抵当権者は妨害排除請求をすることができません。よって、乙建物の収去を求めることはできません。","pending":false}],["q3_option2","Bが、甲土地及び乙建物の双方につき、Cのために抵当権を設定して、その旨の登記をした後（甲土地についてはAの後順位）、Aの抵当権が実行されるとき、乙建物のために法定地上権が成立する。",{"qnum":3,"label":"2","title":"抵当権","stem":"Aは、Bに対する貸付金債権の担保のために、当該貸付金債権額にほぼ見合う評価額を有するB所有の更地である甲土地に抵当権を設定し、その旨の登記をした。その後、Bはこの土地上に乙建物を築造し、自己所有とした。この場合、民法の規定及び判例によれば、次の記述のうち正しいものはどれか。","answer":"❌誤り","explanation":"誤り。Aの抵当権が設定されたとき、土地は更地だったので、法定地上権は成立しません。","pending":false}],["q3_option3","Bが、乙建物築造後、甲土地についてのみ、Dのために抵当権を設定して、その旨の登記をした場合（甲土地についてはAの後順位）、Aの抵当権及び被担保債権が存続している状態で、Dの抵当権が実行されるとき、乙建物のために法定地上権が成立する。",{"qnum":3,"label":"3","title":"抵当権","stem":"Aは、Bに対する貸付金債権の担保のために、当該貸付金債権額にほぼ見合う評価額を有するB所有の更地である甲土地に抵当権を設定し、その旨の登記をした。その後、Bはこの土地上に乙建物を築造し、自己所有とした。この場合、民法の規定及び判例によれば、次の記述のうち正しいものはどれか。","answer":"❌誤り","explanation":"誤り。一番抵当権（Aの抵当権）の設定当時は更地であり、その後建物を築造し、二番抵当権（Dの抵当権）を設定しました。この場合、二番抵当権が実行されても法定地上権は成立しません。","pending":false}],["q3_option4","Aは、乙建物に抵当権を設定していなくても、甲土地とともに乙建物を競売することができるが、優先弁済権は甲土地の代金についてのみ行使できる。",{"qnum":3,"label":"4","title":"抵当権","stem":"Aは、Bに対する貸付金債権の担保のために、当該貸付金債権額にほぼ見合う評価額を有するB所有の更地である甲土地に抵当権を設定し、その旨の登記をした。その後、Bはこの土地上に乙建物を築造し、自己所有とした。この場合、民法の規定及び判例によれば、次の記述のうち正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。土地の抵当権設定後に建物が築造された場合、抵当権者は土地とともにその建物を競売することができます。これを一括競売といいます。ただし、その優先弁済権は、甲土地の代金についてのみ行使できます。","pending":false}],["q4_option1","履行の追完請求権、損害賠償請求権、契約の解除権",{"qnum":4,"label":"1","title":"契約不適合責任","stem":"売買契約の目的物が品質に関して契約の内容に適合しない場合において、当該契約不適合が売主及び買主のいずれの責めにも帰することができない事由によるものであるとき、履行の追完請求権、代金の減額請求権、損害賠償請求権及び契約の解除権のうち、民法の規定によれば、買主が行使することができない権利のみを掲げたものとして正しいものは次の記述のうちどれか。なお、上記帰責性以外の点について、権利の行使を妨げる事情はないものとする。","answer":"❌誤り","explanation":"本問は、契約不適合が売主、買主のいずれの責にも帰することができない事由によるものです。つまり、どちらにも責任がない場合において買主が請求できる権利についての問題です。履行の追完請求権、代金の減額請求権、契約の解除権は売主に責任がなくても請求できますが、損害賠償請求権だけは売主に帰責事由がなければ行使することができません。","pending":false}],["q4_option2","代金の減額請求権、損害賠償請求権、契約の解除権",{"qnum":4,"label":"2","title":"契約不適合責任","stem":"売買契約の目的物が品質に関して契約の内容に適合しない場合において、当該契約不適合が売主及び買主のいずれの責めにも帰することができない事由によるものであるとき、履行の追完請求権、代金の減額請求権、損害賠償請求権及び契約の解除権のうち、民法の規定によれば、買主が行使することができない権利のみを掲げたものとして正しいものは次の記述のうちどれか。なお、上記帰責性以外の点について、権利の行使を妨げる事情はないものとする。","answer":"❌誤り","explanation":"本問は、契約不適合が売主、買主のいずれの責にも帰することができない事由によるものです。つまり、どちらにも責任がない場合において買主が請求できる権利についての問題です。履行の追完請求権、代金の減額請求権、契約の解除権は売主に責任がなくても請求できますが、損害賠償請求権だけは売主に帰責事由がなければ行使することができません。","pending":false}],["q4_option3","履行の追完請求権、代金の減額請求権",{"qnum":4,"label":"3","title":"契約不適合責任","stem":"売買契約の目的物が品質に関して契約の内容に適合しない場合において、当該契約不適合が売主及び買主のいずれの責めにも帰することができない事由によるものであるとき、履行の追完請求権、代金の減額請求権、損害賠償請求権及び契約の解除権のうち、民法の規定によれば、買主が行使することができない権利のみを掲げたものとして正しいものは次の記述のうちどれか。なお、上記帰責性以外の点について、権利の行使を妨げる事情はないものとする。","answer":"❌誤り","explanation":"本問は、契約不適合が売主、買主のいずれの責にも帰することができない事由によるものです。つまり、どちらにも責任がない場合において買主が請求できる権利についての問題です。履行の追完請求権、代金の減額請求権、契約の解除権は売主に責任がなくても請求できますが、損害賠償請求権だけは売主に帰責事由がなければ行使することができません。","pending":false}],["q4_option4","損害賠償請求権",{"qnum":4,"label":"4","title":"契約不適合責任","stem":"売買契約の目的物が品質に関して契約の内容に適合しない場合において、当該契約不適合が売主及び買主のいずれの責めにも帰することができない事由によるものであるとき、履行の追完請求権、代金の減額請求権、損害賠償請求権及び契約の解除権のうち、民法の規定によれば、買主が行使することができない権利のみを掲げたものとして正しいものは次の記述のうちどれか。なお、上記帰責性以外の点について、権利の行使を妨げる事情はないものとする。","answer":"⭕正しい","explanation":"本問は、契約不適合が売主、買主のいずれの責にも帰することができない事由によるものです。つまり、どちらにも責任がない場合において買主が請求できる権利についての問題です。履行の追完請求権、代金の減額請求権、契約の解除権は売主に責任がなくても請求できますが、損害賠償請求権だけは売主に帰責事由がなければ行使することができません。","pending":false}],["q5_option1","Bが甲土地をDに賃貸し、引き渡したときは、Bは甲土地の占有を失うので、甲土地の所有権を時効取得することはできない。",{"qnum":5,"label":"1","title":"時効","stem":"AはBに対し、自己所有の甲土地を売却し、代金と引換えにBに甲土地を引き渡したが、その後にCに対しても甲土地を売却し、代金と引換えにCに甲土地の所有権登記を移転した。この場合におけるBによる甲土地の所有権の時効取得に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。Bが甲土地をDに賃貸し引き渡しても、Bは甲土地の占有を失いません。占有は継続しています。これを代理占有といい、Dによる代理占有の期間も時効取得のための占有期間とみなされます。","pending":false}],["q5_option2","Bが、時効の完成前に甲土地の占有をEに奪われたとしても、Eに対して占有回収の訴えを提起して占有を回復した場合には、Eに占有を奪われていた期間も時効期間に算入される。",{"qnum":5,"label":"2","title":"時効","stem":"AはBに対し、自己所有の甲土地を売却し、代金と引換えにBに甲土地を引き渡したが、その後にCに対しても甲土地を売却し、代金と引換えにCに甲土地の所有権登記を移転した。この場合におけるBによる甲土地の所有権の時効取得に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。占有者が時効の完成前に他人に占有を奪われた場合、取得時効が中断します。ただし、占有回収の訴えを提起して占有を回復した場合には、占有を奪われていた期間も時効期間に含めることができます。","pending":false}],["q5_option3","Bが、甲土地の引渡しを受けた時点で所有の意思を有していたとしても、AC間の売買及びCに対する登記の移転を知ったときは、その時点で所有の意思が認められなくなるので、Bは甲土地を時効により取得することはできない。",{"qnum":5,"label":"3","title":"時効","stem":"AはBに対し、自己所有の甲土地を売却し、代金と引換えにBに甲土地を引き渡したが、その後にCに対しても甲土地を売却し、代金と引換えにCに甲土地の所有権登記を移転した。この場合におけるBによる甲土地の所有権の時効取得に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。取得時効は、所有の意思をもって、平穏かつ公然と他人の物を占有した者は、その所有権を取得するというものです。AC間の売買や登記移転を知ったことは、取得時効の進行に影響することはなく、所有の意思が否定されるわけではありません。","pending":false}],["q5_option4","Bが甲土地の所有権を時効取得した場合、Bは登記を備えなければ、その所有権を時効完成時において所有者であったCに対抗することはできない。",{"qnum":5,"label":"4","title":"時効","stem":"AはBに対し、自己所有の甲土地を売却し、代金と引換えにBに甲土地を引き渡したが、その後にCに対しても甲土地を売却し、代金と引換えにCに甲土地の所有権登記を移転した。この場合におけるBによる甲土地の所有権の時効取得に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。Bが甲土地の所有権を時効取得しているので、Cは時効完成前の第三者となります。時効取得者は時効完成前の第三者に対して、登記を備えていなくても所有権を主張することができます。","pending":false}],["q7_option1","甲土地に、その形状又は効用の著しい変更を伴う変更を加える場合には、共有者の過半数の同意が必要であり、本件ではA、B、C3人の同意が必要となる。",{"qnum":7,"label":"1","title":"共有","stem":"甲土地につき、A、B、C、Dの4人がそれぞれ4分の1の共有持分を有していて、A、B、CのいずれもDの所在を知ることができない場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、Dの共有持分は、相続財産には属していないものとする。","answer":"❌誤り","explanation":"誤り。共有物にその形状又は効用の著しい変更を伴う変更を加える場合には、共有者全員の同意が必要です。よって、Dの同意も必要となります。","pending":false}],["q7_option2","甲土地の所有権の登記名義人となっている者が所有者ではないEである場合、持分に基づいてEに対して登記の抹消を求めるためには、所在が判明しているA、B、Cのうち2人の同意が必要である。",{"qnum":7,"label":"2","title":"共有","stem":"甲土地につき、A、B、C、Dの4人がそれぞれ4分の1の共有持分を有していて、A、B、CのいずれもDの所在を知ることができない場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、Dの共有持分は、相続財産には属していないものとする。","answer":"❌誤り","explanation":"誤り。登記の抹消請求は保存行為に該当するので、各共有者が単独で行うことができます。","pending":false}],["q7_option3","A、B、C3人の同意があれば、甲土地を資材置場として賃借したいFとの間で期間を3年とする賃貸借契約を締結することができる。",{"qnum":7,"label":"3","title":"共有","stem":"甲土地につき、A、B、C、Dの4人がそれぞれ4分の1の共有持分を有していて、A、B、CのいずれもDの所在を知ることができない場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、Dの共有持分は、相続財産には属していないものとする。","answer":"⭕正しい","explanation":"正しい。5年以下の土地の賃貸借は管理行為に該当するので、持分価格の過半数で決定することができます。ABC3人の同意があれば、持ち分価格の4分の3になりますので、賃貸借契約を締結することができます。","pending":false}],["q7_option4","Aが裁判所に請求して、裁判所がDの持分をAに取得させる旨の決定をした場合、Dは、その決定から3年以内に限り、Aが取得したDの共有持分の時価相当額をAに対して支払うよう請求することができる。",{"qnum":7,"label":"4","title":"共有","stem":"甲土地につき、A、B、C、Dの4人がそれぞれ4分の1の共有持分を有していて、A、B、CのいずれもDの所在を知ることができない場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。なお、Dの共有持分は、相続財産には属していないものとする。","answer":"❌誤り","explanation":"誤り。共有者は裁判所の決定を得ることで、所在等不明者の持分を取得することができます。ただし、「所在等不明者が取得者に対して持分の時価相当額の支払いを請求する際には3年以内」という制限は、法律上存在しません。消滅時効（知ってから5年、行使できる時から10年）にかかるまでは請求できます。","pending":false}],["q8_option1","不法行為の加害者は、不法行為に基づく損害賠償債務について、履行の請求を受けた時から遅滞の責任を負う。",{"qnum":8,"label":"1","title":"債務不履行","stem":"","answer":"❌誤り","explanation":"誤り。不法行為の加害者は、履行の請求を受けた時から遅滞の責任を負うのではなく、損害の発生と同時に遅滞に陥ります。被害者からの催告は、必要ありません。","pending":false}],["q8_option2","善意の受益者は、その不当利得返還債務について、履行の請求を受けた時から遅滞の責任を負う。",{"qnum":8,"label":"2","title":"債務不履行","stem":"","answer":"⭕正しい","explanation":"正しい。善意の受益者は、その不当利得返還債務について、履行の請求を受けた時から遅滞の責任を負います。","pending":false}],["q8_option3","請負人の報酬債権に対して、注文者がこれと同時履行の関係にある目的物の瑕疵修補に代わる損害賠償債権を自働債権とする相殺の意思表示をした場合、注文者は、請負人に対する相殺後の報酬残債務について、当該残債務の履行の請求を受けた時から遅滞の責任を負う。",{"qnum":8,"label":"3","title":"債務不履行","stem":"","answer":"❌誤り","explanation":"誤り。報酬債権と損害賠償債権が同時履行の関係にある場合、注文者が損害賠償債権を自働債権として相殺する意思を示した時点で、報酬の残金を支払う義務が生じ、その時から遅滞の責任が発生します。つまり、履行の請求を受けた時ではなく、相殺の意思表示をした時から履行遅滞となります。","pending":false}],["q8_option4","債務の履行について不確定期限があるときは、債務者は、その期限の到来したことを知った後に履行の請求を受けた時から遅滞の責任を負う。",{"qnum":8,"label":"4","title":"債務不履行","stem":"","answer":"❌誤り","explanation":"誤り。債務の履行について不確定期限があるときは、債務者が期限到来後に履行の請求を受けた時、または、期限到来を知った時のいずれか早い時から遅滞の責任を負います。","pending":false}],["q9_option1","甲土地を何らの権原なく不法占有しているCがいる場合、BがCに対して甲土地の所有権を主張して明渡請求をするには、甲土地の所有権移転登記を備えなければならない。",{"qnum":9,"label":"1","title":"物権変動","stem":"Aは、Aが所有している甲土地をBに売却した。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"誤り。不動産の物権は登記がなければ第三者に対抗できませんが、Cは何らの権原なく不法占有しているので不法占拠者となり、この第三者に該当しません。よってBは登記を備えていなくとも、明渡請求ができます。","pending":false}],["q9_option2","Bが甲土地の所有権移転登記を備えていない場合には、Aから建物所有目的で甲土地を賃借して甲土地上にD名義の登記ある建物を有するDに対して、Bは自らが甲土地の所有者であることを主張することができない。",{"qnum":9,"label":"2","title":"物権変動","stem":"Aは、Aが所有している甲土地をBに売却した。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。DはD名義の登記がある建物を所有しており、賃借権の対抗要件を備えています。この場合、Bは登記を備えていなければ、Dに対して自らが甲土地の所有者であることを主張できません。","pending":false}],["q9_option3","Bが甲土地の所有権移転登記を備えないまま甲土地をEに売却した場合、Eは、甲土地の所有権移転登記なくして、Aに対して甲土地の所有権を主張することができる。",{"qnum":9,"label":"3","title":"物権変動","stem":"Aは、Aが所有している甲土地をBに売却した。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。甲土地の所有権は、A→B、B→Eへと順次に移転しています。当事者間であれば、登記がなくても所有権を主張することができます。","pending":false}],["q9_option4","Bが甲土地の所有権移転登記を備えた後に甲土地につき取得時効が完成したFは、甲土地の所有権移転登記を備えていなくても、Bに対して甲土地の所有権を主張することができる。",{"qnum":9,"label":"4","title":"物権変動","stem":"Aは、Aが所有している甲土地をBに売却した。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。時効により甲土地を取得したFから見て、Bは時効完成前の第三者です。取得時効が完成したFは時効完成前の第三者Bに対して、所有権移転登記を備えていなくても所有権を主張できます。","pending":false}],["q10_option1","AがBの同意を得ずに制限行為能力を理由として本件売買契約を取り消した場合、Bは、自己が本件売買契約の取消しに同意していないことを理由に、Aの当該取消しの意思表示を取り消すことができる。",{"qnum":10,"label":"1","title":"制限行為能力者","stem":"未成年者Aが、法定代理人Bの同意を得ずに、Cから甲建物を買い受ける契約（以下この問において「本件売買契約」という。）を締結した場合における次の記述のうち、民法の規定によれば、正しいものはどれか。なお、Aに処分を許された財産はなく、Aは、営業を許されてはいないものとする。","answer":"❌誤り","explanation":"誤り。未成年者Aも制限行為能力を理由として、本件売買契約を取り消すことができます。取消しに法定代理人Bの同意は必要ありません。","pending":false}],["q10_option3","本件売買契約につき、取消しがなされないままAが成年に達した場合、本件売買契約についてBが反対していたとしても、自らが取消権を有すると知ったAは、本件売買契約を追認することができ、追認後は本件売買契約を取り消すことはできなくなる。",{"qnum":10,"label":"3","title":"制限行為能力者","stem":"未成年者Aが、法定代理人Bの同意を得ずに、Cから甲建物を買い受ける契約（以下この問において「本件売買契約」という。）を締結した場合における次の記述のうち、民法の規定によれば、正しいものはどれか。なお、Aに処分を許された財産はなく、Aは、営業を許されてはいないものとする。","answer":"⭕正しい","explanation":"正しい。未成年者が成年者になるなど制限行為能力者ではなくなり、自らが取消権を有すると知った場合、自らの行為を追認できるようになります。そして、追認後は、本件売買契約を取り消すことはできなくなります。","pending":false}],["q10_option4","本件売買契約につき、Bが追認しないまま、Aが成年に達する前にBの同意を得ずに甲建物をDに売却した場合、BがDへの売却について追認していないときでも、Aは制限行為能力を理由として、本件売買契約を取り消すことはできなくなる。",{"qnum":10,"label":"4","title":"制限行為能力者","stem":"未成年者Aが、法定代理人Bの同意を得ずに、Cから甲建物を買い受ける契約（以下この問において「本件売買契約」という。）を締結した場合における次の記述のうち、民法の規定によれば、正しいものはどれか。なお、Aに処分を許された財産はなく、Aは、営業を許されてはいないものとする。","answer":"❌誤り","explanation":"誤り。未成年者Aが行った法律行為は、法定代理人Bが追認していなければ、本人Aは制限行為能力を理由として、本件売買契約を取り消すことができます。","pending":false}],["q11_option1","専ら事業の用に供する建物（居住の用に供するものを除く。）の所有を目的とし、存続期間を20年として借地権を設定する場合、建物買取請求権の規定は適用されず、また、その契約は、公正証書による等書面によってしなければならない。",{"qnum":11,"label":"1","title":"借地借家法（借地）","stem":"建物の所有を目的とする土地の賃貸借契約（一時使用目的の借地契約を除く。）に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。専ら事業の用に供する建物の所有を目的とし、存続期間を20年とする事業用定期借地権では、建物買取請求権の規定は適用されません。そして、その契約は、公正証書によってする必要があります。公正証書による等書面ではいけません。","pending":false}],["q11_option2","居住の用に供する建物の所有を目的として借地権を設定する場合において、借地権を消滅させる目的で、その設定後30年を経過した日に借地権の目的である土地の上の建物を借地権設定者に相当の対価で譲渡する旨の特約を定めても、この特約は無効である。",{"qnum":11,"label":"2","title":"借地借家法（借地）","stem":"建物の所有を目的とする土地の賃貸借契約（一時使用目的の借地契約を除く。）に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。本肢は建物譲渡特約付借地権です。この特約は認められています。","pending":false}],["q11_option3","借地権を設定する場合において、存続期間を定めなかったときは、その期間は30年となる。",{"qnum":11,"label":"3","title":"借地借家法（借地）","stem":"建物の所有を目的とする土地の賃貸借契約（一時使用目的の借地契約を除く。）に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。借地借家法では借地権の存続期間を定めなかったときは、その期間は30年となります。","pending":false}],["q11_option4","当事者が借地権の設定後に最初に借地契約を更新する場合において、存続期間を定めなかったときは、その期間は更新の日から10年となる。",{"qnum":11,"label":"4","title":"借地借家法（借地）","stem":"建物の所有を目的とする土地の賃貸借契約（一時使用目的の借地契約を除く。）に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。借地権の更新の1回目は20年以上の期間に設定されます。本肢は最初の更新であり、存続期間を定めていないので期間が20年となります。","pending":false}],["q12_option3","賃借人が建物の引渡しを受けている場合において、当該建物の賃貸人が当該建物を譲渡するに当たり、当該建物の譲渡人及び譲受人が、賃貸人たる地位を譲渡人に留保する旨及び当該建物の譲受人が譲渡人に賃貸する旨の合意をしたときは、賃貸人たる地位は譲受人に移転しない。",{"qnum":12,"label":"3","title":"借地借家法（借家）","stem":"建物の賃貸借契約（定期建物賃貸借契約及び一時使用目的の建物の賃貸借契約を除く。）に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。賃借人が引渡しを受け、建物の賃貸借について対抗要件を備えている場合、建物が譲渡されるとこの建物の賃貸人たる地位も原則として譲受人に移転します。ただし、賃貸人たる地位を譲渡人に留保する旨の合意、その不動産を譲受人が譲渡人に賃貸する旨の合意がある場合は、例外として賃貸人たる地位は、譲渡人の元に留保されます。","pending":false}],["q13_option1","各共有者の共用部分の持分は、規約に別段の定めがない限り、共有者数で等分することとされている。",{"qnum":13,"label":"1","title":"建物の区分所有等","stem":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"誤り。各共有者の共用部分の持分は、共有者数で等分するのではなく、その有する専有部分の床面積の割合によるのが原則です。","pending":false}],["q13_option2","規約及び集会の決議は、区分所有者の特定承継人に対しても、その効力を生ずる。",{"qnum":13,"label":"2","title":"建物の区分所有等","stem":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。規約及び集会の決議は、区分所有者の特定承継人に対しても、その効力を生じます。","pending":false}],["q13_option3","管理者は、集会において、毎年1回一定の時期に、その事務に関する報告をしなければならない。",{"qnum":13,"label":"3","title":"建物の区分所有等","stem":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。管理者は、集会において、毎年一回一定の時期に、その事務に関する報告をしなければなりません。","pending":false}],["q13_option4","集会の招集の通知は、区分所有者が管理者に対して通知を受けるべき場所を通知しなかったときは区分所有者の所有する専有部分が所在する場所にあててすれば足りる。この場合には、集会の招集の通知は、通常それが到達すべき時に到達したものとみなされる。",{"qnum":13,"label":"4","title":"建物の区分所有等","stem":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。集会の招集の通知は、区分所有者が管理者に対して通知を受けるべき場所を通知しなかったときは区分所有者の所有する専有部分が所在する場所にあててすれば足ります。この場合には、集会の招集の通知は、通常それが到達すべき時に到達したものとみなされます。","pending":false}],["q14_option1","建物が滅失したときは、表題部所有者又は所有権の登記名義人は、その滅失の日から1か月以内に、当該建物の滅失の登記を申請しなければならない。",{"qnum":14,"label":"1","title":"不動産登記法","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。建物が滅失したときは、表題部所有者又は所有権の登記名義人は、その滅失の日から1か月以内に、当該建物の滅失の登記を申請しなければなりません。","pending":false}],["q14_option2","何人も、理由の有無にかかわらず、登記官に対し、手数料を納付して、登記簿の附属書類である申請書を閲覧することができる。",{"qnum":14,"label":"2","title":"不動産登記法","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"誤り。登記簿の附属書類である申請書のすべてを閲覧できるわけではありません。登記簿の附属書類のうち土地所在図・地積測量図・地役権図面・建物図面・各階平面図の閲覧は請求することができますが、それ以外は請求人が正当な理由があると認められる部分に限り閲覧請求できます。","pending":false}],["q14_option3","共有物分割禁止の定めに係る権利の変更の登記の申請は、当該権利の共有者である全ての登記名義人が共同してしなければならない。",{"qnum":14,"label":"3","title":"不動産登記法","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。共有物分割禁止の定めに係る権利の変更の登記の申請は、当該権利の共有者である全ての登記名義人が共同してしなければなりません。","pending":false}],["q14_option4","区分建物の所有権の保存の登記は、表題部所有者から所有権を取得した者も、申請することができる。",{"qnum":14,"label":"4","title":"不動産登記法","stem":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。区分建物の所有権の保存の登記は、登記手続を1回で済ませることができるよう、表題部所有者から所有権を取得した者も申請することができます。","pending":false}],["q15_option1","市街化調整区域は、土地利用を整序し、又は環境を保全するための措置を講ずることなく放置すれば、将来における一体の都市としての整備に支障が生じるおそれがある区域とされている。",{"qnum":15,"label":"1","title":"都市計画法","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。市街化調整区域は、市街化を抑制すべき区域です。本肢は準都市計画区域の説明です。","pending":false}],["q15_option2","高度利用地区は、土地の合理的かつ健全な高度利用と都市機能の更新とを図るため、都市計画に、建築物の高さの最低限度を定める地区とされている。",{"qnum":15,"label":"2","title":"都市計画法","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。高度利用地区は、用途地域内の市街地における土地の合理的かつ健全な高度利用と都市機能の更新を図るため、建築物の容積率の最高限度・最低限度、建蔽率の最高限度、建築面積の最低限度、壁面の位置の制限を定める地区です。","pending":false}],["q15_option3","特定用途制限地域は、用途地域が定められている土地の区域内において、都市計画に、制限すべき特定の建築物等の用途の概要を定める地域とされている。",{"qnum":15,"label":"3","title":"都市計画法","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。特定用途制限地域は、用途地域が定められていない区域で、制限すべき建築物等の用途を定める地域です。","pending":false}],["q15_option4","地区計画は、用途地域が定められている土地の区域のほか、一定の場合には、用途地域が定められていない土地の区域にも定めることができる。",{"qnum":15,"label":"4","title":"都市計画法","stem":"都市計画法に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。地区計画は、用途地域が定められている土地の区域のほか、一定の場合には、用途地域が定められていない土地の区域にも定めることができます。","pending":false}],["q16_option1","市街化区域内において行う、医療法に規定する病院を建築するための1,000㎡の開発行為については、法第29条に基づく都道府県知事の許可を得る必要がある。",{"qnum":16,"label":"1","title":"都市計画法（開発許可）","stem":"都市計画法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"正しい。市街化区域内において開発許可が不要となるのは、面積が1,000㎡未満の場合です。また、病院は公益上必要な建築物に該当しませんので、都道府県知事の許可が必要です。","pending":false}],["q16_option2","市街化区域内において行う、開発行為を伴わない建築物の建築で、当該建築物の床面積が1,000㎡以上のものについては、法第29条に基づく都道府県知事の許可を得る必要がある。",{"qnum":16,"label":"2","title":"都市計画法（開発許可）","stem":"都市計画法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"誤り。開発行為を伴わない建築物の建築は、そもそも開発許可は必要ありません。","pending":false}],["q16_option3","市街化調整区域内において行う、都市計画事業の施行のための開発行為については、法第29条に基づく都道府県知事の許可を得る必要がある。",{"qnum":16,"label":"3","title":"都市計画法（開発許可）","stem":"都市計画法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"誤り。都市計画事業の施行のための開発行為は、区域や規模を問わず開発許可が不要です。","pending":false}],["q16_option4","法第29条に基づく許可を受けた者は、当該許可に係る土地についての一定の事項を開発登録簿に登録しなければならない。",{"qnum":16,"label":"4","title":"都市計画法（開発許可）","stem":"都市計画法（以下この問において「法」という。）に関する次の記述のうち、正しいものはどれか。ただし、この問において条例による特別の定めはないものとし、「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"誤り。当該許可に係る土地についての一定の事項を開発登録簿に登録しなければならないのは都道府県知事であって、許可を受けた者ではありません。","pending":false}],["q17_option1","法第53条第1項及び第2項の建蔽率制限に係る規定の適用については、準防火地域内にある準耐火建築物であり、かつ、街区の角にある敷地又はこれに準ずる敷地で特定行政庁が指定するものの内にある建築物にあっては同条第1項各号に定める数値に10分の2を加えたものをもって当該各号に定める数値とする。",{"qnum":17,"label":"1","title":"建築基準法","stem":"次の記述のうち、建築基準法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。準防火地域内にある準耐火建築物の場合、10分の1の割増があります。さらに、特定行政庁の指定する角地にある建築物も10分の1の割増があり、合わせて10分の2の割増を受けることができます。","pending":false}],["q17_option2","建築物又は敷地を造成するための擁壁は、道路内に、又は道路に突き出して建築し、又は築造してはならず、地盤面下に設ける建築物においても同様である。",{"qnum":17,"label":"2","title":"建築基準法","stem":"次の記述のうち、建築基準法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。地盤面下に設ける建築物の場合は、建築物又は敷地を造成するための擁壁を建築することができます。","pending":false}],["q17_option3","地方公共団体は、その敷地が袋路状道路にのみ接する建築物であって、延べ面積が150㎡を超えるものについては、一戸建ての住宅であっても、条例で、その敷地が接しなければならない道路の幅員、その敷地が道路に接する部分の長さその他その敷地又は建築物と道路との関係に関して必要な制限を付加することができる。",{"qnum":17,"label":"3","title":"建築基準法","stem":"次の記述のうち、建築基準法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。地方公共団体は、その敷地が袋路状道路にのみ接する建築物であって、延べ面積が150㎡を超える建築物の場合、条例で必要な制限をつけることができます。ただし、一戸建て住宅は除きます。","pending":false}],["q17_option4","冬至日において、法第56条の2第1項の規定による日影規制の対象区域内の土地に日影を生じさせるものであっても、対象区域外にある建築物であれば一律に、同項の規定は適用されない。",{"qnum":17,"label":"4","title":"建築基準法","stem":"次の記述のうち、建築基準法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。冬至日において、日影規制の対象区域内に影を生じさせる高さ10m超の建築物は、対象区域外の建築物であっても対象区域内の建築物とみなされ規定が適用されます。","pending":false}],["q18_option1","高さ25mの建築物には、周囲の状況によって安全上支障がない場合を除き、有効に避雷設備を設けなければならない。",{"qnum":18,"label":"1","title":"建築基準法","stem":"建築基準法に関する次の記述のうち、誤っているものはどれか。なお、建築副主事の確認にあっては、建築基準法に定める大規模建築物以外の建築物に限るものとする。","answer":"⭕正しい","explanation":"正しい。有効に避雷設備を設けなければならないのは、高さが20mを超える建築物です。","pending":false}],["q18_option2","特定行政庁は、建築基準法の規定に違反した建築物（国、都道府県又は建築主事を置く市町村の建築物を除く。）の所有者に対して、緊急の必要があり、仮に当該建築物の使用禁止又は使用制限の命令をする場合であっても、意見書の提出先等を記載した通知書の交付等の手続をとらなければならない。",{"qnum":18,"label":"2","title":"建築基準法","stem":"建築基準法に関する次の記述のうち、誤っているものはどれか。なお、建築副主事の確認にあっては、建築基準法に定める大規模建築物以外の建築物に限るものとする。","answer":"❌誤り","explanation":"誤り。特定行政庁は、緊急の必要がある場合においては、通知書の交付等の手続を取らず、仮に、使用禁止または使用制限の命令ができます。","pending":false}],["q18_option3","防火地域内に存在する共同住宅（その用途に供する部分の床面積の合計が300㎡）を増築する場合、その増築に係る部分の床面積の合計が10㎡以内であっても、建築主事、建築副主事又は指定確認検査機関の確認を受ける必要がある。",{"qnum":18,"label":"3","title":"建築基準法","stem":"建築基準法に関する次の記述のうち、誤っているものはどれか。なお、建築副主事の確認にあっては、建築基準法に定める大規模建築物以外の建築物に限るものとする。","answer":"⭕正しい","explanation":"正しい。防火地域内に存在する共同住宅の場合、10㎡以内でも建築主事等の確認を受ける必要があります。防火地域及び準防火地域外の区域で行われる場合は、10㎡以内であれば建築確認が不要となります。","pending":false}],["q18_option4","劇場の用途に供する建築物を映画館（その用途に供する部分の床面積の合計が500㎡）に用途変更する場合、建築主事、建築副主事又は指定確認検査機関の確認を受ける必要はない。",{"qnum":18,"label":"4","title":"建築基準法","stem":"建築基準法に関する次の記述のうち、誤っているものはどれか。なお、建築副主事の確認にあっては、建築基準法に定める大規模建築物以外の建築物に限るものとする。","answer":"⭕正しい","explanation":"正しい。劇場の用途に供する建築物を映画館にすることは、類似の用途相互間の用途変更になりますので、建築確認は不要です。","pending":false}],["q19_option1","都道府県知事は、基本方針に基づき、かつ、基礎調査の結果を踏まえ、宅地造成等工事規制区域内で、宅地造成又は特定盛土等（宅地において行うものに限る。）に伴い災害が生ずるおそれが大きい一団の造成宅地の区域であって、一定の基準に該当するものを、造成宅地防災区域として指定することができる。",{"qnum":19,"label":"1","title":"宅地造成及び特定盛土等規制法","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","answer":"❌誤り","explanation":"誤り。造成宅地防災区域は、宅地造成等工事規制区域内に定めることはできません。","pending":false}],["q19_option2","都道府県知事は、その地方の気候、風土又は地勢の特殊性により、宅地造成及び特定盛土等規制法の規定のみによっては宅地造成等に伴う崖崩れ又は土砂の流出の防止の目的を達し難いと認める場合は、都道府県の規則で、宅地造成等工事規制区域内において行われる宅地造成等に関する工事の技術的基準を強化し、又は付加することができる。",{"qnum":19,"label":"2","title":"宅地造成及び特定盛土等規制法","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"正しい。都道府県知事は宅地造成及び特定盛土等規制法の規定のみによっては宅地造成等に伴う崖崩れ又は土砂の流出の防止の目的を達し難いと認める場合、都道府県の規則で技術的基準を強化し、又は付加することができます。","pending":false}],["q19_option3","都道府県知事は、宅地造成等工事規制区域内の土地について、宅地造成等に伴う災害の防止のため必要があると認める場合には、その土地の所有者に対して、擁壁等の設置等の措置をとることを勧告することができる。",{"qnum":19,"label":"3","title":"宅地造成及び特定盛土等規制法","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"正しい。所有者以外にも、管理者、占有者、工事主、工事施行者に対して、擁壁等の設置等の措置をとることを勧告することができます。","pending":false}],["q19_option4","宅地造成等工事規制区域内の土地（公共施設用地を除く。）において、雨水その他の地表水又は地下水を排除するための排水施設の除却工事を行おうとする場合は、一定の場合を除き、都道府県知事への届出が必要となる。",{"qnum":19,"label":"4","title":"宅地造成及び特定盛土等規制法","stem":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれか。なお、この問において「都道府県知事」とは、地方自治法に基づく指定都市、中核市及び施行時特例市にあってはその長をいうものとする。","answer":"⭕正しい","explanation":"正しい。高さが2mを超える地表水等を排除するための排水施設を除却する工事を行おうとする場合は、工事に着手する日の14日前までに、都道府県知事に届出が必要です。","pending":false}],["q20_option1","仮換地が指定された場合においては、従前の宅地について権原に基づき使用し、又は収益することができる者は、仮換地の指定の効力発生の日から換地処分の公告がある日まで、仮換地又は仮換地について仮に使用し、若しくは収益することができる権利の目的となるべき宅地若しくはその部分について、従前の宅地について有する権利の内容である使用又は収益と同じ使用又は収益をすることができる。",{"qnum":20,"label":"1","title":"土地区画整理法","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。なお、この問において、同法第136条の3による大都市等の特例及び条例で定める事務処理の特例は考慮しないものとする。","answer":"⭕正しい","explanation":"正しい。仮換地が指定された場合、従前の宅地を使用または収益していた者は、仮換地の指定の効力発生日から換地処分の公告がある日まで、仮換地を仮に使用または収益することができます。","pending":false}],["q20_option2","市町村施行の土地区画整理事業において、市町村は、換地処分をした場合においては、その旨を公告しなければならない。",{"qnum":20,"label":"2","title":"土地区画整理法","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。なお、この問において、同法第136条の3による大都市等の特例及び条例で定める事務処理の特例は考慮しないものとする。","answer":"❌誤り","explanation":"誤り。市町村が施行者の場合、換地処分は施行者が関係権利者に通知することで行いますが、その旨を都道府県知事に届出し、知事が公告を行います。公告を行うのは市町村ではなく知事です。","pending":false}],["q20_option3","換地計画において定められた保留地は、換地処分の公告があった日の翌日において、施行者が取得する。",{"qnum":20,"label":"3","title":"土地区画整理法","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。なお、この問において、同法第136条の3による大都市等の特例及び条例で定める事務処理の特例は考慮しないものとする。","answer":"⭕正しい","explanation":"正しい。換地計画において定められた保留地は、換地処分の公告があった日の翌日において、施行者が取得します。","pending":false}],["q20_option4","施行者は、仮換地を指定した場合において、特別の事情があるときは、その仮換地について使用又は収益を開始することができる日を仮換地の指定の効力発生の日と別に定めることができる。",{"qnum":20,"label":"4","title":"土地区画整理法","stem":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。なお、この問において、同法第136条の3による大都市等の特例及び条例で定める事務処理の特例は考慮しないものとする。","answer":"⭕正しい","explanation":"正しい。特別の事情があるときは、その仮換地について使用または収益を開始することができる日を、仮換地の指定の効力発生の日と別に定めることができます。","pending":false}],["q21_option1","自己所有の農地に住宅を建設する資金を借り入れるため、当該農地に抵当権の設定をする場合には、法第3条第1項の許可を受ける必要がある。",{"qnum":21,"label":"1","title":"農地法","stem":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。抵当権を設定しても、農地の使用収益者は従前と変わりません。よって、権利移動に該当せず、農地法3条許可は不要です。","pending":false}],["q21_option2","農地の賃貸借の解除については、農地の所有者が、賃貸人に対して一方的に解約の申入れを行う場合には、法第18条第1項の許可を受ける必要がない。",{"qnum":21,"label":"2","title":"農地法","stem":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。賃貸借を解除する場合、都道府県知事の許可を受ける必要があります。また、解約の申入れ、合意による解約も知事の許可が必要です。","pending":false}],["q21_option3","登記簿の地目が宅地となっている場合には、現況が農地であっても法の規制の対象とはならない。",{"qnum":21,"label":"3","title":"農地法","stem":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。農地法上の農地は現況で判断するので、登記簿上の地目は関係ありません。","pending":false}],["q21_option4","市街化区域内の自己所有の農地を駐車場に転用するため、あらかじめ農業委員会に届け出た場合には、法第4条第1項の許可を受ける必要がない。",{"qnum":21,"label":"4","title":"農地法","stem":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。市街化区域内の農地を農地以外のものに転用する場合、農業委員会にあらかじめ届け出るだけでよく、4条許可は不要です。","pending":false}],["q22_option1","都市計画区域外において、国から一団の土地である6,000㎡と5,000㎡の土地を購入した者は、事後届出を行う必要はない。",{"qnum":22,"label":"1","title":"国土利用計画法","stem":"土地を取得する場合における届出に関する次の記述のうち、正しいものはどれか。なお、この問において「事後届出」とは、国土利用計画法第23条の届出をいい、「重要土地等調査法」とは、重要施設周辺及び国境離島等における土地等の利用状況の調査及び利用の規制等に関する法律をいうものとする。","answer":"⭕正しい","explanation":"正しい。当事者の一方または双方が国である場合は、事後届出を行う必要はありません。","pending":false}],["q22_option2","市街化区域を除く都市計画区域内において、Aが所有する7,000㎡の土地をBが相続により取得した場合、Bは事後届出を行う必要がある。",{"qnum":22,"label":"2","title":"国土利用計画法","stem":"土地を取得する場合における届出に関する次の記述のうち、正しいものはどれか。なお、この問において「事後届出」とは、国土利用計画法第23条の届出をいい、「重要土地等調査法」とは、重要施設周辺及び国境離島等における土地等の利用状況の調査及び利用の規制等に関する法律をいうものとする。","answer":"❌誤り","explanation":"誤り。相続は事後届出の対象となりませんので、事後届出を行う必要はありません。","pending":false}],["q22_option3","市街化区域において、Cが所有する3,000㎡の土地をDが購入する契約を締結した場合、C及びDは事後届出を行わなければならない。",{"qnum":22,"label":"3","title":"国土利用計画法","stem":"土地を取得する場合における届出に関する次の記述のうち、正しいものはどれか。なお、この問において「事後届出」とは、国土利用計画法第23条の届出をいい、「重要土地等調査法」とは、重要施設周辺及び国境離島等における土地等の利用状況の調査及び利用の規制等に関する法律をいうものとする。","answer":"❌誤り","explanation":"誤り。市街化区域内で面積が2,000㎡以上の場合、事後届出の対象となります。ただし、事後届出をするのは権利取得者であるDのみです。","pending":false}],["q22_option4","重要土地等調査法の規定による特別注視区域内にある100㎡の規模の土地に関する所有権又はその取得を目的とする権利の移転をする契約を締結する場合には、当事者は、一定の事項を、あらかじめ、内閣総理大臣に届け出なければならない。",{"qnum":22,"label":"4","title":"国土利用計画法","stem":"土地を取得する場合における届出に関する次の記述のうち、正しいものはどれか。なお、この問において「事後届出」とは、国土利用計画法第23条の届出をいい、「重要土地等調査法」とは、重要施設周辺及び国境離島等における土地等の利用状況の調査及び利用の規制等に関する法律をいうものとする。","answer":"❌誤り","explanation":"誤り。特別注視区域内にある200㎡以上の土地に関する所有権又はその取得を目的とする権利の移転をする契約を締結する場合には、当事者は、一定の事項を、あらかじめ、内閣総理大臣に届け出なければなりません。","pending":false}],["q23_option1","この税率の軽減措置の適用を受けるためには、やむを得ない事情がある場合を除き、その住宅用家屋の取得後1年以内に所有権の移転登記を受けなければならない。",{"qnum":23,"label":"1","title":"登録免許税","stem":"住宅用家屋の所有権の移転登記に係る登録免許税の税率の軽減措置に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。軽減措置の適用を受けるためには、やむを得ない事情がある場合を除き、その住宅用家屋の取得後1年以内に所有権の移転登記を受ける必要があります。","pending":false}],["q23_option2","この税率の軽減措置は、住宅用家屋を相続により取得した場合に受ける所有権の移転登記についても適用される。",{"qnum":23,"label":"2","title":"登録免許税","stem":"住宅用家屋の所有権の移転登記に係る登録免許税の税率の軽減措置に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。軽減税率の適用を受けることができるのは、住宅用家屋の取得原因が売買や競売で取得した場合のみです。相続により取得した場合は、適用されません。","pending":false}],["q23_option3","この税率の軽減措置に係る登録免許税の課税標準となる不動産の価額は、売買契約書に記載されたその住宅用家屋の実際の取引価格である。",{"qnum":23,"label":"3","title":"登録免許税","stem":"住宅用家屋の所有権の移転登記に係る登録免許税の税率の軽減措置に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。登録免許税の課税標準となる不動産の価額は、固定資産課税台帳に登録されている価額です。実際の取引価格ではありません。","pending":false}],["q23_option4","過去にこの税率の軽減措置の適用を受けたことがある者は、再度この措置の適用を受けることはできない。",{"qnum":23,"label":"4","title":"登録免許税","stem":"住宅用家屋の所有権の移転登記に係る登録免許税の税率の軽減措置に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。過去に軽減措置の適用を受けていても、再度この適用を受けることができます。","pending":false}],["q24_option1","固定資産税の徴収については、特別徴収の方法によらなければならない。",{"qnum":24,"label":"1","title":"固定資産税","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。固定資産税の徴収方法は、普通徴収です。","pending":false}],["q24_option2","土地価格等縦覧帳簿及び家屋価格等縦覧帳簿の縦覧期間は、毎年4月1日から、4月20日又は当該年度の最初の納期限の日のいずれか遅い日以後の日までの間である。",{"qnum":24,"label":"2","title":"固定資産税","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。縦覧期間は、毎年4月1日から、4月20日または当該年度最初の納期限のいずれか遅い日以後の日までの間です。","pending":false}],["q24_option3","固定資産税の賦課期日は、市町村の条例で定めることとされている。",{"qnum":24,"label":"3","title":"固定資産税","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。固定資産税の賦課期日は、当該年度の初日の属する年の1月1日です。","pending":false}],["q24_option4","固定資産税は、固定資産の所有者に課するのが原則であるが、固定資産が賃借されている場合は、当該固定資産の賃借権者に対して課される。",{"qnum":24,"label":"4","title":"固定資産税","stem":"固定資産税に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。固定資産税は、固定資産の所有者に課するのが原則です。固定資産が賃借されている場合に、当該固定資産の賃借権者に対して課税されることはありません。","pending":false}],["q25_option1","土地鑑定委員会は、標準地の正常な価格を判定したときは、標準地の単位面積当たりの価格のほか、当該標準地の地積及び形状についても官報で公示しなければならない。",{"qnum":25,"label":"1","title":"地価公示法","stem":"地価公示法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。土地鑑定委員会は、標準地の正常な価格を判定したときは、標準地の単位面積当たりの価格のほか、当該標準地の地積及び形状についても官報で公示しなければなりません。","pending":false}],["q25_option2","正常な価格とは、土地について、自由な取引が行われるとした場合におけるその取引（一の当事者により一方的に行われる取引その他一定の場合を除く。）において通常成立すると認められる価格をいい、当該土地に建物がある場合には、当該建物が存在するものとして通常成立すると認められる価格をいう。",{"qnum":25,"label":"2","title":"地価公示法","stem":"地価公示法に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"誤り。正常な価格とは、土地について自由な取引が行われるとした場合におけるその取引において通常成立すると認められる価格をいいますが、当該土地に建物がある場合でも、その建物は存在しないものとして算定するため、本肢の「建物が存在するものとして」という記述は誤りです。","pending":false}],["q25_option3","公示区域内の土地について鑑定評価を行う場合において、当該土地の正常な価格を求めるときは、公示価格を規準とする必要があり、その際には、当該土地とこれに類似する利用価値を有すると認められる1又は2以上の標準地との位置、地積、環境等の土地の客観的価値に作用する諸要因についての比較を行い、その結果に基づき、当該標準地の公示価格と当該土地の価格との間に均衡を保たせる必要がある。",{"qnum":25,"label":"3","title":"地価公示法","stem":"地価公示法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。公示区域内の土地について鑑定評価を行う場合、当該土地の正常な価格を求めるときは、公示価格を規準とする必要があります。その際には、当該土地とこれに類似する利用価値を有すると認められる1又は2以上の標準地との位置、地積、環境等の土地の客観的価値に作用する諸要因についての比較を行い、その結果に基づき、当該標準地の公示価格と当該土地の価格との間に均衡を保たせる必要があります。","pending":false}],["q25_option4","公示区域とは、都市計画法第4条第2項に規定する都市計画区域その他の土地取引が相当程度見込まれるものとして国土交通省令で定める区域のうち、国土利用計画法第12条第1項の規定により指定された規制区域を除いた区域をいう。",{"qnum":25,"label":"4","title":"地価公示法","stem":"地価公示法に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。公示区域とは、都市計画区域その他の土地取引が相当程度見込まれるものとして国土交通省令で定める区域のうち、国土利用計画法の規定により指定された規制区域を除いた区域をいいます。","pending":false}],["q26_option1","宅地建物取引士とは、宅地建物取引士資格試験に合格し、都道府県知事の登録を受けた者をいう。",{"qnum":26,"label":"1","title":"宅建業・宅建士","stem":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。","answer":"❌誤り","explanation":"誤り。宅地建物取引士資格試験に合格し、都道府県知事の登録を受けただけでは宅建士ではありません。宅建士証の交付を受けることで、宅建士となることができます。","pending":false}],["q26_option2","宅地建物取引士は、宅地又は建物の取引に係る事務に必要な知識及び能力の維持向上に努めなければならない。",{"qnum":26,"label":"2","title":"宅建業・宅建士","stem":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。","answer":"⭕正しい","explanation":"正しい。宅地建物取引士は、宅地又は建物の取引に係る事務に必要な知識及び能力の維持向上に努めなければなりません。","pending":false}],["q28_option1","Aは、当該中古住宅について購入の申込みがあったときは、遅滞なく、その旨をBに報告しなければならないが、Bの希望条件を満たさない申込みだとAが判断した場合については報告する必要はない。",{"qnum":28,"label":"1","title":"媒介契約","stem":"宅地建物取引業者Aが、BからB所有の中古住宅の売却の依頼を受け、専任媒介契約（専属専任媒介契約ではないものとする。）を締結した場合に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。購入の申込みがあったときは、Aは遅滞なく、その旨をBに報告する義務を負います。Bの希望条件を満たすかどうかに関係なく、報告が必要です。","pending":false}],["q28_option2","Aは、法第34条の2第1項の規定に基づく書面の交付後、速やかに、Bに対し、法第34条の2第1項第4号に規定する建物状況調査を実施する者のあっせんの有無について確認しなければならない。",{"qnum":28,"label":"2","title":"媒介契約","stem":"宅地建物取引業者Aが、BからB所有の中古住宅の売却の依頼を受け、専任媒介契約（専属専任媒介契約ではないものとする。）を締結した場合に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。建物状況調査を実施する者のあっせんの有無は、媒介契約書の記載事項です。よって、書面の交付後ではなく、媒介契約書を作成する段階で依頼者に確認する必要があります。","pending":false}],["q28_option3","Aは、当該中古住宅について法で規定されている事項を、契約締結の日から休業日数を含め7日以内に指定流通機構へ登録する義務がある。",{"qnum":28,"label":"3","title":"媒介契約","stem":"宅地建物取引業者Aが、BからB所有の中古住宅の売却の依頼を受け、専任媒介契約（専属専任媒介契約ではないものとする。）を締結した場合に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。休業日を除いて7日以内に、指定流通機構へ登録する義務があります。","pending":false}],["q28_option4","Aは、Bが他の宅地建物取引業者の媒介又は代理によって売買の契約を成立させたときの措置を、法第34条の2第1項の規定に基づく書面に記載しなければならない。",{"qnum":28,"label":"4","title":"媒介契約","stem":"宅地建物取引業者Aが、BからB所有の中古住宅の売却の依頼を受け、専任媒介契約（専属専任媒介契約ではないものとする。）を締結した場合に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。他の宅地建物取引業者の媒介又は代理によって売買の契約を成立させたときの違反措置は、媒介契約書の記載事項です。","pending":false}],["q29_option1","宅地又は建物の売買に関する注文を受けたときは、遅滞なくその注文をした者に対して取引態様の別を明らかにしなければならないが、当該注文者が事前に取引態様の別を明示した広告を見てから注文してきた場合においては、取引態様の別を遅滞なく明らかにする必要はない。",{"qnum":29,"label":"1","title":"広告","stem":"宅地建物取引業者がその業務に関して行う広告に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。なお、この問において「建築確認」とは、建築基準法第6条第1項の確認をいうものとする。","answer":"❌誤り","explanation":"誤り。事前に取引態様の別を明示した広告を見てから注文してきた場合においても、あらためて取引態様の別を遅滞なく明らかにしなければなりません。","pending":false}],["q29_option3","これから建築工事を行う予定である建築確認申請中の建物については、当該建物の売買の媒介に関する広告をしてはならないが、賃借の媒介に関する広告はすることができる。",{"qnum":29,"label":"3","title":"広告","stem":"宅地建物取引業者がその業務に関して行う広告に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。なお、この問において「建築確認」とは、建築基準法第6条第1項の確認をいうものとする。","answer":"❌誤り","explanation":"誤り。賃借の媒介に関する広告はすることができませんが、賃借の契約であれば建築確認前にでもすることができます。","pending":false}],["q29_option4","販売する宅地又は建物の広告に関し、著しく事実に相違する表示をした場合、監督処分の対象となるだけでなく、拘禁刑若しくは罰金に処せられ、又はこれを併科されることもある。",{"qnum":29,"label":"4","title":"広告","stem":"宅地建物取引業者がその業務に関して行う広告に関する次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。なお、この問において「建築確認」とは、建築基準法第6条第1項の確認をいうものとする。","answer":"⭕正しい","explanation":"正しい。販売する宅地又は建物の広告に関し、著しく事実に相違する表示をした場合、指示処分または業務停止処分の対象となるだけでなく、6か月以下の拘禁刑若しくは100万円以下の罰金に処せられ、又はこれを併科されることもあります。","pending":false}],["q30_optionア","ガス配管設備等に関して、住宅の売買後においても宅地内のガスの配管設備等の所有権が家庭用プロパンガス販売会社にあるものとする場合には、その旨を説明しなければならない。",{"qnum":30,"label":"ア","title":"35条書面","stem":"宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはいくつあるか。なお、説明の相手方は宅地建物取引業者ではないものとする。","answer":"⭕正しい","explanation":"正しい。飲用水・電気・ガスの供給施設や排水施設の整備の状況は、宅地又は建物の売買又は貸借の場合、説明しなければなりません。よって、宅地内のガス配管設備等の所有権が家庭用プロパンガス販売会社にあることは、説明しなければなりません。","pending":false}],["q30_optionウ","区分所有建物である事務所ビルの一室の売買の媒介を行う場合、当該1棟の建物及びその敷地の管理が委託されているときは、その委託を受けている者の氏名（法人にあっては、その商号又は名称）及び住所（法人にあっては、その主たる事務所の所在地）を説明しなければならない。",{"qnum":30,"label":"ウ","title":"35条書面","stem":"宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはいくつあるか。なお、説明の相手方は宅地建物取引業者ではないものとする。","answer":"⭕正しい","explanation":"正しい。区分所有建物の売買又は貸借では、1棟の建物及びその敷地の管理が委託されているときには、その委託を受けている者の氏名（法人にあっては、その商号又は名称）及び住所（法人にあっては、その主たる事務所の所在地）を説明しなければなりません。","pending":false}],["q30_optionエ","区分所有建物である中古マンションの一室の売買の媒介を行う場合、当該1棟の建物の計画的な維持修繕のための費用の積立てを行う旨の規約の定めがあるときは、その内容及び既に積み立てられている額について説明しなければならない。",{"qnum":30,"label":"エ","title":"35条書面","stem":"宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、正しいものはいくつあるか。なお、説明の相手方は宅地建物取引業者ではないものとする。","answer":"⭕正しい","explanation":"正しい。区分所有建物の売買では、当該1棟の建物の計画的な維持修繕のための費用の積立てを行う旨の規約の定めがあるときは、その内容及び既に積み立てられている額について説明しなければなりません。","pending":false}],["q31_option1","Aは、仮設テント張りの案内所でBから買受けの申込みを受けた際、以後の取引について、その取引に係る書類に関してBから電磁的方法で提供をすることについての承諾を得た場合、クーリング・オフについて電磁的方法で告げることができる。",{"qnum":31,"label":"1","title":"8種制限（クーリング・オフ）","stem":"宅地建物取引業者Aが、自ら売主として、宅地建物取引業者ではない買主Bから宅地の買受けの申込みを受けた場合における宅地建物取引業法第37条の2の規定に基づくいわゆるクーリング・オフに関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。クーリング・オフに関する告知は、書面で行わなければなりません。買主から承諾を得たとしても、電磁的方法で告知することはできません。","pending":false}],["q31_option2","Aが、仮設テント張りの案内所でBから買受けの申込みを受けた場合、Bは、クーリング・オフについて告げられた日から8日以内に電磁的方法により当該申込みの撤回を申し出れば、申込みの撤回を行うことができる。",{"qnum":31,"label":"2","title":"8種制限（クーリング・オフ）","stem":"宅地建物取引業者Aが、自ら売主として、宅地建物取引業者ではない買主Bから宅地の買受けの申込みを受けた場合における宅地建物取引業法第37条の2の規定に基づくいわゆるクーリング・オフに関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。選択肢1同様、申込みの撤回も電磁的方法は認められておらず、書面で行わなければなりません。","pending":false}],["q31_option4","Aが、売却の媒介を依頼している宅地建物取引業者Cの事務所でBから買受けの申込みを受けた場合、Bは、申込みの日から8日以内に書面により当該申込みの撤回を申し出ても、申込みの撤回を行うことができない。",{"qnum":31,"label":"4","title":"8種制限（クーリング・オフ）","stem":"宅地建物取引業者Aが、自ら売主として、宅地建物取引業者ではない買主Bから宅地の買受けの申込みを受けた場合における宅地建物取引業法第37条の2の規定に基づくいわゆるクーリング・オフに関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。売主から媒介を依頼されている宅建業者の事務所で買受けの申込みを行った場合、クーリング・オフの適用はありません。よって、8日以内に書面により当該申込みの撤回を申し出ても、申込みの撤回を行うことができません。","pending":false}],["q32_optionア","居住用建物（1か月の借賃12万円。消費税等相当額を含まない。）について、Aは貸主から代理を依頼され、Bは借主から媒介を依頼され、Aは貸主から6.7万円、Bは借主から6.5万円を報酬として受領した。なお、Bは、媒介の依頼を受けるに当たって、報酬について借主から特段の承諾を得ていない。",{"qnum":32,"label":"ア","title":"報酬","stem":"宅地建物取引業者A（消費税課税事業者）及び宅地建物取引業者B（消費税免税事業者）が受領した報酬に関するアからウの記述のうち、宅地建物取引業法の規定に違反しないものの組合せは1から4のうちどれか。なお、代理、媒介に当たり、広告の依頼は行われていないものとする。また、賃借の代理又は媒介をする宅地又は建物は長期の空家等には該当しない。","answer":"❌違反する","explanation":"違反する。宅建業者Aは消費税課税業者なので、報酬に10％の消費税を上乗せすることができます。宅建業者Bは消費税免税業者ですが、仕入れに係る消費税相当額として、報酬に4％上乗せすることが認められています。宅建業者Aは、貸主から代理を依頼されているので、1か月の借賃12万円に消費税10％を加算した13.2万円（12万円×1.1＝13.2万円）を上限として報酬を受け取ることができます。宅建業者Bは、借主から媒介を依頼されています。その際、借主から特段の承諾を得ていません。よって、報酬の上限は、0.5か月分の借賃である6万円に4％を加算した6.24万円（6万円×1.04＝6.24万円）となります。よって、Bが借主から6.5万円を報酬として受領することは、宅建業法違反となります。","pending":false}],["q32_optionイ","Bは、事業用建物について、貸主と借主双方から媒介を依頼され、借賃1か月分10万円（消費税等相当額を含まない。）、権利金90万円（権利設定の対価として支払われる金銭であって返還されないもので、消費税等相当額を含まない。）の賃貸借契約を成立させ、貸主と借主からそれぞれ5万円を報酬として受領した。",{"qnum":32,"label":"イ","title":"報酬","stem":"宅地建物取引業者A（消費税課税事業者）及び宅地建物取引業者B（消費税免税事業者）が受領した報酬に関するアからウの記述のうち、宅地建物取引業法の規定に違反しないものの組合せは1から4のうちどれか。なお、代理、媒介に当たり、広告の依頼は行われていないものとする。また、賃借の代理又は媒介をする宅地又は建物は長期の空家等には該当しない。","answer":"⭕違反しない","explanation":"違反しない。事業用建物の場合、権利金を売買代金とみなして計算することができ、借賃1か月分と比較して高いほうを報酬限度額とすることができます。権利金90万円を売買代金とみなして計算すると、90万円×5％＝4.5万円。さらに4％を加算して4.5万円×1.04＝4.68万円となります。また、宅建業者Bは、貸主と借主を媒介していますので、貸主・借主双方から、合わせて1か月分の借賃10万円×1.04＝10.4万円を上限として受け取ることができます。よって、貸主と借主からそれぞれ5万円を報酬として受領しても宅建業法違反にはなりません。","pending":false}],["q32_optionウ","Aは、土地付建物について、売主と買主双方から媒介を依頼され、代金3,500万円（消費税等相当額を含み、土地代金は2,400万円である。）の売買契約を成立させ、売主と買主からそれぞれ110万円を報酬として受領したほか、売主の特別の依頼に基づき行った遠隔地への現地調査に要した実費の費用について、売主が事前に負担を承諾していたので、売主から9万円を受領した。",{"qnum":32,"label":"ウ","title":"報酬","stem":"宅地建物取引業者A（消費税課税事業者）及び宅地建物取引業者B（消費税免税事業者）が受領した報酬に関するアからウの記述のうち、宅地建物取引業法の規定に違反しないものの組合せは1から4のうちどれか。なお、代理、媒介に当たり、広告の依頼は行われていないものとする。また、賃借の代理又は媒介をする宅地又は建物は長期の空家等には該当しない。","answer":"⭕違反しない","explanation":"違反しない。まず、消費税を除いた代金を算出します。土地は非課税ですので、2,400万円。建物代金は3,500万円－2,400万円＝1,100万円。建物は課税されているので、消費税を除き1,000万円となり、土地付建物の本体価格は、3,400万円となります。報酬の上限額は、3,400万円×3％＋6万円＝108万円。宅建業者Aは消費税課税業者ですので消費税10％を加算し、108万円×1.1＝118.8万円まで受け取ることができます。よって、宅建業者Aが報酬として110万円を受領しても、宅建業法に違反しません。さらに、売主の特別の依頼に基づき行った遠隔地への現地調査に要した実費の費用も、売主が事前に負担を承諾しているので、売主から9万円を受領しても宅建業法違反にはなりません。","pending":false}],["q33_option1","国土交通大臣又は都道府県知事は、その免許を受けた宅地建物取引業者が法第65条第1項の規定による指示に従わない場合、その業務の全部又は一部の停止を命ずることができ、業務の停止の処分に違反した場合、免許を取り消さなければならない。",{"qnum":33,"label":"1","title":"監督処分","stem":"次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。免許権者は宅建業者が指示に従わない場合、その業務の全部又は一部の停止を命ずることができます。そして、業務停止処分に違反した場合、免許を取り消さなければなりません。","pending":false}],["q33_option2","国土交通大臣又は都道府県知事は、その免許を受けた宅地建物取引業者の事務所の所在地を確知できないときは、その事実を公告し、その公告の日から2週間を経過しても当該宅地建物取引業者から申出がないときは、免許を取り消すことができる。",{"qnum":33,"label":"2","title":"監督処分","stem":"次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。公告の日から30日を経過しても宅地建物取引業者から申出がないときは、免許を取り消すことができます。2週間というのが誤りです。","pending":false}],["q33_option4","国土交通大臣又は都道府県知事は、法第66条の規定による免許の取消しの処分をしたときはその旨を公告しなければならないが、法第65条第2項の規定による業務の停止の処分をしたときはその旨の公告はしなくともよい。",{"qnum":33,"label":"4","title":"監督処分","stem":"次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。宅建業者や宅建士に対する監督処分をするときは、聴聞を行わなければなりませんが、この聴聞はすべて公開により行われます。免許取消処分も、業務停止処分もその旨の公告をしなければなりません。","pending":false}],["q34_option1","保証協会の社員は、自らが取り扱った宅地建物取引業に係る取引の相手方から当該取引に関する苦情について解決の申出が保証協会にあり、保証協会から関係する資料の提出を求められたときは、正当な理由がある場合でなければ、これを拒んではならない。",{"qnum":34,"label":"1","title":"弁済業務保証金","stem":"宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。苦情の解決は、保証協会の必要的業務の一つです。保証協会は、社員（宅建業者）が取り扱った宅建業に係る取引の相手方から当該取引に関する苦情について解決の申出があった場合、社員に対して関係する資料の提出を求めることができ、社員は、正当な理由がある場合を除き拒むことはできません。","pending":false}],["q34_option3","保証協会は、宅地建物取引業者の相手方から、社員である宅地建物取引業者の取り扱った宅地建物取引業に係る取引に関する損害の還付請求を受けたときは、直ちに弁済業務保証金から返還しなければならない。",{"qnum":34,"label":"3","title":"弁済業務保証金","stem":"宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。宅地建物取引業者の相手方は弁済業務保証金から弁済を受けるには、保証協会の認証を受けなければなりません。保証協会から直ちに弁済業務保証金を返還してもらえるわけではありません。また、還付請求する相手は保証協会ではなく供託所です。","pending":false}],["q34_option4","保証協会は、手付金等保管事業について国土交通大臣の承認を受けた場合、社員が自ら売主となって行う宅地又は建物の売買で、宅地の造成又は建築に関する工事の完了前における買主からの手付金等の受領について、当該事業の対象とすることができる。",{"qnum":34,"label":"4","title":"弁済業務保証金","stem":"宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。手付金等保管事業は、保証協会の任意的業務であり、国土交通大臣の承認を受ければ、手付金等保管事業を行うことができます。ただし、未完成物件に係る手付金等の受領は、当該事業の対象とすることができません。未完成物件では、保証委託契約や保証保険契約（いわゆる8種制限で学ぶ「保全措置」）しか利用できません。","pending":false}],["q35_option3","個人である宅地建物取引業者A（甲県知事免許）が死亡した場合、Aの相続人は、Aの死亡の日から30日以内に、その旨を甲県知事に届け出なければならない。",{"qnum":35,"label":"3","title":"免許","stem":"次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","answer":"❌誤り","explanation":"誤り。個人である宅建業者が死亡した場合、相続人はその事実を知った日から30日以内に、免許権者に届け出なければなりません。死亡の日からではないことに注意しましょう。","pending":false}],["q36_option1","Aが自ら売主として締結する宅地の売買契約において、37条書面の電磁的方法による提供を行う場合、当該契約の相手方に対し、あらかじめ、電磁的方法による提供に用いる電磁的方法の種類及び内容を宅地建物取引士に説明させなければならない。",{"qnum":36,"label":"1","title":"37条書面","stem":"宅地建物取引業者Aが宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に記載すべき事項を電磁的方法により提供すること（以下この問において「37条書面の電磁的方法による提供」という。）に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。37条書面の電磁的方法による提供を行う場合、当該契約の相手方に対し、あらかじめ、電磁的方法による提供に用いる電磁的方法の種類及び内容について承諾を得る必要がありますが、宅建士に説明させる必要はありません。","pending":false}],["q36_option2","Aが媒介業者として関与する建物賃貸借契約において、37条書面の電磁的方法による提供を行う場合、その方法は37条書面の交付に係る宅地建物取引士が明示されるものでなければならない。",{"qnum":36,"label":"2","title":"37条書面","stem":"宅地建物取引業者Aが宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に記載すべき事項を電磁的方法により提供すること（以下この問において「37条書面の電磁的方法による提供」という。）に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。37条書面の電磁的方法による提供を行う場合、書面の交付に係る宅地建物取引士が明示されるものでなければなりません。","pending":false}],["q36_option3","Aが自ら売主として締結する宅地の売買契約において、契約の相手方から37条書面の電磁的方法による提供を行うことについて書面により承諾を得た場合は、その後に当該契約の相手方から書面で電磁的方法による提供を受けない旨の申出があったときでも、37条書面の電磁的方法による提供をすることができる。",{"qnum":36,"label":"3","title":"37条書面","stem":"宅地建物取引業者Aが宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に記載すべき事項を電磁的方法により提供すること（以下この問において「37条書面の電磁的方法による提供」という。）に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。電磁的方法での提供について書面により承諾を得た場合でも、その後に当該契約の相手方から書面で電磁的方法による提供を受けない旨の申出があった場合は、電磁的方法による提供をすることができません。","pending":false}],["q36_option4","Aが媒介業者として関与する宅地の売買契約において、37条書面の電磁的方法による提供を行う場合であっても、提供後速やかに37条書面を交付しなければならない。",{"qnum":36,"label":"4","title":"37条書面","stem":"宅地建物取引業者Aが宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に記載すべき事項を電磁的方法により提供すること（以下この問において「37条書面の電磁的方法による提供」という。）に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。37条書面の電磁的方法による提供を行った場合は、重ねて37条書面を交付する必要はありません。","pending":false}],["q37_option2","届出をすべき場所として、宅地建物取引業者が10区画以上の一団の宅地又は10戸以上の一団の建物の分譲（以下この問において「一団の宅地建物の分譲」という。）をする場合に設置する案内所が定められているが、当該案内所が土地に定着する建物内に設けられる場合、クーリング・オフ制度の適用が除外される。",{"qnum":37,"label":"2","title":"案内所等の規制","stem":"宅地建物取引業法第50条第2項の届出をすべき場所に関する次の記述のうち、誤っているものはどれか。なお、これらの場所では、宅地若しくは建物の売買若しくは交換の契約（予約を含む。）若しくは宅地若しくは建物の売買、交換若しくは貸借の代理若しくは媒介の契約を締結し、又はこれらの契約の申込みを受けるものとする。","answer":"⭕正しい","explanation":"正しい。案内所が土地に定着する建物内に設けられる場合、クーリング・オフ制度の適用が除外されます。","pending":false}],["q37_option3","届出をすべき場所として、他の宅地建物取引業者が行う一団の宅地建物の分譲の代理又は媒介をする場合に設置する案内所が定められており、この場合は、代理又は媒介を行う宅地建物取引業者が届出をするが、売主業者自身も当該案内所で売買契約の申込みを受ける場合は、売主業者も届出をする。",{"qnum":37,"label":"3","title":"案内所等の規制","stem":"宅地建物取引業法第50条第2項の届出をすべき場所に関する次の記述のうち、誤っているものはどれか。なお、これらの場所では、宅地若しくは建物の売買若しくは交換の契約（予約を含む。）若しくは宅地若しくは建物の売買、交換若しくは貸借の代理若しくは媒介の契約を締結し、又はこれらの契約の申込みを受けるものとする。","answer":"⭕正しい","explanation":"正しい。本肢の場合、代理または媒介を行う宅建業者が届出をしますが、売主業者自身も当該案内所で売買契約の申込みを受ける場合は、売主業者も届出をしなければなりません。","pending":false}],["q37_option4","届出をすべき場所として、宅地建物取引業者が業務に関し展示会その他これに類する催しを実施する場所が定められているが、その催しを開始する10日前までに、実施場所を管轄する都道府県知事に届け出なければならず、免許を受けた国土交通大臣又は都道府県知事に届け出る必要はない。",{"qnum":37,"label":"4","title":"案内所等の規制","stem":"宅地建物取引業法第50条第2項の届出をすべき場所に関する次の記述のうち、誤っているものはどれか。なお、これらの場所では、宅地若しくは建物の売買若しくは交換の契約（予約を含む。）若しくは宅地若しくは建物の売買、交換若しくは貸借の代理若しくは媒介の契約を締結し、又はこれらの契約の申込みを受けるものとする。","answer":"❌誤り","explanation":"誤り。展示会場は案内所等に該当しますので、その催しを開始する10日前までに、実施場所を管轄する都道府県知事と免許権者の両方に届け出なければなりません。","pending":false}],["q38_option2","宅地建物取引士の氏名等が登載されている宅地建物取引士資格登録簿は一般の閲覧に供されることはされておらず、一般の閲覧に供される宅地建物取引業者名簿に専任の宅地建物取引士の氏名が登載されることもない。",{"qnum":38,"label":"2","title":"宅地建物取引士","stem":"宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、この問において「登録」とは、宅地建物取引士の登録をいうものとする。","answer":"⭕正しい","explanation":"正しい。宅地建物取引士資格登録簿は宅建士の氏名が記載されていますが、一般の閲覧に供されません。宅地建物取引業者名簿は一般の閲覧に供されますが、専任の宅地建物取引士の氏名は登載されていません。","pending":false}],["q38_option3","宅地建物取引士が、刑法第204条（傷害）の罪により罰金の刑に処せられ、登録が消除された場合、当該登録が消除された日から5年を経過するまでは、新たな登録を受けることができない。",{"qnum":38,"label":"3","title":"宅地建物取引士","stem":"宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、この問において「登録」とは、宅地建物取引士の登録をいうものとする。","answer":"❌誤り","explanation":"誤り。登録が消除された日から5年ではなく、刑の執行を終わり、または執行を受けることがなくなった日から5年経過しなければ、宅建士登録を受けることはできません。","pending":false}],["q38_option4","未成年者は、宅地建物取引業に係る営業に関し成年者と同一の行為能力を有していたとしても、成年に達するまでは登録を受けることができない。",{"qnum":38,"label":"4","title":"宅地建物取引士","stem":"宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、この問において「登録」とは、宅地建物取引士の登録をいうものとする。","answer":"❌誤り","explanation":"誤り。未成年者が、宅建業に係る営業に関し成年者と同一の行為能力を有している場合は、宅建士の登録を受けることができます。ただし、未成年者は宅建業者または法人の役員を除き専任の宅建士になることはできません。","pending":false}],["q40_option3","免許を受けようとするC社の役員Dが刑法第211条（業務上過失致死傷等）の罪により地方裁判所で拘禁刑1年の判決を言い渡された場合、当該判決に対してDが高等裁判所に控訴し裁判が係属中であっても、C社は免許を受けることができない。",{"qnum":40,"label":"3","title":"免許","stem":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。拘禁刑に処せられたものは欠格事由に該当しますが、高等裁判所に控訴し裁判が係属中であれば、まだ刑が確定していないので免許を受けられます。","pending":false}],["q40_option4","免許を受けようとするE社の役員に、宅地建物取引業法の規定に違反したことにより罰金の刑に処せられた者がいる場合、その刑の執行が終わって5年を経過しなければ、E社は免許を受けることができない。",{"qnum":40,"label":"4","title":"免許","stem":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。宅地建物取引業法に違反したことにより罰金の刑に処せられた者がいる場合、その刑の執行が終わって5年を経過しなければ、免許を受けることができません。","pending":false}],["q42_option2","Aが、土地付建物の売買契約を締結する場合において、買主との間で、「売主は、売買物件の引渡しの日から1年間に限り当該物件の種類又は品質に関して契約の内容に適合しない場合におけるその不適合を担保する責任を負う」とする旨の特約を設けることができる。",{"qnum":42,"label":"2","title":"8種制限","stem":"宅地建物取引業者Aが、自ら売主として行う売買契約に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。なお、買主は宅地建物取引業者ではないものとする。","answer":"❌誤り","explanation":"誤り。引渡しの日から1年間に限り当該物件の種類または品質に関して契約の内容に適合しない場合におけるその不適合を担保する責任を負うというのは、民法よりも買主に不利な特約ですので無効となります。宅建業法では、契約不適合責任に関して、民法よりも買主に不利となる特約を禁じており、例外として通知期間を引渡しから2年以上と定める特約のみが有効とされています。","pending":false}],["q43_option2","宅地建物取引業者は、その事務所ごとに従業者名簿を備えなければならないが、取引の関係者から閲覧の請求があった場合であっても、宅地建物取引業法第45条に規定する秘密を守る義務を理由に、閲覧を拒むことができる。",{"qnum":43,"label":"2","title":"事務所等の規制","stem":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。宅建業者は、その事務所ごとに従業者名簿を備える義務を負い、取引の関係者から請求があったときは、従業者名簿を閲覧に供しなければなりません。宅建業者が秘密を守る義務はありますが、それを理由に閲覧を拒むことはできません。","pending":false}],["q43_option3","宅地建物取引業者の従業者は、宅地の買受けの申込みをした者から請求があった場合には、その者が宅地建物取引業者であっても、その者に従業者であることを証する証明書を提示する必要がある。",{"qnum":43,"label":"3","title":"事務所等の規制","stem":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。宅地建物取引業者の従業者は、取引関係者から請求があったときには、相手が宅建業者であっても、従業者証明書を提示しなければなりません。宅地の買受け申込みをした者が宅建業者であるか否かに関わらず、請求があれば提示義務があります。","pending":false}],["q43_option4","宅地建物取引業者は、従業者名簿を最終の記載をした日から5年間保存しなければならない。",{"qnum":43,"label":"4","title":"事務所等の規制","stem":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。従業者名簿は、最終の記載をした日から10年間保存する必要があります。5年間ではありません。","pending":false}],["q44_option3","保証協会の社員は、自らが取り扱った宅地建物取引業に係る取引の相手方から当該取引に関する苦情について解決の申出が保証協会にあり、保証協会から関係する資料の提出を求められたときは、正当な理由がある場合でなければ、これを拒んではならない。",{"qnum":44,"label":"3","title":"営業保証金・保証協会","stem":"営業保証金及び宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはいくつあるか。","answer":"⭕正しい（この肢は誤っていない）","explanation":"正しい。保証協会の社員は、取引の相手方から当該取引に関する苦情について解決の申出が保証協会にあり、保証協会から関係する資料の提出を求められたときは、正当な理由がある場合でなければ、これを拒むことはできません。","pending":false}],["q44_option4","保証協会の社員と宅地建物取引業に関し取引をした者は、その取引により生じた債権に関し、当該社員が納付した弁済業務保証金の額に相当する額の範囲内において弁済を受ける権利を有する。",{"qnum":44,"label":"4","title":"営業保証金・保証協会","stem":"営業保証金及び宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはいくつあるか。","answer":"❌誤り（この肢は誤り）","explanation":"誤り。供託すべき営業保証金の額に相当する額の範囲内で、弁済業務保証金から弁済を受けることができます。当該社員が納付した弁済業務保証金の額に相当する額の範囲内ではありません。","pending":false}],["q45_option2","自ら売主として新築住宅を宅地建物取引業者ではない買主に引き渡した宅地建物取引業者は、基準日に係る保証金の供託及び保険契約の締結の状況について届出をしなければ、当該基準日の翌日から起算して50日を経過した日以後においては、新たに自ら売主となる新築住宅の売買契約を締結してはならない。",{"qnum":45,"label":"2","title":"住宅瑕疵担保履行法","stem":"特定住宅瑕疵担保責任の履行の確保等に関する法律に基づく住宅販売瑕疵担保保証金（以下この問において「保証金」という。）の供託又は住宅販売瑕疵担保責任保険契約（以下この問において「保険契約」という。）の締結に関する次の記述のうち、正しいものはどれか。","answer":"⭕正しい","explanation":"正しい。当該基準日の翌日から起算して50日を経過した日以後においては、新たに自ら売主となる新築住宅の売買契約を締結できません。翌日から起算するということに注意しましょう。","pending":false}],["q45_option4","自ら売主として宅地建物取引業者ではない買主に新築住宅を引き渡した宅地建物取引業者が、保証金を供託する場合、当該住宅の床面積が25㎡以下であるときは、新築住宅の合計戸数の算定に当たって、3戸をもって1戸と数えることになる。",{"qnum":45,"label":"4","title":"住宅瑕疵担保履行法","stem":"特定住宅瑕疵担保責任の履行の確保等に関する法律に基づく住宅販売瑕疵担保保証金（以下この問において「保証金」という。）の供託又は住宅販売瑕疵担保責任保険契約（以下この問において「保険契約」という。）の締結に関する次の記述のうち、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。保証金を供託する場合、当該住宅の床面積が55㎡以下であるときは、新築住宅の合計戸数の算定に当たって、2戸をもって1戸と数えます。","pending":false}],["q46_option1","宅地建物取引業者が、買主として、造成工事完了前の宅地の売買契約を締結しようとする場合、売主が当該造成工事に関し必要な都市計画法第29条第1項の許可を申請中であっても、当該売買契約を締結することができる。",{"qnum":46,"label":"1","title":"総合問題","stem":"次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはいくつあるか。","answer":"❌誤り（正しい肢は一つ）","explanation":"誤り。造成工事完了前の宅地の売買契約は、開発許可があった後でなければ締結することはできません。たとえ申請中であっても、許可後でなければ売買契約を締結することはできません。","pending":false}],["q46_option3","営業保証金を供託している宅地建物取引業者が、売主として、宅地建物取引業者との間で宅地の売買契約を締結しようとする場合、営業保証金を供託した供託所及びその所在地について、買主に対し説明をしなければならない。",{"qnum":46,"label":"3","title":"総合問題","stem":"次の記述のうち、宅地建物取引業法（以下この問において「法」という。）の規定によれば、正しいものはいくつあるか。","answer":"❌誤り（正しい肢は一つ）","explanation":"誤り。宅建業者間での取引の場合、営業保証金を供託した供託所及びその所在地について、買主（宅建業者）に対し説明をする必要はありません。","pending":false}],["q47_option1","証券化支援業務（買取型）において、機構による譲受けの対象となる住宅の購入に必要な資金の貸付けに係る金融機関の貸付債権には、当該住宅の購入に付随する当該住宅の改良に必要な資金は含まれない。",{"qnum":47,"label":"1","title":"住宅金融支援機構法","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"❌誤り","explanation":"誤り。証券化支援業務（買取型）において、住宅の購入に付随する当該住宅の改良に必要な資金も機構による譲受けの対象となります。","pending":false}],["q47_option4","機構は、住宅のエネルギー消費性能（建築物のエネルギー消費性能の向上等に関する法律第2条第1項第2号に規定するエネルギー消費性能をいう。）の向上を主たる目的とする住宅の改良に必要な資金の貸付けを業務として行っている。",{"qnum":47,"label":"4","title":"住宅金融支援機構法","stem":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関する次の記述のうち、誤っているものはどれか。","answer":"⭕正しい","explanation":"正しい。機構は、住宅のエネルギー消費性能の向上を主たる目的とする住宅の改良に必要な資金の貸付けを業務として行っています。","pending":false}],["q48_option1","新築分譲住宅の予告広告（価格が確定していないため、直ちに取引することができない物件について、取引開始時期をあらかじめ告知する広告）を新聞折込チラシを用いて行った場合は、本広告を新聞折込チラシ以外の媒体を用いて行ってはならない。",{"qnum":48,"label":"1","title":"景品表示法","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。新聞折込チラシで予告広告を行った場合は、本広告も予告広告を行った媒体と同一の媒体（この場合は新聞折込チラシ）で行うか、インターネット広告で行う必要があります。","pending":false}],["q48_option2","土地取引において、当該土地上に廃屋が存在するとき、実際の土地を見れば廃屋が存在することは明らかであるため、廃屋が存在する旨を明示する必要はない。",{"qnum":48,"label":"2","title":"景品表示法","stem":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示防止法（不動産の表示に関する公正競争規約を含む。）の規定によれば、正しいものはどれか。","answer":"❌誤り","explanation":"誤り。廃屋が存在する旨を明示しなければなりません。実際の土地を見れば廃屋が存在することは明らかであっても、明示しなければなりません。","pending":false}],["q49_option3","埋立地は、平均海面に対し4〜5mの比高があり護岸が強固であれば、住宅地としても利用が可能である。",{"qnum":49,"label":"3","title":"土地","stem":"土地に関する次の記述のうち、最も不適当なものはどれか。","answer":"⭕正しい","explanation":"適当。埋立地は、平均海面に対し4〜5mの比高があり護岸が強固であれば、住宅地としても利用が可能です。","pending":false}]]});
const EXTRAS={"city_2::区域区分":{"pages":[388,394],"note":"過去に区域の関係が分かりにくいと質問した箇所。都市計画区域の中を市街化区域と市街化調整区域に分けるのが区域区分。準都市計画区域は都市計画区域の外です。「任意」と一定区域での義務を分けて覚えます。"},"city_3::準住居地域":{"pages":[389,396],"note":"過去の「準住居地域も用途地域？」への補足。準住居地域は13種類の用途地域の一つです。準都市計画区域という区域の名称とは区別します。"},"city_3::都市計画に必ず定める事項":{"pages":[389,398,440],"note":"建築基準法の絶対高さ制限（10mまたは12m）も、この既存項目で復習できます。同じ知識を新しい分野に重複登録していません。"},"city_3::必要に応じて定める事項":{"pages":[389,398,440],"note":"外壁後退距離（1mまたは1.5m）は、この既存項目で復習できます。同じ知識を新しい分野に重複登録していません。"},"city_4::特別用途地区":{"pages":[390,399],"note":"用途地域を補充するのが特別用途地区。用途地域の外に定める特定用途制限地域とは名前と条件を組み合わせて区別します。"},"city_5::地区計画の区域内の制限（届出が必要）":{"pages":[391],"note":"過去に「30日はどこから？」「都市計画事業の話？」と繰り返し確認した箇所。地区計画は行為に着手する30日前までに市町村長へ届出。都市計画事業の許可や、認可告示後の有償譲渡の届出とは別です。"},"city_p2_3::都市計画制限":{"pages":[404,405,411],"note":"過去の認可告示・事業地の質問に対応。計画決定と事業の認可告示は段階が違います。建築等の許可と、土地建物の有償譲渡の届出を混同しないようにします。"},"city_p2_4::判定の順序":{"pages":[406],"note":"過去に開発許可が分かりにくいと質問した箇所。「開発行為か」を先に判定し、その後に区域・面積・例外を確認します。"},"city_p2_6::工事完了の公告後・例外②":{"pages":[408,420],"note":"過去の「用途地域に合っていても再申請？」への補足。ここは予定建築物と異なる建築の制限の話です。建物の用途を変えるだけなのか、新たに区画形質を変更して開発行為をするのかを分けて判断します。"}};
DATA.push({id:'chapter7_review',title:'第7章・復習問題',group:'復習問題',items:[["q1_option1","Aは、遅滞なく、宅地建物取引業法第34条の2の規定により依頼者に交付すべき書面を作成し、宅建士をして記名押印させ、Bに交付しなければならない。",{"qnum":1,"label":"1","title":"媒介契約と媒介契約書","stem":"宅地建物取引業者Aが、B所有の建物の売買の媒介の依頼を受け、Bと一般媒介契約（専任媒介契約でない媒介契約）を締結した場合に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、書面の交付には、依頼者の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"❌誤り","explanation":"媒介契約書には宅建業者が記名押印して依頼者に交付します。宅建士の記名押印ではありません。","pending":false}],["q1_option2","「Bが、A以外の宅地建物取引業者に重ねて売買の媒介の依頼をする際は、Aに通知しなければならない」旨の定めをしたときは、その定めは無効である。",{"qnum":1,"label":"2","title":"媒介契約と媒介契約書","stem":"宅地建物取引業者Aが、B所有の建物の売買の媒介の依頼を受け、Bと一般媒介契約（専任媒介契約でない媒介契約）を締結した場合に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、書面の交付には、依頼者の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"❌誤り","explanation":"一般媒介契約では、複数の業者に依頼できますが、「他業者にも依頼していることを通知しなければいけない」と定めた明示型の契約も有効です。","pending":false}],["q1_option3","Aが、建物を売買すべき価額について意見を述べる場合に、その根拠を明らかにしなかったとき、Aは、そのことを理由に業務停止の処分を受けることがある。",{"qnum":1,"label":"3","title":"媒介契約と媒介契約書","stem":"宅地建物取引業者Aが、B所有の建物の売買の媒介の依頼を受け、Bと一般媒介契約（専任媒介契約でない媒介契約）を締結した場合に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、書面の交付には、依頼者の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"⭕正しい","explanation":"建物を売買すべき価額について意見を述べる場合は、根拠を明らかにしなければなりません。違反した場合は、業務停止処分を受けることがあります（108ページ）。","pending":false}],["q3_option4","Aは、指定流通機構に登録した甲宅地について売買契約が成立し、かつ、甲宅地の引渡しが完了したときは、遅滞なく、その旨を当該指定流通機構に通知しなければならない。",{"qnum":3,"label":"4","title":"指定流通機構","stem":"宅地建物取引業者Aが、B所有の甲宅地の売却の媒介を依頼され、Bと専任媒介契約を締結した場合に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。なお、書面の引渡しには、依頼者の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"❌誤り","explanation":"遅滞なく通知するのは、物件の引渡し完了時ではなく契約成立時です。","pending":false}],["q4_optionア","AがBとの間で専任媒介契約を締結した場合、AはBに対して、当該専任媒介契約に係る業務の処理状況を1週間に1回以上報告しなければならない。",{"qnum":4,"label":"ア","title":"媒介契約の規制②","stem":"宅地建物取引業者Aは、BからB所有の宅地の売却について媒介の依頼を受けた。この場合における次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。なお、この問において「専任媒介契約」とは、専属専任媒介契約ではない専任媒介契約をいう。また、書面の交付には、依頼者の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"❌誤り","explanation":"専任媒介契約の場合、報告の頻度は2週間に1回です。","pending":false}],["q4_optionエ","AがBとの間で一般媒介契約を締結した場合、AがBに対し当該宅地の価額又は評価額について意見を述べるときは、その根拠を明らかにしなければならないが、根拠の明示は口頭でも書面を用いてもよい。",{"qnum":4,"label":"エ","title":"媒介契約の規制②","stem":"宅地建物取引業者Aは、BからB所有の宅地の売却について媒介の依頼を受けた。この場合における次の記述のうち、宅地建物取引業法の規定によれば、正しいものはいくつあるか。なお、この問において「専任媒介契約」とは、専属専任媒介契約ではない専任媒介契約をいう。また、書面の交付には、依頼者の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"⭕正しい","explanation":"宅建業者は価額または評価額について意見を述べるときは、その根拠を明らかにしなければなりません。根拠の明示は口頭でも書面でもよいです。","pending":false}],["q5_optionア","A社は、建物の賃借に関し、自ら貸主として契約を締結した場合に、その相手方に37条書面を交付しなければならない。",{"qnum":5,"label":"ア","title":"37条書面の交付","stem":"宅地建物取引業者A社が宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものの組合せはどれか。なお、書面の交付には、契約の各当事者の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"❌誤り","explanation":"賃借の自ら貸主は宅建業に該当しませんので、交付不要です。","pending":false}],["q5_optionウ","A社は、建物の売買に関し、その媒介により契約が成立した場合に、天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を記載した37条書面を交付しなければならない。",{"qnum":5,"label":"ウ","title":"37条書面の交付","stem":"宅地建物取引業者A社が宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものの組合せはどれか。なお、書面の交付には、契約の各当事者の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"⭕正しい","explanation":"天災や不可抗力による損害負担の定めがあるときは、記載します（111ページ）。","pending":false}],["q7_option1","宅地建物取引業者である売主Aは、宅地建物取引業者であるBの媒介により、宅地建物取引業者ではないCと宅地の売買契約を令和8年4月1日に締結した。AとBが共同で作成した37条書面にBの宅地建物取引士の記名がなされていれば、Aは37条書面にAの宅地建物取引士をして記名をさせる必要はない。",{"qnum":7,"label":"1","title":"複数の業者が契約に関与している場合","stem":"宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、誤っているものはどれか。なお、書面の交付には、契約の各当事者の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"❌誤り","explanation":"取引に関与したすべての宅建業者の宅建士が記名しなければなりません。媒介業者Bの宅建士だけではなく、売主である宅建業者Aの宅建士の記名も必要です。","pending":false}],["q7_option2","宅地建物取引士は、37条書面を交付する際、買主から請求があったときは、宅地建物取引士証を提示しなければならない。",{"qnum":7,"label":"2","title":"複数の業者が契約に関与している場合","stem":"宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、誤っているものはどれか。なお、書面の交付には、契約の各当事者の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"⭕正しい","explanation":"そもそも宅建士証は取引の関係者から請求があった場合、いつでも提示しなければいけません。そのため37条書面の交付時は宅建士証の提示義務はありませんが、請求があったときは提示しなければなりません。なお、35条書面の説明をする際は、請求がなくても、宅建士証を提示しなければなりません。","pending":false}],["q7_option3","宅地建物取引業者である売主Dと宅地建物取引業者ではないEとの建物の売買契約において、手付金の保全措置を講ずる場合、Dはその保全措置の概要を、重要事項説明書に記載し説明する必要があるが、37条書面には記載する必要はない。",{"qnum":7,"label":"3","title":"複数の業者が契約に関与している場合","stem":"宅地建物取引業法第37条の規定により交付すべき書面（以下この問において「37条書面」という。）に関する次の記述のうち、誤っているものはどれか。なお、書面の交付には、契約の各当事者の承諾を得て行う電磁的方法による提供を含むものとする。","answer":"⭕正しい","explanation":"手付金の保全措置を講ずる場合、その概要は35条書面の記載事項ですが、37条書面の記載事項ではありません。手付金は契約時に受け取ることがほとんどです。手付金の保全措置を講ずるということは、言い換えれば、保全措置を講じた上でなければ、手付金を受け取れないということです。これは契約締結前に決めておかなければいけないので、35条書面に記載が必要です。ただし、手付金を受け取るとき、つまり契約締結時には、すでに不要な情報です。よって37条書面には記載の必要がありません。","pending":false}],["q8_optionア","当該建物が種類又は品質に関して契約の内容に適合しない場合におけるその不適合を担保すべき責任の内容",{"qnum":8,"label":"ア","title":"必要的記載事項と任意的記載事項","stem":"宅地建物取引業者が媒介により既存建物の賃借の契約を成立させた場合、宅地建物取引業法第37条の規定により、当該賃借の契約当事者に対して交付すべき書面に必ず記載しなければならない事項の組合せはどれか。","answer":"❌誤り","explanation":"本問の設定は、貸借の契約であるため、契約不適合を担保すべき責任の内容は記載事項ではありません。また、売買・交換の場合も、必ず記載する事項ではなく、定めがあれば記載する事項（任意的記載事項）です。","pending":false}],["q8_optionイ","当事者の氏名（法人にあっては、その名称）及び住所",{"qnum":8,"label":"イ","title":"必要的記載事項と任意的記載事項","stem":"宅地建物取引業者が媒介により既存建物の賃借の契約を成立させた場合、宅地建物取引業法第37条の規定により、当該賃借の契約当事者に対して交付すべき書面に必ず記載しなければならない事項の組合せはどれか。","answer":"⭕正しい","explanation":"当事者の氏名（法人の場合は、その名称）および住所は、37条書面に記載しなくてはいけない必要的記載事項です。","pending":false}],["q8_optionウ","建物の引渡しの時期",{"qnum":8,"label":"ウ","title":"必要的記載事項と任意的記載事項","stem":"宅地建物取引業者が媒介により既存建物の賃借の契約を成立させた場合、宅地建物取引業法第37条の規定により、当該賃借の契約当事者に対して交付すべき書面に必ず記載しなければならない事項の組合せはどれか。","answer":"⭕正しい","explanation":"引渡しの時期は、37条書面に記載しなくてはいけない必要的記載事項です。","pending":false}],["q8_optionエ","建物の構造耐力上主要な部分等の状況について当事者双方が確認した事項",{"qnum":8,"label":"エ","title":"必要的記載事項と任意的記載事項","stem":"宅地建物取引業者が媒介により既存建物の賃借の契約を成立させた場合、宅地建物取引業法第37条の規定により、当該賃借の契約当事者に対して交付すべき書面に必ず記載しなければならない事項の組合せはどれか。","answer":"❌誤り","explanation":"貸借の場合、建物の構造耐力上主要な部分等の状況について当事者双方が確認した事項は、記載不要です。","pending":false}]]});
