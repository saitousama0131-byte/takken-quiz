<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>宅建暗記クイズ v4</title><style>
:root{--red:#8f211d;--bg:#fff8f6;--line:#ebd1cd;--ink:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;padding:10px 10px 12px;box-shadow:0 2px 8px #0002}
h1{font-size:16px;margin:0 0 10px}
.tabs,.levels,.filters,.actions,.marks{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar,.levels::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.tab,.level,.filter{flex:0 0 auto;border:1px solid #fff7;background:#fff;color:#7f201d;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700}
.tab.active,.level.active,.filter.active{background:#50110f;color:#fff;border-color:#50110f}
.score{margin-top:8px;font-size:13px;font-weight:800}
main{padding:12px;max-width:900px;margin:auto}
.title{font-size:20px;font-weight:800;color:#7f201d;margin:8px 0 10px}
.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;line-height:1.7;font-size:14px;margin-bottom:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
.card.ok{border-left:5px solid #75b781}
.card.ng{border-left:5px solid #d66a61}
.row{display:grid;grid-template-columns:48px 1fr}
.num{background:#9f302b;color:#fff;font-weight:800;display:flex;align-items:flex-start;justify-content:center;padding:12px 6px;font-size:15px}
.text{padding:12px;font-size:14px;line-height:1.75;white-space:pre-line}
.cloze{display:inline-block;min-width:5em;color:transparent;background:#f1dcda;border-bottom:2px solid #a64c46;border-radius:3px}
.cloze.show{color:#c3342f;background:#fff1ef;font-weight:700}
.extra.hide{display:inline-block;color:transparent;background:#eee1df;border-bottom:2px solid #9b7975;border-radius:3px;min-width:6em}
.adv{display:inline-block;width:94%;min-height:3em;background:#eee1df;color:transparent;border-radius:6px}
.actions{padding:0 10px 12px 58px;align-items:center}
.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:13px}
.answer{background:#fff0ee!important;color:#8b2824;font-weight:800}
.mark{width:44px;height:38px;padding:0!important;font-size:20px!important;font-weight:800}
.mark.sel.ok{background:#eaf8ed}
.mark.sel.ng{background:#fff0ef}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tools button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}
footer{padding:30px 12px 50px;text-align:center;color:#777;font-size:12px}
@media(min-width:700px){.text{font-size:16px}.tab,.level,.filter{font-size:14px}}
</style></head>

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  DATA.forEach((s,i)=>{

  });
}

});

  render();
});

function parsed(raw){
  let t=esc(raw).replace(/\[\[(.*?)\]\]/gs,'<span class="cloze">$1</span>')
                .replace(/\(\((.*?)\)\)/gs,'<span class="extra">$1</span>');
  return t;
}
function updateScore(){
  const s=DATA[sec];let ok=0,ng=0,un=0;
  s.items.forEach(([n])=>{const v=get(s.id,n);if(v==='ok')ok++;else if(v==='ng')ng++;else un++});
  document.getElementById('score').textContent=`○ ${ok}　× ${ng}　未 ${un}`;
}
function setMark(card,sid,n,val){
  const k=key(sid,n);
  if(progress[k]===val) delete progress[k]; else progress[k]=val;
  save();render();
}
function render(){
  const s=DATA[sec];
  document.getElementById('title').textContent=s.title;
  const root=document.getElementById('cards');root.innerHTML='';
  s.items.forEach(([n,raw])=>{
    const v=get(s.id,n);
    if(filter==='ng'&&v!=='ng')return;
    if(filter==='un'&&v)return;
    const c=document.createElement('div');c.className='card '+(v||'');
    const row=document.createElement('div');row.className='row';
    const num=document.createElement('div');num.className='num';num.textContent=n;
    const txt=document.createElement('div');txt.className='text';
    if(level===3) txt.innerHTML='<span class="adv">この項目の内容を頭の中で再現</span>';
    else{
      txt.innerHTML=parsed(raw);
      if(level===2) txt.querySelectorAll('.extra').forEach(x=>x.classList.add('hide'));
    }
    row.append(num,txt);

    const ac=document.createElement('div');ac.className='actions';
    const ans=document.createElement('button');ans.className='answer';ans.textContent='答えを表示';
    ans.onclick=()=>{
      if(level===3){txt.innerHTML=parsed(raw);txt.querySelectorAll('.cloze').forEach(x=>x.classList.add('show'))}
      else{
        txt.querySelectorAll('.cloze').forEach(x=>x.classList.add('show'));
        txt.querySelectorAll('.extra').forEach(x=>x.classList.remove('hide'));
      }
      ans.textContent='答え表示中';
    };
    const ok=document.createElement('button');ok.className='mark '+(v==='ok'?'sel ok':'');ok.textContent='○';ok.onclick=()=>setMark(c,s.id,n,'ok');
    const ng=document.createElement('button');ng.className='mark '+(v==='ng'?'sel ng':'');ng.textContent='×';ng.onclick=()=>setMark(c,s.id,n,'ng');
    ac.append(ans,ok,ng);
    c.append(row,ac);root.appendChild(c);
  });
  updateScore();
}

document.getElementById('reset').onclick=()=>{
  const s=DATA[sec];
  if(!confirm('この分野の○×記録を消しますか？'))return;
  s.items.forEach(([n])=>delete progress[key(s.id,n)]);
  save();render();
};
document.getElementById('backup').onclick=()=>{
  const blob=new Blob([JSON.stringify(progress)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='takken_progress.json';a.click();
};
document.getElementById('restoreBtn').onclick=()=>document.getElementById('restore').click();
document.getElementById('restore').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{progress=JSON.parse(await f.text());save();render();alert('復元しました')}catch(err){alert('読み込めませんでした')}
};
renderTabs();render();
</script></body></html>
