<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宅建暗記クイズ v9｜法令・税・免除科目</title><style>
:root{--red:#8f211d;--bg:#fff8f6;--line:#ebd1cd;--ink:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;box-shadow:0 2px 8px #0002}
.topbar{height:48px;display:flex;align-items:center;gap:8px;padding:0 10px}
.current{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.mini-score{font-size:12px;font-weight:800;opacity:.95;white-space:nowrap}
.menu-btn{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:9px;padding:6px 9px;font-size:13px;font-weight:800}
.panel{display:none;padding:8px 10px 10px;border-top:1px solid #ffffff22}
.panel.open{display:block}
.tabs,.levels,.filters,.tools,.actions{display:flex;gap:7px;align-items:center}
.tabs,.levels,.filters{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar,.levels::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.tab,.level,.filter{flex:0 0 auto;border:1px solid #fff7;background:#fff;color:#7f201d;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}
.tab.active,.level.active,.filter.active{background:#50110f;color:#fff;border-color:#50110f}
.group-label{font-size:11px;opacity:.8;margin:7px 0 4px}
.tools{flex-wrap:wrap;margin-top:8px}
.tools button{border:1px solid #fff6;background:#fff;color:#7f201d;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:700}
main{padding:10px;max-width:900px;margin:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 9px;overflow:hidden}
.card.ok{border:2px solid #69a975;background:#f4fbf5}
.card.ng{border:2px solid #cf6159;background:#fff6f5}
.card.ok .num{background:#4f925d}
.card.ng .num{background:#bd4d46}
.card.ok::after,.card.ng::after{display:block;font-size:12px;font-weight:800;padding:0 10px 9px 55px}
.card.ok::after{content:'○ できた';color:#397247}
.card.ng::after{content:'× 要復習';color:#a43f39}
.row{display:grid;grid-template-columns:46px 1fr}
.num{background:#9f302b;color:#fff;font-weight:800;display:flex;align-items:flex-start;justify-content:center;padding:11px 5px;font-size:14px}
.text{padding:11px 12px;font-size:14px;line-height:1.7;white-space:pre-line}
.cloze{display:inline-block;min-width:5em;color:transparent;background:#f1dcda;border-bottom:2px solid #a64c46;border-radius:3px}
.cloze.show{color:#c3342f;background:#fff1ef;font-weight:700}
.extra.hide{display:inline-block;color:transparent;background:#eee1df;border-bottom:2px solid #9b7975;border-radius:3px;min-width:6em}
.adv{display:inline-block;width:94%;min-height:3em;background:#eee1df;color:transparent;border-radius:6px}
.actions{padding:0 9px 10px 55px;flex-wrap:wrap}
.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px}
.answer{background:#fff0ee!important;color:#8b2824;font-weight:800}
.mark{width:42px;height:36px;padding:0!important;font-size:19px!important;font-weight:800}
.mark.sel.ok{background:#4f925d!important;color:#fff;border-color:#4f925d!important;box-shadow:0 0 0 2px #d8efdd}
.mark.sel.ng{background:#bd4d46!important;color:#fff;border-color:#bd4d46!important;box-shadow:0 0 0 2px #f2d9d6}
.empty{padding:30px 12px;text-align:center;color:#777}
footer{padding:26px 12px 44px;text-align:center;color:#888;font-size:11px}
@media(min-width:700px){
  .topbar{height:54px}.current{font-size:17px}.panel{display:block!important}
  .menu-btn{display:none}.text{font-size:16px}
}

.section-picker{display:block;width:100%;max-width:100%;margin:0 0 8px;padding:8px;border:1px solid #ffffff70;border-radius:8px;background:#fff;color:#7f201d;font:inherit;font-size:13px}
.card-cue{padding:10px 12px 0 55px;font-size:13px;font-weight:800;color:#6e211e;line-height:1.5}
.source-line{padding:0 12px 9px 55px;color:#786460;font-size:11px;line-height:1.5}
.supplement{margin:0 12px 10px 55px;border:1px solid #ecdcd8;border-radius:8px;background:#fffaf2;overflow:hidden}
.supplement summary{padding:8px 10px;color:#76411e;cursor:pointer;font-size:12px;font-weight:700;min-height:36px}
.supplement p{margin:0;padding:0 10px 10px;font-size:13px;line-height:1.7;white-space:pre-line;color:#49392d}
.study-hint{padding:8px 12px;margin:0 0 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:12px;line-height:1.6;color:#745450}
@media(max-width:699px){.card-cue,.source-line{padding-left:55px}.supplement{margin-left:55px}.section-picker{font-size:16px}}


.prediction-nav{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 12px;position:sticky;top:48px;z-index:5;background:var(--bg);-webkit-overflow-scrolling:touch}
.prediction-nav a{flex:0 0 auto;display:inline-flex;align-items:center;min-height:40px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#7f201d;text-decoration:none;font-size:13px;font-weight:800}
.prediction-question{scroll-margin-top:104px;margin:0 0 18px}
.prediction-question h2{font-size:17px;margin:14px 2px 8px;color:#77201d}
.prediction-stem{white-space:pre-line;line-height:1.75;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:9px;font-size:14px}
.prediction-option{margin-bottom:10px}
.prediction-option .text{white-space:pre-line;line-height:1.8;font-size:15px}
.pred-label{font-weight:800;color:#77201d;margin-bottom:5px}
.pred-actions{padding:0 10px 12px 55px;display:flex;gap:7px;flex-wrap:wrap}
.pred-actions button{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:white;font-weight:750;color:#402b29}
.pred-answer-panel,.pred-explanation{margin:0 10px 10px 55px;padding:10px 12px;border-radius:9px;line-height:1.65;white-space:pre-line}
.pred-answer-panel{border:1px solid #d9aaa5;background:#fff4f2;color:#76221e;font-weight:800}
.pred-explanation{border:1px solid #e6d8b9;background:#fffcf3;color:#493b25;font-size:14px}
.pred-actions .pred-self-ok.sel{background:#327a45;color:#fff;border-color:#327a45}
.pred-actions .pred-self-ng.sel{background:#b53f3a;color:#fff;border-color:#b53f3a}
.pred-pending{margin:0 10px 12px 55px;padding:10px 12px;border:1px solid #d69a43;border-radius:9px;background:#fff8e9;color:#6d4915;font-weight:700;line-height:1.55}
@media(max-width:699px){.prediction-nav{top:48px}.prediction-stem{font-size:15px}.prediction-question h2{font-size:16px}.pred-actions{padding-left:55px}.pred-answer-panel,.pred-explanation,.pred-pending{margin-left:55px}}

.prediction-option .cloze{cursor:pointer;touch-action:manipulation;}
.memory-table-scroll{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 10px}
.memory-table{width:100%;min-width:360px;border-collapse:collapse;font-size:13px;line-height:1.55}
.memory-table th,.memory-table td{border:1px solid #d8deea;padding:8px 9px;text-align:left;vertical-align:top}
.memory-table th{background:#f3f6fb;font-weight:700}
.memory-table td .cloze{white-space:normal}
.review-nav{top:var(--review-header-height,48px);}
.review-question{scroll-margin-top:calc(var(--review-header-height,48px) + 60px);}
.review-question .cloze{max-width:100%;overflow-wrap:anywhere;}
.prediction-option .cloze:focus-visible{outline:2px solid #6f93e8;outline-offset:2px;}
</style></head>
<body>
<header>
  <div class="topbar">
    <div id="current" class="current"></div>
    <div id="score" class="mini-score">○0 ×0 未0</div>
    <button id="menuBtn" class="menu-btn">設定</button>
  </div>
  <div id="panel" class="panel">
    <div class="group-label">分野</div><select id="sectionPicker" class="section-picker" aria-label="分野を一覧から選ぶ"></select><div id="tabs" class="tabs"></div>
    <div class="group-label">難易度</div>
    <div class="levels">
      <button class="level active" data-level="1">初級</button>
      <button class="level" data-level="2">中級</button>
      <button class="level" data-level="3">上級</button>
    </div>
    <div class="group-label">表示</div>
    <div class="filters">
      <button class="filter active" data-filter="all">全部</button>
      <button class="filter" data-filter="ng">×だけ</button>
      <button class="filter" data-filter="un">未回答</button>
    </div>
    <div class="tools">
      <button id="reset">この分野をリセット</button>
      <button id="backup">バックアップ</button>
      <button id="restoreBtn">復元</button>
      <input id="restore" type="file" accept="application/json" hidden>
    </div>
  </div>
</header>
<main><div id="studyHint" class="study-hint">赤文字の空欄を思い出してから「答えを表示」。○×は答えの表示と別に記録されます。補足解説は必要なときに開けます。</div><div id="cards"></div></main>
<footer>設定は右上から。○×記録はブラウザ内に保存されます。</footer>
<script>
const DATA=[{"id":"35_sale","title":"35条書面｜売買・交換","items":[["1","登記された権利の種類および内容\n・抵当権など登記されている権利関係を説明。説明時の登記内容を記載するので、物件を[[引渡すまでに抵当権が抹消される予定であっても]]その旨を記載する"],["2","[[法令に基づく制限]]\n・都市計画法、建築基準法等における造成や建築等の制限など、((具体的な制限の内容))"],["3","[[私道]]に関する負担に関する事項\n・[[将来の負担も含む]]私道負担の有無、私道面積、通行使用料等の負担額"],["4","[[飲用水、電気、ガス]]等の供給施設、[[排水施設]]の整備状況\n・未整備であればその[[整備の見通し]]や、その整備に当たって[[負担金が課されるか]]などの負担に関する事項"],["5","[[未完成物件]]の場合　工事完了時の形状、構造\n・[[宅地：造成工事完了時]]\n・完了時の形状、構造、宅地に接している道路の構造と幅員等\n・[[建物：建築工事完了時]]\n・完了時の形状、構造、主要構造部、内装および外装の構造や仕上げ等"],["6","[[土砂災害警戒区域内、造成宅地防災区域内、津波災害警戒区域内]]にある時はその旨"],["7","水防法の規定により市町村の長が提供する図面（[[水害ハザードマップ]]）に表示されているときは水害ハザードマップにおけるその宅地建物の[[所在地]]"],["8","[[住宅性能評価を受けた新築住宅]]の場合はその旨"],["9","[[石綿]]（アスベスト）の使用の有無の調査結果が記録されているときはその内容（[[実施は義務ではない]]）"],["10","昭和56年6月1日以降に新築工事に着手したものを除く建物が、指定確認検査機関等による一定の[[耐震診断]]を受けたものであるときはその内容（[[実施は義務ではない]]）"],["11","既存の建物であるときは、[[建物状況調査]]（インスペクション）等に関する事項\n・既存の建物であるときは、実施後1年を経過していない[[建物状況調査の実施の有無]]や、[[実施している場合はその結果の概要]]（[[実施は義務ではない]]）\n・[[鉄筋コンクリート造]]または[[鉄骨鉄筋コンクリート造]]の[[共同住宅等]]に係る重要事項説明の対象となる建物状況調査の結果については、調査の実施から[[2年]]を経過していないもの"],["12","既存の建物であるときは、[[建物の建築及び維持保全の状況に関する書類の保存状況]]\n・確認の申請書、確認済証、検査済証、建物状況調査の結果についての報告書、既存住宅にかかる建設住宅性能評価書等の保存の状況"],["13","代金、交換差金[[以外]]に授受される金銭の額、および目的\n・手付金等の[[額と目的]]\n※[[代金や交換差金は重要事項説明の対象外]]"],["14","契約の[[解除]]に関する事項\n・契約の解除が可能な場合、手続きや解除の効果について"],["15","[[損害賠償額の予定または違約金]]に関する事項\n・損害賠償額の予定、違約金としての違約金を定めるか否か"],["16","[[手付金等の保全措置]]の概要\n・[[宅建業者が自ら売主]]の場合、お客さんから受け取ったお金を返せるようにするための保全措置義務の概要"],["17","[[支払金、預り金]]を受領する場合の保全措置の有無、概要\n・宅建業者が取引の相手方などから、支払金、預り金を受領する場合、保全措置を講ずるか否か。保全措置を講ずる場合はその概要\n・[[50万円未満のもの]]、売主や交換の当事者である宅建業者が[[登記以後]]に受領するものについては、[[説明義務なし]]"],["18","ローンの[[あっせんの内容]]、およびローン[[不成立の場合の措置]]\n・住宅ローン等をあっせんする場合、融資額、金利、返済方法などのあっせんの内容や融資条件。ローンが受けられなかった場合の措置"],["19","[[契約不適合を担保すべき責任]]の履行に関し保証保険契約の締結、その他の措置の有無・概要\n・宅地建物が種類、品質に関して契約の内容に適合しない場合におけるその不適合を担保すべき責任の履行に関して、保証保険契約等を[[講ずるか否か・講ずる場合におけるその措置の概要]]"],["20","[[割賦販売]]の場合：現金販売価格、割賦販売価格、頭金・賦払いの額、支払時期・方法\n・分割払いを条件として販売する"]]},{"id":"35_lease","title":"35条書面｜貸借","items":[["1","[[登記]]された権利の種類および内容"],["2","[[法令に基づく制限]]\n・[[建物の貸借]]の場合、一定の制限のみ説明\n・[[建蔽率、容積率等]]に関する制限は関係ないので説明不要（[[宅地の貸借では説明必要]]）"],["3","[[私道]]負担に関する事項\n・建物を借りる人にとっては、私道については関係ない"],["4","[[飲用水、電気、ガス]]等の供給施設、[[排水施設]]の整備状況"],["5","[[未完成物件]]の工事完了時の形状、構造"],["6","[[土砂災害警戒区域、津波災害警戒区域、造成宅地防災区域]]に関する事項"],["7","[[水害ハザードマップ]]における取引対象物件の所在地"],["8","建物の[[石綿]]の使用の有無の調査結果の記録に関する事項"],["9","建物の[[耐震診断]]に関する事項"],["10","既存の建物であるときは、[[建物状況調査]]（インスペクション）等に関する事項\n［[[住宅性能評価]]［建物の建築及び維持保全の状況に関する書類］は記載事項ではない］"],["11","借賃[[以外]]に授受される金銭の額、および目的\n・敷金など"],["12","契約の[[解除]]に関する事項"],["13","[[損害賠償額]]の予定または違約金に関する事項"],["14","支払金、預り金を受領する場合の[[保全措置]]の有無、概要"],["15","[[台所・浴室・便所]]等の整備状況\n※[[事業用建物]]の貸借でも説明必要"],["16","[[契約期間および契約更新]]に関する事項\n・更新の際の更新料改定に関することや、期限付き建物賃貸借の場合は契約の更新はないこと等を説明"],["17","[[定期借地権、定期借家権（定期建物賃貸借）]]などに関する事項\n・期間が満了すれば契約は終了－更新はないことを説明"],["18","宅地建物の[[用途や利用の制限]]"],["19","金銭の[[契約終了時の精算]]に関する事項\n・敷金の用途等を明確にする。金額が明確でない場合はその旨を説明"],["20","宅地建物の[[管理の委託]]を受けた者の氏名や住所等"],["21","契約終了時における宅地の[[建物の取壊し]]に関する事項の内容\n・借地上の建物の取壊しのことなので、建物を借りる場合は該当しない"],["22","高齢者の居住の安定確保に関する法律に規定する[[終身建物賃貸借]]をしようとするときはその旨"]]},{"id":"35_condo","title":"35条書面｜区分所有建物","items":[["賃貸1","[[専有部分の用途、その他の利用の制限]]に関する規約の定めがあるときはその内容\n・専有部分の使い方に関する制限\n・ペット飼育や店舗営業などについて規約の定めがあるなら説明をする\n※[[規約が案の段階でも、その案についても説明が必要]]"],["賃貸2","一棟の建物および敷地の[[管理が委託]]されているときは、その委託先の氏名や住所等\n・マンション管理の適正化の推進に関する法律第44条の登録を受けているときは登録番号も記載\n・法人の場合、商号または名称、主たる事務所の所在地。ただし管理業務内容は不要"],["売買1","[[敷地]]に関する権利の種類及び内容\n・敷地利用権であれば、所有権か借地権かなど"],["売買2","[[共用部分]]に関する規約の定めがあるときはその内容\n※[[規約が案の段階でも、その案についても説明が必要]]"],["売買3","[[専有部分の用途、その他の利用の制限]]に関する規約の定めがあるときはその内容\n・専有部分の使い方に関する制限\n・ペット飼育や店舗営業などについて規約の定めがあるなら説明をする\n※[[規約が案の段階でも、その案についても説明が必要]]"],["売買4","[[専用使用権]]に関する規約の定めがあるときはその内容\n・専用駐車場や専用庭など。ただし、[[使用者の氏名や住所は説明不要]]\n※[[規約が案の段階でも、その案についても説明が必要]]"],["売買5","一棟の建物の計画的な[[維持修繕のための費用]]、通常の管理費用、その他の当該建物の所有者が負担しなければならない費用を、特定の者にのみ減免する旨の規約の定めがあるときはその内容\n※[[規約が案の段階でも、その案についても説明が必要]]"],["売買6","[[計画修繕積立金]]の規約の定めがあるときは、その内容及びすでに積み立てられている額\n・滞納がある場合は金額を告げなければならない\n※[[規約が案の段階でも、その案についても説明が必要]]"],["売買7","区分所 のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"build_height_fire","title":"建築基準法｜高さ・防火制限","group":"法令上の制限","items":[["1","道路斜線\n[[すべて]]の用途地域",{"prompt":"高さ制限：道路斜線","pages":[440],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","第一種低層住居専用地域・第二種低層住居専用地域・田園住居地域\n隣地斜線　[[×]]",{"prompt":"高さ制限：低層住居専用・田園住居の隣地斜線","pages":[440],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","第一種低層住居専用地域・第二種低層住居専用地域・田園住居地域・第一種中高層住居専用地域・第二種中高層住居専用地域\n北側斜線　[[○]]\n※日影規制の適用区域内の第一種・第二種中高層住居専用地域では、北側斜線制限は[[適用されない]]",{"prompt":"北側斜線：対象の用途地域","pages":[440],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","商業地域・工業地域・工業専用地域\n日影規制　[[×]]",{"prompt":"日影規制：適用しない用途地域","pages":[440],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","階数[[3以上]]（[[地階を含む]]）の建築物\n[[または]]\n延べ面積[[100㎡超]]の建築物",{"prompt":"防火地域：耐火建築物等の基準","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","階数[[2以下]]、[[かつ]]延べ面積[[100㎡以下]]の建築物\n[[耐火建築物等または準耐火建築物等]]",{"prompt":"防火地域：小規模な建築物","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","地上階数[[4以上]]（[[地階を除く]]）の建築物\n[[または]]\n延べ面積[[1,500㎡超]]の建築物",{"prompt":"準防火地域：耐火建築物等の基準","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","地上階数3、かつ延べ面積[[1,500㎡以下]]の建築物\nまたは\n地上階数2以下、かつ延べ面積[[500㎡を超え1,500㎡以下]]の建築物\n[[耐火建築物等または準耐火建築物等]]",{"prompt":"準防火地域：地上3階・中規模の建築物","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","地上階数[[2以下]]、かつ延べ面積[[500㎡以下]]の建築物\n[[技術的基準適合建築物]]",{"prompt":"準防火地域：地上2階以下・小規模","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","看板・広告塔等で1・2のどちらかに該当する建築物は、その主要な部分を[[不燃材料]]で造り、または覆わなければならない\n1 建築物の[[屋上]]に設けるもの\n2 高さ[[3mを超える]]もの",{"prompt":"防火地域：看板・広告塔等","pages":[441],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","地階を[[除く]]階数が[[4以上]]、高さ[[16m超]]、延べ面積[[3,000㎡超]]の建築物（大規模な木造建築物等）は、原則、主要構造部を[[耐火構造または準耐火構造]]としなければならない",{"prompt":"防火地域等以外：大規模木造建築物","pages":[442],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","防火壁でその建築物が有効に区分されているときを[[除いて]]、[[最も厳しい]]地域の規制が適用されます。",{"prompt":"防火・準防火地域にまたがる建築物","pages":[442],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"build_confirm","title":"建築基準法｜建築確認・建築協定","group":"法令上の制限","items":[["1","用途に供する床面積の合計が[[200㎡超]]",{"prompt":"建築確認：特殊建築物の対象規模","pages":[442],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","1・2のいずれかに該当\n1 階数[[2以上]]（[[地下含む]]）\n2 延べ面積[[200㎡超]]",{"prompt":"建築確認：全国で対象となる大規模建築物","pages":[442],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","建築物が防火地域または準防火地域にある場合の増築・改築・移転は、[[10㎡以内]]であっても建築確認が[[必要]]です。",{"prompt":"建築確認：防火・準防火地域の小規模増築等","pages":[442],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","国土交通大臣または都道府県知事等が指定した[[指定確認検査機関]]でもできる",{"prompt":"確認・検査を行える機関","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","建築主事等は、確認の申請書を受理した日から、特殊建築物、大規模建築物→[[35日以内]]\n一般の建築物→[[7日以内]]に審査、確認し、[[確認済証]]を交付しなければならない",{"prompt":"建築確認：審査の日数","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","建築主は工事が完了した日から[[4日以内]]に建築主事等に到達するように[[工事完了検査の申請]]をしなければならない",{"prompt":"工事完了：建築主の検査申請期限","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","建築主事等は、完了検査の申請を受理した日から[[7日以内]]に完了検査をし、規定に適合するときは[[検査済証]]を交付しなければならない",{"prompt":"工事完了検査：建築主事等の期限","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","[[確認済証の交付]]を受けてから工事を開始します。",{"prompt":"確認済証と工事着手","pages":[453],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","消防長または消防署長の[[同意]]を得なければならない。\nただし、防火地域や準防火地域[[以外]]の区域で行う[[住宅建築]]の場合は[[不要]]",{"prompt":"建築確認：消防同意の例外","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","1 文化財保護法の規定によって[[重要文化財等]]に指定された建築物\n2 [[既存不適格建築物]]\n※ただし建替えや増改築等の際には規定に[[従わなければならない]]",{"prompt":"建築基準法：適用されない建築物","pages":[443],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"過去の「既存不適格」の再質問への補足。建築時には適法でも、法改正等で現行基準に合わなくなったもの。最初から基準に違反していた建物とは区別します。"}],["11","建築協定の締結手続き\n土地の所有者等の[[全員の合意]]によって、建築協定書を作成し、これを[[特定行政庁]]に申請して、その[[認可]]を受ける\n建築協定の変更\n土地の所有者等の[[全員の合意]]が必要",{"prompt":"建築協定：締結と変更の同意","pages":[455],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","土地の所有者等の[[過半数の合意]]が必要",{"prompt":"建築協定：廃止に必要な同意","pages":[455],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","特定行政庁による認可の公告があった日以後に、建築協定区域内の土地の所有者や借地権者になった者に対しても、原則として、この建築協定の[[効力が及ぶ]]",{"prompt":"建築協定：後から取得した人への効力","pages":[455],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","建築協定は、[[1人]]でも定めることができる。効力の発生は認可の日から[[3年以内]]に、その土地の区域に[[2人以上]]の土地所有者等が存在することとなったとき",{"prompt":"一人協定：効力が生じる条件","pages":[443,455],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"land_readjust","title":"土地区画整理法｜施行・換地・仮換地","group":"法令上の制限","items":[["1","土地区画整理事業　[[都市計画区域内]]の土地について、公共施設（道路、公園等）の整備改善および、宅地の利用増進を図るために行われる土地の[[区画形質の変更]]および公共施設の新設または変更に関する事業。[[減歩や換地処分]]という方法で行われる",{"prompt":"土地区画整理事業：対象区域","pages":[456],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","宅地の所有者、借地権者が[[7人以上]]で共同して定款や事業計画を定めた上で、[[都道府県知事等の認可]]を受けて設立する組合",{"prompt":"土地区画整理組合：人数と認可","pages":[456],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","事業計画の認可・決定等の[[公告があった日]]後、[[換地処分の公告がある日]]までの間に、施行地区内において下記の1〜3の行為を行おうとする者は、国土交通大臣（国土交通大臣が施行する場合）または[[都道府県知事等の許可]]が必要です。\n1 土地の形質の変更　2 建築物の建築（新築・増改築等）、工作物の建設　3 移動の容易でない[[5t超]]物件の設置・堆積",{"prompt":"土地区画整理事業の施行地区：建築行為等の制限","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","施行者が個人施行者、土地区画整理組合、区画整理会社、市町村または機構等である場合は、換地計画について[[都道府県知事等の認可]]を受けなければなりません。",{"prompt":"換地計画：認可を受ける者","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","換地は従前の宅地と条件（位置、地積、土質、水利、利用状況、環境等）が[[同じようなもの]]でなければならない＝[[換地照応の原則]]",{"prompt":"換地：照応の原則","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","換地に関して不均衡が生ずる場合には[[金銭]]により清算\n損→清算金を[[交付]]　得→清算金を[[徴収]]",{"prompt":"清算金：換地の不均衡の調整","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","民間施行の場合\n1 土地区画整理事業の[[施行費用]]に充てるため\n2 [[規準、規約、定款]]で定める目的のため",{"prompt":"保留地：民間施行の場合","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["8","公的施行の場合\n土地区画整理事業の[[施行費用]]に充てるためのみ\n[[土地区画整理審議会の同意]]が必要",{"prompt":"保留地：公的施行の場合","pages":[457],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","換地処分を行うまで、[[必要がある]]場合に指定できる",{"prompt":"仮換地：指定できる時期","pages":[458],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","従前の宅地について、使用収益することが[[できない]]\n[[所有権がある]]ので、従前の宅地の処分（売却や抵当権の設定）が[[できる]]",{"prompt":"仮換地指定後：従前の宅地の権利","pages":[458],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","仮換地について[[使用収益することができる]]",{"prompt":"仮換地指定後：仮換地の権利","pages":[458],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"教材の権利関係を整理した補足。仮換地で使用・収益できることと、仮換地の所有権を取得することは別です。所有権の切替えは換地処分の公告に伴う効果で確認します。"}],["12","換地処分は換地計画に係る区域の[[全部]]について、工事が[[完了した後]]に遅滞なく行う",{"prompt":"換地処分：原則の時期","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","換地処分の公告があった日が[[終了したとき]]に消滅する",{"prompt":"換地を定めなかった従前の宅地：権利消滅の時点","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","換地計画について換地処分の公告があった日の[[翌日]]から従前の宅地とみなされる換地\n換地計画で所有者と定められたものが[[取得]]する",{"prompt":"換地：所有権取得の時点","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["15","換地処分の公告があった日の[[翌日]]に施行者が取得する",{"prompt":"保留地：施行者が取得する時点","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","換地処分の公告があった日の[[翌日]]に確定する\n金額の確定後、施行者が[[徴収・交付]]する",{"prompt":"清算金：確定の時点","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["17","土地区画整理の登記は、[[施行者]]によって[[一括]]して申請され、その変動に係る登記をした後でないと、原則として[[施行者以外の者]]は登記できません。",{"prompt":"土地区画整理の登記：申請者","pages":[459],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"national_land","title":"国土利用計画法｜届出・許可","group":"法令上の制限","items":[["1","権利取得者は、契約締結日から[[2週間以内]]に、[[都道府県知事等]]に届出をしなければならない",{"prompt":"事後届出：誰がいつ届け出るか","pages":[472,473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["2","売買の場合⇒[[買主]]\n交換の場合⇒[[両当事者]]",{"prompt":"事後届出：売買・交換の権利取得者","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["3","土地の利用目的、対価の額などを、[[市町村長を経由]]して[[都道府県知事等]]に届け出なければなりません。",{"prompt":"事後届出：提出の経由先","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["4","[[権利性・対価性・契約性]]を満たす取引",{"prompt":"土地取引：対象となる3要件","pages":[472],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["5","市街化区域　[[2,000㎡以上]]",{"prompt":"事後届出：市街化区域の面積基準","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["6","市街化調整区域・非線引き区域　[[5,000㎡以上]]",{"prompt":"事後届出：その他の都市計画区域の面積基準","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["7","都市計画区域外　[[10,000㎡以上]]",{"prompt":"事後届出：都市計画区域外の面積基準","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":"開発許可の面積と混同しないための教材整理。準都市計画区域は都市計画区域外としてこの面積基準で判定します。"}],["8","ひとまとまりの土地を、回数を分けて購入しても、全体として[[一団の土地]]の処分と認められれば、[[全体の面積]]を基準とします。",{"prompt":"事後届出：一団の土地","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["9","[[売買契約、売買予約、交換契約]]（金銭授受がなくても該当）、[[停止条件付売買契約]]",{"prompt":"届出の対象となる売買契約","pages":[472],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["10","[[贈与、相続、時効]]",{"prompt":"届出の対象とならない取得","pages":[472],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["11","都道府県知事が[[利用目的]]について審査する（[[対価の額は審査の対象外]]）",{"prompt":"事後届出：審査対象","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["12","審査に問題があれば、都道府県知事は届出があった日から[[3週間以内]]に勧告する\n都道府県知事は届出をしたものに対して、[[利用目的]]を変更すべきことを勧告できる",{"prompt":"事後届出：勧告の期限・内容","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["13","都道府県知事等は、その旨および勧告内容を[[公表できる]]（[[義務ではない]]）",{"prompt":"勧告に従わない場合","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["14","監視区域⇒都道府県知事等が、[[都道府県の規則]]により定める\n注視区域⇒[[事後届出制と同じ]]",{"prompt":"事前届出：注視区域・監視区域の面積","pages":[473],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["15","契約の当事者は、契約締結[[前]]に[[都道府県知事等の許可]]を受けなければならない",{"prompt":"規制区域：必要な手続と時期","pages":[472],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["16","取引の当事者の一方、または双方が[[国・地方公共団体等]]である場合",{"prompt":"届出不要の例外：国等が当事者","pages":[474],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}],["17","[[農地法3条1項]]の許可を受ける必要がある場合\n農地法[[5条1項]]の許可を受ける場合は[[届出が必要]]",{"prompt":"届出不要の例外：農地法の許可","pages":[474],"source":"教材のまとめ・解法から抜粋（表は見出しを付けて整形）","note":""}]]},{"id":"farmland","title":"農地法｜3条・4条・5条","group":"法令上の制限","items":[["1","農地に該当するかどうかは、各農地の土地の[[現況]]によっ
